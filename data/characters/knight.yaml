class_name: 기사
description: 영광의 맹세로 파티를 이끄는 고결한 지휘관
slogan: 맹세는 지키되, 대가를 치른다
archetype: 지휘관/버퍼
base_stats:
  hp: 216
  mp: 34
  init_brv: 130
  speed: 48
  physical_attack: 79
  physical_defense: 85
  magic_attack: 46
  magic_defense: 54
  max_brv: 485
stat_growth:
  hp: 58.0
  mp: 2.3
  init_brv: 30.7
  strength: 19.7
  defense: 25.5
  magic: 9.3
  spirit: 14.5
  speed: 9.6
  max_brv: 136.2
  luck: 3
  accuracy: 1.6
  evasion: 1.2
traits:
- id: duty_amplifier
  name: 의무 증폭
  description: 의무 획득량 +50%, 의무 5 이상 시 방어력 +30%
  type: passive
  effects:
    duty_gain_bonus: 1.5
    defense_bonus_at_5: 0.3
- id: oath_keeper
  name: 맹세 지킴이
  description: 의무 비례 파티 방어력 버프 (의무당 +3%, 최대 +30%)
  type: passive
  effects:
    party_defense_per_duty: 0.03
    max_party_defense: 0.3
- id: guardian_shield
  name: 수호자의 방패
  description: 아군 보호 시 의무 +3, 받는 피해 -25%
  type: trigger
  effects:
    duty_on_protect: 3
    damage_reduction: 0.25
- id: duty_overflow
  name: 의무 과잉
  description: 의무 MAX(10) 시 파티 전체 무적 1턴 자동 발동
  type: trigger
  conditions:
    duty_exact: 10
  effects:
    party_invincible: 1
- id: sacrifice_honor
  name: 희생의 명예
  description: 파티원 대신 치명상 받을 시 의무 전부 소비하고 생존 + 파티 HP 30% 회복
  type: trigger
  effects:
    survive_fatal: true
    party_heal_on_fatal: 0.3
gimmick:
  type: duty_system
  name: 기사의 의무
  description: '[의무 시스템] 파티를 보호하며 의무 축적!


    - 아군 대신 피해 받을 때 의무 +2

    - 보호 스킬 사용 시 의무 +1

    - 의무 소비해 강력한 수호 기술


    의무 효과:

    - 5 스택: 보호 시 피해 -30%

    - 10 스택: 파티 전체 보호막 발동


    맹세 스킬:

    - 기사도 맹세: 의무 비례 버프

    - 최후의 저항: 의무 전소비 무적

    '
  max_duty_stacks: 10
  duty_gain:
    protect_ally: 2
    use_guard_skill: 1
  duty_effects:
    5:
      damage_reduction: 0.3
    10:
      party_shield: true
skills:
- teamwork
- lance
- duty_strike
- oath
- chivalry
- iron_will
- bash
- last_stand
- devotion
- pledge
- ultimate
- knight_duty_bulwark
- knight_shield_line
- knight_counter_ready
bonuses:
  party_attack_bonus: 0.08
  party_defense_bonus: 0.08
  protect_reduction: 0.1
