class_name: 마검사
description: 마법과 검술이 완벽하게 융합된 전투의 예술가
slogan: "검과 마법, 그 경계를 넘어서"
archetype: 하이브리드 딜러
base_stats:
  hp: 164
  mp: 62
  init_brv: 117
  speed: 58
  physical_attack: 67
  physical_defense: 54
  magic_attack: 70
  magic_defense: 61
  max_brv: 453
stat_growth:
  hp: 11.5
  mp: 5
  init_brv: 23.4
  strength: 4.2
  defense: 3.0
  magic: 4.2
  spirit: 3.5
  speed: 4.0
  luck: 3.5
  accuracy: 2.2
  evasion: 1.8
  max_brv: 90.6
traits:
- id: mana_conduit
  name: 마나 도관
  description: 마나 블레이드 획득량 +50%, 최대 보유량 +20 (100→120)
  type: passive
  effects:
    mana_gain_bonus: 1.5
    max_mana_blade: 120

- id: elemental_mastery
  name: 원소 숙련
  description: 원소 부여 스킬 피해 +40%, 상태이상 지속시간 +1턴
  type: passive
  effects:
    enchant_damage_bonus: 1.4
    status_duration_bonus: 1

- id: blade_resonance
  name: 검의 공명
  description: 마나 50 이상 시 물리/마법 동시 피해 발동
  type: conditional
  conditions:
    mana_blade_min: 50
  effects:
    dual_damage: true

- id: arcane_overflow
  name: 마력 과잉
  description: 마나 MAX(100) 시 다음 스킬 MP 소비 0 + 피해 2배
  type: trigger
  conditions:
    mana_blade_exact: 100
  effects:
    free_cast: true
    damage_multiplier: 2.0

- id: spell_chain
  name: 주문 연쇄
  description: 원소 스킬 연속 사용 시 마나 +10 추가, 피해 누적 +15%
  type: trigger
  effects:
    bonus_mana_on_chain: 10
    chain_damage_bonus: 0.15
gimmick:
  type: enchant_system
  name: 마력 부여
  description: |
    [마검 시스템] 검에 원소 마력을 부여!
    
    - 마법 스킬로 마나 블레이드 충전 (최대 100)
    - 물리 공격 시 마나 소비 + 추가 피해
    - 원소 부여로 속성 공격
    
    원소 부여:
    - 화염 부여: 화상 + 피해 증가
    - 빙결 부여: 속도 감소 + 동결
    - 번개 부여: 연쇄 피해 + 마비
    
    마검 오의:
    - 크리티컬 시 물리+마법 동시 발동
    - 마나 100 소비: 원소 폭풍 (광역)
  max_mana_blade: 100
  enchant_types:
    fire: {damage: 1.3, status: burn}
    ice: {damage: 1.2, status: slow}
    lightning: {damage: 1.25, status: paralyze}
skills:
- teamwork
- magic_slash
- elemental_slash
- fire_infusion
- ice_infusion
- lightning_infusion
- magic_blade_dance
- mana_burst
- elemental_storm
- blade_spin
- ultimate

bonuses:
  hybrid_damage: 1.1
  spell_cast_speed: 1.2
  dual_scaling: 1.0
