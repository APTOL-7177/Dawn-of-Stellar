gimmick:
  type: elemental_spirits
  name: 정령 전환 시스템
  description: '[정령 시스템] 정령을 소환하고 전략적으로 교체하라!


    ■ 기본 규칙

    - 최대 2마리 동시 소환

    - 3번째 정령 소환 → 가장 오래된 정령 자동 교체

    - 융합 스킬 사용해도 정령 유지 (소모 안함)

    - 정령은 전투 종료까지 유지


    ■ 정령별 버프 효과

    🔥 화염: 마공 +20%, 공격 시 30% 화상

    💧 물: 턴 종료 MP +5, 힐 효과 +30%

    💨 바람: 속도 +30%, 회피 +15%

    🌍 대지: 방어력 +30%, 턴 종료 HP +3


    ■ 정령 공명 (2마리 소환 시)

    🔥+💧: 마법 크리티컬 +15%

    🔥+💨: 화염 스킬 범위 +1 (광역화)

    🔥+🌍: 화상 피해 +25%, 방어 관통 +10%

    💧+💨: 공격에 속도 -30% 부여

    💧+🌍: 턴 종료 HP/MP 동시 회복

    💨+🌍: 회피 +10%, 피격 시 20% 반사

    '
  max_spirits: 2
  auto_replace: true
  spirit_slots: []
  spirit_types:
    fire:
      name: 화염 정령
      icon: 🔥
      mp_cost: 12
