gimmick:
  type: alchemy_system
  name: 포션 조합
  description: '[포션 시스템] 재료를 모아 포션 제조!


    - 전투 시작 시 재료 3개 보유

    - 기본 공격(포션 투척/재료 수집)으로 재료 획득 (최대 10개)

    - 재료를 소비해 강력한 포션 효과 발동

    - 회복/MP 회복/버프/폭발/산성/독 다양한 조합


    포션 비용:

    - 회복 포션: 2재료 (HP 45%)

    - 마나 포션: 2재료 (MP 35%, MP 소비 없음!)

    - 버프 포션: 3재료 (공/방 +30%)

    - 산성 플라스크: 2재료 (방어 감소 + 독)

    - 독 폭탄: 3재료 (전체 독)

    - 폭발물: 4재료 (전체 BRV+HP)

    - 연쇄 반응: 5재료 (단일 강타, 재료 비례 강화)

    - 만능약: 6재료 (파티 풀힐 + 정화 + 방어 버프)

    '
