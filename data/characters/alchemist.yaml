class_name: 연금술사
description: 포션과 연금술로 파티를 지원하는 화학의 달인
slogan: "완벽한 조합은 천재의 영역, 폭발은 일상"
archetype: 포션 마스터
base_stats:
  hp: 135
  mp: 69
  init_brv: 113
  speed: 54
  physical_attack: 59
  physical_defense: 44
  magic_attack: 72
  magic_defense: 58
  max_brv: 446
stat_growth:
  hp: 9.5
  mp: 5.8
  init_brv: 22.6
  strength: 2.8
  defense: 2.5
  magic: 4.0
  spirit: 4.2
  speed: 3.5
  luck: 4.2
  accuracy: 2.0
  evasion: 1.8
  max_brv: 89.2
traits:
- id: potion_mastery
  name: 포션 달인
  description: 포션 효과 +40%, 재료 소비 스킬 사용 시 20% 확률로 재료 유지
  type: passive
  effects:
    potion_effect_bonus: 1.4
    material_preserve_chance: 0.2

- id: efficient_brewing
  name: 효율적 조합
  description: 재료 획득량 +1, 최대 재료 보유량 +3 (10→13)
  type: passive
  effects:
    material_gain_bonus: 1
    max_materials: 13

- id: chemical_expert
  name: 화학 전문가
  description: 독/화상 피해 +50%, 디버프 지속시간 +1턴
  type: passive
  effects:
    dot_damage_bonus: 1.5
    debuff_duration_bonus: 1

- id: emergency_synthesis
  name: 긴급 합성
  description: HP 30% 이하 시 재료 3개 즉시 획득 + HP 30% 회복 (전투당 1회)
  type: trigger
  conditions:
    hp_below: 0.3
  effects:
    material_grant: 3
    heal_percent: 0.3

- id: philosophers_touch
  name: 현자의 손길
  description: 턴 종료 시 재료 5개 이상이면 +2 추가 획득
  type: trigger
  conditions:
    materials_min: 5
  effects:
    bonus_materials: 2
gimmick:
  type: alchemy_system
  name: 포션 조합
  description: |
    [포션 시스템] 재료를 모아 포션 제조!
    
    - 공격/힐 스킬로 재료 획득 (최대 10개)
    - 포션 소비해 강력한 효과 발동
    - 회복/버프/폭발/산성 다양한 조합
    
    포션 비용:
    - 회복 포션: 2재료
    - 버프 포션: 3재료
    - 폭발 연쇄: 4재료
  max_potion_stock: 10
  potion_recipes:
    heal: {cost: 2, effect: "HP 회복"}
    buff: {cost: 3, effect: "올스탯 버프"}
    bomb: {cost: 4, effect: "광역 폭발"}
    acid: {cost: 3, effect: "방어 감소"}
skills:
- teamwork
- throw_potion
- explosive
- heal_potion
- buff_potion
- poison_bomb
- gather
- mana_potion
- chain
- acid_flask
- ultimate

bonuses:
  potion_power: 1.2
  item_find: 1.1
  luck_bonus: 8
