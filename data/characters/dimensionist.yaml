traits:
- id: dimensional_stabilization
  name: 차원 안정화
  description: 차원 굴절로 인해 받는 피해 15% → 7.5%로 감소, 매 행동 굴절 감소율 10% → 5%
  type: passive
  unlock_level: 5
  effects:
    damage_reduction_improved: 0.925
    decay_rate_reduced: 0.05
- id: self_healing_mastery
  name: 자가 치유 특화
  description: 본인 스킬로 회복되는 양 200% 증가, 외부 회복 80% 감소
  type: passive
  unlock_level: 10
  effects:
    self_heal_multiplier: 3.0
    external_heal_multiplier: 0.2
- id: fixed_damage_amplification
  name: 고정 피해 증폭
  description: 고정 피해를 입히는 스킬의 피해량 +50%
  type: passive
  unlock_level: 15
  effects:
    fixed_damage_bonus: 1.5
- id: double_refraction
  name: 이중 차원
  description: 받는 모든 피해 50% 추가 감소, 차원 굴절로 인한 피해 75% 증가
  type: passive
  unlock_level: 20
  effects:
    additional_damage_reduction: 0.5
    decay_damage_multiplier: 1.75
- id: undying_existence
  name: 불멸의 존재
  description: HP가 0이 되어도 행동 및 회복 가능. 다른 아군 모두 사망 시 게임 오버
  type: special_passive
  unlock_level: 25
  effects:
    can_act_at_zero_hp: true
    requires_ally_alive: true
gimmick:
  type: dimension_refraction
  name: 차원 굴절
  description: '받는 HP 피해를 85% 경감하고 경감량만큼 차원 굴절 스택 축적.

    매 행동마다 차원 굴절의 10%씩 감소하며 감소량만큼 HP 고정 피해로 받음.

    '
  damage_reduction: 0.85
