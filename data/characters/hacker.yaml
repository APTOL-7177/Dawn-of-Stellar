gimmick:
  type: intrusion_system
  name: 침투 시스템
  description: '[침투 시스템] 적 시스템에 침투하여 장악하라!


    ■ 침투 게이지 (적 단위, 0~100%)

    공격/해킹 스킬로 게이지 축적.

    단계별 디버프 자동 적용.


    ■ 침투 단계별 효과

    25%: 정보 노출 - 회피 -15%, 약점 노출

    50%: 시스템 불안정 - 속도 -20%, 크리 피해 +15%

    75%: 제어권 감소 - 공격 -15%, 랜덤 스킬 봉인

    100%: 완전 장악 - 장악 스킬 사용 가능!


    ■ RAM 자원 (최대 32GB)

    프로그램 실행에 필요한 자원.

    턴 시작마다 3GB 회복, 병렬 처리 특성 시 +1GB 추가.

    오버클럭 시 침투 효율과 속도가 상승하지만 매 턴 RAM/HP를 소모합니다.


    ■ 장악 스킬 (침투 100%)

    - 시스템 크래시: 순수 HP 35%

    - 데이터 와이프: 버프 전부 제거 + 디버프 2배

    - 바이러스 폭발: 주변 전파 + DoT

    - 메모리 덤프: 적 스킬 복사

    '
  max_ram: 32
  start_ram: 8
  ram_regen_per_turn: 3
  intrusion_stages:
    stage_25:
      threshold: 25
      name: 정보 노출
