traits:
- id: lucky_drunk
  name: 행운의 주정뱅이
  description: 럼주 효과가 항상 긍정적, 부정 효과 발동 시 BRV +30% 보상
  type: passive
  effects:
    rum_always_positive: true
    negative_rum_brv_bonus: 0.3
- id: treasure_hoarder
  name: 보물 수집가
  description: 보물 최대 보유량 +2 (3→5), 같은 보물 중첩 시 효과 1.5배
  type: passive
  effects:
    max_treasure: 5
    stack_bonus: 1.5
- id: sea_dog_instinct
  name: 바다 늑대의 본능
  description: HP 30% 이하 시 회피율 +40%, 럼주 효과 지속시간 2배
  type: conditional
  conditions:
    hp_below: 0.3
  effects:
    evasion_bonus: 0.4
    rum_duration_multiplier: 2.0
- id: plunder_master
  name: 약탈의 대가
  description: 적 처치 시 100% 보물 획득 (기본 60%), 보물 효과 +30%
  type: passive
  effects:
    treasure_drop_rate: 1.0
    treasure_effect_bonus: 1.3
- id: pirate_kings_fortune
  name: 해적왕의 행운
  description: 모든 확률 기반 효과 +15%, 크리티컬 데미지 +25%
  type: passive
  effects:
    luck_bonus: 0.15
    critical_damage: 1.25
gimmick:
  type: rum_treasure_system
  name: 럼주와 보물
  description: '[럼주] 마시면 랜덤 효과 발동 (도박!)

    [보물] 적 처치 시 획득, 강력한 일회용 효과


    럼주 효과 (50% 긍정 / 50% 부정):

    - 대박: 공격력 2배 (3턴)

    - 취기: 명중 -30%, 회피 +50% (2턴)

    - 불꽃: 매턴 자해 10%, 공격력 +80% (3턴)

    - 블랙아웃: 1턴 기절, 다음 턴 2회 행동


    보물 종류:

    - 금화 주머니: 즉시 BRV +50%

    - 해적 권총: 추가 원거리 공격

    - 저주받은 동전: 적 전체 디버프

    - 행운의 주사위: 다음 스킬 효과 2배 or 0.5배

    - 검은 진주: 궁극기 게이지 +50

    '
  max_treasure: 3
  rum_positive_chance: 0.5
  treasure_drop_chance: 0.6
  rum_effects:
    jackpot:
      name: 대박
      chance: 0.25
      effect: attack_up_200
      duration: 3
    tipsy:
