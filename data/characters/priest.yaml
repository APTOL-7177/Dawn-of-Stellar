    ■ 신탁 (라운드 시작 시)

    매 라운드 신의 계시 1개 수신.

    신탁 충족 시 신앙 +20 + 보너스 효과.


    ■ 신앙 게이지 (0~100)

    신탁 충족/치유/정화로 축적.

    기적 스킬에 사용.


    ■ 연속 충족 보너스

    2연속: 다음 보상 +10

    3연속: 모든 효과 +20%

    4연속: 신앙 +30 추가

    5연속+: 기적의 은총!

