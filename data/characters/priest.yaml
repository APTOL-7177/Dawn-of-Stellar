class_name: 신관
description: 신의 기적을 일으켜 파티를 축복하는 성스러운 존재
slogan: "구원할 것인가, 심판할 것인가"
archetype: 기적/치유 특화
base_stats:
  hp: 143
  mp: 81
  init_brv: 110
  speed: 52
  physical_attack: 42
  physical_defense: 57
  magic_attack: 79
  magic_defense: 89
  max_brv: 443
stat_growth:
  hp: 10
  mp: 7
  init_brv: 22.0
  strength: 2.2
  defense: 2.5
  magic: 4.2
  spirit: 5.5
  speed: 3.0
  luck: 4.5
  accuracy: 1.8
  evasion: 1.5
  max_brv: 88.6
traits:
- id: faith_amplifier
  name: 신앙 증폭
  description: 치유 스킬 시 신앙 +5 추가, 힐 효과 +30%
  type: passive
  effects:
    extra_faith: 5
    heal_bonus: 1.3

- id: judgment_wrath
  name: 심판의 분노
  description: 심판력 50 이상 시 신성 피해 +50%, 심판력 획득량 +25%
  type: conditional
  conditions:
    judgment_min: 50
  effects:
    holy_damage_bonus: 1.5
    judgment_gain_bonus: 1.25

- id: divine_balance
  name: 신성 균형
  description: 신앙과 심판력이 같을 때 모든 스킬 효과 +40%
  type: conditional
  conditions:
    faith_equals_judgment: true
  effects:
    all_skill_bonus: 1.4

- id: resurrection_prayer
  name: 부활의 기도
  description: 신앙 100 도달 시 전투불능 아군 자동 부활 (HP 60%)
  type: trigger
  conditions:
    faith_exact: 100
  effects:
    auto_resurrect: true
    resurrect_hp: 0.6

- id: holy_sanctuary
  name: 신성한 성역
  description: 심판력 100 도달 시 파티 전체 3턴 무적 + 상태이상 해제
  type: trigger
  conditions:
    judgment_exact: 100
  effects:
    party_invincible: 3
    cleanse_all: true
gimmick:
  type: divinity_system
  name: 신성 권능
  description: |
    [신성 시스템] 치유와 심판으로 신성력 축적!
    
    - 치유 스킬: 신앙 +10
    - 심판 스킬: 심판력 +15
    - 신성력 소비해 기적 발동
    
    신성 기적:
    - 50 신앙: 완전 회복 가능
    - 100 심판: 신성 심판 (즉사급)
    
    특수 기적:
    - 부활: 전투불능 부활 (1회)
    - 신의 보호: 파티 무적 (1턴)
  max_judgment_points: 100
  max_faith_points: 100
  faith_gain:
    heal: 10
    buff: 5
  judgment_gain:
    smite: 15
    damage: 10
skills:
- teamwork
- holy_smite
- divine_judgment
- light_bind
- holy_heal
- divine_protection
- judgment_light
- holy_beam
- divine_wrath
- divine_grace
- ultimate

bonuses:
  healing_power: 1.2
  mp_multiplier: 1.1
  critical_taken_reduction: 0.1
  status_immunity: 1.0
