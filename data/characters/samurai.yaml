gimmick:
  type: kenshin_system
  name: 검심(剣心) - 관찰과 반격의 도
  description: |
    적의 공격을 관찰하고 학습하여 완벽한 반격을 수행한다.

    ■ 관찰 스택 (0~10+)
      - 적의 공격 피격/패링 시 획득 (+1~3)
      - 공격 스킬 사용 시 감소 (-2)
      - 매 턴 종료 시 감소 (-1)
      - 3단계: 초심(0-4) → 무심(5-9) → 검성(10+)
      - 검성 유지는 어렵지만 강력함

    ■ 반격 시스템 (피격 시 자동)
      - 초심: 피해 10%↓, 받은 피해의 30% BRV 반사
      - 무심: 피해 20%↓, 받은 피해의 50% BRV 반사
      - 검성: 피해 35%↓, 받은 피해의 80% BRV 반사

    ■ 검압 게이지 (0~100)
      - 피격/패링 시 획득
      - 특수 스킬 사용 시 소모

    ■ 패링 시스템 (미키리 카마에)
      - MP 0, ATB 150% 캐스트
      - 캐스트 중 최대 3회 패링 (100% 확정)
      - 캐스트 완료 시 패링 횟수에 따라 강공격
        → 1회: 2.0배, 2회: 3.5배, 3회: 5.0배

    ■ 요미 (적 행동 예측)
      - 턴 소모 없음 (즉시 발동)
      - MP 소량 소모
      - 적 전체의 다음 행동 표시 (2~3턴간)

  max_observation: 15
  max_kenatsu: 100
  parry_max_count: 3

  stages:
    shoshin:  # 초심 (0-4)
      name: 초심(平心)
      observation_min: 0
      observation_max: 4
      damage_reduction: 0.1  # 피격 시 피해 10% 감소
      counter_damage: 0.3    # 받은 피해의 30%를 BRV 반사
      brv_absorb_bonus: 0
    mushin:  # 무심 (5-9)
      name: 무심(無心)
      observation_min: 5
      observation_max: 9
      damage_reduction: 0.2  # 피격 시 피해 20% 감소
      counter_damage: 0.5    # 받은 피해의 50%를 BRV 반사
      brv_absorb_bonus: 0.1
    kensei:  # 검성 (10+)
      name: 검성(剣聖)
      observation_min: 10
      damage_reduction: 0.35  # 피격 시 피해 35% 감소
      counter_damage: 0.8     # 받은 피해의 80%를 BRV 반사
      brv_absorb_bonus: 0.2
      special_abilities:
        - yomi_enhanced  # 신메이노요미 해금
        - consecutive_counter  # 연속 반격
        - kenatsu_burst  # 검압 폭발

