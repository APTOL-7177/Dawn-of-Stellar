gimmick:
  type: mockery_system
  name: 농락 시스템
  description: '[농락 시스템] 적을 농락하며 독으로 지배하라!


    ■ 농락 게이지 (적 단위, 0~10)

    회피/비웃기/도발로 농락 축적.

    농락 7+ 적은 명중률 -30%, 피해 +20%.

    농락 10 시 "굴욕" - 다음 공격 필중+치명타.


    ■ 독 시스템

    기본 독: 매 턴 5% HP DoT

    맹독: 2중첩 시 발동 - HP -10%, 회복 불가

    치명독: 3중첩 시 - HP -15%, 공격 시 추가 피해


    ■ 회피 연계

    회피 성공: 농락 +2 + 크리 +30%

    3연속 회피: 은신 돌입 + 농락 +5

    은신 상태: 다음 공격 뒤치기 (3배 피해)

    '
  max_mockery: 10
  mockery_effects:
    7:
      hit_reduction: 0.3
      damage_bonus: 0.2
      name: 당황
    10:
      guaranteed_crit: true
      guaranteed_hit: true
      name: 굴욕
  poison_types:
    basic:
      dot_percent: 0.05
      duration: 3
      name: 기본 독
    deadly:
