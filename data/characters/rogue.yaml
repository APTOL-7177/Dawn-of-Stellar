      heal_block: true
      stacks: 2
      name: 맹독
    lethal:
      dot_percent: 0.15
      damage_bonus: 0.2
      stacks: 3
      name: 치명독
  evasion_chain:
    per_evade:
      mockery: 2
      crit_bonus: 0.3
    chain_3:
      stealth: true
      mockery: 5
    stealth_attack_multiplier: 2.5
