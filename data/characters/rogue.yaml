class_name: 도적
description: 압도적인 속도와 회피로 적을 농락하는 암살자
slogan: "정정당당? 그건 바보들이나 하는 거지"
archetype: 속도형 딜러
base_stats:
  hp: 150
  mp: 41
  init_brv: 110
  physical_attack: 64
  physical_defense: 43
  magic_attack: 38
  magic_defense: 49
  speed: 93
  max_brv: 442
stat_growth:
  hp: 10
  mp: 4
  init_brv: 22.0
  strength: 4.0
  defense: 2.5
  magic: 2.0
  spirit: 2.8
  speed: 5.5
  luck: 4.0
  accuracy: 2.5
  evasion: 2.0
  max_brv: 88.4
traits:
- id: master_thief
  name: 도둑의 달인
  description: 훔치기 성공률 +30%, 훔친 아이템 효과 +50%
  type: passive
  effects:
    steal_success_bonus: 0.3
    stolen_item_bonus: 1.5

- id: treasure_sense
  name: 보물 감지
  description: 훔친 아이템 5개 이상 시 희귀 아이템 획득 확률 2배
  type: conditional
  conditions:
    stolen_items_min: 5
  effects:
    rare_steal_chance: 2.0

- id: shadow_evasion
  name: 그림자 회피
  description: 회피 성공 시 훔친 아이템 +1, 다음 공격 크리티컬 확정
  type: trigger
  effects:
    stolen_on_evade: 1
    guaranteed_crit: true

- id: quick_fingers
  name: 빠른 손놀림
  description: 훔친 아이템 사용 시 50% 확률로 소비 안 함
  type: trigger
  effects:
    item_preserve_chance: 0.5

- id: assassin_instinct
  name: 암살자의 본능
  description: 훔친 아이템 MAX(10) 시 다음 공격이 HP 20% 이하 적 즉사
  type: conditional
  conditions:
    stolen_items_exact: 10
  effects:
    execute_threshold: 0.2
    instant_kill: true
gimmick:
  type: theft_system
  name: 절도와 회피
  description: |
    [절도 시스템] 적에게서 아이템을 훔쳐라!
    
    - 훔치기 스킬로 아이템 획득
    - 훔친 아이템 즉시 사용 가능
    - 회피 성공 시 추가 보너스
    
    훔칠 수 있는 것:
    - 골드 (즉시 획득)
    - 포션 (즉시 사용)
    - 버프 (적 버프 탈취)
    - 희귀템 (확률적)
    
    회피 보너스:
    - 회피 성공 시 크리 +50%
    - 3연속 회피 시 은신 상태
  max_stolen_items: 10
  steal_chances:
    gold: 0.6
    potion: 0.3
    buff: 0.15
    rare: 0.05
skills:
- teamwork
- ambush
- vital_strike
- steal
- smoke
- use_item
- poison
- treasure
- backstab
- assassinate
- ultimate

bonuses:
  speed_multiplier: 1.1
  critical_rate: 1.2
  evasion_bonus: 12
