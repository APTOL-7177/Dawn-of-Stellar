class_name: 브레이커
description: 화공학 엔진과 증기기관이 달린 건틀릿으로 상대를 산산조각 내는 딜러
slogan: 부서진 것들이 나의 무기가 된다
archetype: SCATTER/연격 특화
base_stats:
  hp: 195
  mp: 38
  init_brv: 130
  speed: 68
  physical_attack: 81
  physical_defense: 62
  magic_attack: 35
  magic_defense: 48
  max_brv: 332
