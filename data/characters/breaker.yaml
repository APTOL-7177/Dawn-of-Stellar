class_name: 브레이커
description: BRV를 파괴하는 것에 특화된 전사
slogan: "부서진 것들이 나의 무기가 된다"
archetype: BRV 파괴 특화
base_stats:
  hp: 195
  mp: 38
  init_brv: 130
  speed: 68
  physical_attack: 81
  physical_defense: 62
  magic_attack: 35
  magic_defense: 48
  max_brv: 475
stat_growth:
  hp: 13.0
  mp: 3.8
  init_brv: 26.0
  strength: 6.2
  defense: 4.5
  magic: 2.5
  spirit: 3.2
  speed: 3.8
  luck: 4.2
  accuracy: 3.8
  evasion: 2.0
  max_brv: 95.0
gimmick:
  type: break_system
  name: 파괴력 축적
  description: |
    [파괴 시스템] BRV를 부수고 파괴력 축적!
    
    - BRV 공격 시 파괴력 +1~2 (최대 10)
    - 파괴력 비례 피해 증가 (+20~50%/스택)
    - 파괴력 소비해 강력한 일격
    
    파괴력 보너스:
    - 5 스택: 피해 +100%
    - 10 스택: 피해 +200%, 방어 관통
  max_break_power: 10
  power_scaling:
    per_stack: 0.2
    max_bonus: 2.0
traits:
- id: destruction_resonance
  name: 파괴 공명
  description: 파괴력 5 이상 시 모든 피해 +50%, 파괴력 축적량 +1
  type: conditional
  conditions:
    break_power_min: 5
  effects:
    damage_bonus: 1.5
    break_power_gain_bonus: 1

- id: armor_shatter
  name: 갑옷 분쇄
  description: 파괴력 비례 적 방어력 무시 (파괴력당 3%, 최대 30%)
  type: passive
  effects:
    defense_penetration_per_stack: 0.03
    max_penetration: 0.30

- id: break_momentum
  name: 파괴 추진력
  description: BREAK 발동 시 파괴력 +3, 다음 공격 피해 +80%
  type: trigger
  effects:
    break_power_on_break: 3
    next_attack_bonus: 1.8

- id: relentless_crusher
  name: 무자비한 파쇄자
  description: 파괴력 MAX(10) 시 모든 공격이 방어 완전 관통
  type: conditional
  conditions:
    break_power_exact: 10
  effects:
    full_penetration: true

- id: destruction_chain
  name: 파괴 연쇄
  description: BRV 공격으로 적 BRV 0으로 만들 시 파괴력 +2
  type: trigger
  effects:
    break_power_on_zero_brv: 2
skills:
- teamwork
- crush
- break_hit
- brv_focus
- multi
- enhance
- mega_crush
- wave
- total
- devastation
- ultimate

bonuses:
  brv_damage: 1.15
  break_bonus: 1.4
  shield_penetration: 0.15
