traits:
- id: spirit_vision
  name: 영혼의 시야
  description: 시야 거리 +50%, 함정/보물 탐지 확률 +100%
  type: passive
  effects:
    vision_range: 1.5
    treasure_find: 1.2
    trap_detection: 1.0
    critical_resistance: 0.2
- id: overload_master
  name: 과부하의 달인
  description: 과부하 스킬 효과 +20%, MP 소모 -10%
  type: passive
  effects:
    overload_bonus: 0.2
    overload_mp_reduction: 0.1
- id: desperate_power
  name: 위험한 힘
  description: MP 20~49% 시 과부하 효과 +30%, 크리티컬 +15%
  type: conditional
  conditions:
    mp_percentage_min: 0.2
    mp_percentage_max: 0.49
  effects:
    overload_bonus: 0.3
    critical_rate: 0.15
- id: spirit_resonance
  name: 영력 공명
  description: 과부하 게이지 3+ 시 마공 +40%, 속도 +25%
  type: conditional
  conditions:
    overload_gauge_min: 3
  effects:
    magic_bonus: 0.4
    speed_bonus: 0.25
- id: toggle_efficiency
  name: 토글 효율
  description: 토글 버프 활성 시 MP 회복량 +50%
  type: conditional
  conditions:
    has_active_toggle: true
  effects:
    mp_regen_bonus: 0.5
gimmick:
  type: mp_overload_system
  name: 영력 과부하
  description: '[MP 과부하 시스템] 영력을 극한까지 끌어올려 폭발적 힘 발휘!


    과부하 메커니즘:

    - 스킬 사용 시 추가 MP 투입으로 강화 (2~3배 소모, 50~100% 효과)

    - 과부하 게이지 축적 (최대 5)

    - 게이지 5 도달 시 약화된 ''영력 폭주(자동)'' 자동 발동


    토글 버프:

    - 특정 버프는 ON/OFF 가능

    - 활성 시 최대 MP 20~30% 예약

    - 동시 활성: 최대 2개


    MP 상태별 효과:

    - 안정(50%+): 평범

    - 위험(20~49%): 과부하 +30%, 크리티컬 +15%

    - 고갈(0~19%): 과부하 불가, 스킬 약화

    '
  max_overload_gauge: 5
  gauge_effects:
    5:
      auto_trigger: shaman_overload_auto
  max_active_toggles: 3
  toggle_skills:
  - shaman_spirit_protection
  - shaman_ancestral_blessing
  - shaman_spirit_circulation
  - shaman_mana_guard
  mp_state_effects:
    danger:
      threshold: 0.2
      max_threshold: 0.49
      overload_bonus: 0.3
      critical_bonus: 0.15
    depleted:
      threshold: 0.0
      max_threshold: 0.19
      skill_penalty: 0.5
      overload_disabled: true
skills:
- shaman_spirit_arrow
- shaman_spirit_burst
- shaman_plague
