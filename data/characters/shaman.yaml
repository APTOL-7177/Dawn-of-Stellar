class_name: 무당
description: 영력을 극한까지 끌어올려 폭발적인 힘을 발휘하는 영매
slogan: 조상의 영력이 한계를 넘어선다
archetype: MP 과부하 / 고위험 고보상
base_stats:
  hp: 110
  mp: 225
  init_brv: 100
  speed: 62
  physical_attack: 45
  physical_defense: 40
  magic_attack: 92
  magic_defense: 75
  max_brv: 294
stat_growth:
  hp: 24.4
