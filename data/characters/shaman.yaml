class_name: 무당
description: 영혼과 소통하여 미래를 예견하고 파티를 보호하는 영매
slogan: "조상의 목소리가 미래를 말해준다"
archetype: 시야/정보 특화
base_stats:
  hp: 121
  mp: 76
  init_brv: 107
  speed: 64
  physical_attack: 48
  physical_defense: 44
  magic_attack: 86
  magic_defense: 77
  max_brv: 437
stat_growth:
  hp: 9
  mp: 6
  init_brv: 21.4
  strength: 2.5
  defense: 2.3
  magic: 4.2
  spirit: 4.8
  speed: 3.5
  luck: 4.8
  accuracy: 2.0
  evasion: 2.0
  max_brv: 87.4
traits:
- id: curse_amplifier
  name: 저주 증폭
  description: 저주 획득량 +1, 저주 비례 피해 +20% 추가
  type: passive
  effects:
    curse_gain_bonus: 1
    curse_damage_bonus: 0.2

- id: lingering_curse
  name: 잔류 저주
  description: 디버프/DoT 지속시간 +2턴, 효과 +30%
  type: passive
  effects:
    debuff_duration_bonus: 2
    dot_effect_bonus: 1.3

- id: curse_resonance
  name: 저주 공명
  description: 저주 5 이상 시 모든 피해 +60%, 디버프 면역
  type: conditional
  conditions:
    curse_min: 5
  effects:
    damage_bonus: 1.6
    debuff_immune: true

- id: hex_master
  name: 주술의 대가
  description: 저주 MAX(10) 도달 시 적 전체에 저주 폭발 자동 발동
  type: trigger
  conditions:
    curse_exact: 10
  effects:
    curse_explosion: true
    aoe: true

- id: soul_harvest
  name: 영혼 수확
  description: 적 처치 시 저주 +3, HP/MP 10% 회복
  type: trigger
  effects:
    curse_on_kill: 3
    hp_recover: 0.1
    mp_recover: 0.1
gimmick:
  type: curse_system
  name: 저주 축적
  description: |
    [저주 시스템] 저주를 모아 강력한 주술 발동!
    
    - 저주 스킬로 스택 축적 (최대 10)
    - 저주 비례 피해 + 디버프 강화
    - 저주 소비해 폭발적 효과
    
    저주 효과:
    - 3 스택: DoT 피해 +50%
    - 5 스택: 디버프 지속시간 2배
    - 10 스택: 저주 폭발 (즉사급)
    
    영혼 교감:
    - 적 약점 자동 탐지
    - 숨겨진 함정/보물 발견
  max_curse_stacks: 10
  curse_effects:
    3: {dot_bonus: 0.5}
    5: {debuff_duration: 2.0}
    10: {curse_explosion: true}
skills:
- teamwork
- curse
- curse_burst
- plague
- curse_transfer
- curse_accumulate
- dark_magic
- soul_drain
- curse_mark
- nightmare
- ultimate

bonuses:
  vision_range: 1.5
  treasure_find: 1.2
  trap_detection: 1.0
  critical_resistance: 0.2
