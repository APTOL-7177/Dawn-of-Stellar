class_name: 네크로맨서
description: 저주와 디버프로 적을 약화시키는 어둠의 마법사
slogan: 죽음은 끝이 아니라 시작이다
archetype: 디버프 특화
base_stats:
  hp: 134
  mp: 84
  init_brv: 103
  speed: 48
  physical_attack: 44
  physical_defense: 39
  magic_attack: 84
  magic_defense: 74
  max_brv: 432
stat_growth:
  hp: 28.2
  mp: 6.2
  init_brv: 24.3
  strength: 11.0
  defense: 8.6
  magic: 22.9
  spirit: 18.9
  speed: 10.7
  max_brv: 121.3
  luck: 3
