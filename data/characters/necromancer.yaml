  evasion: 1.2
traits:
- id: undead_commander
  name: 언데드 지휘관
  description: 언데드 3마리 이상 보유 시 모든 언데드 능력 +50%
  type: passive
  conditions:
    undead_count_min: 3
  effects:
    undead_power_multiplier: 1.5
- id: death_harvest
  name: 죽음의 수확
  description: 적 처치 시 시체 자동 획득 (스켈레톤 소환 재료)
  type: trigger
  effects:
    auto_corpse_gain: true
- id: necromantic_power
  name: 사령술의 힘
  description: 언데드 1마리당 마법 공격력 +10%
  type: passive
  effects:
    magic_per_undead: 0.1
- id: undead_sacrifice
  name: 언데드 희생
  description: 언데드 파괴 시 MP 20 회복
  type: trigger
  effects:
    mp_gain_on_death: 20
- id: legion_master
  name: 군단 숙련
  description: 각 언데드 타입 1마리씩 보유 시 모든 능력치 +20%
  type: conditional
  conditions:
    all_undead_types: true
  effects:
    all_stats_multiplier: 1.2
gimmick:
  type: undead_legion
  name: 언데드 군단 관리
  description: 3가지 언데드(스켈레톤/좀비/유령)를 소환하여 전투. 각 언데드는 고유 능력 제공
  max_undead_total: 5
  max_per_type: 2
  undead_types:
    skeleton:
      name: 스켈레톤
      effect: 물리 공격력 +15%
      hp_cost: 10
      summon_cost: 15
    zombie:
      name: 좀비
      effect: 방어력 +20%, HP 회복 +3/턴
      hp_cost: 15
      summon_cost: 20
    ghost:
      name: 유령
      effect: 마법 공격력 +20%, 회피율 +10%
      hp_cost: 20
      summon_cost: 25
skills:
- teamwork
- shadow_bolt
- drain_life
- summon_skeleton
- summon_zombie
- summon_ghost
- sacrifice_undead
- legion_command
- death_wave
- mass_summon
- ultimate
bonuses:
  mp_multiplier: 1.15
  debuff_power: 1.15
  debuff_duration: 1.2
