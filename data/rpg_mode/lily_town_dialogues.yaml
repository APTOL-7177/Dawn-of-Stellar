# 마을에서 릴리와의 대화 (T키)
# 챕터 범위별 대화 주제 제공

town_dialogues:
  ch0_3:
    - id: "favorite_food"
      title: "좋아하는 음식"
      affinity_change: 3
      lines:
        - speaker: "릴리"
          text: "나? 음... 딸기 케이크! 이 세계에도 딸기가 있을까?"
        - speaker: "릴리"
          text: "크리스는? 좋아하는 음식 있어?"
        - speaker: "릴리"
          text: "언젠가 같이 딸기 케이크 만들자! 약속!"

    - id: "this_world"
      title: "이 세계에 대해"
      affinity_change: 3
      lines:
        - speaker: "릴리"
          text: "이 세계... '잔향의 차원'이라고 하잖아."
        - speaker: "릴리"
          text: "가끔 꿈같아. 하지만 네가 있으니까 현실 같기도 하고."
        - speaker: "릴리"
          text: "어쨌든 여기가 내 고향이야. 사랑하는 곳."

    - id: "dream"
      title: "최근에 꾼 꿈"
      affinity_change: 3
      lines:
        - speaker: "릴리"
          text: "어젯밤에 예쁜 꿈을 꿨어."
        - speaker: "릴리"
          text: "넓은 꽃밭에서 누군가와 걸어가고 있었어."
        - speaker: "릴리"
          text: "그 사람 얼굴은 안 보였는데... 크리스 같았어. 아마도."

    - id: "hobby"
      title: "취미"
      affinity_change: 3
      lines:
        - speaker: "릴리"
          text: "나는 별 보는 걸 좋아해. 마을 뒤편 언덕이 명당이야."
        - speaker: "릴리"
          text: "가끔 혼자 앉아서 별을 세다가 잠들곤 해."
        - speaker: "릴리"
          text: "다음에 같이 갈래? 별이 정말 예뻐."

    - id: "village_people"
      title: "마을 사람들"
      affinity_change: 2
      lines:
        - speaker: "릴리"
          text: "마을 사람들 다 착해."
        - speaker: "릴리"
          text: "대장장이 아저씨는 무뚝뚝하지만 착하고, 상점 언니는 항상 사탕을 줘."
        - speaker: "릴리"
          text: "모두 지키고 싶은 사람들이야."

  ch4_6:
    - id: "strange_feeling"
      title: "이상한 기분"
      affinity_change: 5
      lines:
        - speaker: "릴리"
          text: "요즘... 이상한 느낌이 자꾸 들어."
        - speaker: "릴리"
          text: "뭔가 잊고 있는 것 같은, 중요한 것을."
        - speaker: "릴리"
          text: "...아니야, 아마 피곤해서 그런 거야. 걱정하지 마."

    - id: "about_chris"
      title: "크리스에 대해"
      affinity_change: 5
      affinity_min: 50
      lines:
        - speaker: "릴리"
          text: "크리스, 가끔 생각해."
        - speaker: "릴리"
          text: "하늘에서 떨어진 너를 내가 발견한 건... 우연일까?"
        - speaker: "릴리"
          text: "아니면... 정해진 거였을까."
        - speaker: "릴리"
          text: "뭐, 어느 쪽이든 만나서 다행이야."

    - id: "nightmares"
      title: "악몽에 대해"
      affinity_change: 5
      lines:
        - speaker: "릴리"
          text: "자꾸 같은 꿈을 꿔."
        - speaker: "릴리"
          text: "어떤 남자가 울면서 '이번에는 꼭'이라고 말해."
        - speaker: "릴리"
          text: "10만 번... 그 숫자가 머리에서 안 떠나."
        - speaker: "릴리"
          text: "...무서워. 크리스 옆에 있어도 돼?"

    - id: "identity"
      title: "나는 누구일까"
      affinity_change: 5
      affinity_min: 80
      lines:
        - speaker: "릴리"
          text: "크리스... 나, 가끔 생각해."
        - speaker: "릴리"
          text: "내 기억 중에 '시작'이 없어."
        - speaker: "릴리"
          text: "마을에서 자랐다는 건 아는데... 언제부터 여기 있었는지."
        - speaker: "릴리"
          text: "마치 갑자기 '시작'된 것 같아. 무서운 생각이야."

  ch7_9:
    - id: "after_truth"
      title: "진실을 알고 난 후"
      affinity_change: 8
      affinity_min: 100
      lines:
        - speaker: "릴리"
          text: "잔향... 나는 잔향이야."
        - speaker: "릴리"
          text: "10만 번의 반복에서 매번 크리스 곁에 있던 소녀의 메아리."
        - speaker: "릴리"
          text: "처음에는 충격이었어. 내가 '진짜'가 아니라는 게."
        - speaker: "릴리"
          text: "하지만 생각해봤어. 이 감정이 가짜일 리 없어."
        - speaker: "릴리"
          text: "크리스를 좋아하는 마음, 마을을 지키고 싶은 마음..."
        - speaker: "릴리"
          text: "이건 누가 뭐래도 '내' 감정이야."

    - id: "about_cain"
      title: "카인에 대해"
      affinity_change: 5
      lines:
        - speaker: "릴리"
          text: "카인... 그도 아픈 사람이야."
        - speaker: "릴리"
          text: "10만 번을 반복하면서 누군가를 구하지 못한 고통."
        - speaker: "릴리"
          text: "이해는 돼. 하지만 이 세계를 파괴하는 건 용서할 수 없어."
        - speaker: "릴리"
          text: "카인의 아픔을 끝내주는 것도... 우리의 역할이야."

    - id: "about_sephiroth"
      title: "세피로스에 대해"
      affinity_change: 5
      lines:
        - speaker: "릴리"
          text: "세피로스... 이 차원을 만든 존재."
        - speaker: "릴리"
          text: "나를 이 세계에 심은 것도 그야."
        - speaker: "릴리"
          text: "원망해야 하는 건지, 감사해야 하는 건지 모르겠어."
        - speaker: "릴리"
          text: "덕분에 크리스를 만났으니까... 감사하기로 했어."

    - id: "final_resolve"
      title: "마지막 결의"
      affinity_change: 10
      affinity_min: 150
      lines:
        - speaker: "릴리"
          text: "크리스, 들어줘."
        - speaker: "릴리"
          text: "마지막 싸움이 끝나면... 이 세계가 어떻게 될지 몰라."
        - speaker: "릴리"
          text: "나도 사라질 수 있어. 잔향이니까."
        - speaker: "릴리"
          text: "하지만 괜찮아."
        - speaker: "릴리"
          text: "너와 함께한 시간이 있었으니까. 그거면 충분해."
        - speaker: "릴리"
          text: "...거짓말. 사실 더 함께 있고 싶어. 많이."
