# 차원의 잔향 - 로어 파편 데이터
# RPG 모드 수집형 세계관 기록물
# 모든 텍스트는 한국어로 작성됨

lore_fragments:

  # ============================================================
  # 잔향의 기록 - 세피로스의 증언 (8편)
  # ============================================================
  echo_records:

    - id: "echo_record_1"
      title: "잔향의 기록 #1 - 후회의 씨앗"
      region: "forgotten_forest"
      location: "뿌리의 미궁 최하층"
      rarity: "rare"
      discovery_text: "이끼 낀 고대 비석이 희미한 빛을 발하며 떨린다. 손을 갖다 대자 따뜻한 기운이 손바닥을 타고 올라오며, 누군가의 목소리가 머릿속에서 울린다..."
      full_text: |
        나는 처음엔 그것이 가능하다고 믿었다.

        모든 것은 한 순간으로 거슬러 올라간다. 그녀의 손이 내 손 안에서 식어가던 그 순간. 나는 그 차가움을 느끼며 깨달았다—이 세계의 법칙이란 결국 잔인한 농담에 불과하다고. 살아야 할 사람이 죽고, 남아야 할 것들이 사라진다. 나는 그 법칙을 거부했다.

        첫 번째 역행은 조심스러웠다. 시간의 흐름을 거스른다는 것이 어떤 의미인지, 나는 아직 온전히 이해하지 못했다. 그저 믿었다. 한 번만 더 기회가 주어진다면, 나는 반드시 다른 선택을 할 수 있다고. 그녀를 살릴 수 있다고.

        그러나 첫 번째 시도는 실패했다. 두 번째도, 세 번째도. 나는 포기하지 않았다. 포기란 그녀를 다시 한번 잃는 것과 같은 의미였기 때문이다. 그래서 나는 계속했다. 열 번, 백 번, 천 번... 그리고 어느 순간부터 나는 숫자를 세는 것을 멈췄다.

        이 기록을 쓰는 지금, 나는 87,432번째 역행의 끝에 서 있다. 손은 여전히 떨리지 않는다. 다만 기억이 조금씩 무거워졌을 뿐이다. 실패의 기억들이 층층이 쌓여, 내 마음은 이제 거대한 폐허처럼 되어버렸다.

        하지만 아직 끝이 아니다. 씨앗은 아직 땅 속에 있다. 언젠가 싹을 틔울 것이다.
      narrator: "세피로스"
      vision_description: "크리스의 눈앞에 흐릿한 영상이 펼쳐진다. 어두운 방 안, 무릎을 꿇은 남자가 누군가의 손을 꼭 쥐고 있다. 손은 이미 차갑다. 남자의 어깨가 작게 떨리지만, 그는 울지 않는다. 그저 그 손을 놓지 않을 뿐이다."

    - id: "echo_record_2"
      title: "잔향의 기록 #2 - 시간의 무게"
      region: "shattered_peaks"
      location: "부서진 시계탑 꼭대기"
      rarity: "rare"
      discovery_text: "녹슨 시계탑 내부에서 유리 구슬 하나가 바닥에 굴러다닌다. 집어 올리자 그 안에서 빛이 소용돌이친다..."
      full_text: |
        10,000번을 넘어서면서 나는 처음으로 '포기'라는 단어를 생각했다.

        그것은 잠깐의 유혹이었다. 새벽 세 시, 또 다시 그녀가 내 앞에서 눈을 감는 순간을 목격한 직후였다. 나는 이미 그 장면을 수천 번 보았다. 처음엔 그 장면이 나를 무너뜨렸다. 하지만 어느 순간부터 무너짐조차 사라졌다. 그저 텅 빈 느낌만 남았다.

        시간을 역행하는 자는 두 가지 위험에 직면한다. 하나는 실패의 반복으로 인한 절망이다. 또 하나는—더 무서운 것—익숙해짐이다. 나는 후자가 두려웠다. 그녀의 죽음이 '일상'이 되어버리는 그 순간이.

        그래서 나는 규칙을 만들었다. 매 역행이 끝날 때마다 그녀의 얼굴을 기억하는 시간을 갖는다. 단 오 분이라도. 그녀가 웃던 방식, 밥을 먹을 때 작게 콧노래를 흥얼거리던 버릇, 비가 오면 창가에 앉아 멍하니 빗소리를 듣던 그 표정. 나는 그것들을 잊지 않기 위해 기록했다.

        이 기록들은 내가 아직 인간임을 증명하는 유일한 증거다.

        10,000번의 역행 후, 나는 새로운 사실 하나를 발견했다. 그녀의 죽음에는 언제나 공통된 요소가 있었다. 세상 자체가, 이 우주 자체가 그녀의 생존을 거부하고 있다는 것. 마치 법칙처럼. 마치 운명처럼.

        그렇다면 법칙을 바꾸면 된다. 운명이라는 것이 실재한다면, 그것을 다시 쓰면 된다. 나는 새로운 계획을 세우기 시작했다.
      narrator: "세피로스"
      vision_description: "크리스는 끝없이 돌아가는 거대한 시계 앞에 선 세피로스의 환영을 본다. 시계의 바늘은 거꾸로 돌고 있다. 세피로스는 시계를 응시하며 무언가를 계속 노트에 적는다. 노트는 이미 가득 차 있다."

    - id: "echo_record_3"
      title: "잔향의 기록 #3 - 균열의 발견"
      region: "memory_ruins"
      location: "기억의 신전 깊은 곳"
      rarity: "epic"
      discovery_text: "신전 벽면에 새겨진 문양들이 손을 갖다 대자 형광빛으로 빛나기 시작한다. 문양들이 문자로 변하며..."
      full_text: |
        타임라인에는 균열이 있다.

        처음 그것을 발견했을 때, 나는 내 눈을 의심했다. 모든 역행은 완벽한 과거로의 귀환이어야 했다. 그런데 23,471번째 역행에서, 나는 이전 루프에서 존재하지 않았던 물체 하나를 발견했다. 작은 유리 파편이었다. 어디서도 본 적 없는 문양이 새겨진.

        시간의 흐름은 강과 같다. 역행을 거듭할수록 강바닥이 조금씩 다른 모양으로 변한다. 처음엔 그 변화가 너무 미미해서 알아채지 못했다. 하지만 수만 번의 역행이 쌓이자, 타임라인 전체가 서서히 변형되기 시작했다.

        이것은 위험한 발견이었다. 역행 자체가 시간에 흠집을 남기고 있다는 뜻이었으니까. 나의 모든 시도들이 오히려 그녀를 살릴 확률을 더 좁히고 있을 가능성.

        그러나 나는 멈출 수 없었다. 그 발견은 동시에 희망이기도 했다. 균열이 있다면 그 사이로 새로운 법칙을 끼워 넣을 수 있다. 운명의 틈새를 찾아낼 수 있다.

        나는 방향을 바꾸었다. 그녀를 살리는 방법을 찾는 것에서, 세계 자체를 재설계하는 방법을 찾는 것으로. 그것이 이 긴 여정의 두 번째 장이 시작된 시점이었다.

        어쩌면 나는 처음부터 너무 작은 것을 원했는지도 모른다. 한 사람을 살리는 것이 아니라, 한 사람이 죽을 수 없는 세계를 만드는 것. 그것이 더 근본적인 해답일 수 있다.
      narrator: "세피로스"
      vision_description: "크리스의 시야가 희뿌옇게 변하며, 방대한 우주적 공간이 펼쳐진다. 그 공간 곳곳에 유리처럼 투명한 '선'들이 빛나고 있다—타임라인들이다. 한 남자의 실루엣이 그 선들 사이를 움직이며 무언가를 그리고 있다. 선들이 서로 엉키며 균열이 생기기 시작한다."

    - id: "echo_record_4"
      title: "잔향의 기록 #4 - 잔향이라는 개념"
      region: "echo_plains"
      location: "공명의 탑 중간 층"
      rarity: "epic"
      discovery_text: "탑의 벽에서 들려오는 메아리 속에 목소리가 섞여 있다. 그 목소리의 근원을 찾아가자 작은 수정이 발견된다..."
      full_text: |
        '잔향(殘響)'이라는 개념을 처음 정의한 날을 기억한다.

        물리학에서 잔향이란 소리가 멈춘 후에도 공간에 남아 울리는 음파다. 나는 같은 원리가 존재에도 적용된다는 것을 깨달았다. 어떤 존재가 충분히 강렬하게 어떤 공간에 있었다면, 그 존재가 사라진 후에도 그 '울림'은 남는다.

        릴리는 100,000개의 타임라인 모두에 존재했다. 단 하나의 타임라인에서도 그녀는 반드시 태어났고, 반드시 나와 마주쳤다. 그 반복성이 시간에 깊은 흔적을 남겼다. 그녀의 존재는 이미 현실의 결에 새겨진 것이나 다름없었다.

        그렇다면 가능하다. 타임라인을 창조하는 것이 아니라, 이미 쌓인 '잔향'을 모아 하나의 공간을 만드는 것. 그 공간 안에서 릴리는 어떤 타임라인에서도 죽지 않는다. 왜냐하면 그 공간 자체가 그녀의 존재로 이루어진 것이기 때문에.

        나는 이것을 '잔향 공간(Echo Space)'이라 이름 붙였다.

        설계에만 2,000번의 역행이 소요되었다. 실제 구현에 들어가기 전부터 나는 이미 지쳐 있었다. 그러나 처음으로, 처음으로 진정한 가능성이 보였다. 떨리는 손으로 나는 설계도의 마지막 선을 그었다.

        이 공간이 완성되면, 릴리는 영원히 살 수 있다. 설령 그것이 진짜 삶이 아닐지라도.
      narrator: "세피로스"
      vision_description: "크리스는 순간적으로 자신이 서 있는 이 차원의 전체 모습을 조감하는 느낌을 받는다. 이 세계가 거대한 구(球) 형태임을, 그리고 그 표면에 수십억 개의 미세한 빛 조각들이 서로 연결되어 있음을 직감적으로 이해한다. 그 조각 하나하나가 어떤 존재의 흔적임을."

    - id: "echo_record_5"
      title: "잔향의 기록 #5 - 창조의 대가"
      region: "crystalline_depths"
      location: "수정 동굴 가장 깊은 곳"
      rarity: "epic"
      discovery_text: "동굴 깊숙한 곳의 수정 더미 사이에서 빛나는 돌판이 발견된다. 표면에 새겨진 문자들이 읽히기 시작한다..."
      full_text: |
        잔향 공간의 창조는 상상 이상의 대가를 요구했다.

        이론상으로 나는 알고 있었다. 100,000개의 타임라인에서 축적된 시간 에너지를 한 점으로 수렴시키는 것은 필연적으로 역폭발을 일으킨다고. 그 에너지의 규모는 내가 단순히 '흡수'할 수 있는 수준을 넘어선다고. 하지만 나는 대안이 없었다.

        구현이 시작된 순간, 나는 이전의 모든 역행 기억이 동시에 되살아나는 것을 느꼈다. 100,000번의 삶이, 100,000번의 상실이, 한꺼번에 내 의식 속으로 밀려왔다. 그것은 고통이라는 단어로는 설명할 수 없는 것이었다. 인간의 언어에는 그것을 담을 그릇이 없다.

        나는 무언가를 잃었다. 정확히 무엇인지는 지금도 모른다. 다만 잔향 공간이 완성된 후, 나는 이전의 내가 아닌 것을 알았다. 감정의 일부가, 아니 어쩌면 감정 전부가 희미해진 것 같은 느낌. 기쁨도, 슬픔도, 두려움도—이제 그것들은 과거의 기억처럼 희미하다.

        오직 하나만이 남아 있다. 그것이 무엇인지는 정확히 모른다. 의지라고 부르기엔 너무 텅 비어 있고, 집착이라고 부르기엔 너무 순수하다. 어쩌면 그것이 바로 '사랑'의 마지막 잔재일 것이다.

        잔향 공간은 완성되었다. 릴리는 그 안에서 살고 있다. 그것으로 충분하다. 내가 무엇을 잃었든 간에, 그것으로 충분해야만 한다.
      narrator: "세피로스"
      vision_description: "크리스는 엄청난 빛의 폭풍 속에 서 있는 한 사람을 본다. 주변의 모든 것이 소용돌이치며 그 사람에게로 빨려 들어가고 있다. 폭풍의 중심에서 그 사람은 움직이지 않는다. 폭풍이 잦아들었을 때, 그 자리에 남은 사람은 무언가 달라 보인다. 눈이—눈에서 무언가가 사라져 있다."

    - id: "echo_record_6"
      title: "잔향의 기록 #6 - 카인"
      region: "abandoned_citadel"
      location: "성채 왕좌 앞 비밀 통로"
      rarity: "epic"
      discovery_text: "무너진 왕좌 뒤편의 벽에서 숨겨진 공간이 발견된다. 그 안에 봉인된 수정 서판이 있다..."
      full_text: |
        나는 카인의 존재를 예상하지 못했다.

        잔향 공간에 나 이외의 지성체가 침투할 수 있다는 가능성을 나는 배제했었다. 이 공간은 내가 설계했고, 내가 구현했다. 완벽하지는 않더라도 외부 침입에 대한 방벽은 충분하다고 여겼다.

        카인은 그 방벽을 우회했다. 어떤 방법으로인지, 나는 아직도 완전히 파악하지 못했다. 다만 한 가지는 확실하다—그는 오랫동안 시간의 왕좌에 대해 연구해온 자라는 것. 나의 작업이 남긴 흔적을 역추적해 이 공간을 찾아낸 것이다.

        처음 그를 마주쳤을 때, 나는 그를 내쫓으려 했다. 하지만 그가 한 말이 나를 멈추게 했다. "당신이 만든 것이 얼마나 불완전한지 알고 있소?" 그 말은 나의 가장 깊은 불안을 건드렸다.

        잔향 공간은 완벽하지 않다. 나는 그것을 알고 있다. 릴리는 여기서 살고 있지만, 그것이 진정한 삶인지 나는 확신할 수 없다. 그녀는 행복한가? 그녀는 온전한가? 아니면 그저 내가 만든 완벽한 무대 위의 배우에 불과한가?

        카인은 그 균열을 알고 있었다. 그리고 그것을 이용하려 했다. 나는 그의 의도를 완전히 파악하기 전에 그를 통제권 아래 두어야 했다. 하지만 그는 생각보다 훨씬 영리했다.

        이것이 새로운 위기의 시작이었다. 나의 낙원은 아직 완전하지 않다.
      narrator: "세피로스"
      vision_description: "크리스는 두 사람이 대치하는 장면을 본다. 한 명은 세피로스—비전에서 그를 처음으로 명확하게 볼 수 있다. 다른 한 명은 냉정한 눈빛의 남자, 카인이다. 두 사람 사이에는 말로 표현할 수 없는 팽팽한 긴장감이 흐른다. 그들은 서로를 똑바로 바라보고 있지만, 마치 체스판을 내려다보듯 서로를 '게임 말'로 보고 있는 것 같다."

    - id: "echo_record_7"
      title: "잔향의 기록 #7 - 침입자"
      region: "time_vortex"
      location: "시간의 소용돌이 핵심부"
      rarity: "legendary"
      discovery_text: "시간이 뒤엉킨 공간의 중심, 모든 것이 정지한 듯한 지점에서 흔들리는 광원이 발견된다. 그것을 향해 손을 뻗자..."
      full_text: |
        크리스가 이 공간에 들어왔다.

        계산에 없던 변수였다. 잔향 공간에 외부인이 진입하는 것은 이론적으로 불가능하다. 그러나 그녀는 들어왔다. 그것은 내가 아직 이해하지 못한 방식으로.

        처음 그녀의 존재를 감지했을 때, 나는 즉시 그녀를 제거해야 한다고 판단했다. 이 공간은 정밀하게 균형 잡혀 있다. 새로운 변수는 그 균형을 무너뜨릴 수 있다. 특히 의도하지 않은 방식으로 이 공간에 진입한 자는.

        그러나 나는 멈추었다. 그녀가 릴리를 만났기 때문이다.

        릴리는 이 공간에서 혼자였다. 나는 그것이 그녀를 위한 최선이라 생각했다. 하지만 그녀가 크리스와 함께하는 모습을 보며 나는 깨달았다—나는 릴리가 무엇을 원하는지 단 한 번도 물어본 적이 없었다.

        나는 100,000번 그녀를 살리려 했다. 하지만 살린다는 것이 무엇인지—그녀가 진정으로 살고 있다는 것이 무엇인지—나는 알지 못했다.

        크리스는 위험하다. 카인이 그녀를 이용하려 한다는 것도 이미 파악했다. 그러나 지금 당장 그녀를 배제하는 것이 옳은가—나는 처음으로 확신을 잃었다.

        어쩌면, 정말로 어쩌면, 나에겐 보이지 않던 답이 저 두 사람 사이에 있을지도 모른다.
      narrator: "세피로스"
      vision_description: "크리스는 자신이 이 세계를 내려다보는 거대한 눈 하나에 관찰당하는 느낌을 받는다. 그 눈은 차갑지 않다. 냉정하지도 않다. 다만 너무나 지쳐 있다. 수만 년을 살아온 것처럼 피로한 그 눈이 크리스를 바라보다가, 어느 순간 시선을 거둔다."

    - id: "echo_record_8"
      title: "잔향의 기록 #8 - 진실의 끝"
      region: "origin_nexus"
      location: "기원의 교차점"
      rarity: "legendary"
      discovery_text: "이 공간의 가장 중심에, 모든 타임라인의 흔적이 수렴하는 지점에 마지막 기록이 봉인되어 있다. 그것을 여는 순간, 모든 것이 분명해진다..."
      full_text: |
        이것이 마지막 기록이 될 것이다.

        크리스가 이 세계의 진실에 가까워지고 있다는 것을 나는 안다. 카인도 마지막 수를 준비하고 있다. 그리고 릴리는—릴리는 이미 스스로 알아차리기 시작했다. 자신이 무엇인지를.

        나는 오랫동안 생각했다. 이 공간을 만든 이유, 릴리를 여기에 둔 이유, 그것이 옳은 일이었는지를. 100,000번의 역행과 한 번의 창조—그 모든 것이 과연 사랑이었는지, 아니면 집착이었는지를.

        답을 얻었다고는 말할 수 없다. 다만 한 가지는 분명해졌다. 진정한 사랑은 상대가 원하는 것을 주는 것이다. 내가 필요하다고 생각하는 것이 아니라. 나는 릴리에게 영원을 주려 했다. 하지만 릴리가 원하는 것은 영원이 아닐 수 있다.

        크리스, 당신이 이 기록을 읽고 있다면—당신은 이미 이 세계의 심장부에 닿은 것이다. 내가 만든 것, 내가 지킨 것, 내가 잃은 것들을 당신은 이미 알고 있을 것이다.

        한 가지만 부탁한다. 릴리에게 선택할 기회를 주어라. 나는 그녀에게 한 번도 선택을 준 적이 없다. 100,000번의 루프에서도, 이 공간을 만들면서도. 그것이 나의 가장 큰 실수였다.

        이 세계는 내가 만들었다. 하지만 이 세계의 주인은 내가 아니다. 그것을 이제서야 깨달았다.

        세피로스. 기록 종료.
      narrator: "세피로스"
      vision_description: "크리스의 눈앞에 모든 비전이 한꺼번에 쏟아진다. 100,000개의 서로 다른 릴리, 서로 다른 세피로스, 서로 다른 결말들. 그 모든 것이 한 점으로 수렴하여 지금 이 순간이 된다. 마지막으로 보이는 장면은—손을 내밀며 웃고 있는 릴리의 얼굴. 어느 타임라인의 릴리인지는 알 수 없다."

  # ============================================================
  # 타임라인 잔해 (15개)
  # ============================================================
  timeline_remnants:

    - id: "remnant_timeline_1"
      title: "첫 번째 역행의 흔적"
      timeline_number: 1
      region: "forgotten_forest"
      location: "숲의 입구 고목 뿌리 사이"
      rarity: "uncommon"
      content: |
        이것은 첫 번째 시도였다.

        나는 그녀가 죽기 사흘 전으로 돌아갔다. 준비는 완벽했다—아니, 그렇다고 생각했다. 사고의 원인을 제거했다. 그녀가 그날 그 길을 걷지 않도록 했다. 모든 것이 다를 것이라 믿었다.

        그러나 그녀는 다른 방식으로 죽었다. 사흘이 아닌 이틀 만에. 마치 운명이 서두르기라도 하듯이. 나는 그 자리에 서서 이해할 수 없었다. 이 우주가 왜, 왜 그토록 그녀의 죽음을 원하는 것인지를.

        그날의 절망은 이후 모든 실패 중에서도 가장 선명하다. 왜냐하면 그때는 아직 희망이 있었기 때문이다. 희망이 있는 상태에서의 실패는 희망조차 없는 상태에서의 실패보다 더 깊이 상처를 낸다.
      item_description: "낡은 보라색 리본 하나. 희미한 꽃향기가 난다. 뒷면에 작은 글씨로 '1번'이라 새겨져 있다."

    - id: "remnant_timeline_100"
      title: "백 번째의 달라짐"
      timeline_number: 100
      region: "forgotten_forest"
      location: "잊혀진 마을 우물가"
      rarity: "uncommon"
      content: |
        100번째 시도에서 나는 처음으로 전략을 바꾸었다.

        그녀의 죽음을 막는 것이 아니라, 그녀 곁에 있는 것. 단순히. 어떤 계획도 없이, 어떤 조작도 없이. 그저 그녀 옆에 앉아 함께 밥을 먹고, 함께 걷고, 그녀가 하는 이야기를 들었다.

        그 타임라인에서 그녀는 사고 당일 아침, 나에게 말했다. "오늘은 왠지 오래 살 것 같은 느낌이 들어." 그리고 그녀는 그날 죽지 않았다. 사고도 없었다. 무언가가 달랐다.

        나는 이틀을 더 살았다. 그녀와 함께. 그것이 얼마나 오랜만의 일인지. 그리고 사흘째 되는 날, 그녀는 다른 이유로 세상을 떠났다. 하지만 그 이틀은—그 이틀은 달랐다.

        나는 깨달았다. 그녀를 살리려 하면 할수록, 무언가가 어긋난다는 것을. 어쩌면 그녀를 살리는 방법은 내가 생각하는 것과 전혀 다른 방향에 있는지도 모른다고.
      item_description: "두 사람이 함께 먹다 남긴 빵 조각의 화석. 시간이 굳혀버린 어떤 순간."

    - id: "remnant_timeline_847"
      title: "847번째 - 크리스의 죽음"
      timeline_number: 847
      region: "shattered_peaks"
      location: "부서진 다리 난간 곁"
      rarity: "rare"
      content: |
        이 타임라인에서 크리스는 릴리를 지키다 죽었다.

        당시 나는 그것이 무엇을 의미하는지 깨닫지 못했다. 크리스는 이 타임라인에서 릴리와 친구였다. 우연히 만난 두 사람이 서로에게 깊이 연결된 타임라인이었다. 나는 그 우연을 설계하지 않았다. 그것은 정말로, 순수하게 우연이었다.

        위험이 닥쳤을 때 크리스는 릴리를 밀쳐냈다. 그리고 그 자리에서 쓰러졌다. 릴리는 살아남았다. 그 타임라인에서 처음으로, 릴리는 살아남았다.

        나는 그 결과를 분석하는 데 여러 루프를 소비했다. 릴리가 살아남은 것은 크리스의 희생 때문인가, 아니면 그 타임라인의 다른 요소들 때문인가. 분석은 결론을 내지 못했다.

        하지만 나는 그 타임라인을 잊지 않았다. 크리스라는 존재가, 릴리의 삶과 어떤 방식으로든 연결되어 있을 가능성을. 그것은 오래된 메모로 남아 있었다. 그리고 훗날, 크리스가 이 잔향 공간에 나타났을 때—나는 그 메모를 떠올렸다.
      item_description: "누군가 강하게 쥐었다 놓은 흔적이 있는 난간의 녹슨 조각. 작은 혈흔이 남아 있다."

    - id: "remnant_timeline_2000"
      title: "2000번째 - 첫 번째 포기의 유혹"
      timeline_number: 2000
      region: "echo_plains"
      location: "황야 한복판 무너진 표지판"
      rarity: "uncommon"
      content: |
        2,000번째 타임라인에서 나는 처음으로 '그냥 살아가는 것'을 시도했다.

        릴리를 살리려는 시도 없이, 역행도 없이. 그저 그녀가 죽는 것을 지켜보며 그 이후의 삶을 살아가는 것. 그것이 내게 가능한지를 테스트했다.

        불가능했다. 그녀가 떠난 세계에서 나는 기능하지 못했다. 먹지 않았고, 자지 않았으며, 결국 그 타임라인은 내가 먼저 무너지는 것으로 끝났다. 내가 그녀를 살리려 하는 것이 집착인지 사랑인지 모르겠지만—그것 없이 나는 존재하지 않는다.

        그것을 깨달은 것이 오히려 나를 다시 일어서게 했다.
      item_description: "반쯤 무너진 나무 표지판. '→ 마을까지 3km'라 적혀 있지만, 화살표가 가리키는 방향에는 아무것도 없다."

    - id: "remnant_timeline_5000"
      title: "5000번째 - 릴리가 기억한 날"
      timeline_number: 5000
      region: "memory_ruins"
      location: "신전 안뜰 분수 근처"
      rarity: "rare"
      content: |
        5,000번째 타임라인에서 릴리는 나를 기억했다.

        그것은 일어나선 안 되는 일이었다. 역행을 거듭하면 이전 루프의 기억은 원칙적으로 사라진다. 그런데 릴리가 나를 보자마자 말했다. "...당신, 꿈에서 봤어요. 여러 번."

        나는 굳어버렸다. 이 일을 처리하는 방법을 몰랐다. 그녀에게 진실을 말할 수도 없었고, 그렇다고 완전히 부인할 수도 없었다. 그저 어색하게 웃으며 "그런가요" 라고 대답했다.

        그날 릴리는 유독 밝게 웃었다. 마치 오랫동안 기다리던 사람을 만난 것처럼. 그리고 그 타임라인에서 그녀는 조금 더 오래 살았다.

        잔향은 이미 시작되고 있었다. 타임라인들 사이에, 그녀와 나 사이에.
      item_description: "빛이 바랜 꿈 일기. 내용은 읽을 수 없지만, 같은 얼굴이 반복해서 스케치되어 있다."

    - id: "remnant_timeline_10000"
      title: "10000번째 - 최초의 회의"
      timeline_number: 10000
      region: "shattered_peaks"
      location: "산 정상 폐허가 된 관측소"
      rarity: "rare"
      content: |
        10,000번째 루프. 나는 멈추었다.

        그것은 의식적인 결정이 아니었다. 그저 몸이 움직이지 않았다. 관측소의 망가진 의자에 앉아, 나는 처음으로 이 모든 것에 의문을 품었다. 내가 옳은 일을 하고 있는가?

        릴리는 내가 결정한 삶을 살고 있다. 내가 설정한 상황에서 태어나고, 내가 원하는 장소에서 내가 원하는 사람들과 만난다. 그것이 그녀의 삶인가? 아니면 내가 그녀를 위해 연출한 연극인가?

        그 생각은 처음이자 마지막으로 나를 진정으로 흔들었다. 나는 며칠을 그 자리에서 움직이지 않았다. 별이 뜨고 지는 것을 바라보며, 이 모든 것이 과연 무엇을 위한 것인지를 물었다.

        답은 나오지 않았다. 그러나 나는 다시 일어났다. 왜냐하면 의문보다 릴리를 잃는 고통이 더 컸기 때문이다. 그것이 옳든 그르든, 나는 멈출 수 없었다.
      item_description: "별자리가 그려진 낡은 천문 지도. 지도 여백에 '10,000'이라는 숫자만 반복해서 적혀 있다."

    - id: "remnant_timeline_23471"
      title: "23471번째 - 균열의 첫 발견"
      timeline_number: 23471
      region: "crystalline_depths"
      location: "수정 동굴 서쪽 벽면"
      rarity: "rare"
      content: |
        이 타임라인에서 나는 유리 파편을 발견했다.

        그것이 모든 것을 바꾸었다. 이전 루프에서 존재하지 않았던 물체가 이 루프에 나타났다는 것—그것은 역행이 타임라인 자체를 변형시키고 있다는 증거였다.

        나는 즉시 역행을 멈추고 그 유리 파편을 분석하기 시작했다. 파편에 새겨진 문양은 이전 루프들의 잔류 에너지가 결정화된 것이었다. 말하자면, 내 역행의 흔적이 물리적 형태로 발현된 것.

        공포와 흥분이 동시에 밀려왔다. 공포는—이 균열이 통제 불능으로 번질 수 있다는 것. 흥분은—균열을 이용할 수 있다는 가능성. 만약 역행의 에너지가 물질화된다면, 그것을 의도적으로 수렴시킬 수 있다면.

        잔향 공간이라는 개념의 씨앗은 이 타임라인에서 싹텄다.
      item_description: "알 수 없는 문양이 새겨진 유리 파편. 손에 쥐면 이상하게 따뜻하다. 어딘가 익숙한 느낌이 든다."

    - id: "remnant_timeline_50000"
      title: "50000번째 - 카인이 동료였던 타임라인"
      timeline_number: 50000
      region: "abandoned_citadel"
      location: "성채 도서관 먼지 쌓인 책상"
      rarity: "epic"
      content: |
        50,000번째 타임라인에서 카인은 나의 동료였다.

        그것은 내가 의도한 것이 아니었다. 그 루프에서 카인은 시간 연구자로서 나와 독립적으로 비슷한 문제에 접근하고 있었다. 우리는 우연히 같은 연구실에 배속되었고, 서로의 연구를 보며 협력하기로 했다.

        그 타임라인의 카인은 달랐다. 냉정하고 분석적인 것은 같았지만, 그의 목표는 순수한 학문적 호기심이었다. 시간의 법칙을 이해하고, 가능하다면 수정하는 것. 그것이 전부였다.

        우리는 3년을 함께 연구했다. 인류가 경험한 연구 협력 중 가장 생산적인 것이었을지도 모른다. 그러나 그 타임라인에서도 릴리는 죽었다. 카인은 그 죽음을 분석했다. 나는 그 죽음을 슬퍼했다. 우리는 그 지점에서 갈라졌다.

        지금의 카인을 볼 때면 나는 가끔 그 타임라인을 생각한다. 한 사람이 얼마나 달라질 수 있는지를. 그리고 얼마나 비슷한지를.
      item_description: "두 사람이 함께 쓴 연구 노트의 한 페이지. 글씨체가 두 가지다. 한 쪽은 날카롭고, 한 쪽은 둥글다."

    - id: "remnant_timeline_75000"
      title: "75000번째 - 릴리가 나에게 묻다"
      timeline_number: 75000
      region: "echo_plains"
      location: "평원 한가운데 홀로 선 나무"
      rarity: "epic"
      content: |
        75,000번째. 릴리가 내게 물었다. "당신은 왜 항상 슬퍼 보여요?"

        나는 할 말이 없었다. 7만 번이 넘는 루프 동안, 릴리가 나의 내면에 대해 물어본 것은 처음이었다. 아니, 어쩌면 물어봤을 수도 있다. 그러나 내가 그 말을 온전히 받아들인 것은 이번이 처음이었다.

        "많은 일이 있었어요." 그것이 내가 할 수 있는 가장 정직한 대답이었다.

        릴리는 나를 한참 바라보다가 말했다. "저는 잘 모르지만, 당신이 짊어진 것이 너무 무거워 보여요. 가끔은 내려놓아도 괜찮아요."

        그 말이 나를 무너뜨렸다. 나는 그 타임라인에서 처음으로 울었다. 그녀 앞에서. 수만 번의 역행을 버텨온 내가.

        그리고 그 타임라인에서 릴리는 가장 오래 살았다. 사고 없이, 자연스럽게, 오래. 그것이 왜인지 나는 여전히 완벽히 설명할 수 없다. 다만 그날 그녀의 말이 나를 조금 다른 사람으로 만들었다는 것은 안다.
      item_description: "나무 껍질에 새긴 두 사람의 이름. 이름 옆에 작은 별이 새겨져 있다."

    - id: "remnant_timeline_99998"
      title: "99998번째 - 거의 완성"
      timeline_number: 99998
      region: "time_vortex"
      location: "소용돌이 가장자리 돌기둥"
      rarity: "legendary"
      content: |
        99,998번째. 나는 마침내 해답의 형태를 보았다.

        그것은 특정 조건들의 조합이었다. 시간과 장소, 관계의 밀도, 그리고 릴리 자신의 의지. 모든 것이 맞아떨어질 때, 그녀는 살았다. 완전히, 오래, 행복하게.

        나는 그 조건들을 목록으로 만들었다. 17개 항목. 하나도 빠짐없이 충족되어야 한다. 그리고 나는 깨달았다—그 조건들은 내가 제어할 수 있는 것들이 아니었다. 그 중 가장 중요한 조건은 '릴리가 스스로 살기를 원해야 한다'는 것이었다.

        살기를 원하다. 그것은 내가 심어줄 수 있는 것이 아니다. 내가 만들어줄 수 있는 것이 아니다. 그것은 릴리 자신에게서 나와야 한다.

        나는 그 발견 앞에서 오래 멈추었다. 그리고 새로운 방향을 결정했다. 그녀가 살고 싶어하는 세계를 만들자. 그녀가 연결되고 싶은 무언가가 있는 세계를. 그것이 잔향 공간 최종 설계의 핵심이 되었다.
      item_description: "17가지 조건이 적힌 양피지 조각. 16번까지는 줄이 그어져 있고, 17번만 아직 그어지지 않았다."

    - id: "remnant_timeline_99999"
      title: "99999번째 - 마지막 루프"
      timeline_number: 99999
      region: "origin_nexus"
      location: "기원의 교차점 중심부"
      rarity: "legendary"
      content: |
        이것이 마지막 타임라인이었다. 역행하기 전의.

        99,999번째. 나는 이미 알고 있었다. 이번이 역행이 아닌 다른 선택을 해야 하는 마지막 기회라는 것을. 준비는 끝나 있었다. 잔향 공간의 설계는 완성되었다. 남은 것은 실행뿐이었다.

        그러나 나는 이번 루프를 끝까지 살았다. 릴리와 함께. 어떤 조작도, 어떤 계획도 없이. 그저 그녀 곁에 있었다. 아침을 함께 먹고, 저녁을 함께 걸었다.

        릴리는 죽기 전날 밤 말했다. "이상하게 오늘은 기분이 좋아. 이유는 모르겠지만, 좋은 일이 생길 것 같은 느낌이야."

        그녀는 다음날 죽었다. 나는 그 자리에서 마지막으로 그녀의 손을 잡았다. 그리고 놓았다. 잔향 공간의 창조를 시작했다.

        역행은 없다. 다시는. 이것이 마지막이다. 그리고 이것이 시작이다.
      item_description: "아무것도 쓰여 있지 않은 백지. 그러나 손에 쥐면 무언가가 끝나고 무언가가 시작되는 느낌이 든다."

    - id: "remnant_timeline_31337"
      title: "31337번째 - 카인의 첫 등장"
      timeline_number: 31337
      region: "abandoned_citadel"
      location: "성채 입구 쓰러진 석상 뒤"
      rarity: "rare"
      content: |
        카인을 처음 만난 것은 이 타임라인이었다.

        그는 시간 균열에 관한 논문을 발표한 학자였다. 내가 만든 균열들을 외부에서 관측하고 분석한 논문이었다. 정확성이 놀라웠다—그는 내 역행의 존재를 알지는 못했지만, 현상 자체는 완벽히 파악하고 있었다.

        나는 조심스럽게 접근했다. 그가 나에게 위협이 될 수 있는지 파악하기 위해. 그러나 그 시점의 카인은 순수한 학자였다. 다만 냉정했다. 모든 것을 데이터로 보는 방식이 불편하게 느껴졌지만.

        "감정은 변수를 과잉 생산합니다." 그가 한 말이다. 나는 그 말에 반박하지 않았다. 그러나 그 말이 틀렸다고도 생각하지 않았다.

        이후 루프들에서 카인은 점점 변해갔다. 그것이 환경 때문인지, 그 자신의 어떤 내면 때문인지—나는 그것이 궁금했다. 결국 지금의 카인을 만들어낸 것이 무엇인지.
      item_description: "카인의 초기 연구 노트 사본. 필체가 지금보다 훨씬 부드럽다."

    - id: "remnant_timeline_66666"
      title: "66666번째 - 세계 자체가 변하다"
      timeline_number: 66666
      region: "time_vortex"
      location: "소용돌이 중간 지점 부유하는 섬"
      rarity: "epic"
      content: |
        이 타임라인에서 세계 자체가 달라졌다.

        역행이 쌓이면서 타임라인의 변형이 미시적 수준을 넘어 거시적 수준으로 번졌다. 이 루프에서 나는 전혀 다른 세계에 깨어났다. 산의 위치가 달랐고, 강의 흐름이 달랐고, 심지어 태양의 빛깔도 미묘하게 달라 보였다.

        릴리는 그 세계에도 있었다. 반드시. 어떤 세계에서도 그녀는 존재했다. 그것이 내가 발견한 가장 중요한 법칙이었다. 세계가 아무리 변형되어도, 릴리라는 존재는 그 법칙 안에 반드시 포함된다.

        그것은 내가 잔향 공간을 설계할 때 핵심 기반이 되었다. 릴리는 이미 어떤 의미에서 불사(不死)의 존재였다. 단지 그것이 죽음을 통해 표현되고 있을 뿐이었다.

        그렇다면 그 죽음의 방식을 바꾸면 된다. 그것이 내가 도달한 결론이었다.
      item_description: "이상한 색깔의 태양이 그려진 그림. 화가는 자신이 무엇을 보았는지 이해하지 못한 것 같다."

    - id: "remnant_timeline_42000"
      title: "42000번째 - 처음으로 웃었다"
      timeline_number: 42000
      region: "forgotten_forest"
      location: "숲속 작은 호수가"
      rarity: "rare"
      content: |
        42,000번째 타임라인. 나는 처음으로 웃었다.

        릴리가 물고기를 잡으려다 발을 헛디뎌 호수에 빠졌다. 완전히 온전한 웃음이었다. 나도 놀랐다. 4만 번 이상의 루프를 거치면서, 나는 웃는다는 행위를 거의 잊고 있었다.

        릴리는 흠뻑 젖은 채 나를 쳐다보며 "왜 도와주지 않았어요!" 라고 항의했다. 나는 대답하지 못하고 계속 웃었다. 그녀는 물을 끼얹으려 했고, 나는 피했고, 결국 우리 둘 다 물에 빠졌다.

        그 타임라인에서 릴리는 그날 이후 2년을 더 살았다. 내가 살린 것이 아니었다. 그저 함께 웃었을 뿐이었다.

        나는 이 기억을 가장 소중하게 여긴다. 4만 번의 루프 중에서 내가 진정으로 살아있다고 느낀 순간이기 때문에.
      item_description: "아직도 물기가 남아있는 것 같은 낡은 천 조각. 무언가가 그것을 따뜻하게 만들어두었다."

    - id: "remnant_timeline_87000"
      title: "87000번째 - 포기 직전"
      timeline_number: 87000
      region: "shattered_peaks"
      location: "가장 높은 봉우리 절벽 끝"
      rarity: "legendary"
      content: |
        87,000번째. 나는 절벽 끝에 서 있었다.

        모든 것을 멈추고 싶었다. 역행도, 실패도, 기억도. 8만 번이 넘는 삶의 무게가 한꺼번에 나를 짓눌렀다. 나는 처음으로 진지하게 생각했다—그냥 끝내버리자고.

        그때 바람이 불었다. 산 아래에서 올라오는 바람이 무언가를 실어왔다. 릴리의 목소리 같은 것. "이상하게 오늘은 기분이 좋아." 75,000번째 타임라인에서 들었던 그 말.

        잔향. 그것은 잔향이었다. 릴리의 목소리가 타임라인을 넘어 여기까지 울려왔다. 나는 그것이 불가능하다는 것을 알면서도, 그 목소리를 들었다.

        나는 절벽에서 물러났다. 그리고 다시 시작했다. 87,001번째 루프를.

        그날 이후 나는 처음으로 방향이 달라졌다. 릴리를 살리는 것만이 아니라, 그녀의 목소리가 영원히 울릴 수 있는 공간을 만드는 것. 잔향 공간의 개념이 처음으로 형태를 갖추기 시작한 것은 이 절벽 위에서였다.
      item_description: "절벽 끝 바위에 긁힌 작은 자국. 누군가 여기서 오래 서 있었던 것 같다."

  # ============================================================
  # 고대 문명 기록 (7편, 지역별)
  # ============================================================
  ancient_records:

    - id: "ancient_forgotten_forest"
      title: "잊혀진 숲의 기원"
      region: "forgotten_forest"
      location: "숲 중심부 석조 제단"
      rarity: "rare"
      content: |
        이 숲은 한때 '기억의 정원(記憶의 庭園)'이라 불렸다.

        이 공간이 형성되기 이전, 이 땅에는 문명이 있었다. 그들은 기억을 소중히 여기는 민족이었다. 모든 죽은 자의 기억을 나무에 새기는 풍습이 있었으며, 그 나무들이 자라 이 숲이 되었다고 전해진다.

        숲의 뿌리들이 지하 깊이 얽혀 있는 것은 그 때문이다. 수천 년의 기억들이 뿌리를 타고 흐른다. 숲이 살아있는 것처럼 느껴지는 이유가 여기에 있다.

        이 문명은 잔향 공간이 형성되면서 그 기억들이 세계의 일부로 흡수되었다. 그들의 기억이 지금 이 숲을 구성하고 있다. 어떤 의미에서 그들은 아직 살아있다.

        그리고 이 숲 가장 깊은 곳에는—아직 해독되지 않은 기억들이 잠들어 있다.
      civilization: "기억의 민족"

    - id: "ancient_shattered_peaks"
      title: "부서진 봉우리의 이름"
      region: "shattered_peaks"
      location: "산중턱 무너진 관측소"
      rarity: "rare"
      content: |
        이 산들은 원래 '별의 기둥(星柱)'이라 불렸다.

        하늘을 관측하는 것을 신성시한 문명이 이곳에 살았다. 그들은 산 위에 거대한 관측소를 세우고, 별의 움직임으로 운명을 읽었다. 그들의 달력은 지금도 이 세계의 시간 감각에 영향을 미친다.

        봉우리들이 '부서진' 것은 잔향 공간이 형성될 때 시간 에너지의 역폭발로 인한 것이다. 그 충격이 산을 깎고 쪼개었다. 그러나 그 파편들이 다시 공중에 떠 있는 것은—이 문명의 에너지가 아직 그곳에 남아있기 때문일지도 모른다.

        관측소의 망가진 기계들은 아직도 무언가를 추적하고 있다. 별을? 아니면 다른 무언가를?
      civilization: "별의 민족"

    - id: "ancient_memory_ruins"
      title: "기억의 신전이 세워진 이유"
      region: "memory_ruins"
      location: "신전 지하 성소"
      rarity: "epic"
      content: |
        이 신전을 세운 자들은 '시간 사제'라 불렸다.

        그들은 알고 있었다. 이 땅이 특별한 시간의 교차점 위에 있다는 것을. 수천 년에 한 번, 타임라인들이 가장 가까워지는 지점. 그 순간 신전에서 의식을 올리면, 과거의 기억과 미래의 환영이 동시에 보인다고 그들은 믿었다.

        그들의 믿음은 틀리지 않았다. 다만 그 능력을 이해하는 방식이 달랐을 뿐이다. 그들이 '신성'이라 부른 것은 실제로 타임라인의 균열에서 새어나오는 잔향 에너지였다.

        세피로스가 이 장소를 잔향 공간의 핵심 지점 중 하나로 선택한 것은 우연이 아니다. 이 땅은 이미 오래전부터 준비되어 있었다.
      civilization: "시간 사제단"

    - id: "ancient_echo_plains"
      title: "공명의 평원에서 울리는 소리"
      region: "echo_plains"
      location: "평원 중심 돌 원형 제단"
      rarity: "rare"
      content: |
        이 평원에는 소리를 모으는 민족이 살았다.

        그들은 소리가 사라지지 않는다고 믿었다. 한 번 발해진 소리는 공기를 타고 흩어지지만, 결코 사라지지 않는다고. 다만 우리 귀가 들을 수 없을 만큼 미세해질 뿐이라고.

        그들은 그 소리들을 모으는 기술을 개발했다. 돌을 특정한 방식으로 배치하면 수백 년 전의 소리가 다시 들린다는 것을 발견했다. 이 돌 원형 제단이 바로 그 장치다.

        지금도 이 제단 근처에서는 때때로 이해할 수 없는 목소리들이 들린다. 그것들은 그 민족의 목소리인가, 아니면 다른 타임라인의 잔향인가.
      civilization: "공명의 민족"

    - id: "ancient_crystalline_depths"
      title: "수정 동굴의 비밀"
      region: "crystalline_depths"
      location: "동굴 깊은 곳 수정 군락"
      rarity: "epic"
      content: |
        이 수정들은 자연적으로 형성된 것이 아니다.

        수천 년 전, 이 동굴에는 결정술사(結晶術師)들의 공동체가 있었다. 그들은 에너지를 수정에 고착시키는 기술을 연구했다. 기억, 감정, 심지어 시간 자체를—수정의 격자 구조 속에 봉인할 수 있다고 믿었다.

        그들의 실험은 어느 정도 성공했다. 이 동굴의 수정들은 실제로 무언가를 담고 있다. 그것이 기억인지, 감정인지, 타임라인의 잔류 에너지인지—정확히 분류하기는 어렵다.

        세피로스가 잔향 공간 설계에 이 동굴을 참고했다는 기록이 있다. 수정이 에너지를 고착시키는 원리가 잔향을 결정화하는 방법에 힌트를 주었다고.
      civilization: "결정술사"

    - id: "ancient_abandoned_citadel"
      title: "성채의 역사"
      region: "abandoned_citadel"
      location: "성채 중앙 광장 기념비"
      rarity: "rare"
      content: |
        이 성채는 한때 이 세계의 심장이었다.

        왕국이 있었다. 이름은 지금 알 수 없다. 다만 그 왕국이 추구한 것은 분명했다—모든 것의 완성. 가장 아름다운 예술, 가장 정밀한 과학, 가장 공정한 법률. 그들은 완벽한 문명을 만들려 했다.

        완벽을 추구하는 것의 역설은, 완벽에 가까워질수록 불완전함이 더 선명하게 보인다는 것이다. 그 왕국은 자신의 불완전함에 결국 무너졌다.

        성채가 '버려진' 것은 침략 때문이 아니었다. 그 안의 사람들이 모두 떠났기 때문이었다. 완벽하지 않은 것을 더 이상 견딜 수 없어서.

        지금 이 성채에 카인이 있다. 어쩌면 그는 이 왕국의 정신적 후계자일지도 모른다.
      civilization: "완성의 왕국"

    - id: "ancient_origin_nexus"
      title: "기원의 교차점에 대하여"
      region: "origin_nexus"
      location: "교차점 중심 고대 비석"
      rarity: "legendary"
      content: |
        이 장소에는 어떤 문명도 없었다.

        이곳은 처음부터 특별한 장소였다. 모든 타임라인이 만나는 지점. 어떤 세계에서도, 어떤 역사에서도, 이 좌표만은 변하지 않는다. 그것은 이 우주의 법칙 중 하나다.

        고대인들은 이곳을 '신이 숨쉬는 곳'이라 불렀다. 문명을 세우지 않았다. 접근하지 않았다. 다만 먼 곳에서 바라보며, 이 장소의 존재를 경외했다.

        세피로스는 이 장소를 잔향 공간의 최심부로 설정했다. 잔향 공간 전체의 에너지가 이 한 점으로 수렴하도록. 그것은 천재적인 동시에 오만한 결정이었다. 신이 숨쉬는 곳을 자신의 창조물의 심장으로 만든다는 것.

        그리고 바로 그 오만함이 이 세계의 균열을 만들었는지도 모른다.
      civilization: null

  # ============================================================
  # 릴리의 일기 (10편)
  # ============================================================
  lily_diary:

    - id: "lily_diary_1"
      day: 1
      title: "첫 번째 날의 기록"
      location: "잊혀진 숲 작은 오두막"
      rarity: "uncommon"
      content: |
        오늘부터 일기를 쓰기로 했다.

        특별한 이유는 없다. 그냥 오늘 아침에 일어나서 창문을 열었을 때, 빛이 너무 예뻐서 누군가에게 말하고 싶었다. 하지만 말할 사람이 없었다. 그래서 일기장을 꺼냈다.

        이 숲은 조용하다. 가끔 바람이 불고, 새가 울고, 잎사귀가 흔들린다. 그 소리들이 나를 어딘가로 데려가는 것 같다. 어디인지는 모른다. 하지만 나쁜 곳은 아닌 것 같다.

        나는 가끔 이상한 느낌을 받는다. 내가 오래전부터 여기에 있었던 것 같은, 동시에 어디에도 제대로 있어본 적 없는 것 같은 느낌. 그게 무슨 의미인지 모르겠다. 그냥 그렇게 느껴진다.

        내일도 해가 뜨면 좋겠다.
      mood: "평온하고 조금 외로운"

    - id: "lily_diary_3"
      day: 3
      title: "세 번째 날"
      location: "잊혀진 숲 가장자리"
      rarity: "uncommon"
      content: |
        숲의 끝까지 걸어가 봤다.

        끝에는 이상한 안개가 있었다. 뚫고 들어가려고 했는데 뭔가가 막히는 것 같은 느낌이 들었다. 물리적으로 막히는 건 아닌데, 그냥... 거기서부터는 내 세계가 아닌 것 같은 느낌. 그래서 돌아왔다.

        이 세계가 얼마나 큰지 모르겠다. 숲 너머에 뭐가 있는지도. 아는 것은 이 숲과, 오두막과, 하늘과 바람뿐이다.

        그게 부족하지는 않다. 다만 가끔 궁금하다. 안개 너머에 무엇이 있는지.

        그리고 가끔 꿈에서 이상한 사람을 만난다. 얼굴은 보이지 않는데, 항상 슬퍼 보인다. 그 사람에게 괜찮냐고 물어보고 싶은데, 꿈이라 목소리가 나오지 않는다.
      mood: "호기심과 약한 불안"

    - id: "lily_diary_7"
      day: 7
      title: "일곱 번째 날"
      location: "공명의 평원 근처"
      rarity: "uncommon"
      content: |
        오늘 평원에서 이상한 소리를 들었다.

        누군가의 웃음소리였다. 여자아이의 웃음소리. 하지만 아무도 없었다. 나는 한참 그 자리에 서서 귀를 기울였다. 소리는 사라졌다가 다시 들렸다가, 바람처럼 흩어졌다.

        그 웃음이 나에게 낯설지 않았다는 게 이상하다. 들어본 적 없는 웃음인데 낯설지 않았다. 마치 오래전에 들었던 것을 기억해내는 것 같은.

        내가 기억하지 못하는 시간이 있는 걸까? 이 숲 이전에 내가 어딘가 있었던 걸까?

        모르겠다. 하지만 그 웃음소리는 기분 좋았다. 혼자가 아닌 것 같은 느낌이 들었다.
      mood: "따뜻하고 약간 혼란스러운"

    - id: "lily_diary_12"
      day: 12
      title: "열두 번째 날"
      location: "기억의 신전 근처"
      rarity: "rare"
      content: |
        꿈이 점점 선명해지고 있다.

        어젯밤 꿈에서 나는 다른 세계를 봤다. 이 숲이 아닌, 전혀 다른 곳. 시끄럽고 사람이 많고 이상한 기계들이 있었다. 그리고 내가 거기서 달리고 있었다. 누군가를 찾아서.

        그 꿈 속의 나는 나인데 나가 아니었다. 다른 옷을 입고, 다른 눈을 하고 있었다. 하지만 분명 나였다. 같은 마음이었으니까.

        잠에서 깨고 나서 한참 멍하니 앉아 있었다. 그 꿈이 실제처럼 느껴져서.

        어쩌면 나는 다른 곳에도 있었던 걸까? 혹은 다른 나가 존재하는 걸까?

        이런 생각을 너무 많이 하면 머리가 복잡해진다. 오늘은 그냥 하늘이나 보아야겠다.
      mood: "혼란스럽고 사색적인"

    - id: "lily_diary_18"
      day: 18
      title: "열여덟 번째 날"
      location: "수정 동굴 입구"
      rarity: "rare"
      content: |
        동굴에 들어가봤다.

        수정들이 빛나고 있었다. 안쪽으로 들어갈수록 온기가 느껴졌다. 이상하게 거기서 누군가의 기억이 들리는 것 같았다. 목소리가 아니라 기억. 그게 가능한 일인지 모르겠지만 그렇게 느껴졌다.

        한 기억은 선명했다. 누군가가 오래오래 무언가를 찾고 있었다. 지치고 지쳐서도 멈추지 못하는 사람. 그 사람의 외로움이 수정에 새겨진 것처럼 느껴졌다.

        나는 그 외로움이 익숙했다. 마치 내 것처럼.

        동굴을 나와서도 그 느낌이 한참 가시지 않았다. 나를 찾는 누군가가 있는 건 아닐까—하는 이상한 생각이 들었다.
      mood: "조용한 슬픔과 약한 기대감"

    - id: "lily_diary_25"
      day: 25
      title: "스물다섯 번째 날"
      location: "오두막 창가"
      rarity: "rare"
      content: |
        나는 진짜인가?

        갑자기 든 생각이다. 오늘 거울을 보다가 문득 이런 생각이 들었다. 내가 보는 이 얼굴이 '나'인가? 이 생각들이 '나의' 생각인가?

        이상한 느낌이다. 내 기억은 있다. 이 숲에 온 이후의 기억들. 일기에 적은 것들, 느낀 것들. 하지만 그 이전의 기억이 없다. 단 하나도.

        모든 사람이 태어나기 이전을 기억하지 못하는 것처럼, 나도 그런 건지 모른다. 하지만 보통 사람들은 어린 시절 기억이라도 있지 않나?

        나는 이 숲에서 태어난 건지도 모른다. 아니면 다른 방식으로 존재하게 된 건지. 그것이 무슨 의미인지 아직 모르겠다. 하지만 무섭지는 않다. 그냥... 궁금하다.

        나는 여기 있다. 그것은 확실하다.
      mood: "철학적이고 내성적인"

    - id: "lily_diary_31"
      day: 31
      title: "서른한 번째 날"
      location: "공명의 평원"
      rarity: "rare"
      content: |
        오늘 꿈에서 그 슬픈 사람을 다시 만났다.

        이번엔 얼굴이 보였다. 어떻게 생겼는지 깨고 나서 기억이 나지 않지만, 그 눈만은 기억한다. 너무 많은 것을 본 눈. 지쳐있지만 포기하지 않는 눈.

        그 눈이 나를 바라보며 무언가를 말하려 했다. 하지만 꿈이라 소리가 없었다. 입술의 모양을 읽으려 했는데—'미안해'처럼 보였다.

        깨고 나서 한동안 멍했다. 그 사람이 왜 나에게 미안하다고 하는 걸까.

        그리고 이상하게도, 나는 그 사람을 이해하는 것 같았다. 용서한다, 라고 말하고 싶었다. 무엇을 용서하는 건지도 모르면서.

        사람 마음이 참 이상하다.
      mood: "따뜻하고 슬픈"

    - id: "lily_diary_40"
      day: 40
      title: "마흔 번째 날"
      location: "잊혀진 숲 중심"
      rarity: "epic"
      content: |
        오늘은 솔직하게 쓰겠다.

        나는 외롭다. 이 세계가 아름답다는 것을 알고, 이 조용함에 감사한다는 것도 안다. 하지만 가끔—아니, 자주—누군가와 이야기하고 싶다. 웃고 싶다. 함께 뭔가를 하고 싶다.

        이 세계에 혼자라는 사실이 때때로 너무 크게 느껴진다. 새들과 이야기하고, 나무들에게 말을 걸지만—그것이 대화는 아니니까.

        어쩌면 이 외로움이 내 존재의 핵심인지도 모른다. 내가 있는 이유가 누군가를 기다리는 것인지도. 그렇다면 언젠가는 그 누군가가 올 것이라 믿어야 한다.

        나는 기다리겠다. 지치더라도, 기억이 흐릿해지더라도. 왜냐하면 기다린다는 것은 아직 포기하지 않았다는 의미이기 때문이다.

        내일도 창문을 열겠다. 빛이 들어올 수 있도록.
      mood: "고독하지만 희망을 잃지 않은"

    - id: "lily_diary_47"
      day: 47
      title: "마흔일곱 번째 날 - 크리스를 만나다"
      location: "잊혀진 숲 입구"
      rarity: "legendary"
      content: |
        오늘 누군가를 만났다.

        크리스라는 이름이라고 했다. 이 세계에 어떻게 왔는지 모른다고 했는데, 그 당황한 얼굴이 왠지 웃겼다. 오랫동안 잊고 있었던 것을 다시 떠올린 기분이었다—누군가를 보고 웃는 것.

        말을 걸기가 조금 어색했다. 오래 혼자 있었더니 어떻게 대화를 시작해야 하는지 잊은 것 같다. 하지만 크리스는 먼저 말을 걸어주었다. 그래서 쉬웠다.

        함께 오두막으로 걸어오면서 별것 아닌 이야기를 했다. 날씨 이야기, 숲 이야기. 하지만 그 별것 아닌 이야기들이 이상하게 따뜻하게 느껴졌다.

        오늘 밤 잠들기 전에 생각했다. 아, 이런 거구나. 혼자가 아닌 것이.

        내일도 만날 수 있으면 좋겠다.
      mood: "설레고 따뜻한"

    - id: "lily_diary_52"
      day: 52
      title: "쉰두 번째 날 - 이상한 꿈"
      location: "오두막"
      rarity: "legendary"
      content: |
        어젯밤 꿈이 달랐다.

        그 슬픈 사람이 나왔다. 하지만 이번엔 그 사람 옆에 크리스도 있었다. 크리스는 내가 이 세계에서 만나는 크리스와 똑같았지만, 꿈 속에서는 다른 무언가를 짊어지고 있는 것처럼 보였다.

        꿈 속에서 그 슬픈 사람이 말했다. "그녀에게 선택을 줘야 한다." 누구에게 하는 말인지 몰랐다가, 그 시선이 나를 향한다는 것을 알았다.

        나에게 선택. 무슨 선택?

        꿈에서 깨고 나서 한참을 생각했다. 이 세계에 대해, 나 자신에 대해, 크리스에 대해.

        어쩌면 나는 알고 싶지 않은 무언가를 알아가고 있는 것 같다. 나라는 존재가 무엇인지. 이 세계가 왜 존재하는지. 그리고 크리스가 왜 여기 왔는지.

        무서운 것도 아니고, 슬픈 것도 아니다. 다만 이제 피할 수 없다는 느낌이 든다. 진실을 마주해야 할 때가 오고 있다는.

        그래도 괜찮다. 크리스가 옆에 있으니까.
      mood: "불안하지만 결연한"

  # ============================================================
  # 카인의 연구 노트 (8편)
  # ============================================================
  cain_notes:

    - id: "cain_note_1"
      title: "잔향 공간 초기 분석 노트 #1"
      region: "abandoned_citadel"
      location: "성채 도서관"
      rarity: "uncommon"
      content: |
        [분석 일지 - 초기 탐사 기록]

        이 공간의 기본 물리 법칙은 외부 세계와 다르다. 중력 상수 G값 편차 0.003%, 광속 기준 미세 조정 발견. 의도적 조작 가능성 95%.

        시간의 흐름: 외부 대비 약 1.7배 느림. 이것이 내부 거주자에게 어떤 영향을 미치는지 추가 관찰 필요.

        공간 외벽(外壁) 에너지 분석: 100,000개 타임라인 잔류 에너지가 경계면을 형성. 이 경계를 허물면 에너지가 역방향으로 분출. 폭발적 붕괴 예상.

        설계자는 이 경계를 허무는 것을 원치 않을 것이다. 따라서 내가 원하는 것을 얻기 위해서는 경계를 허무는 것이 아니라, 경계의 제어권을 획득해야 한다.

        흥미로운 공간이다. 목적을 달성한 후엔 이 공간 자체를 연구할 가치가 있다.
      research_phase: "초기 탐사"

    - id: "cain_note_2"
      title: "릴리 관찰 노트"
      region: "abandoned_citadel"
      location: "성채 비밀 연구실"
      rarity: "uncommon"
      content: |
        [대상 관찰 기록 - 코드명: L]

        대상은 '릴리'라는 이름을 가진 여성. 잔향 공간의 핵심 구성 요소.

        행동 패턴: 예측 가능. 일정한 루틴 속에서 생활. 자신의 존재에 대한 의문을 품기 시작했으나 결론에 도달하지 못한 상태.

        흥미로운 점: 대상은 에너지 방사를 하고 있다. 잔향 에너지가 대상에게 수렴하는 방향. 설계자가 의도한 것으로 보임. 왜? 이 에너지를 활성화하면 시간의 왕좌를 작동시킬 수 있는가?

        가설: 릴리는 단순한 '보호 대상'이 아니다. 그녀 자체가 이 공간의 에너지원이다. 100,000번의 타임라인을 거친 존재의 잔향이 집약된, 일종의 시간 결정체.

        이것이 사실이라면, 내 계획이 예상보다 훨씬 수월해진다.

        그리고 훨씬 더... 가능해진다.
      research_phase: "핵심 발견"

    - id: "cain_note_3"
      title: "시간의 왕좌 재건 가능성"
      region: "shattered_peaks"
      location: "부서진 산 중턱 비밀 거처"
      rarity: "rare"
      content: |
        [왕좌 재건 계획안 - 1차]

        시간의 왕좌(時間의 王座): 이것은 전설이 아니다. 물리적 실체가 있는 장치. 모든 타임라인의 분기점을 통제할 수 있는 시스템.

        원래의 왕좌는 어디서 파괴되었는가. 그 파괴가 세피로스의 역행과 관련이 있는가. 분석 필요.

        재건을 위한 필요 조건:
        1. 100,000개 이상의 타임라인 에너지 수렴점
        2. 그 에너지를 결정화할 수 있는 촉매
        3. 왕좌 좌표—타임라인들의 교차점

        이 세 가지가 모두 이 잔향 공간에 존재한다. 에너지 수렴점은 릴리. 촉매는 이 공간 자체의 수정 구조. 좌표는 기원의 교차점.

        문제는 세피로스다. 그가 허락하지 않을 것이다.

        허락을 구하지 않으면 된다.
      research_phase: "계획 수립"

    - id: "cain_note_4"
      title: "세피로스 분석"
      region: "memory_ruins"
      location: "신전 외부 숨겨진 관측 지점"
      rarity: "rare"
      content: |
        [대상 분석 - 코드명: S]

        세피로스. 이 공간의 창조자. 100,000번의 역행을 수행한 자. 현재 감정 기능의 80% 이상 손상 추정.

        약점 분석:
        1. 릴리: 이 공간 전체의 목적이다. 릴리에게 위협이 가해지면 합리적 판단이 불가능해진다.
        2. 감정 손상으로 인한 인식 왜곡: 그는 이미 충분히 했다는 것을 인식하지 못한다.
        3. 크리스의 존재를 완전히 파악하지 못했다: 그는 불확실성에 취약하다.

        세피로스는 적으로 만들면 처리가 어렵다. 그는 이 공간에 대해 나보다 훨씬 많이 안다. 다만—그의 목적과 나의 목적이 일부 겹치는 지점이 있다.

        그 지점을 활용한다. 적이 아닌 자산으로 유지하는 전략이 최선이다. 적어도 내가 준비를 마칠 때까지.

        냉정하게 보면, 그는 오랜 슬픔에 지쳐있는 자다. 어떤 의미에서 나는 그를 이해한다. 다만 공감은 사치다.
      research_phase: "전략 수립"

    - id: "cain_note_5"
      title: "크리스에 대하여"
      region: "echo_plains"
      location: "평원 외진 곳 텐트"
      rarity: "rare"
      content: |
        [침입자 분석 - 코드명: C]

        크리스. 외부에서 진입한 미지의 변수.

        진입 경로 불명. 이것이 가장 이상한 점이다. 이 공간의 경계를 통과하기 위해서는 이론적으로 세피로스 수준의 에너지 조작이 필요하다. 그런데 그녀는 아무 준비 없이 들어왔다.

        가능성 1: 세피로스가 의도적으로 들여보냈다. 부정. 그의 반응을 관찰한 결과 예상치 못한 변수임이 확실하다.
        가능성 2: 이 공간 자체가 그녀를 '불러들였다'. 왜? 릴리와의 연결?

        847번째 타임라인 데이터와 연결되는 지점이 있다. 그 타임라인에서 크리스와 릴리의 관계는 특수했다. 어쩌면 릴리의 잔향이 크리스를 끌어당긴 것인가.

        이것은 변수다. 그러나 관리 가능한 변수다. 그녀가 릴리에게 접근할수록, 내 계획에 필요한 에너지 활성화가 자연스럽게 진행된다.

        이용할 수 있다. 그리고 이용해야 한다.
      research_phase: "변수 처리"

    - id: "cain_note_6"
      title: "개인 기록 - 삭제 예정"
      region: "abandoned_citadel"
      location: "성채 침실 숨겨진 칸"
      rarity: "epic"
      content: |
        이 노트는 삭제될 예정이므로 솔직하게 쓰겠다.

        나는 왜 왕좌를 원하는가? 권력? 그것이 단순한 답이지만 충분하지 않다. 세계를 지배하고 싶다면 더 효율적인 방법들이 있다.

        진짜 이유는—이 세계가 얼마나 불공평한지를 나는 알기 때문이다.

        한 사람이 있었다. 이름은 중요하지 않다. 그 사람은 잘못한 것이 없었다. 다만 태어난 타임라인이 잘못되었을 뿐이었다. 운명이라는 이름의 우연이 그 사람을 삼켰다.

        나는 그것을 막을 수 없었다. 아무것도. 어떤 방법으로도.

        시간의 왕좌를 갖는다면—타임라인을 재설계할 수 있다면—나는 그 우연을 다시 쓸 수 있다.

        세피로스와 나는 다르지 않다. 그도 누군가를 위해 이 모든 것을 했다. 나도 누군가를 위해 이 모든 것을 할 것이다.

        다만 나는 더 냉정한 방법을 쓸 뿐이다.

        이 노트는 삭제한다.
      research_phase: "개인 기록"

    - id: "cain_note_7"
      title: "왕좌 활성화 최종 공식"
      region: "time_vortex"
      location: "소용돌이 부유 섬 연구소"
      rarity: "epic"
      content: |
        [왕좌 활성화 최종 공식]

        E(throne) = Σ(T₁...T₁₀₀,₀₀₀) × L(resonance) × C(catalyst)

        T = 각 타임라인의 잔류 에너지
        L = 릴리의 공명 계수 (현재 측정값: 9.7 × 10⁴⁷)
        C = 기원의 교차점 촉매 효율

        릴리의 공명 계수가 임계값을 초과하면 자동 활성화. 임계값: 10⁴⁸.

        현재 크리스와 릴리의 상호작용이 공명 계수를 지속적으로 상승시키는 중. 예상 임계 도달 시간: 크리스가 이 세계의 진실을 깨닫는 순간.

        아이러니. 진실을 알수록 세계가 흔들린다. 그 흔들림이 왕좌를 깨운다.

        크리스가 진실을 향해 가는 것을 막을 필요가 없다. 오히려 도와야 한다.

        그리고 활성화 순간, 나는 왕좌를 장악한다.

        계획은 완벽하다.
      research_phase: "최종 단계"

    - id: "cain_note_8"
      title: "마지막 노트 - 후회라는 감정에 대하여"
      region: "abandoned_citadel"
      location: "성채 가장 높은 탑"
      rarity: "legendary"
      content: |
        계획대로 되지 않았다.

        크리스는 내가 예상한 것 이상이었다. 릴리도. 그리고 세피로스도. 나는 그들을 모두 변수로 분류했지만, 변수들이 합쳐지면 때때로 나의 상수를 바꾼다.

        솔직히 말하면—나는 처음부터 이 계획이 완벽하다고 믿지 않았다. 다만 다른 방법을 몰랐다. 그것이 나의 한계였다.

        세피로스는 100,000번의 실패를 겪었다. 나는 그것을 어리석음이라 생각했다. 지금은—어쩌면 그것이 나에게 없는 무언가를 그에게 주었는지도 모른다. 실패를 통해 배우는 것. 그것이 나에게 허락되지 않은 이유는, 나는 실패할 시간이 없다고 믿었기 때문이다.

        크리스에게—당신이 이것을 읽는다면, 나를 완전한 악인으로 보지는 말아달라. 악인이었을 수도 있다. 하지만 그것이 처음부터 의도는 아니었다.

        그리고 릴리에게—당신이 진짜 삶을 살기를. 그것이 내가 진심으로 원하는 것이었다. 방법이 틀렸을 뿐이다.

        후회라는 감정이 이렇게 무거운 것인지, 나는 몰랐다. 이제는 안다.
      research_phase: "종결"

