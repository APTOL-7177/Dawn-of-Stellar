# 6장-2: 보스전 준비
id: story_18_boss_preparation
title: "보스전 준비"
order: 18
category: story
chapter: "chapter_6"
enabled: true
skippable: true

description: |
  보스와 싸우기 전 철저한 준비가 필요하다.
  장비 점검, 버프 음식, 파티 구성을 확인한다.

objective: "보스전 준비를 완료하세요"

npc_guide: "karnos"

messages:
  - text: "보스 방 앞에 도착했다..."
    color: [200, 100, 255]
    pause: 2.5
    effect: "typing"
    sound: "boss_door.ogg"

npc_dialogue:
  - npc: "karnos"
    text: "멈춰라. 보스전은 준비 없이 들어가면 안 된다."
    pause: 2.5
    
  - npc: "karnos"
    text: "장비 상태, 소모품, 파티 구성... 모두 점검해야 한다."
    pause: 3.0
    
  - npc: "selena"
    text: "현재 파티 상태를 분석할게요..."
    pause: 2.0
    
  - npc: "selena"
    text: "HP 회복 아이템, 버프 음식이 있으면 좋겠어요."
    pause: 2.5
    highlight: "inventory"
    
  - npc: "lina"
    text: "제가 만든 요리 먹었어요? 버프 꼭 받고 가세요!"
    pause: 2.5
    
  - npc: "tord"
    text: "장비 내구도 확인해. 보스전 중에 부서지면 끝이야."
    pause: 2.5
    
  - npc: "mira"
    text: "준비됐으면 들어가요! 다 같이 힘내봐요!"
    pause: 2.5

# 보스전 준비 체크리스트
preparation_checklist:
  - item: "party_size"
    requirement: 3
    message: "파티원 3명 이상"
    
  - item: "hp_items"
    requirement: 1
    message: "HP 회복 아이템"
    optional: true
    
  - item: "equipment_durability"
    requirement: 50
    message: "장비 내구도 50% 이상"
    optional: true

# 완료 조건
completion_condition:
  type: "checklist_complete"
  required_items: ["party_size"]
  message: "준비 완료! 이제 보스에게 도전하세요!"

hints:
  - text: "최소 파티원 3명이 필요해요."
    trigger_time: 10.0
    npc: "selena"
    
  - text: "여유가 있다면 장비 수리와 버프 음식도 챙기세요."
    trigger_time: 18.0
    npc: "karnos"

ui_highlights:
  - element: "boss_door"
    color: [255, 0, 0]
    pulse: true
    description: "보스 방"

rewards:
  message: "보스전 준비 완료!"

next_step: "story_19_time_devourer_boss"
