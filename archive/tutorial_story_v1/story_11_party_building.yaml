# 4장-2: 파티 구성
id: story_11_party_building
title: "파티 구성의 기술"
order: 11
category: story
chapter: "chapter_4"
enabled: true
skippable: true

description: |
  4명의 파티 구성.
  역할 분배가 승리의 열쇠다.

objective: "추천 파티 구성을 배우세요"

npc_guide: "karnos"
bgm: "party_setup.ogg"

messages:
  - text: "파티 구성은 전략의 기본이다."
    color: [255, 100, 100]
    pause: 2.0
    effect: "typing"

npc_dialogue:
  - npc: "karnos"
    text: "4명의 파티. 역할 분배가 가장 중요하다."
    pause: 3.0
    
  - npc: "karnos"
    text: "탱커 1명, 딜러 2명, 힐러/서포터 1명. 이게 기본이다."
    pause: 3.5
    color: [255, 255, 0]
    
  - npc: "selena"
    text: "34개 직업 중에서 자유롭게 선택할 수 있어요."
    pause: 2.5
    
  - npc: "selena"
    text: "단, 시작 전에만 선택 가능하고, 중간에 바꿀 수 없어요."
    pause: 3.0
    color: [255, 100, 100]
    
  - npc: "mira"
    text: "초보자라면 전사, 궁수, 성직자, 아크메이지 추천해요!"
    pause: 3.0
    
  - npc: "karnos"
    text: "각 직업의 기믹을 이해하면 시너지를 낼 수 있다."
    pause: 2.5

# 추천 파티 구성
recommended_parties:
  beginner:
    name: "초보자 추천"
    members: ["전사", "궁수", "성직자", "아크메이지"]
    description: "균형 잡힌 기본 구성"
    
  aggressive:
    name: "공격형"
    members: ["검성", "브레이커", "바드", "시간술사"]
    description: "높은 딜, 빠른 클리어"
    
  defensive:
    name: "방어형"
    members: ["기사", "성기사", "성직자", "정령술사"]
    description: "높은 생존력, 안정적"

