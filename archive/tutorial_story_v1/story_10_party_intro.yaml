# 4장-1: 시대를 넘은 동료
id: story_10_party_intro
title: "시대를 넘은 동료"
order: 10
category: story
chapter: "chapter_4"
enabled: true
skippable: true

description: |
  각기 다른 시대에서 온 영웅들.
  시공 균열에 도전하기 전, 4명의 파티를 구성해야 한다.

objective: "파티 시스템에 대해 배우세요"

npc_guide: "selena"
bgm: "party_setup.ogg"

messages:
  - text: "각기 다른 시대에서 온 영웅들이 모인다..."
    color: [200, 200, 200]
    pause: 2.5
    effect: "fade_in"

npc_dialogue:
  - npc: "selena"
    text: "시공 균열에 도전하려면 파티가 필요해요."
    pause: 2.5
    
  - npc: "selena"
    text: "파티는 4명으로 구성되며, 한번 출발하면 게임오버까지 바꿀 수 없어요."
    pause: 3.5
    color: [255, 255, 0]
    
  - npc: "karnos"
    text: "시공 전쟁에서도... 한번 팀을 짜면 끝까지 함께했다."
    pause: 3.0
    
  - npc: "karnos"
    text: "신중하게 선택해라. 역할 분배가 승패를 가른다."
    pause: 3.0
    
  - npc: "mira"
    text: "탱커, 딜러, 힐러, 서포터! 균형이 중요해요~"
    pause: 2.5

completion_condition:
  type: "dialogue_complete"
  message: "파티 시스템을 이해했습니다!"

rewards:
  message: "파티 시스템을 이해했습니다!"

next_step: "story_11_party_building"
