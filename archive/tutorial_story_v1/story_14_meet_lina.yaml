# 5장-3: 우주선 요리사 리나
id: story_14_meet_lina
title: "미래의 요리사"
order: 14
category: story
chapter: "chapter_5"
enabled: true
skippable: true

description: |
  2500년 우주선에서 온 요리사 리나.
  과거 재료와 미래 기술의 융합 요리!

objective: "리나의 요리를 맛보세요"

npc_guide: "lina"

story_scene:
  background: "temporal_settlement"
  location: "kitchen"
  bgm: "town.ogg"

messages:
  - text: "맛있는 냄새가 어디선가 풍긴다..."
    color: [255, 150, 200]
    pause: 2.0
    effect: "typing"

npc_dialogue:
  - npc: "lina"
    text: "어머! 새로운 분이네요! 배고프지 않아요?"
    pause: 2.0
    portrait_animation: "cheerful"
    
  - npc: "selena"
    text: "리나 씨는 2500년 우주선의 요리사였어요."
    pause: 2.5
    
  - npc: "lina"
    text: "300명 승무원 요리 담당했었죠~"
    pause: 2.0
    
  - npc: "lina"
    text: "갑자기 중세에 떨어졌을 때... 진짜 당황했어요!"
    pause: 2.5
    
  - npc: "lina"
    text: "근데 여기 재료가 정말 신선하더라고요!"
    pause: 2.5
    color: [0, 255, 0]
    
  - npc: "lina"
    text: "과거 재료 + 미래 합성 기술 = 새로운 맛!"
    pause: 2.5
    color: [255, 255, 0]
    
  - npc: "lina"
    text: "시공 융합 요리예요! 자, 드셔보세요!"
    pause: 2.5
    reward_preview: true
    
  - npc: "tord"
    text: "(저 여자 요리는... 인정할 수밖에 없어.)"
    pause: 2.0
    color: [200, 150, 100]

# 요리 지급
tutorial_reward_item:
  - type: "food"
    name: "시공 융합 스테이크"
    effect: "HP +50, ATK +10% (3턴)"

completion_condition:
  type: "item_received"
  message: "요리를 받았습니다!"

hints:
  - text: "요리는 전투 전에 먹으면 버프를 받을 수 있어요!"
    trigger_time: 10.0
    npc: "lina"

rewards:
  items:
    - "temporal_steak"
  message: "리나의 요리를 받았습니다!"
  unlock:
    - type: "npc_bond"
      npc: "lina"
      level: 1
    - type: "system"
      system: "cooking"

next_step: "story_15_cooking_basics"
