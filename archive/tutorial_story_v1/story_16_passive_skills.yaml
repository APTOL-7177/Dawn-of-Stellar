# 5장-5: 패시브 스킬 시스템
id: story_16_passive_skills
title: "숨겨진 힘: 패시브"
order: 16
category: story
chapter: "chapter_5"
enabled: true
skippable: true

description: |
  패시브 스킬은 항상 발동되는 숨겨진 힘.
  캐릭터를 더 강하게 만든다.

objective: "패시브 스킬을 장착하세요"

npc_guide: "mira"

messages:
  - text: "패시브 스킬의 비밀을 알려드릴게요!"
    color: [255, 200, 100]
    pause: 2.0
    effect: "typing"

npc_dialogue:
  - npc: "mira"
    text: "패시브 스킬은 게임 시작 전에 설정하는 거예요!"
    pause: 3.0
    
  - npc: "mira"
    text: "파티 선택 화면에서 각 캐릭터의 패시브를 골라요~"
    pause: 3.0
    
  - npc: "selena"
    text: "한 번 던전에 들어가면 변경할 수 없으니 신중하게!"
    pause: 2.5
    
  - npc: "mira"
    text: "HP 증가, 크리티컬 확률 증가, 속도 증가... 다양해요!"
    pause: 3.0
    
  - npc: "karnos"
    text: "패시브 조합이 전투의 승패를 가른다. 신중하게 선택해라."
    pause: 3.0

# 완료 조건
completion_condition:
  type: "passive_equipped"
  count: 1
  message: "패시브 스킬 장착 완료!"

hints:
  - text: "파티 선택 화면에서 패시브를 설정할 수 있어요."
    trigger_time: 10.0
    npc: "selena"
    
  - text: "각 캐릭터마다 다른 패시브를 골라보세요!"
    trigger_time: 18.0
    npc: "mira"

ui_highlights:
  - element: "character_menu_key"
    color: [0, 255, 255]
    pulse: true
    description: "캐릭터 메뉴 (C)"
    
  - element: "passive_slot"
    color: [255, 200, 0]
    pulse: true
    description: "패시브 슬롯"

rewards:
  message: "패시브 시스템을 이해했습니다!"

next_step: "story_17_dungeon_intro"
