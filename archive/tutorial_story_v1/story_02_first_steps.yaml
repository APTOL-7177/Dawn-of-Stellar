    highlight: "interaction_key"
    
  - npc: "selena"
    text: "정보를 모아야 무슨 일이 벌어졌는지 알 수 있어요."
    pause: 2.5

completion_condition:
  type: "npc_interaction"
  target_npc: "any"
  count: 1
  message: "상호작용 방법을 익혔습니다!"

hints:
  - text: "NPC 앞에서 Enter키를 누르면 대화할 수 있어요."
