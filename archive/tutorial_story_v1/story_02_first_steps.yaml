# 1장-2: 첫 걸음
id: story_02_first_steps
title: "첫 걸음"
order: 2
category: story
chapter: "chapter_1"
enabled: true
skippable: true

description: |
  기본적인 상호작용을 배웁니다.
  NPC와 대화하고, 오브젝트를 조사하세요.

objective: "마을의 NPC와 대화하세요"

npc_guide: "selena"

messages:
