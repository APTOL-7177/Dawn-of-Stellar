# 5장-1: 바이킹 대장장이 토르드
id: story_12_meet_tord
title: "과거의 대장장이"
order: 12
category: story
chapter: "chapter_5"
enabled: true
skippable: true

description: |
  800년 과거에서 온 바이킹 대장장이 토르드.
  미래 기술에 당황하지만, 장비의 본질은 같다.

objective: "토르드에게 장비를 받으세요"

npc_guide: "tord"

story_scene:
  background: "temporal_settlement"
  location: "blacksmith"
  bgm: "town.ogg"

messages:
  - text: "대장간에서 망치 소리가 울린다..."
    color: [200, 150, 100]
    pause: 2.0
    effect: "typing"
    sound: "blacksmith_hammer.ogg"

npc_dialogue:
  - npc: "tord"
    text: "흥. 또 미래에서 온 녀석인가."
    pause: 2.0
    portrait_animation: "gruff"
    
  - npc: "tord"
    text: "뭐야, 그 장비는. 형편없군."
    pause: 2.0
    
  - npc: "selena"
    text: "토르드 씨는 800년 바이킹 시대에서 오셨어요."
    pause: 2.5
    
  - npc: "tord"
    text: "처음엔 이 '레이저' 뭐시기에 당황했지만..."
    pause: 2.5
    
  - npc: "tord"
    text: "기본 원리는 같아. 때려서 강하게 만드는 거지."
    pause: 2.5
    color: [255, 200, 100]
    
  - npc: "tord"
    text: "여기. 내가 만든 장비다. 미래 기술도 섞었어."
    pause: 2.5
    reward_preview: true
    
  - npc: "tord"
    text: "장비는 전투의 기본이야. 잘 관리해."
    pause: 2.0

# 장비 지급
tutorial_reward_item:
  - type: "weapon"
    name: "시공 융합 검"
    stats:
      attack: 15
      
  - type: "armor"
    name: "시공 융합 갑옷"
    stats:
      defense: 10

completion_condition:
  type: "item_received"
  message: "새 장비를 받았습니다!"

hints:
  - text: "인벤토리(I)에서 장비를 확인하고 장착하세요."
    trigger_time: 10.0
    npc: "selena"

rewards:
  items:
    - "temporal_sword"
    - "temporal_armor"
  message: "토르드에게 장비를 받았습니다!"
  unlock:
    - type: "npc_bond"
      npc: "tord"
      level: 1

next_step: "story_13_equipment_basics"
