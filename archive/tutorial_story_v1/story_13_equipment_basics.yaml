# 5장-2: 장비 시스템 기초
id: story_13_equipment_basics
title: "장비의 기본"
order: 13
category: story
chapter: "chapter_5"
enabled: true
skippable: true

description: |
  장비는 전투력의 기본.
  무기, 방어구, 장신구를 장착하는 법을 배운다.

objective: "받은 장비를 장착하세요"

npc_guide: "tord"

messages:
  - text: "장비를 장착해봐라."
    color: [200, 150, 100]
    pause: 2.0
    effect: "typing"

npc_dialogue:
  - npc: "tord"
    text: "장비는 3가지 슬롯이 있다. 무기, 방어구, 장신구."
    pause: 2.5
    
  - npc: "tord"
    text: "무기는 공격력, 방어구는 방어력, 장신구는 특수 효과."
    pause: 3.0
    
  - npc: "selena"
    text: "I키로 인벤토리를 열고, 장비를 선택해서 장착할 수 있어요."
    pause: 3.0
    highlight: "inventory_key"
    
  - npc: "tord"
    text: "장비는 내구도가 있다. 전투하면 닳으니까 관리해야 해."
    pause: 3.0
    
  - npc: "tord"
    text: "대장간에서 수리하거나 강화할 수 있다. 나한테 오면 돼."
    pause: 2.5

# 완료 조건
completion_condition:
  type: "equipment_equipped"
  slots: ["weapon", "armor"]
  message: "장비 장착 완료!"

hints:
  - text: "I키로 인벤토리를 열어보세요."
    trigger_time: 8.0
    npc: "selena"
    
  - text: "장비를 선택하고 Enter로 장착할 수 있어요."
    trigger_time: 15.0
    npc: "selena"
    
  - text: "무기부터 장착해봐. 공격력이 올라간다."
    trigger_time: 22.0
    npc: "tord"

ui_highlights:
  - element: "inventory_key"
    color: [255, 255, 0]
    pulse: true
    description: "인벤토리 (I)"
    
  - element: "equipment_slot"
    color: [0, 255, 0]
    pulse: true
    description: "장비 슬롯"

rewards:
  message: "장비 시스템을 이해했습니다!"

next_step: "story_14_meet_lina"
