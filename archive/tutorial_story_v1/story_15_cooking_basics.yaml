# 5장-4: 요리 시스템 기초
id: story_15_cooking_basics
title: "요리의 기본"
order: 15
category: story
chapter: "chapter_5"
enabled: true
skippable: true

description: |
  요리는 전투 전 준비의 핵심!
  버프 음식으로 전투력을 높인다.

objective: "요리를 사용해서 버프를 받으세요"

npc_guide: "lina"

messages:
  - text: "요리의 힘을 체험해봐요!"
    color: [255, 150, 200]
    pause: 2.0
    effect: "typing"

npc_dialogue:
  - npc: "lina"
    text: "요리는 전투 전에 먹으면 버프를 줘요!"
    pause: 2.5
    
  - npc: "lina"
    text: "HP 회복, 공격력 증가, 방어력 증가... 종류가 다양해요."
    pause: 3.0
    
  - npc: "selena"
    text: "인벤토리에서 음식을 선택하고 사용하면 돼요."
    pause: 2.5
    
  - npc: "lina"
    text: "버프는 몇 턴 동안 유지되니까 전투 직전에 먹는 게 좋아요!"
    pause: 3.0
    
  - npc: "tord"
    text: "...인정한다. 저 여자 음식은 효과가 확실해."
    pause: 2.5
    color: [200, 150, 100]
    
  - npc: "lina"
    text: "토르드 씨도 매일 먹잖아요~ 아하하!"
    pause: 2.0

# 완료 조건
completion_condition:
  type: "item_used"
  item_type: "food"
  message: "버프 활성화! 전투 준비 완료!"

hints:
  - text: "인벤토리(I)에서 음식을 찾아서 사용해보세요."
    trigger_time: 10.0
    npc: "selena"
    
  - text: "음식 위에서 Enter를 누르면 사용할 수 있어요."
    trigger_time: 18.0
    npc: "lina"

ui_highlights:
  - element: "food_item"
    color: [255, 200, 100]
    pulse: true
    description: "음식 아이템"

rewards:
  stellar_fragments: 5  # 별의 파편 (메타 진행 해금용)
  message: "요리 시스템을 이해했습니다!"

next_step: "story_16_passive_skills"
