# 에필로그: 시간의 각성 - 시간술사 해금
id: story_20_time_awakening
title: "시간의 각성"
order: 20
category: story
chapter: "epilogue"
enabled: true
skippable: false  # 에필로그는 스킵 불가

description: |
  첫 번째 시공 균열을 봉인하는 순간...
  당신 안에서 시간의 힘이 각성한다.

objective: "시공 균열을 봉인하세요"

# 특별 보스전
boss_battle:
  enabled: true
  bgm: "boss.ogg"
  victory_me: "Fanfare1.ogg"
  boss:
    id: "time_devourer"
    name: "시간 포식자"
    hp: 500
    brv: 800
    phase_changes:
      - hp_percent: 50
        effect: "time_acceleration"
        message: "시간 포식자가 시간을 가속시킨다!"

# 스토리 씬
story_scene:
  background: "temporal_rift"
  ambient: "time_distortion"
  special_effects:
    - "time_particles"
    - "dimensional_cracks"

messages:
  - text: "거대한 시공 균열이 눈앞에 있다..."
    color: [200, 200, 255]
    pause: 2.5
    effect: "fade_in"

npc_dialogue:
  # 보스전 전
  - npc: "selena"
    text: "저 안에 '시간 포식자'가 있어요."
    pause: 2.5
    
  - npc: "selena"
    text: "시공 교란의 원인 중 하나입니다. 처치해야 균열을 닫을 수 있어요."
    pause: 3.0
    
  - npc: "karnos"
    text: "지금까지 배운 것을 총동원해야 한다. 준비됐나?"
    pause: 2.5
    
  - npc: "mira"
    text: "모두 함께 싸워요! 할 수 있어요!"
    pause: 2.0
    color: [255, 200, 100]

# 보스전 후 컷신
post_battle_cutscene:
  enabled: true
  
  messages:
    - text: "시간 포식자가 소멸한다..."
      color: [255, 255, 255]
      pause: 2.5
      effect: "fade_in"
      
    - text: "시공 균열이 닫히기 시작한다."
      color: [0, 255, 255]
      pause: 2.5
      effect: "typing"
      
    - text: "그 순간, 뭔가가 당신 안에서 폭발한다!"
      color: [255, 255, 0]
      pause: 3.0
      effect: "flash"
      screen_shake: true
      sound: "time_awakening.ogg"
      
  npc_dialogue:
    - npc: "selena"
      text: "경고: 알 수 없는 에너지 급증 감지!"
      pause: 2.0
      color: [255, 255, 0]
      
    - npc: "selena"
      text: "이건... 시간의 힘이에요!"
      pause: 2.5
      color: [0, 255, 255]
      
    - npc: "selena"
      text: "시공 균열을 닫으면서 당신 안에서 각성한 거예요!"
      pause: 3.0
      
    - npc: "karnos"
      text: "시간술사... 시공 교란의 핵심 힘을 다룰 수 있게 됐군."
      pause: 3.0
      color: [255, 150, 150]
      
    - npc: "karnos"
      text: "이 힘으로 세계를 구할 수 있을지도 모르겠다."
      pause: 2.5
      
    - npc: "mira"
      text: "대박! 시간술사예요! 엄청나게 희귀한 재능이에요!"
      pause: 2.5
      color: [255, 200, 100]
      
    - npc: "mira"
      text: "타임라인을 조작해서 과거와 미래를 오갈 수 있답니다!"
      pause: 3.0

# 직업 선택 UI
job_selection:
  enabled: true
  bgm: "fanfare.ogg"
  title: "각성할 힘을 선택하세요"
  description: "튜토리얼 완료 보상으로 해금 직업 1개를 무료로 획득합니다."
  timeout: 30  # 30초 후 기본 선택
  
  choices:
    - id: "time_mage"
      name: "시간술사"
      description: |
        시간을 조작하여 전장을 지배하는 시공의 마법사.
        타임라인 시스템으로 과거/현재/미래를 넘나든다.
      story_text: "시공 균열 봉인으로 시간의 힘이 각성했다."
      recommended: true
      preview_skills:
        - "시간 정지 (Stop)"
        - "시간 역행 (Rewind)"
        - "가속 (Haste)"
        
    - id: "dimensionist"
      name: "차원술사"
      description: |
        차원과 확률을 조작하는 시공간의 지배자.
        평행 우주의 힘으로 불가능을 가능으로.
      story_text: "차원 항해 기술의 부작용으로 공간 조작력이 각성했다."
      recommended: false
      preview_skills:
        - "차원 도약 (Dimension Leap)"
        - "확률 왜곡 (Probability Warp)"
        
    - id: "hacker"
      name: "해커"
      description: |
        시스템을 해킹하여 적을 약화시키는 전투 전문가.
        미래 기술로 적의 능력을 무력화.
      story_text: "미래 기술과의 접촉으로 시스템 해킹 능력이 각성했다."
      recommended: false
      preview_skills:
        - "시스템 침투 (System Breach)"
        - "바이러스 (Virus)"
        
  default_choice: "time_mage"
  
  # 선택 후 대사
  selection_dialogue:
    time_mage:
      - npc: "selena"
        text: "시간술사... 타임라인을 조작하는 능력이에요."
        
      - npc: "karnos"
        text: "좋은 선택이다. 이 힘을 잘 다루면 운명을 바꿀 수 있다."
        
      - npc: "mira"
        text: "와! 시간술사 튜토리얼, 제가 알려드릴게요!"
        
    dimensionist:
      - npc: "selena"
        text: "차원술사... 공간과 확률을 조작하는 능력이에요."
        
      - npc: "karnos"
        text: "차원의 힘... 예측불가능하지만 강력하다."
        
    hacker:
      - npc: "selena"
        text: "해커... 저와 비슷한 방식으로 세상을 보시는군요."
        
      - npc: "karnos"
        text: "미래 기술의 힘... 흥미롭군."

# 완료 조건
completion_condition:
  type: "boss_defeated"
  boss_id: "time_devourer"
  and_job_selected: true
  message: "축하합니다! 시공의 힘이 각성했습니다!"

# 최종 보상
rewards:
  stellar_fragments: 100  # 별의 파편 (메타 진행 해금용)
  job_unlock: "selected"  # 선택한 직업 해금
  message: |
    🎉 튜토리얼 완료!
    
    새로운 직업이 해금되었습니다!
    별의 파편 100개를 획득했습니다!

# 튜토리얼 완료
next_step: null  # 튜토리얼 종료
tutorial_complete: true
