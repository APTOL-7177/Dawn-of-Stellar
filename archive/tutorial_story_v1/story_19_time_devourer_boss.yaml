# 6장-3: 시간 포식자 보스전
id: story_19_time_devourer_boss
title: "시간 포식자"
order: 19
category: story
chapter: "chapter_6"
enabled: true
skippable: false  # 보스전은 스킵 불가

description: |
  첫 번째 시공 균열의 핵심, 시간 포식자.
  지금까지 배운 모든 것을 활용해야 한다.

objective: "시간 포식자를 처치하세요"

npc_guide: "karnos"

# 보스 설정
boss_battle:
  enabled: true
  bgm: "boss.ogg"
  victory_me: "Victory1.ogg"
  boss:
    id: "time_devourer"
    name: "시간 포식자"
    title: "시공 균열의 핵심"
    hp: 800
    brv: 1200
    
    # 페이즈 변화
    phases:
      - hp_percent: 100
        name: "1페이즈: 시간 왜곡"
        message: "시간 포식자가 시간을 왜곡시킨다!"
        
      - hp_percent: 50
        name: "2페이즈: 시간 가속"
        message: "시간 포식자가 시간을 가속시킨다!"
        effect: "boss_speed_up"
        
      - hp_percent: 25
        name: "3페이즈: 시간 폭주"
        message: "시간 포식자가 폭주한다!"
        effect: "boss_enrage"
    
    # 패턴
    patterns:
      - name: "시간 흡수"
        description: "BRV를 대량으로 축적"
        
      - name: "시간 절단"
        description: "강력한 HP 공격"
        warning: "시간 포식자가 시간을 절단하려 한다!"
        
      - name: "시간 역류"
        description: "자신의 HP 일부 회복"

# 스토리 씬
story_scene:
  background: "temporal_rift_core"
  ambient: "time_distortion_heavy"
  special_effects:
    - "boss_aura"
    - "time_particles"

messages:
  - text: "시간 포식자가 모습을 드러낸다!"
    color: [255, 0, 0]
    pause: 2.5
    effect: "flash"
    screen_shake: true
    sound: "boss_appear.ogg"

npc_dialogue:
  # 전투 시작 전
  - npc: "selena"
    text: "경고: 강력한 시간 에너지 감지! 이게 시간 포식자예요!"
    pause: 2.5
    color: [255, 255, 0]
    
  - npc: "karnos"
    text: "집중해라. 지금까지 배운 모든 걸 써야 한다."
    pause: 2.5
    
  - npc: "mira"
    text: "BRV 관리 잊지 마세요! BREAK 노려요!"
    pause: 2.0

# 전투 중 힌트
combat_hints:
  - trigger: "boss_hp_50"
    npc: "selena"
    text: "2페이즈 돌입! 보스 속도가 빨라집니다!"
    
  - trigger: "boss_hp_25"
    npc: "karnos"
    text: "폭주 상태다! 집중 공격해라!"
    
  - trigger: "boss_charging"
    npc: "mira"
    text: "강한 공격이 온다! 방어 자세를 취하세요!"
    
  - trigger: "player_low_hp"
    npc: "lina"
    text: "위험해요! HP 회복하세요!"

# 완료 조건
completion_condition:
  type: "boss_defeated"
  boss_id: "time_devourer"
  message: "시간 포식자를 물리쳤습니다!"

# 전투 후 대사
post_battle_dialogue:
  - npc: "selena"
    text: "시간 포식자 소멸 확인! 시공 균열이 닫히기 시작해요!"
    pause: 2.5
    
  - npc: "karnos"
    text: "...해냈군. 훌륭했다."
    pause: 2.0
    
  - npc: "mira"
    text: "우와! 정말 대단해요! 첫 번째 균열을 닫았어요!"
    pause: 2.5

rewards:
  stellar_fragments: 30  # 별의 파편 (메타 진행 해금용)
  items:
    - "temporal_crystal"  # 특별 아이템
  message: "첫 번째 시공 균열을 봉인했습니다!"

next_step: "story_20_time_awakening"
