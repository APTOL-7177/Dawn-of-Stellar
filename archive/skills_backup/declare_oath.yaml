id: declare_oath
name: 서약 선언
type: special
description: |
  [전투 시작 시 자동] 신에게 서약합니다.
  3가지 서약 중 1가지 선택:
  
  1. 인내의 서약 (탱커)
     - 피격 시 신앙 +10
     - 아군 대신 피격 가능
     - 방어력 +20%
     - 금지: 공격 행동
  
  2. 순결의 서약 (딜러)
     - 정화/처치 시 신앙 +15
     - 공격력 +20%, 신성 피해 +15%
     - 금지: 버프/힐 행동
  
  3. 자비의 서약 (힐러)
     - 치유 시 신앙 +10
     - 힐 효과 +30%, 턴 MP +5
     - 금지: 공격 행동
target: self
costs:
  mp: 0
metadata:
  auto_battle_start: true
  choice_skill: true
  choices:
    - id: endurance
      name: 인내의 서약
    - id: purity
      name: 순결의 서약
    - id: mercy
      name: 자비의 서약
effects:
- type: custom
  handler: select_oath
animation:
  icon: "📜"
  color: [255, 215, 0]
