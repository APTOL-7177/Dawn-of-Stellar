id: hacker_teamwork
name: 분산 해킹 네트워크
type: teamwork
description: |
  [팀워크] 파티 전체가 해킹 네트워크에 연결됩니다.
  
  효과:
  1. 전체 적 침투 +40
  2. 아군 전체 2턴 버프:
     - 명중 +20%
     - 크리티컬 +15%
  3. 모든 적 "네트워크 노출" 디버프 2턴:
     - 받는 피해 +15%
