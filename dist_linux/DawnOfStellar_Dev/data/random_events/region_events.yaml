# 랜덤 이벤트 - 지역 이벤트
# Dawn of Stellar - 지역별 야외 랜덤 이벤트 정의
region_events:

  # ============================================================
  # 초원 지역 이벤트
  # ============================================================

  - id: "wild_horse"
    name: "야생마"
    category: "npc_rescue"
    region: "grassland"
    description: "상처 입은 야생마가 풀밭에 쓰러져 있다. 아름다운 은빛 갈기가 바람에 흩날린다."
    weight: 14
    cooldown_steps: 200
    once_only: false
    choices:
      - text: "마를 치료해준다"
        requirements: {}
        outcomes:
          - type: "heal"
            heal_percent: 20
            message: "말이 감사하다는 듯 코를 비볐다. 기분이 좋아졌다."
          - type: "buff"
            buff_id: "horse_blessing"
            duration: 40
            message: "야생마가 다음 전투까지 함께 달려줄 것이다."
      - text: "드루이드라면 동물과 교감한다"
        requirements:
          has_job: "druid"
        outcomes:
          - type: "reward"
            items: ["silver_horseshoe", "horse_companion_token"]
            exp: 200
            affinity_gain: 5
            message: "자연의 언어로 말과 대화했다. 말이 특별한 편자를 발굽에서 빼어 건넸다."
      - text: "말을 타고 달린다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "mounted_speed"
            duration: 20
            message: "야생마에 올라타 초원을 질주했다. 이동 속도가 빨라졌다."

  - id: "flower_field_fairy"
    name: "꽃밭의 요정"
    category: "story"
    region: "grassland"
    description: "색색의 꽃들이 피어있는 들판에서 작은 빛이 반짝인다. 요정이 꽃들 사이에서 춤을 추고 있다."
    weight: 10
    cooldown_steps: 300
    once_only: false
    choices:
      - text: "요정을 조용히 바라본다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "nature_harmony"
            duration: 50
            message: "요정이 알아채고 미소 지었다. 자연의 조화가 파티에게 깃들었다."
      - text: "요정에게 말을 건다"
        requirements: {}
        outcomes:
          - type: "reward"
            items: ["fairy_pollen", "bloom_charm"]
            exp: 150
            affinity_gain: 4
            message: "요정이 기뻐하며 특별한 꽃가루를 나눠주었다."
      - text: "요정을 잡으려 한다"
        requirements: {}
        outcomes:
          - type: "debuff"
            debuff_id: "nature_curse"
            duration: 10
            message: "꽃들이 모두 시들고 요정이 분노했다. 자연의 저주를 받았다."

  - id: "shepherd_request"
    name: "목동의 부탁"
    category: "npc_rescue"
    region: "grassland"
    description: "어린 목동이 울고 있다. '양들이 다 도망가 버렸어요! 늑대들이 쫓아왔나 봐요.'"
    weight: 12
    cooldown_steps: 220
    once_only: false
    choices:
      - text: "양들을 찾아준다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 150
            items: ["fresh_wool", "shepherd_pie"]
            affinity_gain: 4
            message: "양들을 전부 찾아 목동에게 돌려주었다. 목동이 수제 파이를 감사히 건넸다."
      - text: "늑대를 처치한다"
        requirements: {}
        outcomes:
          - type: "battle"
            enemy_id: "wild_wolf"
            enemy_level: 2
          - type: "reward"
            gold: 200
            items: ["wolf_pelt", "shepherd_gratitude"]
            affinity_gain: 5
            message: "늑대를 물리쳤다. 목동이 크게 기뻐하며 사례를 주었다."
      - text: "바쁘다고 거절한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -2
            message: "목동이 실망한 눈빛으로 쳐다보았다."

  # ============================================================
  # 숲 지역 이벤트
  # ============================================================

  - id: "giant_tree_spirit"
    name: "거대 나무 정령"
    category: "story"
    region: "forest"
    description: "수천 년은 되어 보이는 거대한 나무가 천천히 눈을 뜨더니 당신들을 바라본다."
    weight: 7
    cooldown_steps: 500
    once_only: true
    choices:
      - text: "정령에게 경의를 표한다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "ancient_tree_blessing"
            duration: 100
            exp: 500
            affinity_gain: 8
            message: "정령이 천천히 고개를 끄덕였다. 오래된 숲의 축복이 파티에게 내렸다."
      - text: "드루이드로서 숲의 언어로 말한다"
        requirements:
          has_job: "druid"
        outcomes:
          - type: "reward"
            items: ["ancient_bark", "heartwood_gem", "nature_tome"]
            exp: 800
            affinity_gain: 10
            message: "정령이 반가워하며 숲의 비밀을 공유했다. 고대의 나무껍질과 심목석을 선물했다."
      - text: "나무를 베려 한다"
        requirements: {}
        outcomes:
          - type: "battle"
            enemy_id: "ancient_treant"
            enemy_level: 10
          - type: "damage"
            damage_percent: 30
            message: "정령이 분노했다! 숲 전체가 적이 되었다."

  - id: "poisonous_mushroom_colony"
    name: "독버섯 군락"
    category: "trap"
    region: "forest"
    description: "화려한 색의 버섯들이 군락을 이루고 있다. 아름답지만 독성이 있을 것 같다."
    weight: 13
    cooldown_steps: 180
    once_only: false
    choices:
      - text: "조심스럽게 우회한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "버섯 군락을 안전하게 우회했다."
      - text: "연금술사라면 독을 추출한다"
        requirements:
          has_job: "alchemist"
        outcomes:
          - type: "reward"
            items: ["rare_poison_extract", "mushroom_spore"]
            exp: 200
            message: "독버섯에서 귀한 독을 추출했다. 약이 될 수도 독이 될 수도 있다."
      - text: "버섯을 채집한다"
        requirements: {}
        outcomes:
          - type: "reward"
            items: ["poisonous_mushroom"]
            message: "독버섯을 채집했다."
          - type: "debuff"
            debuff_id: "mild_poison"
            duration: 5
            message: "포자를 흡입해 가벼운 중독 상태가 되었다."
      - text: "먹어본다 (위험!)"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 25
            message: "독버섯을 먹자 온몸이 뒤틀렸다!"
          - type: "buff"
            buff_id: "toxic_resistance"
            duration: 60
            message: "...그러나 살아남았다. 독에 대한 저항이 생긴 것 같다."

  - id: "forest_trial"
    name: "숲의 시험"
    category: "story"
    region: "forest"
    description: "숲 한가운데 빛나는 제단이 있다. 목소리가 들린다. '이 숲을 통과하려면 시험을 통과해야 한다.'"
    weight: 9
    cooldown_steps: 400
    once_only: true
    choices:
      - text: "시험을 받아들인다"
        requirements: {}
        outcomes:
          - type: "battle"
            enemy_id: "forest_guardian"
            enemy_level: 5
          - type: "reward"
            exp: 600
            items: ["forest_pass", "guardian_essence"]
            message: "수호자를 이겨냈다. 숲의 정령이 통과를 허락하며 정수를 주었다."
      - text: "지혜로 시험에 답한다"
        requirements:
          has_job: "scholar"
        outcomes:
          - type: "reward"
            exp: 800
            items: ["wisdom_leaf", "forest_pass"]
            affinity_gain: 6
            message: "지혜의 말로 수호자를 납득시켰다. 싸움 없이 시험을 통과했다."
      - text: "시험을 거부하고 강행 돌파한다"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 20
            message: "숲이 방해했다. 가시덤불과 나무뿌리에 걸려 상처를 입었다."

  # ============================================================
  # 산악 지역 이벤트
  # ============================================================

  - id: "rockfall_danger"
    name: "낙석 위험"
    category: "trap"
    region: "mountain"
    description: "산 위에서 돌이 굴러떨어지기 시작한다. 산사태가 일어나고 있다!"
    weight: 15
    cooldown_steps: 150
    once_only: false
    choices:
      - text: "전속력으로 달린다"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 15
            message: "낙석 몇 개에 맞았지만 통과했다."
      - text: "방어막을 펼친다"
        requirements:
          has_job: "knight"
        outcomes:
          - type: "damage"
            damage_percent: 5
            message: "방패로 파티를 보호하며 낙석 지대를 통과했다."
      - text: "마법으로 낙석을 막는다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "neutral"
            exp: 100
            message: "마법으로 낙석들을 튕겨냈다. 무사히 통과했다."
      - text: "동굴을 찾아 피한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "근처 동굴에서 낙석이 멈출 때까지 기다렸다. 시간이 걸렸지만 안전했다."

  - id: "mountain_bandit_ambush"
    name: "산적 매복"
    category: "trap"
    region: "mountain"
    description: "산길 양쪽에서 산적들이 튀어나왔다. '통행료를 내시오!'"
    weight: 14
    cooldown_steps: 160
    once_only: false
    choices:
      - text: "싸운다"
        requirements: {}
        outcomes:
          - type: "battle"
            enemy_id: "mountain_bandit"
            enemy_level: 4
          - type: "reward"
            gold: 300
            items: ["bandit_loot"]
            message: "산적들을 물리쳤다. 그들이 모아둔 전리품을 가져왔다."
      - text: "통행료를 낸다"
        requirements:
          min_gold: 200
        outcomes:
          - type: "reward"
            gold: -200
            message: "통행료를 냈다. 번거롭지만 시간을 아꼈다."
      - text: "허세를 부려 겁을 준다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "강하게 위협하자 산적들이 주춤하다 도망쳤다."
          - type: "reward"
            exp: 100
            message: "싸우지 않고 이겨냈다."
      - text: "도적 기술로 그들의 방심을 노린다"
        requirements:
          has_job: "rogue"
        outcomes:
          - type: "reward"
            gold: 500
            items: ["stolen_treasure_map"]
            message: "산적 두목의 지갑을 털고 보물 지도까지 빼앗았다."

  - id: "hermit_cave"
    name: "은자의 동굴"
    category: "story"
    region: "mountain"
    description: "외딴 동굴 입구에 '방해하지 마시오'라는 팻말이 있다. 하지만 안에서 기침 소리가 들린다."
    weight: 8
    cooldown_steps: 350
    once_only: true
    choices:
      - text: "들어가서 노인을 돕는다"
        requirements: {}
        outcomes:
          - type: "reward"
            exp: 300
            items: ["hermit_wisdom_scroll", "mountain_herb"]
            affinity_gain: 6
            message: "은자 노인이 처음에는 화를 냈지만 도움을 받고 귀한 지식을 전해주었다."
      - text: "팻말을 존중하고 돌아간다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "respect_karma"
            duration: 30
            message: "팻말을 존중하고 돌아갔다. 왠지 좋은 일이 생길 것 같다."
      - text: "의사라면 병을 치료해준다"
        requirements:
          has_job: "priest"
        outcomes:
          - type: "reward"
            exp: 500
            items: ["ancient_technique_scroll", "rare_mountain_crystal"]
            affinity_gain: 8
            message: "노인의 병을 고쳐주었다. 노인은 수십 년간 갈고 닦은 비전 기술을 전수해주었다."

  # ============================================================
  # 사막 지역 이벤트
  # ============================================================

  - id: "mirage"
    name: "신기루"
    category: "trap"
    region: "desert"
    description: "저 멀리 오아시스가 보인다. 하지만 뭔가 이상하다. 신기루일 수도 있다."
    weight: 13
    cooldown_steps: 180
    once_only: false
    choices:
      - text: "오아시스를 향해 달려간다"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 10
            message: "오아시스가 사라졌다. 신기루였다. 헛걸음에 체력이 소진되었다."
      - text: "마법으로 진위를 확인한다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "neutral"
            message: "마법 감지로 신기루임을 확인했다. 소중한 체력을 아꼈다."
      - text: "경험으로 판단한다"
        requirements:
          min_level: 10
        outcomes:
          - type: "neutral"
            exp: 50
            message: "경험 덕분에 신기루를 바로 알아챘다."
      - text: "도전해서 가본다 (혹시 모르니)"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 100
            items: ["desert_pearl"]
            message: "신기루인 줄 알았는데 실제 오아시스 근처에서 사막 진주를 발견했다!"

  - id: "oasis_discovery"
    name: "오아시스 발견"
    category: "hidden_treasure"
    region: "desert"
    description: "진짜 오아시스를 발견했다! 맑은 물과 야자수가 있는 아름다운 오아시스다."
    weight: 8
    cooldown_steps: 300
    once_only: false
    choices:
      - text: "물을 마시고 쉰다"
        requirements: {}
        outcomes:
          - type: "heal"
            heal_percent: 40
            message: "오아시스의 맑은 물이 파티를 회복시켰다."
      - text: "오아시스를 탐색한다"
        requirements: {}
        outcomes:
          - type: "reward"
            items: ["oasis_water_flask", "desert_fruit"]
            message: "오아시스에서 물통을 채우고 과일을 수확했다."
      - text: "오아시스에서 오래 머문다"
        requirements: {}
        outcomes:
          - type: "heal"
            heal_percent: 100
            message: "충분한 휴식 후 완전히 회복되었다."
          - type: "reward"
            exp: 100
            message: "사막에서 살아남는 법을 몸으로 익혔다."

  - id: "sandstorm"
    name: "모래 폭풍"
    category: "trap"
    region: "desert"
    description: "지평선 너머로 거대한 모래 폭풍이 몰려오고 있다. 빠르게 결정해야 한다!"
    weight: 14
    cooldown_steps: 140
    once_only: false
    choices:
      - text: "천을 두르고 엎드려 버틴다"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 12
            message: "모래 폭풍이 지나갔다. 온몸이 모래투성이가 되었다."
      - text: "바위 뒤에 숨는다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "바위를 방패 삼아 폭풍을 막았다."
      - text: "바람 마법으로 맞선다"
        requirements:
          has_job: "elementalist"
        outcomes:
          - type: "reward"
            exp: 250
            items: ["wind_essence"]
            message: "바람 마법으로 폭풍을 분산시켰다. 원소 정수를 얻었다."
      - text: "시간 마법으로 멈춘다"
        requirements:
          has_job: "time_mage"
        outcomes:
          - type: "reward"
            exp: 400
            items: ["frozen_sand_crystal"]
            message: "폭풍을 일시 정지시켰다. 시간이 멈춘 모래 결정이 생성되었다."

  # ============================================================
  # 해안 지역 이벤트
  # ============================================================

  - id: "shipwreck_search"
    name: "난파선 탐색"
    category: "hidden_treasure"
    region: "coast"
    description: "해안에 오래된 난파선이 좌초해 있다. 화물이 남아있을 수도 있다."
    weight: 10
    cooldown_steps: 250
    once_only: false
    choices:
      - text: "난파선에 올라가 탐색한다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 400
            items: ["sailor_chest", "old_compass"]
            message: "난파선에서 금화와 낡은 나침반을 찾았다."
          - type: "damage"
            damage_percent: 8
            message: "낡은 갑판이 부서지며 발을 다쳤다."
      - text: "수영해서 선창에 들어간다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 800
            items: ["sunken_treasure", "pearl_necklace"]
            message: "선창 깊숙한 곳에서 보물 상자를 발견했다!"
      - text: "피해 간다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "위험해 보이는 난파선을 피해 지나쳤다."

  - id: "mermaid_song"
    name: "인어의 노래"
    category: "story"
    region: "coast"
    description: "바다에서 아름다운 노래가 들려온다. 바위 위에 앉은 인어가 노래하고 있다."
    weight: 7
    cooldown_steps: 400
    once_only: true
    choices:
      - text: "노래에 귀를 기울인다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "sea_blessing"
            duration: 60
            exp: 200
