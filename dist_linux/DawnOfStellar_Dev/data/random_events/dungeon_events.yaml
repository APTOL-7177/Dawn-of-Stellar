# 랜덤 이벤트 - 던전 이벤트
# Dawn of Stellar - 던전 내 랜덤 이벤트 정의
dungeon_events:

  # ============================================================
  # NPC 구출 / 조우 이벤트
  # ============================================================

  - id: "wounded_traveler"
    name: "부상당한 여행자"
    category: "npc_rescue"
    description: "길가에 쓰러진 여행자를 발견했다. 깊은 상처에서 피가 흐르고 있다."
    min_floor: 1
    max_floor: 15
    weight: 15
    cooldown_steps: 200
    once_only: false
    choices:
      - text: "치료해준다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 120
            items: ["healing_herb", "mana_potion_small"]
            affinity_gain: 3
            message: "여행자가 눈물을 글썽이며 감사 인사를 전한다. 가방에서 약초를 꺼내 건넨다."
      - text: "치료사가 있다면 치료를 맡긴다"
        requirements:
          has_job: "priest"
        outcomes:
          - type: "reward"
            gold: 300
            items: ["ancient_herb", "resurrection_stone"]
            exp: 80
            affinity_gain: 5
            message: "사제의 손길에 상처가 빠르게 아물었다. 여행자는 숨겨둔 귀중한 물건을 감사의 표시로 건넨다."
      - text: "무시하고 지나간다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -2
            message: "신음 소리가 등 뒤에서 멀어진다. 마음 한구석이 무거워진다."

  - id: "trapped_adventurer"
    name: "함정에 갇힌 모험가"
    category: "npc_rescue"
    description: "거대한 바위틈에 다리가 끼인 모험가를 발견했다. 혼자 힘으로는 빠져나올 수 없어 보인다."
    min_floor: 3
    max_floor: 20
    weight: 12
    cooldown_steps: 250
    once_only: false
    choices:
      - text: "힘을 합쳐 바위를 들어낸다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 200
            items: ["dungeon_map_fragment", "iron_key"]
            affinity_gain: 4
            message: "모험가가 자유로워졌다. 감사의 표시로 이 층의 지도 조각과 열쇠를 건넨다."
      - text: "마법으로 바위를 부순다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "reward"
            gold: 350
            items: ["spell_scroll_rare", "mana_crystal"]
            exp: 100
            affinity_gain: 5
            message: "마법사의 주문으로 바위가 산산조각 났다. 모험가는 비밀 스크롤을 사례로 건넨다."
      - text: "모른 척한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -3
            message: "절박한 외침이 점점 작아진다. 언젠가 그 목소리가 꿈에 나올지도 모른다."

  - id: "lost_child"
    name: "미아 아이"
    category: "npc_rescue"
    description: "어두운 던전 한가운데서 울고 있는 아이를 발견했다. 어떻게 여기까지 들어왔는지 알 수 없다."
    min_floor: 1
    max_floor: 10
    weight: 10
    cooldown_steps: 300
    once_only: true
    choices:
      - text: "출구로 안전하게 데려다 준다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 500
            items: ["lucky_charm", "child_drawing"]
            exp: 150
            affinity_gain: 8
            message: "아이의 부모가 눈물을 흘리며 감사한다. 아이는 작은 그림을 그려 선물로 준다. 왠지 행운이 깃들 것 같다."
      - text: "일단 안전한 곳에 숨겨두고 나중에 데리러 온다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: 2
            message: "아이를 안전한 곳에 숨겨두었다. 빨리 돌아와야 한다."
      - text: "혼자서도 나갈 수 있을 거라 달래고 떠난다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -5
            message: "아이의 울음소리가 오래도록 귓가에 맴돈다."

  - id: "poisoned_explorer"
    name: "독에 중독된 탐험가"
    category: "npc_rescue"
    description: "바닥에 쓰러진 탐험가가 독 증상으로 고통받고 있다. 피부가 검게 변해가고 있다."
    min_floor: 5
    max_floor: 25
    weight: 13
    cooldown_steps: 220
    once_only: false
    choices:
      - text: "해독제를 사용해 치료한다"
        requirements:
          has_item: "antidote"
        outcomes:
          - type: "reward"
            gold: 400
            items: ["rare_poison_vial", "explorer_notes"]
            exp: 120
            affinity_gain: 6
            message: "해독제가 독을 중화시켰다. 탐험가는 귀한 독약 샘플과 탐사 메모를 건넨다."
      - text: "연금술사라면 임시 해독제를 만들 수 있다"
        requirements:
          has_job: "alchemist"
        outcomes:
          - type: "reward"
            gold: 600
            items: ["master_antidote", "alchemist_formula"]
            exp: 200
            affinity_gain: 7
            message: "연금술사가 주변 재료로 강력한 해독제를 조합했다. 탐험가는 비밀 제조법을 알려준다."
      - text: "지켜보다가 떠난다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -4
            message: "탐험가의 떨리는 손이 뇌리에 박힌다."

  - id: "mind_controlled_adventurer"
    name: "정신 지배당한 모험가"
    category: "npc_rescue"
    description: "눈이 텅 빈 모험가가 마치 꼭두각시처럼 걸어온다. 어딘가의 마법에 지배당한 것이 분명하다."
    min_floor: 10
    max_floor: 30
    weight: 8
    cooldown_steps: 350
    once_only: false
    choices:
      - text: "마법을 해제하려 시도한다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "reward"
            gold: 500
            items: ["mind_ward_amulet", "enchanted_staff"]
            exp: 250
            affinity_gain: 8
            message: "복잡한 주문을 풀어내자 모험가가 의식을 되찾았다. 지니고 있던 마법 지팡이를 감사히 건넨다."
      - text: "전투로 제압하고 결박한다"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 10
            message: "모험가를 제압하는 과정에서 상처를 입었다. 그러나 결박에 성공했고, 정신이 돌아온 모험가는 감사 인사를 전했다."
      - text: "위험하니 피해서 지나간다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: 0
            message: "지배당한 모험가를 우회해 나아간다. 나중에 누군가가 도와주길 바란다."

  - id: "talking_cat"
    name: "말하는 고양이"
    category: "npc_rescue"
    description: "구석에서 야옹거리는 고양이가 갑자기 또렷한 목소리로 말을 걸었다. '이봐, 나 좀 도와줄 수 있어?'"
    min_floor: 2
    max_floor: 20
    weight: 7
    cooldown_steps: 400
    once_only: true
    choices:
      - text: "말하는 고양이라니, 도와준다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 0
            items: ["cat_whisker_charm", "fortune_cookie"]
            exp: 180
            affinity_gain: 10
            message: "고양이가 웃음기 담긴 목소리로 '잊지 않을게' 라며 사라졌다. 손안에 이상한 부적이 쥐어져 있다."
      - text: "환각이다. 무시한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -1
            message: "고양이는 실망한 듯 '다음엔 더 잘해줄게' 라고 중얼거리며 사라졌다."
      - text: "고양이를 파티에 데려간다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "cat_luck"
            duration: 30
            message: "고양이가 어깨에 올라탔다. 왠지 모르게 운이 좋아질 것 같다."

  - id: "injured_soldier"
    name: "부상당한 병사"
    category: "npc_rescue"
    description: "왕국 문장이 새겨진 갑옷을 입은 병사가 벽에 기대어 있다. 전투에서 크게 다친 것 같다."
    min_floor: 5
    max_floor: 20
    weight: 11
    cooldown_steps: 280
    once_only: false
    choices:
      - text: "응급 처치를 한다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 250
            items: ["royal_medal", "soldier_ration"]
            affinity_gain: 5
            message: "병사가 왕국의 은혜에 보답할 것을 맹세하며 군용 식량을 건넨다."
      - text: "기사라면 전우를 돕는다"
        requirements:
          has_job: "knight"
        outcomes:
          - type: "reward"
            gold: 500
            items: ["knight_badge", "enchanted_shield"]
            exp: 150
            affinity_gain: 7
            message: "기사의 도움에 병사는 눈물을 흘린다. 대를 이어 전해온 방패를 기꺼이 양도한다."
      - text: "지나간다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -2
            message: "병사의 힘겨운 숨소리가 귓가에 남는다."

  - id: "merchant_chased_by_bandits"
    name: "도적에게 쫓기는 상인"
    category: "npc_rescue"
    description: "상인이 숨을 헐떡이며 달려온다. '제발 도와주세요! 도적들이 쫓아옵니다!'"
    min_floor: 2
    max_floor: 15
    weight: 14
    cooldown_steps: 180
    once_only: false
    choices:
      - text: "도적을 상대한다"
        requirements: {}
        outcomes:
          - type: "battle"
            enemy_id: "dungeon_bandit"
            enemy_level: 3
          - type: "reward"
            gold: 400
            items: ["merchant_gratitude_box"]
            affinity_gain: 6
            message: "도적들을 물리쳤다. 상인은 감사의 표시로 특별한 상자를 건넨다."
      - text: "상인에게 숨을 곳을 알려주고 도적을 유인한다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 300
            items: ["trade_voucher"]
            affinity_gain: 4
            message: "상인을 안전하게 피신시켰다. 나중에 이 지역 상점에서 쓸 수 있는 바우처를 받았다."
      - text: "상관없는 일이다"
        requirements: {}
        outcomes:
          - type: "neutral"
            affinity_gain: -3
            message: "상인의 비명이 던전 안에 울려 퍼진다."

  # ============================================================
  # 숨겨진 보물 이벤트
  # ============================================================

  - id: "ancient_chest"
    name: "고대의 상자"
    category: "hidden_treasure"
    description: "이끼 낀 오래된 상자가 구석에 놓여있다. 자물쇠는 녹슬었지만 단단해 보인다."
    min_floor: 1
    max_floor: 30
    weight: 14
    cooldown_steps: 150
    once_only: false
    choices:
      - text: "자물쇠를 부수고 연다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 300
            items: ["ancient_coin", "dust_relic"]
            message: "먼지 쌓인 유물이 나왔다. 가치가 있을 것 같다."
      - text: "도둑처럼 자물쇠를 푼다"
        requirements:
          has_job: "rogue"
        outcomes:
          - type: "reward"
            gold: 600
            items: ["legendary_gem", "stealth_boots"]
            exp: 200
            message: "자물쇠를 소리 없이 풀었다. 안에는 보석과 그림자처럼 가벼운 장화가 들어있었다."
      - text: "마법으로 안을 들여다본다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "reward"
            gold: 450
            items: ["magic_tome_fragment", "mana_crystal"]
            message: "마법으로 안을 살핀 후 조심히 열었다. 마법 서적 일부와 수정이 들어있었다."
      - text: "그냥 지나친다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "상자를 그냥 지나쳤다. 무엇이 있었는지 궁금하다."

  - id: "wall_crack_glow"
    name: "벽 틈의 빛"
    category: "hidden_treasure"
    description: "벽 틈 사이로 희미한 빛이 새어 나온다. 무언가가 안에 있는 것 같다."
    min_floor: 3
    max_floor: 25
    weight: 12
    cooldown_steps: 200
    once_only: false
    choices:
      - text: "손을 넣어 꺼낸다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 200
            items: ["glowing_crystal"]
            message: "빛나는 수정을 꺼냈다. 온기가 느껴진다."
          - type: "damage"
            damage_percent: 5
            message: "손에 날카로운 돌부리가 긁혔다."
      - text: "벽을 무너뜨린다"
        requirements:
          has_job: "warrior"
        outcomes:
          - type: "reward"
            gold: 500
            items: ["hidden_vault_key", "war_relic"]
            message: "벽이 무너지며 숨겨진 보물 창고가 드러났다."
      - text: "지나간다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "빛이 점점 희미해진다. 지금쯤이면 사라졌을 것이다."

  - id: "floor_crack"
    name: "바닥의 균열"
    category: "hidden_treasure"
    description: "바닥에 독특한 문양의 균열이 있다. 아래에 무언가 있는 것 같은 느낌이 든다."
    min_floor: 2
    max_floor: 20
    weight: 11
    cooldown_steps: 180
    once_only: false
    choices:
      - text: "균열을 파헤친다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 150
            items: ["buried_coin_pouch"]
            message: "오래된 동전 주머니를 꺼냈다."
      - text: "마법으로 감지한다"
        requirements:
          has_job: "mage"
        outcomes:
          - type: "reward"
            gold: 800
            items: ["ley_stone", "ancient_map"]
            exp: 180
            message: "마법 감지로 지맥석과 고대 지도를 찾아냈다."
      - text: "균열이 넓어진다 (점프)"
        requirements: {}
        outcomes:
          - type: "damage"
            damage_percent: 15
            message: "균열이 갑자기 넓어지며 아래로 추락했다! 다행히 아래 층과 이어져 있었다."

  - id: "suspicious_statue"
    name: "수상한 석상"
    category: "hidden_treasure"
    description: "복도 한가운데 놓인 석상이 손에 무언가를 쥐고 있는 것 같다."
    min_floor: 4
    max_floor: 25
    weight: 10
    cooldown_steps: 220
    once_only: false
    choices:
      - text: "손에서 물건을 빼앗는다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 400
            items: ["stone_idol"]
            message: "석상 손에서 석상을 뽑아냈다."
          - type: "damage"
            damage_percent: 20
            message: "석상의 눈이 빨갛게 빛나며 독화살이 날아왔다!"
      - text: "석상에 공물을 바친다"
        requirements:
          min_gold: 100
        outcomes:
          - type: "reward"
            gold: -100
            items: ["divine_blessing_scroll", "ancient_artifact"]
            exp: 300
            message: "석상이 황금빛으로 빛나며 신성한 두루마리를 내려주었다."
      - text: "석상을 관찰만 한다"
        requirements: {}
        outcomes:
          - type: "neutral"
            message: "석상은 그저 석상이었다. 혹은 그렇게 보였다."

  - id: "fairy_gift"
    name: "요정의 선물"
    category: "hidden_treasure"
    description: "작은 빛이 반짝이며 작은 상자를 남기고 사라졌다. 요정이 두고 간 것이 분명하다."
    min_floor: 1
    max_floor: 15
    weight: 8
    cooldown_steps: 400
    once_only: false
    choices:
      - text: "상자를 열어본다"
        requirements: {}
        outcomes:
          - type: "heal"
            heal_percent: 30
            message: "상자 안에서 향기로운 빛이 쏟아졌다. 상처가 아물고 기운이 회복되었다."
          - type: "reward"
            items: ["fairy_dust", "lucky_clover"]
            message: "요정의 가루와 네잎 클로버가 나왔다."
      - text: "요정에게 선물을 돌려주려 한다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "fairy_blessing"
            duration: 50
            message: "요정이 다시 나타나 감동한 듯 파티 전체에 축복을 내려주었다."

  - id: "ghost_merchant_relic"
    name: "유령 상인의 유품"
    category: "hidden_treasure"
    description: "이 던전에서 죽은 상인의 영혼이 자신의 유품을 남겨두고 떠났다. '가져가세요... 어차피 나는 이제 필요 없으니...'"
    min_floor: 8
    max_floor: 30
    weight: 7
    cooldown_steps: 350
    once_only: true
    choices:
      - text: "유품을 정중히 받는다"
        requirements: {}
        outcomes:
          - type: "reward"
            gold: 700
            items: ["merchant_ledger", "ghost_coin", "trade_ring"]
            exp: 200
            affinity_gain: 5
            message: "유령 상인이 감사히 사라졌다. 그의 물건들이 손안에 남았다."
      - text: "유품을 묻어주고 떠난다"
        requirements: {}
        outcomes:
          - type: "buff"
            buff_id: "spirit_blessing"
            duration: 60
            exp: 300
