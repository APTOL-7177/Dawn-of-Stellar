gimmick:
  type: venom_system
  name: 맹독 시스템
  description: '[맹독 시스템] 치명적인 독과 압도적 속도로 적을 지배하라!


    ■ 독 중첩 (적 단위, 0~5)

    공격/스킬로 독 중첩 축적.

    매 턴 중첩당 물공 8% HP DoT.


    ■ 독 단계

    2중첩 "맹독": 회복량 -50%

    4중첩 "치명독": 받는 피해 +25%, 속도 -20%

    5중첩 "사독": 즉사 확률 10% (보스 면역)


    ■ 속도 연계

    속도 차이에 비례해 독 피해 증가 (최대 +50%)

    회피 성공 시: ATB +15%, 다음 독 중첩 +1

    '
  max_venom: 5
  venom_dot_per_stack: 0.08
  speed_scaling: true
  venom_effects:
    2:
      name: 맹독
      heal_reduction: 0.5
    4:
      name: 치명독
      damage_taken_bonus: 0.25
      speed_reduction: 0.2
    5:
      name: 사독
      instant_kill_chance: 0.10
      boss_immune: true
  evasion_chain:
    atb_bonus: 0.15
    extra_venom: 1
traits:
- id: venom_master
  name: 맹독술사
  description: 독 피해 +30%, 독 중첩 시 추가 +1
  type: passive
