# 차원의 잔향 - 숨겨진 콘텐츠 데이터
# 세피로스의 10,000번 반복된 후회가 만들어낸 차원 속 비밀들

hidden_content:

  # ============================================================
  # 비밀 보스
  # ============================================================
  secret_bosses:

    - id: "boss_timeline_knight"
      name: "시간의 기사 아르카이나"
      title: "모든 루프를 기억하는 자"
      region: "war_lands"
      location: "벨포트 북쪽 폐허, '붉은 기억의 탑' 최상층. 탑 입구의 깨진 방패 세 개를 올바른 순서(왕국 문장 → 용병단 마크 → 빈 방패)로 맞춰야 열림"
      discovery_condition: |
        전투 회수가 10,000회를 초과한 상태에서 벨포트 무기상에게
        '오래된 기사의 이야기'를 세 번 연속 말을 걸면 상인이
        '붉은 기억의 탑' 위치를 알려주는 낡은 지도를 건넨다.
        지도를 소지한 채 탑 앞에 서면 입구가 나타남.
      level_req: 55
      lore: |
        아르카이나는 원래 이 차원이 생성되기 이전 세피로스의 1번째 루프에 존재했던
        기사였다. 그는 어떤 이유에서인지 루프가 반복될 때마다 기억을 유지했고,
        10,000번의 반복을 모두 목격했다. 처음에는 세피로스를 돕기 위해 싸웠지만,
        수천 번의 죽음과 재탄생, 그리고 결코 변하지 않는 비극을 목격하며
        점차 이성을 잃어갔다. 지금의 그는 '정해진 결말'을 믿으며,
        크리스와 릴리가 이 루프를 깨려는 것을 막으려 한다.
        그의 갑옷 안에는 수천 개의 루프에서 죽은 동료들의 이름이 새겨져 있다.
      pre_battle_dialogue:
        - speaker: "아르카이나"
          text: "또 왔군. 이번이 몇 번째인지 알고 있나? 나는 알지. 나는 언제나 알고 있어."
        - speaker: "크리스"
          text: "...당신은 우리를 아는 것처럼 말하는군요."
        - speaker: "아르카이나"
          text: "알지. 너희 둘을 1번째 루프부터 지켜봤으니까. 크리스, 너는 항상 같은 선택을 해. 릴리를 위해서라면 뭐든지. 하지만..."
        - speaker: "아르카이나"
          text: "그 선택이 결국 그녀를 죽이지. 10,000번 모두. 예외 없이."
        - speaker: "릴리"
          text: "그건... 거짓말이에요."
        - speaker: "아르카이나"
          text: "거짓말이길 바라겠지. 나도 처음엔 그랬어. 하지만 이제 나는 모든 것을 알고, 그래서 미쳐버렸다. 너희도 알게 되면 이해할 거야. 멈추는 것이 자비라는 걸."
      post_battle_dialogue:
        - speaker: "아르카이나"
          text: "...하, 역시. 이 루프에서도 내가 지는군. 1번 루프와 똑같아."
        - speaker: "크리스"
          text: "당신이 본 10,000번의 루프... 한 번이라도 우리가 성공한 적이 있었나요?"
        - speaker: "아르카이나"
          text: "...있었지. 딱 한 번. 하지만 그 루프에서 너는 릴리 대신 이 차원을 선택했어. 그래서 그 루프가 현재의 차원이 됐지. 그 루프의 너는... 크리스가 아니라 세피로스야."
        - speaker: "아르카이나"
          text: "이해했나? 너희가 성공하면... 다음 세피로스는 크리스가 되는 거야."
      rewards:
        - type: "item"
          name: "만루프의 갑옷 파편"
          description: "모든 루프를 기억한 기사의 갑옷 조각. 장착 시 '기억의 무게'로 받는 피해 10% 감소"
        - type: "item"
          name: "아르카이나의 기록"
          description: "1번 루프부터 현재까지의 사건을 담은 기록. 히든 스토리 해금"
        - type: "title"
          name: "루프의 증인"
          description: "10,000번의 루프를 기억하는 자를 꺾은 자"
        - type: "lore_fragment"
          id: "lore_fragment_01"

    - id: "boss_corrupted_echo"
      name: "타락한 메아리 릴리아나"
      title: "실패한 루프의 유령"
      region: "abyss_cavern"
      location: "'딥홈' 지하 3층, '메아리의 방'. 릴리의 테마 음악이 흘러나오는 방향으로 계속 이동하면 도달 가능. 지도에 표시되지 않음"
      discovery_condition: |
        릴리와 파티를 이루고 있는 상태에서 딥홈 지하 3층을 탐색 중
        릴리가 "이상해... 어디서 내 목소리가 들리는 것 같아"라고 말하는 순간
        (랜덤 이벤트, 확률 30%)이 발생하면 추적 가능해짐.
        릴리 없이는 해당 방에 진입 불가.
      level_req: 60
      lore: |
        릴리아나는 3,847번째 루프의 릴리다. 그 루프에서 크리스는 최종 결전 직전
        카인에게 살해당했고, 혼자 남은 릴리는 세피로스에게 애원했다.
        "루프를 되돌려 달라"고. 세피로스는 그 소원을 들어줬지만,
        루프를 되돌리는 과정에서 릴리의 '메아리(echo)' - 그녀의 감정과 기억의 잔재 -
        가 차원의 심층에 남아버렸다. 수천 번의 루프를 혼자 지켜본 그 메아리는
        점차 절망으로 뒤틀렸고, 이제 현재의 릴리를 질투하며 증오한다.
        "나도 크리스와 함께하고 싶었을 뿐인데"라고 중얼거리며.
      pre_battle_dialogue:
        - speaker: "릴리아나"
          text: "...왔구나. 나를 찾아올 줄 알았어."
        - speaker: "릴리"
          text: "당신은... 나인가요? 하지만 어떻게..."
        - speaker: "릴리아나"
          text: "나는 네가 버린 감정이야. 3,847번째 루프의 너. 크리스 없이 혼자 남겨졌을 때의 너."
        - speaker: "크리스"
          text: "릴리..."
        - speaker: "릴리아나"
          text: "(크리스를 향해) 그 눈빛. 수천 번을 봐도 익숙해지지 않는군. 나를 그렇게 봐줬다면 좋았을 텐데. 아, 물론 그 루프에서 넌 죽었지만."
        - speaker: "릴리아나"
          text: "이 루프도 어차피 같은 결말이야. 네가 죽고, 나는 혼자 남겨지겠지. 그러니까... 차라리 내가 현재의 릴리가 되는 게 낫지 않을까?"
      post_battle_dialogue:
        - speaker: "릴리아나"
          text: "...역시 나는 이길 수 없구나. 어느 루프에서도."
        - speaker: "릴리"
          text: "당신은... 나예요. 그러니까 알잖아요. 크리스는 항상 돌아와요."
        - speaker: "릴리아나"
          text: "3,847번째 루프에서는 돌아오지 않았어."
        - speaker: "크리스"
          text: "미안해요. 그 루프에서."
        - speaker: "릴리아나"
          text: "...사과를 받을 줄은 몰랐네. 이상하다. 이렇게 말해주는 크리스는 처음이야."
        - speaker: "릴리아나"
          text: "릴리. 하나만 부탁해. 이 루프에서는... 행복하게 끝내줘. 내가 기다리고 있을게."
      rewards:
        - type: "item"
          name: "잃어버린 메아리의 결정"
          description: "타락한 메아리가 남긴 수정. 릴리의 특수 스킬 '메아리의 공명' 해금"
        - type: "item"
          name: "3847번째 루프의 일기"
          description: "그 루프의 릴리가 쓴 일기. 읽으면 영구적으로 릴리의 공격력 +5%"
        - type: "lore_fragment"
          id: "lore_fragment_02"

    - id: "boss_time_paradox"
      name: "파라독스 원점"
      title: "인과의 균열"
      region: "twilight_desert"
      location: "'미라지' 동쪽 사막 중앙, '신기루의 탑'. 탑은 매일 정오에만 실체화되며 다른 시간에는 신기루로 보임"
      discovery_condition: |
        미라지 마을 점쟁이 노파에게 '과거', '현재', '미래'를 각각 세 번씩
        주제로 대화하면 (총 9번의 특정 대화 선택) 노파가 "균열이 보이는군"이라며
        탑이 나타나는 시간을 알려줌. 게임 내 시간 정오 (오전 11:50 ~ 오후 12:10)에만 입장 가능.
      level_req: 65
      lore: |
        세피로스가 루프를 반복하면서 발생한 시간의 모순들이 한 점에 집약되어
        의지를 가진 존재가 됐다. 파라독스 원점은 특정 존재가 아니라
        '존재해서는 안 되는 모든 것의 합'이다. 1번 루프에서 일어났지만
        2번 루프에서는 일어나지 않은 사건들, 살았어야 했지만 죽은 자들,
        죽었어야 했지만 살아남은 자들의 인과가 뒤엉킨 존재.
        이 존재를 쓰러뜨리면 차원의 근본적인 인과가 일시적으로 안정되지만,
        그것이 진정한 해결인지는 아무도 모른다.
      pre_battle_dialogue:
        - speaker: "파라독스 원점"
          text: "존재(存在)... 비존재(非存在)... 어느 것이... 진실인가..."
        - speaker: "크리스"
          text: "당신은... 무엇인가요?"
        - speaker: "파라독스 원점"
          text: "나는... 10,000번의 모순. 일어났지만... 일어나지 않은 것. 존재했지만... 존재하지 않는 것."
        - speaker: "릴리"
          text: "저 목소리들... 들려요. 수많은 사람들의 목소리가..."
        - speaker: "파라독스 원점"
          text: "맞다... 릴리. 너도 그 목소리 중 하나야. 3,847번의 릴리, 9,213번의 릴리, 모두 나의 일부..."
        - speaker: "파라독스 원점"
          text: "너희가 나를 쓰러뜨려도... 모순은 사라지지 않는다. 단지... 잠시 침묵할 뿐."
      post_battle_dialogue:
        - speaker: "파라독스 원점"
          text: "감사... 한다. 잠시나마... 쉴 수 있겠군."
        - speaker: "크리스"
          text: "당신은... 사라지나요?"
        - speaker: "파라독스 원점"
          text: "사라지지 않는다. 단지... 잠든다. 루프가 끝나지 않는 한... 나는 언제나 여기 있을 것이다."
        - speaker: "파라독스 원점"
          text: "크리스... 하나 알려주겠다. 세피로스가 두려워하는 것은... 루프가 끝나는 것이 아니야. 루프가 끝난 후... 무엇이 남는지를 두려워하고 있어."
      rewards:
        - type: "item"
          name: "인과의 파편"
          description: "시간의 모순이 결정화된 파편. 스킬 쿨타임 20% 감소"
        - type: "item"
          name: "모순의 핵"
          description: "파라독스 원점의 핵심. 최강 장비 '무한의 갑옷' 제작 재료"
        - type: "lore_fragment"
          id: "lore_fragment_03"

    - id: "boss_shadow_sephiroth"
      name: "절망의 그림자"
      title: "세피로스의 이면"
      region: "eternal_glacier"
      location: "'프로스트헤이븐' 북쪽 빙하 끝, '얼어붙은 거울 호수' 한가운데. 호수 위를 걸어가면 갑자기 거울 속으로 빠져들어 전투 발생"
      discovery_condition: |
        메인 스토리에서 세피로스와 첫 대화 이후, 프로스트헤이븐의 음유시인에게서
        '거울 호수의 전설'을 들어야 함. 이후 호수에서 세피로스와 관련된
        아이템 '잔향의 구슬'(미라지 유물상 구매 가능)을 물에 던지면
        거울 세계로 진입하며 보스 조우.
      level_req: 70
      lore: |
        세피로스가 10,000번의 루프를 반복하면서 버린 모든 절망, 후회, 자기혐오가
        응결되어 만들어진 존재. 세피로스 자신도 이 존재의 존재를 모른다.
        절망의 그림자는 세피로스가 될 수 있었지만 되지 못한 '포기한 세피로스'이며,
        "이 차원은 의미 없다, 루프를 멈추고 모든 것을 소멸시켜야 한다"는
        극단적인 신념을 가지고 있다. 그는 크리스를 막으려는 것이 아니라
        오히려 세피로스를 죽이길 바라며, 그것이 이 모든 고통을 끝내는
        유일한 방법이라고 믿는다.
      pre_battle_dialogue:
        - speaker: "절망의 그림자"
          text: "이 호수에 오는 자는 드물지. 특히 세피로스의 냄새를 풍기는 자는."
        - speaker: "크리스"
          text: "당신은... 세피로스인가요? 하지만 분위기가..."
        - speaker: "절망의 그림자"
          text: "나는 세피로스의 그림자야. 그가 버린 모든 '포기'의 집합. 그는 10,000번을 반복하면서도 희망을 놓지 않았지. 나는 그가 버린 절망들이야."
        - speaker: "릴리"
          text: "세피로스가... 이렇게 많이 절망했던 건가요..."
        - speaker: "절망의 그림자"
          text: "당연하지. 그가 희망을 유지하려면 절망을 버려야 했으니까. 그 버려진 절망들이 모여 나가 됐어. 그런데 크리스, 너에게 부탁이 있어."
        - speaker: "절망의 그림자"
          text: "세피로스를 죽여줘. 제발. 그것만이 우리 모두를 해방시키는 길이야."
      post_battle_dialogue:
        - speaker: "절망의 그림자"
          text: "강하군... 하지만 나는 사라지지 않아. 세피로스가 살아있는 한."
        - speaker: "크리스"
          text: "당신의 부탁은 들어줄 수 없어요. 세피로스를 죽이는 게 답이라고 생각하지 않아요."
        - speaker: "절망의 그림자"
          text: "...그래. 어느 루프에서도 크리스는 그렇게 말하더군. 그래서 루프가 끝나지 않는 거야."
        - speaker: "절망의 그림자"
          text: "하지만... 이번 루프는 뭔가 다른 느낌이 드는군. 네가 선택한 방법이 세피로스에게 닿을 수도 있겠어. 그렇다면... 내가 틀렸을지도 모르지."
      rewards:
        - type: "item"
          name: "절망의 결정체"
          description: "버려진 절망이 결정화된 보석. 세피로스 관련 스토리 이벤트 추가 해금"
        - type: "skill"
          name: "그림자 메아리"
          description: "세피로스의 절망에서 배운 스킬. 적의 절망을 이용해 공격"
        - type: "lore_fragment"
          id: "lore_fragment_04"

    - id: "boss_cain_true"
      name: "카인 알베르트 진실"
      title: "선택받지 못한 주인공"
      region: "storm_plateau"
      location: "'스카이홀드' 폐탑 최상층. 메인 스토리의 카인과 다른 별개의 존재. 폐탑 내부의 일기 조각 5개를 모두 수집한 후 탑 꼭대기에 오르면 조우"
      discovery_condition: |
        스카이홀드 폐탑 내 숨겨진 방 5곳의 일기 조각 수집 필요.
        각 방은 특정 조건(1층: 번개 스킬 사용, 2층: 혼자 입장,
        3층: 야간 방문, 4층: 카인과 대화 후 방문, 5층: 아이템 '낡은 열쇠' 사용)으로 열림.
        모든 조각 수집 후 탑 꼭대기의 초상화 앞에서 '카인의 일기'를 읽으면 시작.
      level_req: 58
      lore: |
        이 존재는 5,500번째 루프의 카인이다. 그 루프에서 카인은 크리스의 친구였고,
        함께 세피로스와 싸우려 했다. 하지만 그 루프에서 세피로스는
        "이 루프는 실패다"라고 판단하고 리셋을 결정했다.
        카인은 자신의 의지와 관계없이 존재가 소멸되는 것에 저항했고,
        그 저항의 기억이 차원 어딘가에 남아 물질화됐다.
        그는 현재 루프의 카인(악당)과 달리 복잡한 감정을 가지고 있으며,
        크리스를 만나면 "왜 이 루프의 나는 악당이 됐는가"를 묻는다.
      pre_battle_dialogue:
        - speaker: "카인(진실)"
          text: "크리스. 오래 기다렸어."
        - speaker: "크리스"
          text: "당신은... 카인? 하지만 우리 카인과는 달라요."
        - speaker: "카인(진실)"
          text: "5,500번째 루프의 카인이야. 그 루프에서 나는 네 친구였어. 함께 싸우려 했지."
        - speaker: "릴리"
          text: "그럼 왜... 지금 이 루프의 카인은..."
        - speaker: "카인(진실)"
          text: "모르겠어. 루프가 달라지면 같은 사람도 달라지나 봐. 하지만 크리스, 한 가지 물어봐도 될까? 이 루프의 카인... 그는 왜 악당이 된 거야? 원래 카인은 그런 사람이 아닌데."
        - speaker: "카인(진실)"
          text: "내가 아는 카인은 정의를 위해 싸우는 사람이었어. 그 사람이 어떻게..."
        - speaker: "카인(진실)"
          text: "됐어. 네가 답을 알기 위해서는 먼저 나를 이겨야 해. 그것이 규칙이야. 이 차원의 규칙."
      post_battle_dialogue:
        - speaker: "카인(진실)"
          text: "역시... 5,500번째 루프에서도 넌 강했지."
        - speaker: "크리스"
          text: "이 루프의 카인이 악당이 된 이유... 알 수 있을까요?"
        - speaker: "카인(진실)"
          text: "세피로스에게 물어봐. 카인이 어느 루프에서 처음으로 악당이 됐는지. 아마... 세피로스가 그렇게 설정한 루프가 있을 거야. 그 이후로 카인의 역할이 바뀐 거야."
        - speaker: "카인(진실)"
          text: "크리스. 부탁이야. 이 루프의 카인을... 구해줘. 그가 원래 어떤 사람인지 알 수 있게."
      rewards:
        - type: "item"
          name: "5500번째 루프의 기억"
          description: "친구로서의 카인의 기억. 카인 관련 히든 엔딩 루트 해금"
        - type: "item"
          name: "진실의 배지"
          description: "5,500번째 루프의 카인이 가지고 있던 친구의 배지"
        - type: "lore_fragment"
          id: "lore_fragment_05"

    - id: "boss_echo_of_origin"
      name: "원점의 메아리 - 세피로스 이전"
      title: "10001번째 가능성"
      region: "starlight_throne"
      location: "'아스트라' 최상층 '별의 제단'. 7개의 로어 파편을 모두 모은 후 제단에 배치하면 소환"
      discovery_condition: |
        5개의 비밀 보스 처치 + 2개의 히든 에어리어 로어 파편 획득으로
        총 7개의 로어 파편을 완성. 아스트라 최상층의 별의 제단에 7개의 파편을
        별자리 모양(북두칠성 형태)으로 배치하면 보스 소환.
        단, 메인 스토리 최종장에 도달한 상태여야 함.
      level_req: 80
      lore: |
        이 존재는 세피로스가 되기 전, 최초로 이 차원을 꿈꿨던 자의 메아리다.
        세피로스가 10,000번의 루프를 반복하기 전, 그가 처음으로 이상향을 그렸을 때의
        순수한 의지가 결정화됐다. 원점의 메아리는 적이 아니라 심판자다.
        "너희가 이 차원을 끝낼 자격이 있는가"를 시험하기 위해 싸운다.
        이 보스를 쓰러뜨리면 진정한 진실이 밝혀진다:
        세피로스가 10,001번째 루프로 넘기려 했던 것은 단순한 후회가 아니라,
        처음으로 "자신 외의 누군가"가 이 세계를 구원해주길 바랐던 소망이었다는 것.
      pre_battle_dialogue:
        - speaker: "원점의 메아리"
          text: "왔군. 7개의 파편을 모은 자들이여."
        - speaker: "크리스"
          text: "당신은... 세피로스인가요? 하지만 분위기가 완전히 달라요."
        - speaker: "원점의 메아리"
          text: "나는 세피로스가 되기 전의 꿈이야. 그가 처음으로 이 차원을 상상했을 때의 의지. 순수한 형태로."
        - speaker: "릴리"
          text: "그러면 당신이 이 모든 것의 시작인가요? 세피로스가 10,000번을 반복한 이유..."
        - speaker: "원점의 메아리"
          text: "그래. 그리고 나는 심판자야. 너희가 이 차원과 세피로스의 이야기를 끝낼 자격이 있는지 시험할 것이다."
        - speaker: "원점의 메아리"
          text: "세피로스가 10,001번째로 넘기려 한 것은... 그 진실을 받아들일 준비가 됐나?"
      post_battle_dialogue:
        - speaker: "원점의 메아리"
          text: "...합격이다. 크리스. 릴리. 너희는 자격이 있어."
        - speaker: "크리스"
          text: "세피로스가 10,001번째 루프에서 원한 것이 무엇인가요?"
        - speaker: "원점의 메아리"
          text: "그는... 처음으로 '구원'을 원했어. 자신이 구원하는 것이 아니라, 자신이 구원받는 것을. 10,000번을 반복하면서 그는 지쳐버렸거든. 그래서 이 루프에서... 크리스, 너를 만들었어."
        - speaker: "릴리"
          text: "...크리스를 위해서가 아니라, 세피로스 자신을 위해서?"
        - speaker: "원점의 메아리"
          text: "그래. 세피로스는 자신을 구원해줄 누군가를 원했어. 그것이 10,001번째 루프, 즉 이 루프야. 그러니 크리스... 세피로스를 구원해줘. 그것이 이 차원의 진정한 결말이야."
      rewards:
        - type: "item"
          name: "원점의 별빛"
          description: "이 차원이 시작된 최초의 빛. 진정한 최강 무기 제작 가능"
        - type: "unlock"
          name: "진정한 엔딩 해금"
          description: "세피로스를 구원하는 진정한 최종 엔딩 루트 개방"
        - type: "title"
          name: "차원의 구원자"
          description: "10,001번째 루프를 완성할 자격을 인정받음"

  # ============================================================
  # 숨겨진 지역
  # ============================================================
  hidden_areas:

    - id: "area_forgotten_forest_sanctuary"
      name: "시간이 멈춘 꽃의 성소"
      region: "forgotten_forest"
      discovery_method: |
        실바나 마을 할머니에게 '잊혀진 숲의 전설'을 들은 후,
        숲 중심부에서 파란 나비 세 마리를 따라가면 발견.
        나비는 비 오는 날 오후에만 나타남.
      description: |
        숲의 가장 깊은 곳에 위치한 작은 공터. 이곳은 세피로스가 처음으로
        루프를 시작했던 순간이 시간적으로 결정화된 장소다.
        꽃들이 만발해 있지만 바람에 흔들리지 않고, 빗소리도 들리지 않으며,
        오직 부드러운 빛만이 가득하다. 장소 안에서는 시간이 흐르지 않는다.
      contents:
        - type: "npc"
          name: "시간의 요정 피아"
          description: "꽃들을 돌보고 있는 작은 요정. 루프에 대한 힌트를 줌"
        - type: "item"
          name: "시간결정화된 꽃"
          description: "시간이 멈춘 공간에서만 존재하는 꽃. 강력한 포션 재료"
        - type: "puzzle"
          name: "꽃의 배열 퍼즐"
          description: "꽃을 올바른 색 순서로 배치하면 숨겨진 상자가 나타남"
        - type: "lore_fragment"
          id: "lore_fragment_06"
      lore_text: |
        [낡은 나무 표지판]
        "이곳에서 모든 것이 시작됐다. 한 인간이 처음으로 이 차원을 꿈꿨던 순간,
        그 기억이 이 공간을 만들었다. 꽃들은 그때의 희망이고,
        멈춘 시간은 그때의 두려움이다.
        이 장소를 발견한 자여, 그에게 전해다오:
        '처음의 꿈은 아직 여기 있다'고."

    - id: "area_twilight_desert_library"
      name: "사막 아래의 연대기 도서관"
      region: "twilight_desert"
      discovery_method: |
        미라지 마을 도서관의 사서에게 '금지된 책'에 대해 다섯 번 묻고,
        사서가 "그런 책은 없습니다"라고 다섯 번 대답한 후,
        도서관 북쪽 벽의 다섯 번째 책장에서 책 순서를 바꾸면
        비밀 계단이 나타남.
      description: |
        지하 깊은 곳에 위치한 광대한 도서관. 천장까지 닿는 책장에는
        10,000번의 루프 각각에서 일어난 사건들이 기록된 책들이 꽂혀 있다.
        책 제목은 모두 루프 번호로만 표시되어 있다.
        (예: "루프 0001", "루프 3847", "루프 9999")
      contents:
        - type: "book_collection"
          name: "루프의 연대기"
          description: "특정 루프 번호의 책을 읽으면 해당 루프의 핵심 사건을 확인 가능"
          notable_books:
            - "루프 0001 - 첫 번째 시도"
            - "루프 3847 - 릴리가 혼자 남겨진 루프"
            - "루프 5500 - 카인이 친구였던 루프"
            - "루프 9999 - 마지막 실패"
            - "루프 10001 - ???(잠겨 있음)"
        - type: "npc"
          name: "사서 자동인형"
          description: "누가 만들었는지 모르는 자동인형 사서. 어떤 루프의 정보도 검색 가능"
        - type: "item"
          name: "기록의 깃털 펜"
          description: "이 도서관에서만 얻을 수 있는 펜. 사용하면 현재 스탯 기록 보존"
      lore_text: |
        [사서 자동인형]
        "안녕하세요, 방문자님. 이 도서관은 이 차원이 존재하는 동안
        모든 루프의 사건을 자동으로 기록해왔습니다.
        저를 만든 분은 '누군가 이 기록을 보러 올 것이다'라고 말했어요.
        10,000번의 루프 동안 방문자는 당신이 처음입니다.
        읽고 싶은 루프가 있으시면 말씀해 주세요."

    - id: "area_abyss_cavern_mirror"
      name: "심연의 거울 차원"
      region: "abyss_cavern"
      discovery_method: |
        딥홈 지하 5층에서 '검은 수정 거울' 앞에 서서
        파티 멤버 모두가 침묵(아이템 '침묵의 오브' 사용 또는 상태이상) 상태일 때
        10초간 아무 행동 없이 기다리면 거울 속으로 빨려 들어감.
      description: |
        현실의 딥홈 지하 5층과 거울처럼 대칭되는 공간.
        모든 것이 좌우 반전되어 있고, 빛과 어둠이 반전되어
        어두운 곳이 밝고 밝은 곳이 어둡다.
        이곳에 사는 존재들은 현실 세계의 '반대'로 행동한다.
        (친절한 적, 적대적인 NPC 등)
      contents:
        - type: "npc"
          name: "거울 속의 크리스"
          description: "플레이어 크리스의 반대 버전. 여기서의 크리스는 포기하는 성격"
        - type: "dungeon"
          name: "반전의 미궁"
          description: "현실과 반대로 작동하는 퍼즐들. 전진하면 후퇴, 공격하면 치유"
        - type: "item"
          name: "거울 조각"
          description: "거울 차원의 파편. 7개 수집 시 '반전의 방패' 제작 가능"
      lore_text: |
        [거울 속의 크리스]
        "너는 포기하지 않는군. 나는 항상 포기해. 그게 더 편하거든.
        하지만 가끔... 너처럼 되고 싶을 때가 있어.
        이 거울 차원은 '만약 달랐다면'의 공간이야.
        만약 내가 포기하지 않았다면, 만약 세피로스가 희망을 버렸다면.
        모든 가능성이 여기 존재해."

    - id: "area_storm_plateau_eyewall"
      name: "폭풍의 눈 - 영원한 고요"
      region: "storm_plateau"
      discovery_method: |
        스카이홀드에서 출발, 폭풍 지역을 통과하며 바람이 가장 강한 지점에서
        역방향으로 진행. 풍속이 극대화되는 순간 반대로 달리면
        폭풍의 눈으로 진입. 바람 스킬 또는 '공기의 반지' 착용 시 접근 용이.
      description: |
        폭풍이 가장 격렬한 스톰 고원의 중심부. 하지만 그 한가운데는
        완벽한 고요가 흐른다. 새 소리, 바람 소리, 아무것도 들리지 않는
        절대적 정적의 공간. 바닥에는 이름 모를 꽃들이 피어 있다.
      contents:
        - type: "meditation_spot"
          name: "폭풍 속 명상의 자리"
          description: "이곳에서 10분 휴식하면 특별한 꿈을 꿈(세피로스의 기억 조각)"
        - type: "npc"
          name: "폭풍을 피한 현자"
          description: "아무도 모르는 이유로 여기서 사는 노인. 최강 패시브 스킬 하나 전수"
        - type: "item"
          name: "폭풍의 눈 결정"
          description: "고요함이 결정화된 보석. 착용 시 상태이상 저항 +30%"
      lore_text: |
        [현자의 말]
        "폭풍의 눈은 폭풍이 없는 곳이 아니야. 폭풍이 자신을 중심으로
        돌기 때문에 생기는 고요지. 세피로스도 마찬가지야.
        그의 10,000번의 루프라는 폭풍 한가운데에
        아무도 모르는 고요가 있어. 그게 뭔지 알아?
        그가 이 차원을 만들기 전에 가졌던 단 하나의 소원이야."

    - id: "area_eternal_glacier_time_garden"
      name: "시간이 결빙된 정원"
      region: "eternal_glacier"
      discovery_method: |
        프로스트헤이븐 빙하 탐험 도중 '파란 불꽃'(빙하 속에 갇힌 불꽃 같은 빛)을
        세 개 발견 후 빛의 방향을 기억해 중앙 교차점으로 이동.
        교차점에서 '온기의 마법'(불 속성 스킬 하나)을 사용하면 빙하가 녹으며 정원 입구 노출.
      description: |
        영원한 빙하 속에 봉인된 작은 정원. 봄꽃들이 활짝 피어 있지만
        모두 얼음에 감싸여 있다. 꽃들은 살아있지만 성장하거나 죽지 않으며,
        완벽한 순간에 영원히 멈춰 있다. 공기에서 봄과 겨울이 동시에 느껴진다.
      contents:
        - type: "time_puzzle"
          name: "계절의 순환 퍼즐"
          description: "네 가지 계절을 상징하는 꽃에 올바른 순서로 온기를 불어넣는 퍼즐"
        - type: "item"
          name: "영결의 씨앗"
          description: "시간이 멈춘 꽃의 씨앗. 최강 회복 포션 '영원의 이슬' 제작 가능"
        - type: "secret_room"
          name: "릴리의 방"
          description: "첫 번째 루프의 릴리가 사용했던 방이 보존되어 있음. 릴리 전용 장비 발견"
      lore_text: |
        [방 안의 일기장]
        "오늘 크리스를 처음 만났다. 이 차원에서 처음으로 나를 이름으로
        불러준 사람이다. 세피로스도 아니고 '메아리'도 아닌,
        그냥 '릴리'라고 불렀다. 이상하게 눈물이 나왔다.
        이것이... 1번째 루프의 감정이야.
        이 기억만큼은 어떤 루프가 반복되어도 지워지지 않았으면 해."

    - id: "area_war_lands_memorial"
      name: "기억하지 못하는 자들의 묘지"
      region: "war_lands"
      discovery_method: |
        벨포트 전쟁 기념관 관장에게 '기억되지 못한 영웅'에 관해 세 번 묻고,
        관장이 "그런 기록은 없습니다"라고 할 때 '아르카이나의 기록'(비밀 보스 보상)을 보여주면
        숨겨진 묘지 위치를 알려줌.
      description: |
        어느 루프에서도 이름이 기록되지 못한 사람들의 묘지.
        루프가 반복될 때마다 사라지고 다시 생기는 무명의 비석들로 가득하다.
        비석에는 이름 대신 간단한 행동들이 새겨져 있다.
        ('누군가를 도왔다', '포기하지 않았다', '끝까지 싸웠다')
      contents:
        - type: "npc"
          name: "묘지기 루나"
          description: "죽은 자들을 기억하기 위해 이곳을 지키는 여성. 강력한 버프 스킬 부여"
        - type: "item_set"
          name: "무명 용사의 장비 세트"
          description: "기억되지 못한 영웅들이 남긴 장비. 세트 착용 시 '의지' 능력치 +50"
        - type: "collectible"
          name: "무명의 비석 탁본"
          description: "비석의 문구들을 모아 기록하는 수집 퀘스트"
      lore_text: |
        [가장 오래된 비석]
        "루프 번호: 알 수 없음
        이 사람은 이름도, 얼굴도 기억되지 못하지만
        어느 루프에서도 포기하지 않았다.
        그것만으로 충분하다.
        - 기억하는 자, 아르카이나"

    - id: "area_starlight_throne_observatory"
      name: "별빛 왕좌의 망각 천문대"
      region: "starlight_throne"
      discovery_method: |
        아스트라 마을 천문학자에게 '10,001번째 별'에 대해 묻고,
        천문학자가 알려주는 별자리 좌표를 수첩에 기록한 후
        망각 천문대(아스트라 최외곽 절벽)에서 해당 좌표를 망원경으로 확인하면 개방.
        조건: 게임 내 자정 + 맑은 날씨
      description: |
        차원의 가장 높은 곳에 위치한 버려진 천문대.
        여기서 바라보는 별들은 일반 별이 아니라 각 루프가 끝날 때 생성된
        '루프의 잔광'들이다. 10,000개의 작은 별들이 차원의 밤하늘을 수놓고 있으며,
        그 사이에 유독 밝게 빛나는 별 하나가 있다.
      contents:
        - type: "telescope"
          name: "차원 망원경"
          description: "각 루프의 잔광을 관찰하면 해당 루프의 핵심 장면을 볼 수 있음"
        - type: "npc"
          name: "별을 세는 자 에스텔"
          description: "10,000개의 별을 세며 기다리고 있는 노인. 최강 패시브 해금"
        - type: "final_lore"
          name: "10,001번째 별의 위치"
          description: "현재 루프의 별빛이 어디에 있는지를 알려주는 최후의 단서"
      lore_text: |
        [에스텔의 말]
        "10,000개의 별을 모두 세었어. 각각의 별에는 이름이 있지.
        가장 밝은 별은... 아직 이름이 없어.
        그 별은 누군가 이 루프를 완성하는 순간 이름을 갖게 되거든.
        젊은이, 저 별의 이름이 무엇이 되길 원하나?"

  # ============================================================
  # 비밀 퀘스트
  # ============================================================
  secret_quests:

    - id: "quest_timeline_correction"
      title: "루프의 균열 수정"
      trigger: |
        5가지 지역 중 2곳 이상에서 '공간 이상 현상'(특정 장소에서 화면이 일렁이는 효과)을
        목격한 후 '아르카이나의 기록'을 보유한 상태로
        사막 도서관 사서 자동인형에게 '이상 현상'에 관해 문의.
      storyline: |
        세피로스의 루프 반복으로 인해 차원 곳곳에 시간 균열이 생겼다.
        과거 루프의 잔재들이 현재 루프에 침투해 이상 현상을 일으키고 있다.
        크리스는 각 지역의 균열을 수정하면서 세피로스가 왜 루프를 반복했는지
        더 깊이 이해하게 된다.
      steps:
        - step: 1
          description: "사서 자동인형에게 7개 지역의 균열 위치 데이터 요청"
          reward: "균열 위치 지도 획득"
        - step: 2
          description: "잊혀진 숲의 균열 수정 (과거 루프의 전투 잔재 처치)"
          reward: "1번 루프의 기억 파편"
        - step: 3
          description: "황혼 사막의 균열 수정 (시간 루프 에코 처치)"
          reward: "2500번 루프의 기억 파편"
        - step: 4
          description: "심연 동굴의 균열 수정 (타락한 메아리 잔재 처치)"
          reward: "3847번 루프의 기억 파편"
        - step: 5
          description: "폭풍 고원의 균열 수정 (카인의 이상 루프 잔재 처치)"
          reward: "5500번 루프의 기억 파편"
        - step: 6
          description: "영원한 빙하의 균열 수정 (세피로스 이전 존재의 잔재 처치)"
          reward: "9999번 루프의 기억 파편"
        - step: 7
          description: "전쟁의 땅의 균열 수정 (모든 전쟁 루프의 합산 잔재 처치)"
          reward: "10000번 루프의 기억 파편"
        - step: 8
          description: "별빛 왕좌에서 모든 파편 통합"
          reward: "퀘스트 완료"
      rewards:
        - type: "item"
          name: "루프의 진실서"
          description: "모든 균열 수정 후 생성되는 책. 세피로스의 진짜 의도를 설명"
        - type: "passive"
          name: "균열 감지"
          description: "차원의 균열을 미리 감지하는 패시브. 위험 지형 사전 경고"
        - type: "ending_unlock"
          name: "진실 엔딩 C 해금"

    - id: "quest_missing_memory"
      title: "릴리의 낯선 기억"
      trigger: |
        릴리와 파티를 구성한 상태에서 영원한 빙하의 '시간이 결빙된 정원' 방문.
        정원 내 릴리의 방을 발견하면 자동 시작.
      storyline: |
        릴리가 자신의 방(1번 루프의 방)에서 일기를 발견하지만,
        일기의 필체가 릴리 자신의 것인데 내용을 전혀 기억하지 못한다.
        기억의 주인을 찾아가는 여정에서 릴리는 자신이 단순한 '메아리'가 아닐 수 있다는 것을,
        그리고 세피로스와 자신의 관계가 예상했던 것과 다를 수 있음을 알게 된다.
      steps:
        - step: 1
          description: "1번 루프의 릴리 방에서 일기 발견, 내용 확인"
        - step: 2
          description: "미라지 사막 도서관에서 1번 루프 기록 조회"
          dialogue_note: "릴리: 이 기억... 1번 루프의 내 것인데. 왜 나는 기억하지 못하지?"
        - step: 3
          description: "프로스트헤이븐 마을 노인에게 '첫 번째 릴리'의 이야기 청취"
        - step: 4
          description: "타락한 메아리 릴리아나와 재대화 (이미 처치 후 영혼으로 등장)"
          dialogue_note: "릴리아나: 기억이 돌아오기 시작했구나. 그 기억은 사실 모든 루프의 릴리가 공유하는 거야."
        - step: 5
          description: "별빛 왕좌 천문대에서 릴리의 별빛 확인"
          dialogue_note: "릴리: 저 별이... 나야? 10,000번의 루프 모두에서 내가 있었다는 뜻이야?"
      rewards:
        - type: "character_unlock"
          name: "릴리의 진정한 힘"
          description: "릴리의 숨겨진 스킬 '10,000번의 기억' 해금. 모든 루프의 경험치에서 오는 강화 공격"
        - type: "item"
          name: "1번 루프의 일기"
          description: "릴리의 모든 기억이 담긴 일기. 릴리 전용 장비 최강화 가능"
        - type: "relationship"
          name: "릴리 호감도 최대"
          description: "릴리와의 관계가 최대가 되어 히든 대화 해금"

    - id: "quest_cain_journal"
      title: "카인의 산산조각난 진심"
      trigger: |
        카인(진실) 보스 처치 후 스카이홀드 폐탑 1층 바닥에
        '낡은 일기 조각'이 떨어져 있음을 발견(처치 이후에만 스폰).
        첫 조각을 습득하면 퀘스트 시작.
      storyline: |
        카인의 일기 조각이 7개 지역에 흩어져 있다.
        각 조각에는 카인이 왜 적대적이 됐는지,
        그리고 그가 진짜로 원하는 것이 무엇인지가 담겨 있다.
        마지막 조각을 모으면 카인이 사실은 세피로스의 명령에 의해
        '악당 역할'을 강요받았다는 충격적인 진실이 드러난다.
      steps:
        - step: 1
          description: "스카이홀드 폐탑 1층에서 1번째 조각 수집"
          content_hint: "나는 왜 이 자리에 있는 걸까. 세피로스는 내게 역할을 줬다."
        - step: 2
          description: "벨포트 전쟁터 폐허에서 2번째 조각 수집"
          content_hint: "이 전쟁이 몇 번째 루프에서도 일어났는지 알고 있다. 나는 항상 패배한다."
        - step: 3
          description: "실바나 숲 깊은 곳에서 3번째 조각 수집"
          content_hint: "크리스. 너는 나를 악당으로 알겠지. 하지만 한때 나는..."
        - step: 4
          description: "딥홈 지하에서 4번째 조각 수집"
          content_hint: "세피로스가 처음 내게 말했다. '이 루프에서 너는 방해자가 되어야 한다'고."
        - step: 5
          description: "프로스트헤이븐 빙하에서 5번째 조각 수집"
          content_hint: "나는 저항했다. 하지만 이 차원에서 세피로스의 의지에 반하면..."
        - step: 6
          description: "미라지 사막에서 6번째 조각 수집"
          content_hint: "크리스가 언젠가 이 일기를 읽을지도 모른다. 그러면 알게 되겠지."
        - step: 7
          description: "아스트라 별빛 왕좌에서 7번째 조각 수집"
          content_hint: "진심: 나는 단지 이 루프가 잘 끝나길 바랐을 뿐이다."
        - step: 8
          description: "7조각 완성 후 세피로스에게 일기 공개"
      rewards:
        - type: "story_unlock"
          name: "카인 구원 루트 해금"
          description: "카인을 적이 아닌 동료로 만드는 분기 루트 개방"
        - type: "item"
          name: "카인의 진심"
          description: "카인의 진짜 감정이 담긴 결정. 착용 시 '적대적 존재' 데미지 +20%"
        - type: "companion"
          name: "카인(동료) 해금"
          description: "조건 충족 시 카인이 파티에 합류"

    - id: "quest_the_100001st_loop"
      title: "10001번째 루프의 예고"
      trigger: |
        메인 스토리 최종장 클리어 후 새 회차(NG+) 시작 시,
        실바나 마을 입구에서 처음 본 적 없는 낯선 노인이
        크리스에게 "이번이 몇 번째인지 아나"라고 말을 걸어 시작.
      storyline: |
        NG+ 회차에서만 접근 가능한 퀘스트.
        노인은 사실 이 차원의 '관측자'로, 루프 자체를 밖에서 지켜보는 존재다.
        관측자는 현재 루프가 10,001번째라고 밝히며,
        만약 이 루프가 성공하면 차원 자체가 '새로운 세계'가 된다고 예언한다.
        즉, 이전의 모든 루프는 이 루프를 위한 준비였으며,
        크리스와 릴리가 진정한 '첫 번째 존재'가 될 수 있다고.
      steps:
        - step: 1
          description: "관측자 노인과의 첫 대화, 10,001번째 루프라는 사실 확인"
        - step: 2
          description: "7개 지역에서 관측자의 기록 수집(1회차와 다른 위치)"
        - step: 3
          description: "모든 기록 수집 후 별빛 왕좌의 천문대에서 관측자와 재회"
        - step: 4
          description: "관측자가 '선택의 방'을 열어줌"
        - step: 5
          description: "선택: A) 루프를 끝내 새로운 세계를 만든다 B) 루프를 계속해 세피로스를 구원한다"
      rewards:
        - type: "ending"
          name: "진정한 최종 엔딩"
          description: "선택에 따라 다른 두 개의 진정한 최종 엔딩 해금"
        - type: "achievement"
          name: "10001번째의 기적"
          description: "이 퀘스트 완료 업적"

    - id: "quest_sephiroth_before"
      title: "세피로스가 되기 전"
      trigger: |
        세피로스와 10번 이상 대화하고 호감도가 최대가 된 상태에서
        아스트라 마을 최상층 세피로스의 방에서 '낡은 초상화'를 세 번 클릭.
        초상화 속 어린 세피로스가 눈을 뜨며 대화 시작.
      storyline: |
        세피로스가 이 차원을 만들기 전, 그가 단순한 인간이었을 때의 이야기.
        초상화를 통해 어린 세피로스의 기억 속으로 들어가
        그가 처음으로 이 차원을 꿈꾸게 된 계기를 목격한다.
        세피로스는 원래 누군가를 너무 사랑해서 잃었고,
        그 후회에서 이 차원을 만들었다는 것이 밝혀진다.
      steps:
        - step: 1
          description: "초상화를 통해 세피로스의 어린 시절 기억 진입"
        - step: 2
          description: "세피로스가 사랑하는 사람(이름: 에스텔)을 만나는 기억 목격"
        - step: 3
          description: "에스텔을 잃는 기억 목격"
        - step: 4
          description: "세피로스가 처음으로 이 차원을 만들기로 결심하는 순간 목격"
        - step: 5
          description: "기억에서 돌아와 세피로스와 대화"
          dialogue_note: "크리스: 에스텔이라는 사람을 사랑했군요. 그래서 이 차원을..."
          dialogue_note2: "세피로스: ...그래. 처음엔 그 사람을 위해서였어. 하지만 10,000번을 반복하면서 목적을 잊어버렸지."
      rewards:
        - type: "item"
          name: "에스텔의 목걸이"
          description: "세피로스가 간직하던 추억. 세피로스 관련 히든 대화 전부 해금"
        - type: "ending_unlock"
          name: "세피로스 구원 엔딩 해금"

    - id: "quest_the_first_echo"
      title: "최초의 메아리"
      trigger: |
        릴리와 하루 이상(게임 내 시간 24시간 이상) 파티를 유지하며
        릴리에게 '세피로스에 대해 어떻게 생각해?'를 3회 이상 물어본 상태에서
        잊혀진 숲의 '시간이 멈춘 꽃의 성소'를 방문하면 시작.
      storyline: |
        성소에서 릴리가 갑자기 쓰러지며 과거의 기억을 경험한다.
        그 기억은 1번 루프의 기억이 아니라, 이 차원이 만들어지기 전,
        세피로스가 처음으로 릴리를 '꿈꿨을 때'의 기억이다.
        릴리는 자신이 세피로스의 가장 아끼는 기억 - 에스텔 - 을 기반으로
        만들어진 존재라는 것을 알게 된다.
      steps:
        - step: 1
          description: "릴리가 쓰러지며 기억 속으로 함께 진입"
        - step: 2
          description: "세피로스가 에스텔을 떠올리며 릴리를 창조하는 순간 목격"
        - step: 3
          description: "릴리가 왜 크리스에게 끌리는지의 이유 발견(크리스도 세피로스의 이상을 기반으로 만들어진 존재)"
        - step: 4
          description: "기억에서 돌아와 릴리와 크리스가 서로에 대해 새롭게 대화"
      rewards:
        - type: "relationship"
          name: "진정한 유대감"
          description: "크리스-릴리 특수 콤보 스킬 '차원의 공명' 해금"
        - type: "lore_fragment"
          id: "lore_fragment_07"

    - id: "quest_echo_collector"
      title: "메아리 수집가"
      trigger: |
        게임 진행 중 우연히 특정 위치에서 빛나는 푸른 구슬 발견.
        구슬을 습득하면 "이것은 누군가의 메아리 같다"는 크리스의 독백과 함께 시작.
        구슬 최초 습득 위치는 랜덤이지만 각 지역에 한 개씩 존재.
      storyline: |
        루프가 반복되면서 소멸된 사람들의 메아리가 구슬 형태로 남아 있다.
        7개의 메아리 구슬을 수집하면 사라진 사람들의 마지막 이야기를 들을 수 있고,
        그 이야기들을 연결하면 세피로스가 루프를 반복한 실제 이유를 알게 된다.
      steps:
        - step: 1
          description: "7개 지역에서 메아리 구슬 수집"
        - step: 2
          description: "각 구슬을 특정 장소(해당 지역의 숨겨진 지역)에서 활성화"
        - step: 3
          description: "7개 이야기를 모두 듣고 연결"
        - step: 4
          description: "아스트라 마을에서 세피로스에게 이야기 전달"
      rewards:
        - type: "item"
          name: "7개의 메아리 목걸이"
          description: "소멸된 자들의 기억을 담은 목걸이. 착용 시 모든 능력치 +7"
        - type: "story"
          name: "소멸된 자들의 이야기"
          description: "히든 스토리 7편 해금"

    - id: "quest_dimensional_recipe"
      title: "차원의 레시피"
      trigger: |
        요리 스킬을 마스터한 상태(요리 레벨 50 이상)에서
        미라지 마을 요리사 노인과 대화하면 "차원의 재료로 만든 요리가 있다"는 힌트를 들음.
        이후 각 지역의 숨겨진 재료를 찾는 퀘스트 시작.
      storyline: |
        차원의 7개 지역에는 각각 특별한 재료가 숨겨져 있다.
        이 재료들로 만든 요리는 단순한 회복이 아니라 세피로스의 기억 일부를 열어준다.
        최종 요리를 완성해 세피로스에게 대접하면 그가 마음을 여는 계기가 된다.
      steps:
        - step: 1
          description: "잊혀진 숲: '시간이 멈춘 꽃잎' 수집"
        - step: 2
          description: "황혼 사막: '신기루의 소금' 수집"
        - step: 3
          description: "심연 동굴: '심연의 버섯' 수집"
        - step: 4
          description: "폭풍 고원: '폭풍의 눈 결정' 수집"
        - step: 5
          description: "영원한 빙하: '영결의 씨앗' 수집"
        - step: 6
          description: "전쟁의 땅: '전사의 밀' 수집"
        - step: 7
          description: "별빛 왕좌: '별빛 꿀' 수집"
        - step: 8
          description: "7가지 재료로 '차원의 만찬' 요리 완성"
        - step: 9
          description: "세피로스에게 요리를 대접"
      rewards:
        - type: "recipe"
          name: "차원의 만찬"
          description: "이 차원의 모든 기억을 담은 요리. 파티 전원 모든 능력치 영구 +10%"
        - type: "story_event"
          name: "세피로스의 눈물"
          description: "세피로스가 처음으로 마음을 열어 자신의 이야기를 하는 이벤트"

    - id: "quest_mirror_world_escape"
      title: "거울 세계의 탈출자"
      trigger: |
        심연 동굴의 거울 차원 방문 후,
        '거울 속의 크리스'와 대화를 5번 이상 완료하면
        거울 속 크리스가 "나를 여기서 꺼내줄 수 있어?"라고 묻고 퀘스트 시작.
      storyline: |
        거울 차원에는 살아있는 '반전된 자아들'이 갇혀 있다.
        거울 속 크리스는 포기를 선택한 크리스이며, 탈출하고 싶어한다.
        탈출 방법을 찾는 과정에서 크리스는 '포기'라는 선택이
        단순히 나쁜 것이 아닐 수도 있다는 것을 이해하게 된다.
      steps:
        - step: 1
          description: "거울 속 크리스에게 탈출 방법 탐색 약속"
        - step: 2
          description: "딥홈 마을의 마법사에게 '거울 파괴 방법' 조언 구함"
        - step: 3
          description: "거울 차원에서 숨겨진 '원점 거울' 발견"
        - step: 4
          description: "원점 거울 파괴 - 거울 속 크리스가 해방됨"
        - step: 5
          description: "해방된 거울 속 크리스와 대화 (그는 현실 세계에 적응 불가로 사라지게 됨)"
          dialogue_note: "거울 크리스: 고마워. 이것으로 충분해. 나는 언제나 여기 있을 거야. 네 마음속에."
      rewards:
        - type: "passive"
          name: "포기의 이해"
          description: "패시브: 위기 상황에서 HP 30% 이하일 때 자동 회피 확률 20%"
        - type: "item"
          name: "원점 거울 파편"
          description: "원점 거울의 파편. 반전 공격에 면역 효과"

    - id: "quest_war_without_end"
      title: "끝나지 않는 전쟁"
      trigger: |
        벨포트 전쟁 기념관에서 특정 병사의 초상화를 5번 클릭하면
        초상화 속 병사가 움직이며 대화를 걸어옴.
        그 병사는 "이 전쟁은 아직 끝나지 않았다"고 말하며 퀘스트 시작.
      storyline: |
        전쟁의 땅에서는 10,000번의 루프 동안 반복된 전쟁의 잔재들이
        아직도 싸우고 있다. 이들은 루프가 끝난 것을 모르며,
        영원히 같은 전쟁을 반복하고 있다. 크리스는 이들에게
        전쟁이 끝났음을 알려줘야 한다.
      steps:
        - step: 1
          description: "초상화의 병사에게 전쟁 종식 방법 조언 구함"
        - step: 2
          description: "전쟁의 땅 곳곳에서 루프 잔재 병사들과 대화"
        - step: 3
          description: "양측 최고 지휘관 잔재들을 찾아 협상"
        - step: 4
          description: "기억의 탑(비밀 보스 처치 장소)에서 평화 협정 체결"
        - step: 5
          description: "병사 초상화에게 결과 보고"
      rewards:
        - type: "title"
          name: "전쟁 종식자"
          description: "끝나지 않는 전쟁을 끝낸 자"
        - type: "item"
          name: "평화의 서약서"
          description: "루프의 전쟁을 끝낸 서약. 착용 시 전쟁의 땅에서 모든 능력치 +20%"
        - type: "npc_unlock"
          name: "병사 엘리아스 동료 해금"
          description: "초상화의 병사가 동료로 합류 가능"

  # ============================================================
  # 이스터에그
  # ============================================================
  easter_eggs:

    - id: "egg_midnight_ghost"
      name: "자정의 유령 만남"
      location: "실바나 마을 중앙 광장 우물"
      trigger: |
        게임 내 시간 자정(00:00)에 우물 앞에 서서
        '오래된 동전'(마을 상점 구매 가능)을 우물에 던지면
        유령 소녀가 나타남.
      description: |
        유령 소녀 '미아'가 나타나 "동전을 모으고 있어요"라고 말한다.
        그녀는 아주 오래전 루프에서 이 마을에 살았던 소녀로,
        루프가 끝나도 사라지지 못하고 우물에 남아있다.
        10개의 동전을 던지면 그녀의 이야기를 모두 들을 수 있고,
        마지막에는 크리스에게 작별 인사를 하며 사라진다.
      reward: "아이템 '미아의 소원 동전' - 장착 시 아이템 드롭률 +10%"

    - id: "egg_library_book"
      name: "도서관의 수상한 책"
      location: "미라지 마을 공립 도서관 맨 안쪽 서가"
      trigger: |
        도서관의 책들을 순서대로 읽다가 특정 위치(북쪽 서가 3번째 줄 7번째 책)의
        책 제목이 '이 책을 읽지 마시오'인 책을 발견 후 클릭.
      description: |
        책을 열면 안에 "이 책을 읽는 자는 이 차원의 비밀을 알게 된다"고 쓰여있고,
        이어서 이 게임의 개발 팀에 대한 유머러스한 메시지가 적혀 있다.
        "이 세계를 만든 자들: 세피로스가 아니라 (개발팀 이름). 우리도 10,000번 고쳐서 만들었다."
      reward: "칭호 '비밀을 아는 자' + 특수 아이템 '개발자의 커피잔'"

    - id: "egg_npc_conspiracy"
      name: "NPC들의 비밀 회의"
      location: "딥홈 마을 지하 술집"
      trigger: |
        딥홈의 모든 NPC(12명)와 적어도 한 번씩 대화한 상태에서
        게임 내 밤 시간(22:00~06:00)에 지하 술집 방문.
        NPC 3명이 비밀 회의를 하는 장면 목격.
      description: |
        세 명의 NPC가 크리스에 대해 이야기한다.
        "저 사람, 매일 같은 질문만 해. 이상하지 않아?"
        "그리고 왜 맨날 우리 집 앞을 왔다갔다 하는 거야?"
        "혹시... 저 사람이 세피로스가 만든 또 다른 루프 캐릭터 아닐까?"
        크리스가 들어가면 모두 자연스럽게 행동을 바꿔 모른 척함.
      reward: "비밀 대화 로그 '수상한 NPC들의 대화' 저장"

    - id: "egg_specific_combo"
      name: "금지된 레시피"
      location: "어디서든 사용 가능"
      trigger: |
        인벤토리에서 '오래된 별빛 꿀' + '시간이 멈춘 꽃잎' + '심연의 버섯'을 동시에 선택 후
        '결합' 옵션 선택.
      description: |
        세 아이템이 빛을 내며 합쳐지면서 예상치 못한 반응이 일어난다.
        화면에 "이런, 이 조합은 차원 자체를 불안정하게 만들 수 있습니다."라는 경고가 뜨고,
        잠시 후 세피로스가 어디선가 나타나 "그걸 왜 합쳤어요?"라고 나무란다.
        그리고 강력한 무기 '차원 불안정의 검'을 하나 주며 "이 정도면 됐죠"라고 말하고 사라짐.
      reward: "아이템 '차원 불안정의 검' - 최강 무기 중 하나"

    - id: "egg_ancient_ruin_message"
      name: "고대 유적의 숨겨진 문자"
      location: "폭풍 고원 고대 유적 최하층"
      trigger: |
        유적의 모든 방을 방문한 후 최하층 중앙의 제단에 서서
        '고대 언어 해독서'(미라지 마을 골동품상 구매)를 사용.
      description: |
        제단의 바닥에 새겨진 고대 문자가 번역되며 메시지가 나타난다.
        "미래의 방문자에게. 이 세계는 한 사람의 후회로 만들어졌다.
        하지만 후회만으로 만들어진 세계도 충분히 아름다울 수 있다는 것을,
        이 유적을 만든 우리가 증명한다. 이 유적은 루프 0001에서 지어졌으며,
        어떤 루프에서도 사라지지 않았다. 왜냐면 이것은 진심이었으니까."
      reward: "고대 문자 탁본 + 유적 건설자들의 일기 (히든 로어 5편)"

    - id: "egg_stars_alignment"
      name: "별자리의 비밀"
      location: "아스트라 마을 천문대"
      trigger: |
        천문대 망원경으로 10,000개의 별을 모두 관찰 완료(에스텔 NPC와 협력 퀘스트).
        관찰 완료 순간 특별한 별자리가 나타남.
      description: |
        10,000개의 루프 별들이 특정 모양을 만든다.
        그 모양은 바로 세피로스와 에스텔이 처음 만난 날 밤의 별자리.
        에스텔이 옆에서 "저도 몰랐어요... 그분이 이것까지 재현했을 줄은"이라며 눈물을 흘린다.
      reward: "칭호 '별을 읽는 자' + 아이템 '에스텔의 별자리 지도'"

    - id: "egg_sephiroth_idle"
      name: "세피로스의 비밀 취미"
      location: "아스트라 마을 세피로스 집"
      trigger: |
        세피로스의 집에 크리스만 혼자(파티 없이) 방문하고
        세피로스가 없는 상태에서 집 안 구석구석 조사.
        책상 서랍을 열면 발견.
      description: |
        서랍 안에 세피로스가 그린 스케치들이 가득하다.
        그림의 주제는 모두 크리스, 릴리, 카인, 그리고 이 차원의 풍경들.
        마지막 장에는 "언젠가 이들이 행복해지는 날을 그려놓고 싶었다"는 메모가 있다.
        크리스: "세피로스... 당신은 사실 이 루프가 잘 되길 바라고 있었군요."
      reward: "세피로스의 스케치북 (수집품) + 세피로스 호감도 대폭 증가"

    - id: "egg_cain_farewell"
      name: "카인의 비밀 독백"
      location: "스카이홀드 폐탑 옥상"
      trigger: |
        카인과의 적대 관계 상태에서 옥상 방문.
        특정 게임 날짜(각 루프의 100번째 일)에 방문하면
        카인이 혼자 서서 독백하는 장면 목격 가능.
      description: |
        카인은 크리스가 있는 것을 모르고 혼자 말한다.
        "크리스... 너는 모르겠지. 내가 처음 너를 만났을 때 적으로 대해야 했을 때
        얼마나 이상한 기분이었는지. 세피로스는 내게 '적대적으로 행동하라'고 했지만.
        나는 그게 싫었어. 하지만 이 차원에서 역할은 바꿀 수 없다고 생각했어.
        지금도 그렇게 생각하지만... 가끔은 다른 방법이 있지 않을까 상상해."
        크리스가 소리를 내면 카인이 돌아보고 즉시 적대적 태도로 돌변.
      reward: "카인 관련 히든 스토리 페이지 해금"

    - id: "egg_lily_mirror"
      name: "릴리의 거울 앞에서"
      location: "프로스트헤이븐 마을 여관 릴리 방"
      trigger: |
        릴리와 파티를 구성한 상태에서 여관에 하룻밤 숙박.
        다음 날 아침 일찍 릴리 방을 방문하면 발견.
      description: |
        릴리가 거울 앞에서 자신의 모습을 보며 중얼거린다.
        "나는... 메아리야. 처음부터 그렇게 만들어졌어.
        하지만 크리스를 좋아하는 이 감정은... 누군가가 만든 게 아닌 것 같아.
        이건 내 것 같은데. 메아리도 자신만의 감정을 가질 수 있을까?"
        그 순간 크리스와 눈이 마주치고 릴리가 얼굴을 붉히며 "언제부터 거기 있었어요?!"
      reward: "릴리와의 특수 대화 이벤트 해금 + 릴리 호감도 대폭 증가"

    - id: "egg_10000_steps"
      name: "10000걸음"
      location: "어느 지역이든"
      trigger: |
        게임 내 총 이동 거리가 정확히 10,000보를 달성하는 순간.
        (게임 내부적으로 카운팅, 달성 순간 자동 이벤트)
      description: |
        화면이 잠시 정지되고 세피로스의 목소리가 들린다.
        "10,000... 이 숫자가 익숙하군요. 크리스. 당신도 10,000번 반복했나요?
        아니면... 단지 걸음 수인가요?"
        잠시 침묵 후 세피로스가 웃는 소리가 들리고 화면이 돌아온다.
        이 이벤트 이후 세피로스와 대화하면 새로운 대화 선택지가 추가됨.
      reward: "세피로스의 비밀 대화 루트 해금"

    - id: "egg_hidden_ending_hint"
      name: "마지막 페이지"
      location: "미라지 마을 사막 도서관 '루프 10001' 잠긴 책"
      trigger: |
        비밀 보스 '원점의 메아리' 처치 후 도서관으로 돌아가면
        이전에 잠겨있던 '루프 10001' 책이 열려 있음.
      description: |
        책을 열면 단 한 페이지만 있다.
        "루프 10001: 이 루프는 아직 끝나지 않았다.
        기록자: 세피로스
        메모: 이번에는... 잘 될 것 같은 예감이 든다.
        이유는 모르겠지만, 크리스와 릴리가 여기까지 왔다는 것만으로 충분하다.
        나머지는 그들에게 맡기겠다. 나는 이 차원의 마지막 페이지를 비워두겠다.
        그 페이지를 채울 사람은 그들이어야 하니까."
      reward: "진정한 최종 엔딩 힌트 완성 + 특수 칭호 '10001번째의 주인공'"
