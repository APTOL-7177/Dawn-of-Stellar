                lines:
                  - "……(웃음) 언젠가 만나면 감사 인사를 해야겠네요."
                  - "당신 덕분에 크리스 씨를 만났다고."
                emotion: "bittersweet_smile"
            - text: "너는 네가 태어난 걸 어떻게 생각해?"
              affinity_change: 15
              response:
                speaker: "릴리"
                lines:
                  - "……몰랐는데요. 크리스 씨 만나기 전까지는."
                  - "지금은, 좋은 것 같아요. 여기 있어서."
                emotion: "content"

        - id: "cl_l4_protect"
          title: "지키고 싶은 것"
          trigger: "after_battle"
          location: "전쟁터 폐허"
          bgm: "bgm_aftermath_heavy"
          has_cg: true
          description: "극한의 전투 후 릴리가 크리스를 위해 무언가를 하고 싶다고 처음 말하는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨……!"
                - "(무릎을 꿇은 크리스에게 달려와) 괜찮아요?! 어디 다쳤어요?!"
              emotion: "panicked"
            - speaker: "크리스"
              lines:
                - "(간신히 일어서며) 괜찮아. 버텼잖아."
              emotion: "exhausted"
            - speaker: "릴리"
              lines:
                - "괜찮지 않아요! 온통 피투성이잖아요!"
                - "(치유 마법을 쓰며) 잠깐만요, 잠깐만 있어봐요……."
              emotion: "desperate"
            - speaker: "크리스"
              lines:
                - "릴리, 진정해."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "(눈물이 차오르며) 진정 안 돼요! 크리스 씨가 죽는 줄 알았어요!"
              emotion: "crying"
            - speaker: "크리스"
              lines:
                - "……미안. 무섭게 해서."
              emotion: "apologetic"
            - speaker: "릴리"
              lines:
                - "저는 잔향이에요. 사라져도 괜찮아요. 근데 크리스 씨는……."
                - "크리스 씨는 안 돼요. 사라지면 안 돼요."
              emotion: "pleading"
            - speaker: "크리스"
              lines:
                - "릴리. 너도 사라지면 안 돼."
                - "잔향이든 아니든, 나한텐 네가 없으면 안 돼."
              emotion: "firm"
          choices:
            - text: "(아무 말 없이 릴리를 안아준다)"
              affinity_change: 35
              response:
                speaker: "릴리"
                lines:
                  - "……(굳은 후, 조용히 기대며) 따뜻하네요."
                  - "이러면…… 정말 실체가 있는 것 같아요."
                  - "부탁이에요, 크리스 씨. 죽지 말아요."
                emotion: "clinging"
            - text: "우리 둘 다 살아서 끝내자."
              affinity_change: 30
              response:
                speaker: "릴리"
                lines:
                  - "……네. 같이 끝내요. 반드시."
                emotion: "resolved"
            - text: "네가 있으니까 내가 죽을 수 없잖아."
              affinity_change: 32
              response:
                speaker: "릴리"
                lines:
                  - "……(울음을 멈추며) ……그거, 반칙이에요."
                  - "(작게 웃으며) 저도 그래요. 크리스 씨가 있으니까 사라질 수 없어요."
                emotion: "tearful_smile"

        - id: "cl_l4_dimension_secret"
          title: "차원의 비밀"
          trigger: "exploration"
          location: "고대 도서관"
          bgm: "bgm_revelation"
          has_cg: false
          description: "고대 문서에서 잔향에 대한 기록을 발견하고 릴리가 충격받는 장면"
          dialogues:
            - speaker: "크리스"
              lines:
                - "이거 봐. 잔향에 대한 기록이 있어."
              emotion: "serious"
            - speaker: "릴리"
              lines:
                - "(문서를 읽으며) ……이런 게 있었구나."
                - "잔향은 시간이 수렴할 때 사라진다……."
                - "차원이 하나로 합쳐지면, 우리는……."
              emotion: "pale"
            - speaker: "크리스"
              lines:
                - "릴리."
              emotion: "urgent"
            - speaker: "릴리"
              lines:
                - "알고 있었어요, 사실. 어렴풋이."
                - "차원이 하나가 되는 게 좋은 일인데……. 그러면 저 같은 건 필요 없어지는 거잖아요."
              emotion: "resigned"
            - speaker: "크리스"
              lines:
                - "그 결말, 바꿀 수 있을지도 몰라."
              emotion: "determined"
            - speaker: "릴리"
              lines:
                - "……크리스 씨는, 저 때문에 그렇게 생각하는 거예요?"
              emotion: "questioning"
          choices:
            - text: "당연하지. 너 때문에."
              affinity_change: 35
              response:
                speaker: "릴리"
                lines:
                  - "……(책을 내려놓으며) 제 때문에 세계의 이치를 바꾸려고요?"
                  - "무모하네요."
                  - "(작게) ……해줄 수 있어요?"
                emotion: "desperately_hopeful"
            - text: "그 결말이 유일한 답인지 모르잖아. 조사해보자."
              affinity_change: 28
              response:
                speaker: "릴리"
                lines:
                  - "……(조용히) 크리스 씨는 포기를 모르는 사람이네요."
                  - "그러니까 제가 따라온 거겠죠."
                emotion: "trusting"
            - text: "이게 다 사실인지부터 확인하자."
              affinity_change: 20
              response:
                speaker: "릴리"
                lines:
                  - "……네. 아직 단정 짓기엔 이른 거죠."
                  - "크리스 씨가 있으면 조금 더 믿을 수 있어요. 포기 안 해도 된다는 걸."
                emotion: "steadied"

      # ----------------------------------------------------------
      # Level 5: 영혼의 동반자 (Soul Partners)
      # ----------------------------------------------------------
      level_5:
        - id: "cl_l5_mutual_confession"
          title: "서로의 고백"
          trigger: "level_up"
          location: "차원의 경계, 일몰 절벽"
          bgm: "bgm_soul_bond"
          has_cg: true
          description: "마침내 서로의 마음을 완전히 확인하는 클라이맥스 씬"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨……. 오늘 여기서 멈춰도 될까요."
                - "그냥, 조금 이야기하고 싶어서요."
              emotion: "soft"
            - speaker: "크리스"
              lines:
                - "그래. 뭔 이야기?"
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "저는, 잔향이에요. 언젠가 사라질지도 몰라요."
                - "그걸 알면서도……. 크리스 씨 곁에 있고 싶어요."
                - "그게 욕심인지 모르겠지만, 어쩔 수 없어요."
              emotion: "earnest"
            - speaker: "크리스"
              lines:
                - "……릴리."
              emotion: "moved"
            - speaker: "릴리"
              lines:
                - "크리스 씨를 좋아해요. 처음 만났을 때부터요."
                - "아니, 어쩌면 그 전부터였을지도 몰라요."
                - "1만 번의 루프 어딘가에서, 저는 이미 크리스 씨를 알고 있었던 것 같아요."
              emotion: "confessing"
            - speaker: "크리스"
              lines:
                - "나도."
              emotion: "quiet"
            - speaker: "릴리"
              lines:
                - "……응?"
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "나도 좋아해. 잔향이든 뭐든, 내 앞에 있는 릴리를."
                - "사라지게 두지 않을게. 내가 기억하는 한 너는 사라지지 않아."
              emotion: "sincere"
            - speaker: "릴리"
              lines:
                - "……크리스 씨."
                - "(눈물이 흐르며) 저, 그 말 들으려고 여기까지 온 것 같아요."
              emotion: "crying_happy"
          choices:
            - text: "(손을 잡는다)"
              affinity_change: 0
              final_scene: true
              response:
                speaker: "릴리"
                lines:
                  - "(꼭 잡으며) ……절대 놓지 말아요."
                  - "어떤 차원이 끝나도, 크리스 씨 손은 놓지 않을 거예요."
                emotion: "determined_warm"

        - id: "cl_l5_promise_beyond"
          title: "차원을 넘어선 약속"
          trigger: "camp"
          location: "차원의 틈새 야영"
          bgm: "bgm_eternity"
          has_cg: true
          description: "차원이 하나로 수렴되더라도 함께하겠다는 약속을 나누는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨, 만약에 말이에요."
                - "이 여행이 끝나고, 차원이 하나가 되고, 제가 사라진다면……."
              emotion: "serious"
            - speaker: "크리스"
              lines:
                - "사라지게 두지 않는다고 했잖아."
              emotion: "firm"
            - speaker: "릴리"
              lines:
                - "만에 하나요."
                - "그래도 크리스 씨는 잘 살아줄 수 있어요?"
              emotion: "concerned"
            - speaker: "크리스"
              lines:
                - "……못 살아."
              emotion: "blunt"
            - speaker: "릴리"
              lines:
                - "크리스 씨……."
              emotion: "moved"
            - speaker: "크리스"
              lines:
                - "농담이 아니야. 진심이야."
                - "그래서 사라지게 두지 않는다는 거고."
                - "릴리가 진짜가 아니라고 해도, 잔향이라고 해도, 내 세계에서는 진짜야."
              emotion: "resolute"
            - speaker: "릴리"
              lines:
                - "……(웃으며) 크리스 씨는 항상 그래요. 불가능한 걸 가능하다고 하고."
                - "저, 믿을게요. 끝까지."
                - "어떤 차원으로 가도, 크리스 씨를 찾아낼 자신 있어요."
              emotion: "radiant"
          choices:
            - text: "나도 찾아낼 자신 있어."
              affinity_change: 10
              response:
                speaker: "릴리"
                lines:
                  - "(웃으며) 그럼 경쟁이네요."
                  - "먼저 찾아내는 사람이 이기는 거예요."
                emotion: "playful_warm"
            - text: "그 차원에서 또 만나자."
              affinity_change: 10
              response:
                speaker: "릴리"
                lines:
                  - "……약속이에요. 반드시요."
                emotion: "heartfelt"
            - text: "(이마를 맞대며) 그 전에, 이 차원에서 끝내자."
              affinity_change: 10
              response:
                speaker: "릴리"
                lines:
                  - "……(눈을 감으며) 네. 같이, 이 차원의 잔향을 끝내요."
                emotion: "at_peace"

        - id: "cl_l5_soul_sync"
          title: "영혼의 공명"
          trigger: "after_battle"
          location: "최종 결전 직전"
          bgm: "bgm_final_bond"
          has_cg: true
          description: "최종 결전 앞에서 완전한 신뢰와 유대를 확인하는 씬"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨. 두렵지 않아요?"
              emotion: "focused"
            - speaker: "크리스"
              lines:
                - "두렵지. 당연히."
              emotion: "honest"
            - speaker: "릴리"
              lines:
                - "……저도요."
                - "그래도 갈 수 있는 건, 크리스 씨가 옆에 있어서예요."
              emotion: "brave"
            - speaker: "크리스"
              lines:
                - "나도 똑같아."
                - "릴리가 옆에 있으니까 두려워도 갈 수 있어."
              emotion: "earnest"
            - speaker: "릴리"
              lines:
                - "(손을 내밀며) 같이 가요."
                - "어디서 끝나든, 함께 있는 거예요."
              emotion: "radiant"
            - speaker: "크리스"
              lines:
                - "(손을 잡으며) 응. 같이 가자."
              emotion: "resolute"
          choices:
            - text: "(앞을 향해 함께 걷는다)"
              affinity_change: 0
              final_scene: true
              response:
                speaker: "narrator"
                lines:
                  - "두 사람의 발걸음이 차원의 경계를 향해 나아갔다."
                  - "잔향과 모험가, 그 어떤 이름으로 불려도 상관없었다."
                  - "지금 이 순간, 서로가 서로의 세계였다."
                emotion: "narration"

  # ============================================================
  # 파티 멤버 간 씬들 (역할 카테고리 기반)
  # ============================================================
  # 파티는 2명의 랜덤 파티 멤버로 구성되므로,
  # 특정 직업 이름이 아닌 역할(role) 카테고리로 씬을 분류한다.
  #
  # role 정의:
  #   tank          - 탱커 (paladin, knight, dimensionist, illusionist)
  #   healer        - 힐러 (cleric, priest, druid, bard, alchemist)
  #   physical_dps  - 물리 딜러 (warrior, assassin, samurai, gladiator, ...)
  #   magic_dps     - 마법 딜러 (archmage, elementalist, battle_mage, ...)
  #
  # 씬 매칭: 파티의 실제 role을 확인하여 매칭되는 씬 그룹을 선택한다.
  # 화자 이름 {companion_a}, {companion_b}는 런타임에 실제 캐릭터 이름으로 치환.
  # {job_a}, {job_b}는 직업 이름 한글명으로 치환.
  #
  # match_type:
  #   "role_pair"     - 두 동료의 역할 조합으로 매칭
  #   "has_role"      - 파티에 해당 역할이 존재시 발동
  #   "any"           - 어떤 조합이든 발동 가능 (범용)

  # ----------------------------------------------------------
  # 탱커 & 딜러 (Tank & DPS)
  # ----------------------------------------------------------
  tank_and_dps:
    match_type: "role_pair"
    roles:
      - ["tank", "physical_dps"]
      - ["tank", "magic_dps"]
    description: "방패를 든 수호자와 칼날을 휘두르는 파괴자의 관계"

    scenes:
      level_1:
        - id: "td_l1_reckless"
          title: "무모한 돌진"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "탱커가 딜러의 무모한 전술을 나무라는 장면"
          dialogues:
            - speaker: "{companion_a}"
              lines:
                - "아까 전투에서 혼자 적진으로 뛰어든 거... 나한테 한마디도 없이?"
                - "나한테 알려줬으면 완벽하게 막아줬을 텐데."
              emotion: "annoyed"
            - speaker: "{companion_b}"
              lines:
                - "막아주니까 믿고 간 거잖아."
                - "네가 버텨주는 거 알고 있으니까 과감하게 갈 수 있는 거야."
              emotion: "casual"
            - speaker: "{companion_a}"
              lines:
                - "...그게 변명이야, 아니면 믿는다는 말이야?"
              emotion: "surprised"
            - speaker: "{companion_b}"
              lines:
                - "둘 다."
              emotion: "smiling"
            - speaker: "narrator"
              lines:
                - "잠시 침묵이 흘렀다. 그리고 탱커는 한숨을 내쉬었다."
              emotion: "narration"
          choices:
            - text: "두 사람 잘 어울리는 것 같은데요."
              affinity_change: 8
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "잘 어울린다고? ...그렇게 보여?"
                  emotion: "flustered"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스는 눈이 있네. 우린 최고의 콤비야."
                  emotion: "proud"
            - text: "다음엔 작전 좀 맞추세요."
              affinity_change: 5
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "맞아. 크리스 말이 맞아. 다음엔 신호 정하자."
                  emotion: "serious"
                - speaker: "{companion_b}"
                  lines:
                    - "...알았어. 세 번 두드리면 돌진한다."
                  emotion: "agreeing"

        - id: "td_l1_after_battle_thanks"
          title: "처음 하는 감사"
          trigger: "after_battle"
          location: "전장 근처"
          bgm: "bgm_battle_aftermath"
          has_cg: false
          description: "딜러가 처음으로 탱커에게 감사를 표하는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "전투가 끝났다. {companion_b}는 쓰러지기 직전이었다."
                - "{companion_a}가 가까스로 적의 마지막 공격을 막아냈다."
              emotion: "narration"
            - speaker: "{companion_b}"
              lines:
                - "...고마워."
              emotion: "quiet"
            - speaker: "{companion_a}"
              lines:
                - "응?"
              emotion: "surprised"
            - speaker: "{companion_b}"
              lines:
                - "고맙다고. 한 번만 말할 거야. 두 번은 없어."
              emotion: "stubborn"
            - speaker: "{companion_a}"
              lines:
                - "...들었어. 잘 들었어."
              emotion: "warm"
          choices:
            - text: "둘 다 수고했어요."
              affinity_change: 10
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "크리스도 잘 싸웠어."
                  emotion: "satisfied"
                - speaker: "{companion_a}"
                  lines:
                    - "다음에도 같이 싸우자. 셋이서."
                  emotion: "determined"
            - text: "그냥 지켜본다."
              affinity_change: 6
              response:
                - speaker: "narrator"
                  lines:
                    - "크리스는 조용히 미소지으며 두 사람 곁을 지켰다."
                  emotion: "narration"

      level_2:
        - id: "td_l2_night_watch_past"
          title: "방패와 검의 이유"
          trigger: "night"
          location: "야간 파수"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "야간 파수 중 서로의 과거와 싸우는 이유를 나누는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "달빛도 없는 밤. {companion_a}와 {companion_b}가 나란히 서서 주변을 경계했다."
              emotion: "narration"
            - speaker: "{companion_b}"
              lines:
                - "...너는 왜 방패를 든 거야?"
              emotion: "curious"
            - speaker: "{companion_a}"
              lines:
                - "지킬 것이 있어서."
                - "잃고 싶지 않은 게 생겼을 때, 자연스럽게 방패를 들게 됐어."
              emotion: "sincere"
            - speaker: "{companion_b}"
              lines:
                - "나는... 부술 것이 있어서 검을 들었어."
                - "없애야 할 것. 무너뜨려야 할 것."
              emotion: "dark"
            - speaker: "{companion_a}"
              lines:
                - "그게 이 잔향 차원에도 있어?"
              emotion: "gentle"
            - speaker: "{companion_b}"
              lines:
                - "...모르겠어. 하지만 싸우는 건 익숙하니까."
                - "그리고 지금은... 지킬 것도 생긴 것 같고."
              emotion: "quiet"
            - speaker: "{companion_a}"
              lines:
                - "나도 그래."
              emotion: "warm"
          choices:
            - text: "두 사람이 함께라서 든든해요."
              affinity_change: 15
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스... 우리도 너를 지킬게."
                  emotion: "resolved"
                - speaker: "{companion_b}"
                  lines:
                    - "...말 잘했어, 크리스."
                  emotion: "approving"
            - text: "이 차원에서 잃은 것은 없나요?"
              affinity_change: 10
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "여기서는 아직 없어. 그래서 더 조심해야지."
                  emotion: "serious"
                - speaker: "{companion_a}"
                  lines:
                    - "잃지 않게 내가 막겠어. 둘 다."
                  emotion: "protective"

  # ----------------------------------------------------------
  # 힐러 & 딜러 (Healer & DPS)
  # ----------------------------------------------------------
  healer_and_dps:
    match_type: "role_pair"
    roles:
      - ["healer", "physical_dps"]
      - ["healer", "magic_dps"]
    description: "치유의 손길과 파괴의 칼날이 만나는 엉뚱하고 따뜻한 관계"

    scenes:
      level_1:
        - id: "hd_l1_bitter_medicine"
          title: "쓴 약"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_playful"
          has_cg: false
          description: "힐러가 딜러에게 쓴 약을 강제로 먹이려는 코믹한 장면"
          dialogues:
            - speaker: "{companion_a}"
              lines:
                - "자, 입 벌려."
              emotion: "determined"
            - speaker: "{companion_b}"
              lines:
                - "싫어. 그거 어제도 쓰다고."
              emotion: "refusing"
            - speaker: "{companion_a}"
              lines:
                - "상처 감염되면 손 못 써. 어서!"
              emotion: "stern"
            - speaker: "{companion_b}"
              lines:
                - "야, 잠깐!"
              emotion: "fleeing"
            - speaker: "narrator"
              lines:
                - "야영지에 추격전이 벌어졌다. 릴리가 손뼉을 치며 웃었다."
              emotion: "narration"
            - speaker: "릴리"
              lines:
                - "두 분 진짜 사이좋아 보여요~"
              emotion: "amused"
            - speaker: "{companion_b}"
              lines:
                - "이게 사이 좋아 보여?!"
              emotion: "exasperated"
            - speaker: "{companion_a}"
              lines:
                - "잡았다."
              emotion: "triumphant"
          choices:
            - text: "제가 중재할게요."
              affinity_change: 8
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "크리스! 살려줘!"
                  emotion: "desperate"
                - speaker: "{companion_a}"
                  lines:
                    - "크리스, 잡아줘."
                  emotion: "cunning"
                - speaker: "narrator"
                  lines:
                    - "크리스는 잠시 고민하다가 힐러 편을 들었다."
                  emotion: "narration"
            - text: "저도 같이 피할게요."
              affinity_change: 6
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스까지?! 배신자들!"
                  emotion: "betrayed"
                - speaker: "{companion_b}"
                  lines:
                    - "하하, 도망가!"
                  emotion: "laughing"

        - id: "hd_l1_late_healing"
          title: "늦은 치유"
          trigger: "after_battle"
          location: "전장 근처"
          bgm: "bgm_melancholy"
          has_cg: false
          description: "힐러의 치유가 늦어졌고, 딜러가 크게 다친 후의 감정적인 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{companion_b}가 큰 상처를 입었다. {companion_a}의 치유가 한 박자 늦었다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "미안해. 내가... 조금만 더 빨리 왔더라면."
              emotion: "guilty"
            - speaker: "{companion_b}"
              lines:
                - "야, 울지 마."
              emotion: "awkward"
            - speaker: "{companion_a}"
              lines:
                - "안 울어. 눈에 뭐가 들어간 거야."
              emotion: "teary"
            - speaker: "{companion_b}"
              lines:
                - "...아프긴 한데. 네 덕에 살았어."
                - "그거면 된 거야."
              emotion: "sincere"
            - speaker: "{companion_a}"
              lines:
                - "다음엔 더 빨리 갈게. 약속해."
              emotion: "resolved"
          choices:
            - text: "둘 다 괜찮아요?"
              affinity_change: 10
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "응. 이 정도는 괜찮아. 걱정 마."
                  emotion: "tough"
                - speaker: "{companion_a}"
                  lines:
                    - "다음엔 제가 더 잘할게요. 크리스도 안 다치도록."
                  emotion: "sincere"
            - text: "힐러 잘못 아니에요. 전투가 거셌으니까."
              affinity_change: 12
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "...크리스가 그렇게 말해줘서 조금 나아졌어."
                  emotion: "relieved"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스 말이 맞아. 너 탓 아니야."
                  emotion: "reassuring"

      level_2:
        - id: "hd_l2_herb_cooking"
          title: "약초 요리"
          trigger: "cooking"
          location: "야영지 부엌"
          bgm: "bgm_cooking_warm"
          has_cg: false
          description: "힐러가 약초로 만든 요리를 딜러에게 주는 훈훈한 장면"
          dialogues:
            - speaker: "{companion_a}"
              lines:
                - "자, 먹어봐. 회복에 좋은 약초로 만들었어."
              emotion: "proud"
            - speaker: "{companion_b}"
              lines:
                - "...약이야, 요리야?"
              emotion: "suspicious"
            - speaker: "{companion_a}"
              lines:
                - "둘 다. 먹으면 상처 회복이 빨라지고 맛도 있어."
              emotion: "confident"
            - speaker: "{companion_b}"
              lines:
                - "...어? 진짜 맛있다."
              emotion: "surprised"
            - speaker: "{companion_a}"
              lines:
                - "당연하지. 나 요리도 잘해."
              emotion: "smug"
            - speaker: "{companion_b}"
              lines:
                - "그럼 나도 뭔가 만들어줄게. 어... 내가 할 수 있는 게 뭐가 있지."
              emotion: "thinking"
            - speaker: "{companion_a}"
              lines:
                - "전투 말고 다른 건 없어?"
              emotion: "teasing"
            - speaker: "{companion_b}"
              lines:
                - "...고기 굽기. 그거 잘해."
              emotion: "determined"
          choices:
            - text: "저도 한 입 먹어봐도 돼요?"
              affinity_change: 8
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "물론이죠. 크리스도 드세요~"
                  emotion: "warm"
                - speaker: "{companion_b}"
                  lines:
                    - "내 거 조금 줄게. 근데 조금만."
                  emotion: "reluctant"
            - text: "두 분이 같이 요리하면 잘 될 것 같아요."
              affinity_change: 10
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "오, 그 아이디어 좋은데. 같이 만들어볼까?"
                  emotion: "excited"
                - speaker: "{companion_b}"
                  lines:
                    - "...고기 굽는 건 내가 담당할게."
                  emotion: "agreeing"

  # ----------------------------------------------------------
  # 탱커 & 힐러 (Tank & Healer)
  # ----------------------------------------------------------
  tank_and_healer:
    match_type: "role_pair"
    roles: ["tank", "healer"]
    description: "완벽한 수비와 회복의 콤비, 묵직한 신뢰를 쌓아가는 두 사람"

    scenes:
      level_1:
        - id: "th_l1_perfect_combo"
          title: "완벽한 콤비"
          trigger: "exploration"
          location: "던전 내부"
          bgm: "bgm_dungeon_explore"
          has_cg: false
          description: "탱커가 앞에서 길을 열고 힐러가 뒤를 지키며 서로의 역할을 자각하는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{companion_a}가 방패로 함정을 걷어내며 앞길을 열었다."
                - "{companion_b}는 조용히 뒤따르며 빛의 막을 펼쳤다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "네 치유가 없으면 나는 그냥 깡통이야."
              emotion: "honest"
            - speaker: "{companion_b}"
              lines:
                - "당신 방패가 없으면 저는 그냥 종이예요."
              emotion: "candid"
            - speaker: "{companion_a}"
              lines:
                - "그러니까 둘이 있어야 완성이네."
              emotion: "warm"
            - speaker: "{companion_b}"
              lines:
                - "처음부터 그랬던 것 같아요."
              emotion: "smiling"
          choices:
            - text: "완벽한 팀이에요, 두 분."
              affinity_change: 10
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스까지 있으면 더 완벽하지."
                  emotion: "confident"
                - speaker: "{companion_b}"
                  lines:
                    - "맞아요. 셋이서라면 어디든 갈 수 있어요."
                  emotion: "cheerful"
            - text: "저도 역할이 있나요?"
              affinity_change: 8
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "당연하지. 크리스는 우리 중심이야."
                  emotion: "sincere"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스가 없었으면 우리 여기까지 못 왔어요."
                  emotion: "earnest"

        - id: "th_l1_hidden_wound"
          title: "숨겨진 상처"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "힐러가 탱커의 갑옷 틈새 상처를 발견하고 치료하는 감동적인 장면"
          dialogues:
            - speaker: "{companion_b}"
              lines:
                - "잠깐, 거기... 갑옷 틈새에 피가 맺혀 있어요."
              emotion: "concerned"
            - speaker: "{companion_a}"
              lines:
                - "어, 그건 별거 아니야. 신경 쓰지 마."
              emotion: "dismissive"
            - speaker: "{companion_b}"
              lines:
                - "신경 쓰여요. 앉아요."
              emotion: "firm"
            - speaker: "narrator"
              lines:
                - "{companion_b}가 조용히 상처를 치료했다. {companion_a}는 말이 없었다."
              emotion: "narration"
            - speaker: "{companion_b}"
              lines:
                - "왜 아프면서 말 안 해요?"
              emotion: "sad"
            - speaker: "{companion_a}"
              lines:
                - "...말하면 걱정할까 봐."
              emotion: "quiet"
            - speaker: "{companion_b}"
              lines:
                - "걱정하는 게 내 역할이에요. 앞으로는 말해줘요."
              emotion: "earnest"
          choices:
            - text: "탱커가 많이 무리했군요."
              affinity_change: 12
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "...크리스도 눈치챘어? 잘 숨겼다고 생각했는데."
                  emotion: "sheepish"
                - speaker: "{companion_b}"
                  lines:
                    - "앞으로는 셋이서 나눠서 부담해요."
                  emotion: "caring"
            - text: "조용히 옆에 앉는다."
              affinity_change: 8
              response:
                - speaker: "narrator"
                  lines:
                    - "크리스가 말없이 옆에 앉았다. 셋이 나란히, 조용히 밤을 보냈다."
                  emotion: "narration"

      level_2:
        - id: "th_l2_silent_cape"
          title: "망토"
          trigger: "night"
          location: "야영지"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "탱커가 잠든 힐러에게 망토를 덮어주는 조용한 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "한밤중, {companion_b}가 파수 중에 깜빡 잠이 들었다."
                - "{companion_a}는 조용히 자신의 망토를 벗어 {companion_b}의 어깨에 덮었다."
                - "힐러는 사실 알고 있었지만, 모른 척 눈을 감았다."
              emotion: "narration"
            - speaker: "narrator"
              lines:
                - "다음 날 아침."
              emotion: "narration"
            - speaker: "{companion_b}"
              lines:
                - "어젯밤... 따뜻했어요."
              emotion: "soft"
            - speaker: "{companion_a}"
              lines:
                - "그래? 날씨가 좋았나 보지."
              emotion: "casual"
            - speaker: "{companion_b}"
              lines:
                - "...네. 날씨가 좋았어요."
              emotion: "smiling"
          choices:
            - text: "두 분 사이 좋아 보여요."
              affinity_change: 15
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "...동료니까. 당연한 거야."
                  emotion: "flustered"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스도 포함해서 셋이 사이 좋은 거예요~"
                  emotion: "cheerful"
            - text: "어젯밤 추웠죠? 저도 몰랐어요."
              affinity_change: 10
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스는 일찍 자서 몰랐겠지. 괜찮아."
                  emotion: "warm"
                - speaker: "{companion_b}"
                  lines:
                    - "덕분에 잘 잤어요."
                  emotion: "grateful"

  # ----------------------------------------------------------
  # 딜러 & 딜러 (DPS & DPS)
  # ----------------------------------------------------------
  dps_and_dps:
    match_type: "role_pair"
    roles: ["physical_dps", "magic_dps"]
    description: "물리와 마법의 라이벌이자 전우, 경쟁과 우정 사이의 두 딜러"

    scenes:
      level_1:
        - id: "dd_l1_kill_count"
          title: "킬 카운트"
          trigger: "after_battle"
          location: "전장 근처"
          bgm: "bgm_battle_aftermath"
          has_cg: false
          description: "누가 더 많이 잡았는지 경쟁하는 유치한 장면"
          dialogues:
            - speaker: "{companion_a}"
              lines:
                - "이번에 내가 셋 잡았어! 최고 기록이야."
              emotion: "boasting"
            - speaker: "{companion_b}"
              lines:
                - "나는 넷. 범위 마법이니까 한 번에 쓸었거든."
              emotion: "smug"
            - speaker: "{companion_a}"
              lines:
                - "범위는 반칙이잖아! 하나하나 제대로 잡은 건 나야."
              emotion: "protesting"
            - speaker: "{companion_b}"
              lines:
                - "결과가 중요한 거야, 방법이 아니라."
              emotion: "logical"
            - speaker: "{companion_a}"
              lines:
                - "다음엔 내가 다섯 잡는다. 두고 봐."
              emotion: "determined"
            - speaker: "{companion_b}"
              lines:
                - "해봐. 나는 여섯 잡을게."
              emotion: "competitive"
          choices:
            - text: "저는 한 명 잡았어요."
              affinity_change: 6
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스도 잡았어? 그럼 우리 팀 총합이..."
                  emotion: "calculating"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스 포함하면 여덟. 우리 팀 최고야."
                  emotion: "satisfied"
            - text: "그런 경쟁 의미 없지 않나요?"
              affinity_change: 8
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "의미 있어! 실력이 느는 거잖아."
                  emotion: "insisting"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스는 철학자야. 어쨌든 난 네 명이 맞아."
                  emotion: "amused"

        - id: "dd_l1_trap"
          title: "함정 확인법"
          trigger: "exploration"
          location: "던전 내부"
          bgm: "bgm_dungeon_explore"
          has_cg: false
          description: "마법딜러가 함정을 발견했는데 물리딜러가 무작정 밟아버리는 장면"
          dialogues:
            - speaker: "{companion_b}"
              lines:
                - "잠깐, 저기 바닥에 함정 마법진이 있어. 멈춰."
              emotion: "alert"
            - speaker: "narrator"
              lines:
                - "{companion_a}가 그대로 걸어가서 마법진을 밟았다."
                - "쿵 소리와 함께 천장에서 돌이 쏟아졌다."
              emotion: "narration"
            - speaker: "{companion_b}"
              lines:
                - "왜 멈추라 했는데 걸어가?!"
              emotion: "shocked"
            - speaker: "{companion_a}"
              lines:
                - "함정이 있으면 몸으로 확인하는 거 아니야?"
              emotion: "calm"
            - speaker: "{companion_b}"
              lines:
                - "그게 무슨 논리야?!"
              emotion: "exasperated"
            - speaker: "{companion_a}"
              lines:
                - "빠르잖아. 어, 이 정도는 버티지."
              emotion: "shrugging"
          choices:
            - text: "괜찮아요, {companion_a}?"
              affinity_change: 8
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "응. 멀쩡해. 이제 함정 없어졌으니까 가자."
                  emotion: "unbothered"
                - speaker: "{companion_b}"
                  lines:
                    - "...이게 매번 이런 식이야. 크리스, 다음엔 말려줘."
                  emotion: "resigned"
            - text: "이게 효율적인 방법인 것도 같긴 한데..."
              affinity_change: 5
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "크리스도 이상한 말 하지 마!!"
                  emotion: "betrayed"
                - speaker: "{companion_a}"
                  lines:
                    - "크리스는 이해력이 있어. 역시 좋아."
                  emotion: "validated"

      level_2:
        - id: "dd_l2_night_future"
          title: "이 차원을 나가면"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "밤하늘을 보며 나누는 진지한 전우 대화"
          dialogues:
            - speaker: "{companion_a}"
              lines:
                - "야."
              emotion: "casual"
            - speaker: "{companion_b}"
              lines:
                - "응?"
              emotion: "distracted"
            - speaker: "{companion_a}"
              lines:
                - "이 잔향 차원에서 나가면 뭐 하고 싶어?"
              emotion: "sincere"
            - speaker: "{companion_b}"
              lines:
                - "...생각해본 적 없어."
                - "이 차원 자체가 메아리라며. 나가면 또 다른 메아리일 수도 있잖아."
              emotion: "thoughtful"
            - speaker: "{companion_a}"
              lines:
                - "그래도 뭔가 하고 싶은 거 있을 거잖아."
              emotion: "pressing"
            - speaker: "{companion_b}"
              lines:
                - "...모르겠어. 근데 같이 싸운 건 기억할 거야."
                - "이 차원에서 네 옆에서 싸운 것. 그건 진짜인 것 같아."
              emotion: "earnest"
            - speaker: "{companion_a}"
              lines:
                - "나도."
              emotion: "quiet"
          choices:
            - text: "저도 같이 기억할게요."
              affinity_change: 15
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "크리스도? 그럼 셋이서 기억하는 거네."
                  emotion: "warm"
                - speaker: "{companion_b}"
                  lines:
                    - "잔향이라도 진짜 기억이면 됐어."
                  emotion: "resolved"
            - text: "이 차원의 다음이 있을까요?"
              affinity_change: 10
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "릴리가 알겠지. 나중에 물어봐야지."
                  emotion: "curious"
                - speaker: "{companion_b}"
                  lines:
                    - "어떻게 돼도, 지금 이 순간은 진짜야."
                  emotion: "certain"

  # ----------------------------------------------------------
  # 범용 씬 (어떤 역할 조합이든 발동 가능)
  # ----------------------------------------------------------
  any_companion:
    match_type: "any"
    description: "역할에 무관하게 어떤 동료 조합이든 발동되는 범용 씬"

    scenes:
      level_1:
        - id: "any_l1_first_camp"
          title: "첫 야영"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "어색한 첫 야영, 동료들이 서로를 알아가기 시작하는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "첫 야영의 밤. 불꽃이 조용히 타올랐다."
                - "아직 서로를 잘 모르는 네 사람이 각자 자리에 앉아 있었다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "있잖아... 왜 이 여행에 참여했어?"
              emotion: "curious"
            - speaker: "narrator"
              lines:
                - "{companion_b}가 잠시 생각에 잠겼다."
              emotion: "narration"
          choices:
            - text: "저도 궁금해요."
              affinity_change: 8
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "이유... 솔직히 말하면, 혼자서는 여기서 살아남을 자신이 없었어."
                    - "그래서 같이 가도 괜찮냐고 했더니 크리스가 받아줬지."
                  emotion: "honest"
                - speaker: "{companion_a}"
                  lines:
                    - "...그래? 나도 비슷한 이유야."
                  emotion: "surprised"
            - text: "이유가 있어야 해요?"
              affinity_change: 10
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "크리스는 의외로 철학자네. 맞는 말이야."
                  emotion: "amused"
                - speaker: "{companion_a}"
                  lines:
                    - "이유는 나중에 생겨도 되는 거니까."
                  emotion: "thoughtful"
                - speaker: "릴리"
                  lines:
                    - "저는 이 차원이 왜 생겼는지 알고 싶어서요. 그게 이유라면요?"
                  emotion: "soft"

        - id: "any_l1_rain_shelter"
          title: "비 오는 날"
          trigger: "rain"
          location: "동굴"
          bgm: "bgm_rain"
          has_cg: false
          description: "비를 피해 동굴에 모인 파티가 릴리의 노래로 평화로운 시간을 보내는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "갑자기 쏟아지는 비. 일행은 근처 동굴로 피신했다."
                - "빗소리가 동굴 입구를 가득 채웠다."
              emotion: "narration"
            - speaker: "릴리"
              lines:
                - "비 오는 날엔 노래가 잘 어울린다고 하잖아요."
              emotion: "cheerful"
            - speaker: "narrator"
              lines:
                - "릴리가 조용히 노래를 시작했다."
                - "멜로디가 동굴 안에 울려 퍼지자, 동료들이 하나둘 합류했다."
                - "가사도 모르면서, 흥얼거리기만 해도 충분했다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "...이상하네. 싸우는 것도 아닌데 마음이 편안해."
              emotion: "peaceful"
            - speaker: "{companion_b}"
              lines:
                - "이 차원에서도 이런 시간이 있구나."
              emotion: "wondering"
          choices:
            - text: "같이 흥얼거린다."
              affinity_change: 10
              response:
                - speaker: "릴리"
                  lines:
                    - "크리스도 노래 알아요?"
                  emotion: "delighted"
                - speaker: "크리스"
                  lines:
                    - "모르지만... 좋아요."
                  emotion: "warm"
                - speaker: "narrator"
                  lines:
                    - "넷이서 빗소리와 노래 속에 잠시 전투를 잊었다."
                  emotion: "narration"
            - text: "릴리, 어디서 배운 노래예요?"
              affinity_change: 8
              response:
                - speaker: "릴리"
                  lines:
                    - "음... 기억이 잘 안 나요. 어딘가에서 들은 것 같기도 하고."
                    - "이 차원이 반향이니까, 이 노래도 어딘가의 반향일지도 몰라요."
                  emotion: "wondering"

      level_2:
        - id: "any_l2_village_festival"
          title: "마을 축제"
          trigger: "festival"
          location: "마을 광장"
          bgm: "bgm_festival"
          has_cg: false
          description: "마을 축제에서 동료들이 각자의 방식으로 즐기는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "작은 마을에서 축제가 열렸다. 잔향 차원에도 이런 순간이 있었다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "음식이 여기도 있잖아. 저거 먹어봐야지."
              emotion: "excited"
            - speaker: "{companion_b}"
              lines:
                - "저기 게임 부스 있는데. 내기해볼까."
              emotion: "interested"
            - speaker: "릴리"
              lines:
                - "다들 각자 즐기고 있네요~ 크리스는요?"
              emotion: "amused"
            - speaker: "크리스"
              lines:
                - "저는... 다들 구경하는 게 좋아요."
              emotion: "warm"
            - speaker: "릴리"
              lines:
                - "저도 그래요. 이런 날이 진짜인 것 같아요."
              emotion: "peaceful"
          choices:
            - text: "{companion_a}랑 같이 먹으러 가요."
              affinity_change: 10
              response:
                - speaker: "{companion_a}"
                  lines:
                    - "오, 크리스도 와! 이거 진짜 맛있어."
                  emotion: "enthusiastic"
                - speaker: "narrator"
                  lines:
                    - "잠시나마 차원의 위기를 잊고, 넷은 축제를 즐겼다."
                  emotion: "narration"
            - text: "{companion_b}랑 게임 해봐요."
              affinity_change: 10
              response:
                - speaker: "{companion_b}"
                  lines:
                    - "좋아. 이기면 내 말 한 번 들어줘야 해."
                  emotion: "competitive"
                - speaker: "크리스"
                  lines:
                    - "...지면 어떻게 해요?"
                  emotion: "curious"
                - speaker: "{companion_b}"
                  lines:
                    - "그때 생각할게."
                  emotion: "smiling"

        - id: "any_l2_stargazing"
          title: "별자리 이야기"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "밤하늘의 별자리를 보며 각자 고향의 이야기를 나누는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "맑은 밤. 잔향 차원의 하늘에는 별들이 가득했다."
              emotion: "narration"
            - speaker: "{companion_a}"
              lines:
                - "저 별자리... 고향에서 본 거랑 달라."
              emotion: "nostalgic"
            - speaker: "{companion_b}"
              lines:
                - "그래. 이 차원만의 별자리인가 봐."
              emotion: "thoughtful"
            - speaker: "릴리"
              lines:
                - "이 차원의 별자리는 제가 만들었어요... 라고 하면 믿어요?"
              emotion: "teasing"
            - speaker: "{companion_a}"
              lines:
                - "믿어."
              emotion: "deadpan"
            - speaker: "{companion_b}"
              lines:
                - "나도."
              emotion: "deadpan"
            - speaker: "릴리"
              lines:
                - "어머, 진짜요?! 저도 모르겠는데..."
              emotion: "surprised"
            - speaker: "narrator"
              lines:
                - "넷이 웃음을 터뜨렸다. 잔향 차원의 밤하늘 아래."
              emotion: "narration"
          choices:
            - text: "릴리는 이 차원을 어떻게 생각해요?"
              affinity_change: 12
              response:
                - speaker: "릴리"
                  lines:
                    - "무섭기도 하고, 신기하기도 하고..."
                    - "근데 이런 밤이 있으면, 나쁘지 않다는 생각도 해요."
                  emotion: "honest"
                - speaker: "{companion_a}"
                  lines:
                    - "나도 그래. 여기도 살만한 것 같아."
                  emotion: "peaceful"
            - text: "저는 이 별자리가 마음에 들어요."
              affinity_change: 10
              response:
                - speaker: "릴리"
                  lines:
                    - "그럼 크리스 별자리예요. 이름 지어줄게요."
                  emotion: "warm"
                - speaker: "{companion_b}"
                  lines:
                    - "크리스 자리. 나쁘지 않네."
                  emotion: "smiling"

  # ----------------------------------------------------------
  # 역할별 개인 씬 (특정 역할이 파티에 있을 때 발동)
  # ----------------------------------------------------------

  # 탱커가 파티에 있을 때
  has_tank:
    match_type: "has_role"
    required_role: "tank"
    description: "탱커가 파티에 있을 때 발동되는 씬"

    scenes:
      level_1:
        - id: "tank_l1_heavy_shield"
          title: "무거운 방패"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "탱커의 독백을 크리스가 듣게 되는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{tank}가 혼자 방패를 닦고 있었다."
                - "긁힌 자국들. 전투의 흔적들."
              emotion: "narration"
            - speaker: "{tank}"
              lines:
                - "지키는 게 내 존재 이유야. 그게 없으면 나는 그냥 무거운 갑옷이고."
              emotion: "quiet"
            - speaker: "크리스"
              lines:
                - "...혼자 짊어지지 마요."
              emotion: "gentle"
            - speaker: "{tank}"
              lines:
                - "크리스? 듣고 있었어?"
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "다 짊어질 필요 없어요. 우리도 있으니까."
              emotion: "sincere"
            - speaker: "{tank}"
              lines:
                - "...그래. 맞아."
              emotion: "relieved"
          choices:
            - text: "우리가 함께 짊어질게요."
              affinity_change: 15
              response:
                - speaker: "{tank}"
                  lines:
                    - "크리스... 고마워. 그 말이 필요했던 것 같아."
                  emotion: "moved"
            - text: "방패, 새거로 바꾸는 건 어때요?"
              affinity_change: 6
              response:
                - speaker: "{tank}"
                  lines:
                    - "이거... 바꿀 수 없어. 기억이 담겨있거든."
                  emotion: "quiet"
                - speaker: "크리스"
                  lines:
                    - "...미안해요. 몰랐어요."
                  emotion: "sorry"

        - id: "tank_l1_under_armor"
          title: "갑옷 아래"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_melancholy"
          has_cg: false
          description: "탱커가 갑옷을 벗었을 때 드러나는 상처들, 릴리가 치료하며 감정을 나누는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{tank}가 갑옷을 벗었다."
                - "온몸에 크고 작은 상처 자국들."
                - "릴리가 그것을 보고 멈췄다."
              emotion: "narration"
            - speaker: "릴리"
              lines:
                - "...이게 다..."
              emotion: "shocked"
            - speaker: "{tank}"
              lines:
                - "울지 마."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "안 울어요. 눈에 먼지가 들어가서..."
              emotion: "teary"
            - speaker: "{tank}"
              lines:
                - "이건 다 훈장이야. 지켜낸 증거들."
              emotion: "proud"
            - speaker: "릴리"
              lines:
                - "...치료할게요. 가만히 있어요."
              emotion: "determined"
          choices:
            - text: "정말 대단해요."
              affinity_change: 12
              response:
                - speaker: "{tank}"
                  lines:
                    - "크리스도 언젠가 이런 상처가 생기면... 훈장이라고 생각해."
                  emotion: "warm"
                - speaker: "릴리"
                  lines:
                    - "크리스는 상처 없이 이 차원을 나가면 좋겠어요."
                  emotion: "caring"
            - text: "아프지 않아요?"
              affinity_change: 10
              response:
                - speaker: "{tank}"
                  lines:
                    - "아파. 근데 아프면 살아있다는 뜻이지."
                  emotion: "wry"
                - speaker: "릴리"
                  lines:
                    - "그런 말 하지 말아요... 우리가 지켜줄 테니까."
                  emotion: "earnest"

  # 힐러가 파티에 있을 때
  has_healer:
    match_type: "has_role"
    required_role: "healer"
    description: "힐러가 파티에 있을 때 발동되는 씬"

    scenes:
      level_1:
        - id: "healer_l1_healers_cost"
          title: "치유의 대가"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "자신을 돌보지 않는 힐러를 크리스가 발견하고 역으로 돌봐주는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{healer}가 다른 사람들을 모두 치료하고 홀로 앉아 있었다."
                - "크리스가 보니, 힐러의 손에 작은 상처가 있었다."
              emotion: "narration"
            - speaker: "크리스"
              lines:
                - "거기, 손 다친 거 아니에요?"
              emotion: "concerned"
            - speaker: "{healer}"
              lines:
                - "응? 아, 이거 별거 아니야. 전투 중에 긁힌 거."
              emotion: "dismissive"
            - speaker: "크리스"
              lines:
                - "치료 안 해도 돼요?"
              emotion: "gentle"
            - speaker: "{healer}"
              lines:
                - "다른 사람들 다 치료하고 나면 마나가 없어서... 내 건 나중에."
              emotion: "tired"
            - speaker: "크리스"
              lines:
                - "저한테 마나 없어도 되는 치료법 가르쳐줘요. 제가 할게요."
              emotion: "sincere"
            - speaker: "{healer}"
              lines:
                - "...너도 돌봄 받을 자격 있어. 그 말 나한테도 해야겠다."
              emotion: "touched"
          choices:
            - text: "당신도 우리한테 중요해요."
              affinity_change: 15
              response:
                - speaker: "{healer}"
                  lines:
                    - "알아. 근데 자꾸 잊게 돼. 크리스 덕에 기억했어."
                  emotion: "grateful"
            - text: "다음엔 마나 분배 좀 해요."
              affinity_change: 8
              response:
                - speaker: "{healer}"
                  lines:
                    - "...그래, 나도 남겨둬야지. 감사해, 크리스."
                  emotion: "reflective"

        - id: "healer_l1_herb_lesson"
          title: "약초 채집"
          trigger: "exploration"
          location: "숲 속"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "릴리와 힐러가 약초 채집을 하며 정체성에 대해 나누는 대화"
          dialogues:
            - speaker: "narrator"
              lines:
                - "탐험 중 약초 가득한 숲 속. {healer}가 릴리를 불렀다."
              emotion: "narration"
            - speaker: "{healer}"
              lines:
                - "릴리, 이거 알아? 이 잎은 상처 소독에 쓰이고, 저 꽃은 열 내리는 데 좋아."
              emotion: "teaching"
            - speaker: "릴리"
              lines:
                - "와, 어떻게 다 알아요?"
              emotion: "curious"
            - speaker: "{healer}"
              lines:
                - "오래 배웠지. 약초는 말이 없어도 많은 걸 알려줘."
              emotion: "warm"
            - speaker: "릴리"
              lines:
                - "저도... 누군가를 치유할 수 있을까요?"
                - "저는 이 차원의 반향이라서, 진짜 힘이 있는 건지 모르겠어요."
              emotion: "uncertain"
            - speaker: "{healer}"
              lines:
                - "릴리가 노래할 때, 다들 마음이 편해지잖아. 그게 치유야."
                - "마나가 없어도 누군가를 낫게 하는 방법은 많아."
              emotion: "sincere"
            - speaker: "릴리"
              lines:
                - "...고마워요. 그 말이 위로가 됐어요."
              emotion: "touched"
          choices:
            - text: "릴리는 이미 치유하고 있어요."
              affinity_change: 12
              response:
                - speaker: "릴리"
                  lines:
                    - "크리스도 그렇게 생각해요?"
                  emotion: "hopeful"
                - speaker: "{healer}"
                  lines:
                    - "보이지? 크리스도 느끼고 있어."
                  emotion: "affirming"
            - text: "저도 약초 이름 배우고 싶어요."
              affinity_change: 8
              response:
                - speaker: "{healer}"
                  lines:
                    - "좋아, 그럼 오늘부터 수업이야. 이건 민들레인데..."
                  emotion: "enthusiastic"
                - speaker: "릴리"
                  lines:
                    - "저도 같이 배울게요!"
                  emotion: "cheerful"

  # 물리 딜러가 파티에 있을 때
  has_physical_dps:
    match_type: "has_role"
    required_role: "physical_dps"
    description: "물리 딜러가 파티에 있을 때 발동되는 씬"

    scenes:
      level_1:
        - id: "pdps_l1_sword_weight"
          title: "검의 무게"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_melancholy"
          has_cg: false
          description: "물리딜러가 수련 중 스승을 회상하며 세계관에 의문을 품는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "{physical_dps}가 홀로 검술을 수련하고 있었다."
                - "그 눈빛이 어딘가 먼 곳을 향하고 있었다."
              emotion: "narration"
            - speaker: "{physical_dps}"
              lines:
                - "이 검술은... 스승에게 배웠는데."
                - "스승도 이 잔향 차원의 메아리일까."
              emotion: "quiet"
            - speaker: "크리스"
              lines:
                - "스승이 있었어요?"
              emotion: "gentle"
            - speaker: "{physical_dps}"
              lines:
                - "응. 엄하고, 무뚝뚝하고, 근데... 정이 있는 사람이었어."
                - "이 차원이 메아리라면, 내가 배운 검술도 메아리인 건가."
              emotion: "wondering"
            - speaker: "크리스"
              lines:
                - "당신이 지금 쓰는 검술은 진짜예요. 제가 봤어요."
              emotion: "certain"
            - speaker: "{physical_dps}"
              lines:
                - "...그래. 그게 중요한 거지."
              emotion: "resolving"
          choices:
            - text: "스승을 그리워하는군요."
              affinity_change: 12
              response:
                - speaker: "{physical_dps}"
                  lines:
                    - "그래. 이 차원 나가면 만날 수 있을까... 있다면 보여주고 싶어. 이만큼 강해졌다고."
                  emotion: "nostalgic"
            - text: "검술 가르쳐줄 수 있어요?"
              affinity_change: 8
              response:
                - speaker: "{physical_dps}"
                  lines:
                    - "크리스가 배우고 싶어? 좋아. 스승한테 배운 첫 번째 자세부터 시작하자."
                  emotion: "warm"

        - id: "pdps_l1_dawn_training"
          title: "새벽 수련"
          trigger: "camp"
          location: "야영지 외곽"
          bgm: "bgm_morning"
          has_cg: false
          description: "크리스와 물리딜러가 새벽에 함께 수련하며 경쟁의식과 성장을 나누는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "새벽, 해가 뜨기 전. {physical_dps}가 홀로 수련 중이었다."
                - "크리스가 눈을 비비며 나왔다."
              emotion: "narration"
            - speaker: "{physical_dps}"
              lines:
                - "벌써 일어났어? 보통 사람들은 이 시간에 자는데."
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "당신이 나와 있으면 저도 나와야 할 것 같아서요."
              emotion: "determined"
            - speaker: "narrator"
              lines:
                - "둘이서 수련을 시작했다. 크리스가 새로운 동작을 시도하다가 넘어졌다."
                - "그리고 다시 일어났다. 또 시도했다."
              emotion: "narration"
            - speaker: "{physical_dps}"
              lines:
                - "...너한테 지면 안 되는데."
              emotion: "muttering"
            - speaker: "크리스"
              lines:
                - "들었어요."
              emotion: "amused"
            - speaker: "{physical_dps}"
              lines:
                - "안 들렸으면 했는데."
              emotion: "embarrassed"
          choices:
            - text: "같이 강해져요."
              affinity_change: 15
              response:
                - speaker: "{physical_dps}"
                  lines:
                    - "...그래. 같이 강해지는 거라면 지는 게 아니니까."
                  emotion: "accepting"
            - text: "저한테 질 것 같아요?"
              affinity_change: 10
              response:
                - speaker: "{physical_dps}"
                  lines:
                    - "아직은 아니야! 하지만 크리스는 빠르게 느는 것 같아서..."
                  emotion: "wary"
                - speaker: "크리스"
                  lines:
                    - "열심히 할게요."
                  emotion: "smiling"

  # 마법 딜러가 파티에 있을 때
  has_magic_dps:
    match_type: "has_role"
    required_role: "magic_dps"
    description: "마법 딜러가 파티에 있을 때 발동되는 씬"

    scenes:
      level_1:
        - id: "mdps_l1_mana_overflow"
          title: "마력의 폭주"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_tense"
          has_cg: false
          description: "마법딜러가 수면 중 마력이 폭주하고 릴리가 안정화하며 로어 힌트를 주는 장면"
          dialogues:
            - speaker: "narrator"
              lines:
                - "한밤중, {magic_dps}의 몸에서 마력이 새어나오기 시작했다."
                - "주변 공기가 떨렸다. 릴리가 먼저 깼다."
              emotion: "narration"
            - speaker: "릴리"
              lines:
                - "{magic_dps}!"
              emotion: "urgent"
            - speaker: "narrator"
              lines:
                - "릴리가 조용히 손을 올려 빛을 내보냈다. 마력이 천천히 가라앉았다."
              emotion: "narration"
            - speaker: "{magic_dps}"
              lines:
                - "...나 또 그랬어?"
              emotion: "groggy"
            - speaker: "릴리"
              lines:
                - "이 차원의 마나는... 감정에 반응하는 것 같아요."
                - "잠들면서 뭔가 강한 감정을 느꼈죠?"
              emotion: "thoughtful"
            - speaker: "{magic_dps}"
              lines:
                - "꿈에서... 뭔가를 잃는 장면이 반복됐어."
              emotion: "disturbed"
            - speaker: "릴리"
              lines:
                - "잔향 차원이니까. 기억의 메아리가 꿈으로 나오는 걸 수도 있어요."
              emotion: "gentle"
          choices:
            - text: "괜찮아요?"
              affinity_change: 12
              response:
                - speaker: "{magic_dps}"
                  lines:
                    - "...응. 크리스가 깬 거야? 미안, 깨웠지."
                  emotion: "apologetic"
                - speaker: "크리스"
                  lines:
                    - "아니에요. 같이 있을게요."
                  emotion: "caring"
            - text: "릴리, 잔향 차원의 마나에 대해 더 알아요?"
              affinity_change: 10
              response:
                - speaker: "릴리"
                  lines:
                    - "조금요. 여기 마나는... 원래 차원의 감정이 응축된 것 같아요."
                    - "그래서 강한 감정을 가진 사람일수록 더 강한 마력을 다루지만, 위험하기도 하고."
                  emotion: "explaining"
                - speaker: "{magic_dps}"
                  lines:
                    - "...그런 이유였구나."
                  emotion: "understanding"

        - id: "mdps_l1_starlight_magic"
          title: "별빛 마법"
          trigger: "camp"
          location: "야영지"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "마법딜러가 별빛으로 불꽃놀이를 만들어 파티 전원이 구경하는 아름다운 장면"
          dialogues:
            - speaker: "{magic_dps}"
              lines:
                - "다들 잠깐만. 위 봐봐."
              emotion: "focused"
            - speaker: "narrator"
              lines:
                - "{magic_dps}가 손을 들어올렸다."
                - "하늘에서 별빛이 모여 작은 불꽃들이 피어났다."
                - "금빛, 은빛, 푸른빛. 조용한 불꽃놀이가 야영지를 채웠다."
              emotion: "narration"
            - speaker: "릴리"
              lines:
                - "...예쁘다."
              emotion: "wonder"
            - speaker: "{magic_dps}"
              lines:
                - "전투 말고도 마법을 쓸 수 있어. 이런 것도."
              emotion: "peaceful"
            - speaker: "크리스"
              lines:
                - "잔향 차원에서도 이런 순간이 있네요."
              emotion: "moved"
            - speaker: "{magic_dps}"
              lines:
                - "그래. 메아리라도 아름다운 건 아름다운 거야."
              emotion: "sincere"
          choices:
            - text: "고마워요. 덕분에 좋은 밤이에요."
              affinity_change: 15
              response:
                - speaker: "{magic_dps}"
                  lines:
                    - "다들 고생하니까. 이 정도는 해줄 수 있어."
                  emotion: "warm"
                - speaker: "릴리"
                  lines:
                    - "저도 뭔가 보답하고 싶다. 노래 불러줄까요?"
                  emotion: "happy"
            - text: "저도 마법 배울 수 있을까요?"
              affinity_change: 10
              response:
                - speaker: "{magic_dps}"
                  lines:
                    - "크리스는 마나 체질이야? 확인해봐야 하는데..."
                  emotion: "considering"
                - speaker: "크리스"
                  lines:
                    - "모르겠어요. 그냥 해보고 싶어서요."
                  emotion: "honest"
                - speaker: "{magic_dps}"
                  lines:
                    - "좋아. 내일 가르쳐줄게."
                  emotion: "agreeing"
