# 차원의 잔향 - 친밀도 이벤트 씬 데이터
# Echoes of Dimension - Affinity Scene Data
#
# 친밀도 레벨:
#   Level 0: 모르는 사이 (threshold: 0)
#   Level 1: 동료      (threshold: 50)
#   Level 2: 신뢰      (threshold: 150)
#   Level 3: 친밀      (threshold: 300)
#   Level 4: 깊은 유대  (threshold: 500)
#   Level 5: 영혼의 동반자 (threshold: 750)
#
# trigger 종류:
#   level_up      - 레벨 달성 시 자동 발동
#   camp          - 야영 시 선택 가능
#   after_battle  - 전투(특히 보스) 후 자동 발동
#   exploration   - 탐색 중 발견
#   cooking       - 요리 시 발동
#   night         - 야간 파수 중 발동
#   rain          - 비 오는 날
#   festival      - 축제/이벤트 장소

affinity_scenes:

  # ============================================================
  # 크리스 & 릴리 (주인공 & 히로인 - 메인 페어)
  # ============================================================
  chris_lily:
    pair: ["크리스", "릴리"]
    description: "세피로스의 1만 번 루프를 거친 '잔향'인 릴리와 크리스의 관계 변화"

    scenes:
      # ----------------------------------------------------------
      # Level 1: 동료 (Companions)
      # ----------------------------------------------------------
      level_1:
        - id: "cl_l1_first_meal"
          title: "처음 나누는 식사"
          trigger: "camp"
          location: "숲 속 야영지"
          bgm: "bgm_field_calm"
          has_cg: false
          description: "처음으로 함께 밥을 먹으며 어색하게 대화를 시작하는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "……이상하네요."
                - "같이 밥을 먹는 게 이렇게 어색한 건 처음이에요."
              emotion: "awkward"
            - speaker: "크리스"
              lines:
                - "뭐, 우리 그냥 어제 만났잖아."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "그렇긴 한데… 크리스 씨는 낯선 사람이랑 밥 먹는 거 불편하지 않아요?"
              emotion: "curious"
            - speaker: "크리스"
              lines:
                - "밥은 밥이지. 배고프면 먹는 거야."
              emotion: "casual"
            - speaker: "릴리"
              lines:
                - "……하하. 그렇군요."
                - "어쩐지, 그 말이 좋게 느껴지네요."
              emotion: "smile"
          choices:
            - text: "뭐가 좋아? 내가 한 말이 마음에 들었어?"
              affinity_change: 8
              response:
                speaker: "릴리"
                lines:
                  - "네. 딱 잘라 말하는 사람이 없었거든요. 주변 사람들은 다들 너무 조심스러워서…"
                  - "크리스 씨는 시원시원하네요."
                emotion: "happy"
            - text: "(아무 말 없이 밥을 건넨다)"
              affinity_change: 5
              response:
                speaker: "릴리"
                lines:
                  - "……감사해요."
                  - "(작은 목소리로) 괜찮은 사람 같아요."
                emotion: "shy"
            - text: "그냥 허기 채우자고."
              affinity_change: 2
              response:
                speaker: "릴리"
                lines:
                  - "……그렇죠. 네."
                emotion: "neutral"

        - id: "cl_l1_lily_curious_world"
          title: "바깥세상에 대한 호기심"
          trigger: "exploration"
          location: "언덕 위 전망대"
          bgm: "bgm_field_light"
          has_cg: false
          description: "릴리가 처음 보는 넓은 세상 풍경에 호기심을 보이는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "와……."
                - "저기, 크리스 씨. 저 산 너머에는 뭐가 있어요?"
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "글쎄, 지도로 보면 항구 도시 아르나가 있을 텐데."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "항구 도시……! 바다도 볼 수 있는 건가요?"
              emotion: "excited"
            - speaker: "크리스"
              lines:
                - "바다는 처음이야?"
              emotion: "curious"
            - speaker: "릴리"
              lines:
                - "……저는, 기억이 그렇게 많지 않아서요. 알고는 있는데, 직접 본 적은 없는 것 같아요."
                - "아니, 어쩌면 봤는데 기억을 못 하는 건지……."
              emotion: "thoughtful"
            - speaker: "크리스"
              lines:
                - "……그렇구나."
              emotion: "calm"
          choices:
            - text: "그럼 이번에 같이 보자. 가는 길에 아르나가 있으니까."
              affinity_change: 10
              response:
                speaker: "릴리"
                lines:
                  - "정말요?!"
                  - "……정말이죠? 약속이에요."
                emotion: "excited"
            - text: "뭐, 바다는 바다지. 별거 없어."
              affinity_change: 3
              response:
                speaker: "릴리"
                lines:
                  - "……크리스 씨는 정말 건조한 사람이네요. 그런데 그 말도 왜인지 믿어지네요."
                emotion: "amused"
            - text: "기억이 없다는 게 무슨 말이야?"
              affinity_change: 6
              response:
                speaker: "릴리"
                lines:
                  - "아……. 아직은, 잘 모르겠어요. 언젠가 이야기할 수 있을 때 말할게요."
                emotion: "awkward"

        - id: "cl_l1_after_first_boss"
          title: "첫 번째 고비"
          trigger: "after_battle"
          location: "던전 출구"
          bgm: "bgm_aftermath"
          has_cg: false
          description: "첫 번째 강적을 함께 쓰러뜨린 후의 안도감"
          dialogues:
            - speaker: "릴리"
              lines:
                - "하……. 살았다."
                - "크리스 씨, 괜찮아요? 어깨에서 피가……."
              emotion: "worried"
            - speaker: "크리스"
              lines:
                - "긁힌 거야. 그것보다 네가 쓰러지는 줄 알았잖아."
              emotion: "relieved"
            - speaker: "릴리"
              lines:
                - "저도 놀랐어요. 그때 갑자기 크리스 씨가 막아줬을 때……."
                - "고마워요. 정말로."
              emotion: "grateful"
            - speaker: "크리스"
              lines:
                - "동료잖아. 당연한 거야."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "……동료."
                - "(작게) 처음으로 그 말이 실감나네요."
              emotion: "warm"
          choices:
            - text: "상처 좀 봐줄게. 이리 와."
              affinity_change: 12
              response:
                speaker: "릴리"
                lines:
                  - "……네."
                  - "(붕대를 감으며) 크리스 씨 손이 생각보다 따뜻하네요."
                emotion: "shy"
            - text: "이제 우리 호흡이 맞는 것 같지 않아?"
              affinity_change: 8
              response:
                speaker: "릴리"
                lines:
                  - "맞아요. 뭔가…… 서로 어디 있는지 알 수 있는 것 같아요."
                emotion: "happy"
            - text: "다음엔 더 조심해."
              affinity_change: 4
              response:
                speaker: "릴리"
                lines:
                  - "……네, 알겠어요."
                emotion: "neutral"

        - id: "cl_l1_nightwatch"
          title: "첫 번째 파수"
          trigger: "night"
          location: "야영지 모닥불 옆"
          bgm: "bgm_night_quiet"
          has_cg: false
          description: "야간 파수를 같이 서게 된 두 사람의 어색하고 소소한 대화"
          dialogues:
            - speaker: "릴리"
              lines:
                - "안 자요? 크리스 씨 파수 시간은 한 시간 뒤인데."
              emotion: "curious"
            - speaker: "크리스"
              lines:
                - "잠이 안 와. 같이 있어도 돼?"
              emotion: "casual"
            - speaker: "릴리"
              lines:
                - "저야 상관없지만……. 별 보는 거 좋아해요?"
              emotion: "neutral"
            - speaker: "크리스"
              lines:
                - "그냥, 밤이 싫지는 않아서."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "저는 밤이 좋아요."
                - "낮에는 세상이 너무 바빠서 내가 어디 있는지 모르겠는데, 밤이 되면 조용해지잖아요."
              emotion: "thoughtful"
            - speaker: "크리스"
              lines:
                - "……철학적이네."
              emotion: "amused"
            - speaker: "릴리"
              lines:
                - "놀리는 거예요?"
              emotion: "pouty"
          choices:
            - text: "아니, 좋은 말이야. 나도 비슷하게 생각해."
              affinity_change: 9
              response:
                speaker: "릴리"
                lines:
                  - "……정말요?"
                  - "그럼 우리, 생각보다 비슷한 사람일지도 모르겠네요."
                emotion: "warm"
            - text: "(함께 하늘을 올려다본다)"
              affinity_change: 7
              response:
                speaker: "릴리"
                lines:
                  - "(한참 침묵 후) 이런 시간도 나쁘지 않네요."
                emotion: "peaceful"
            - text: "그냥 피곤해서 못 자는 거야."
              affinity_change: 2
              response:
                speaker: "릴리"
                lines:
                  - "……그렇군요. 그럼 눈이라도 감아봐요."
                emotion: "neutral"

      # ----------------------------------------------------------
      # Level 2: 신뢰 (Trust)
      # ----------------------------------------------------------
      level_2:
        - id: "cl_l2_rain_shelter"
          title: "비를 피하며"
          trigger: "rain"
          location: "폐허 처마 밑"
          bgm: "bgm_rain_gentle"
          has_cg: false
          description: "갑작스러운 비에 함께 좁은 처마 밑에서 피하며 릴리가 자신의 두려움을 털어놓는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "갑자기 쏟아지네요……."
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "조금만 기다리면 그칠 거야. 좁아도 참아."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "괜찮아요. 비도 좋아하니까요."
                - "……크리스 씨는 두려운 게 있어요?"
              emotion: "thoughtful"
            - speaker: "크리스"
              lines:
                - "갑자기?"
              emotion: "surprised"
            - speaker: "릴리"
              lines:
                - "비를 보면 갑자기 생각나서요. 저는…… 사라지는 게 무서워요."
                - "기억이 지워지는 것도요. 내가 있었다는 흔적이 남지 않는 것도요."
              emotion: "sad"
            - speaker: "크리스"
              lines:
                - "릴리."
              emotion: "serious"
            - speaker: "릴리"
              lines:
                - "미안해요, 무거운 얘기 해서. 그냥…… 오늘따라 그런 생각이 들어서요."
              emotion: "awkward"
          choices:
            - text: "무거운 게 아니야. 말해줘서 고마워."
              affinity_change: 15
              response:
                speaker: "릴리"
                lines:
                  - "……크리스 씨."
                  - "처음이에요, 이런 말 들어본 게."
                emotion: "moved"
            - text: "사라지지 않아. 내가 기억하면 되잖아."
              affinity_change: 18
              response:
                speaker: "릴리"
                lines:
                  - "……그런 생각은 못 했어요."
                  - "(조용히) 크리스 씨가 기억해준다면……. 그걸로 충분한 것 같기도 해요."
                emotion: "touched"
            - text: "그런 생각은 왜 하는 거야?"
              affinity_change: 8
              response:
                speaker: "릴리"
                lines:
                  - "글쎄요…… 저도 왜인지는 모르겠어요. 타고난 건지도요."
                emotion: "thoughtful"

        - id: "cl_l2_trust_battle"
          title: "등을 맡기다"
          trigger: "after_battle"
          location: "황폐한 전장"
          bgm: "bgm_aftermath_tense"
          has_cg: false
          description: "극도로 위험한 전투 후 서로 등을 기대며 신뢰가 깊어지는 장면"
          dialogues:
            - speaker: "크리스"
              lines:
                - "……살았네."
              emotion: "exhausted"
            - speaker: "릴리"
              lines:
                - "크리스 씨 덕분에요. 중간에 제가 굳어버렸을 때……."
              emotion: "grateful"
            - speaker: "크리스"
              lines:
                - "괜찮아. 나도 처음엔 그랬어."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "크리스 씨가요?"
              emotion: "surprised"
            - speaker: "크리스"
              lines:
                - "어. 처음 진짜 죽을 것 같은 전투를 했을 때, 다리가 굳어서 움직이질 못했어."
                - "그때 누군가가 내 등을 한 대 때리면서 말했지. '지금 자면 죽는다'고."
              emotion: "reminiscing"
            - speaker: "릴리"
              lines:
                - "……그 사람이 크리스 씨를 살린 거네요."
              emotion: "thoughtful"
            - speaker: "크리스"
              lines:
                - "그래. 오늘 내가 네 등을 밀어준 것처럼."
              emotion: "warm"
            - speaker: "릴리"
              lines:
                - "……그렇군요. 이어지는 거네요, 그런 게."
                - "감사해요, 크리스 씨. 진심으로."
              emotion: "moved"
          choices:
            - text: "이제 너도 누군가의 등을 밀어줄 수 있어."
              affinity_change: 14
              response:
                speaker: "릴리"
                lines:
                  - "……그렇게 될 수 있을까요?"
                  - "열심히 해볼게요. 크리스 씨처럼."
                emotion: "determined"
            - text: "(아무 말 없이 어깨를 두드린다)"
              affinity_change: 12
              response:
                speaker: "릴리"
                lines:
                  - "……(조용히 웃음) 크리스 씨는 말보다 행동이네요."
                emotion: "warm"
            - text: "다음엔 혼자 버텨."
              affinity_change: 5
              response:
                speaker: "릴리"
                lines:
                  - "……그렇게는 아직 못 하겠지만, 노력해볼게요."
                emotion: "determined"

        - id: "cl_l2_cooking_together"
          title: "함께 만드는 저녁"
          trigger: "cooking"
          location: "야영지 화덕 앞"
          bgm: "bgm_daily_warm"
          has_cg: false
          description: "처음으로 함께 요리하며 소소하게 가까워지는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨, 요리할 줄 알아요?"
              emotion: "curious"
            - speaker: "크리스"
              lines:
                - "기본적인 건 돼. 여행이 길면 어쩔 수 없잖아."
              emotion: "casual"
            - speaker: "릴리"
              lines:
                - "저는…… 사실 잘 모르거든요. 레시피는 알고 있는데, 손이 따라가질 않아요."
              emotion: "embarrassed"
            - speaker: "크리스"
              lines:
                - "머릿속으로 아는 거랑 손이 아는 건 다르지. 내가 옆에서 봐줄게."
              emotion: "calm"
            - speaker: "릴리"
              lines:
                - "……정말요? 가르쳐줄 수 있어요?"
              emotion: "hopeful"
            - speaker: "크리스"
              lines:
                - "일단 칼 잡아봐. 그 자세부터 고쳐야겠다."
              emotion: "amused"
            - speaker: "릴리"
              lines:
                - "이렇게요?"
              emotion: "focused"
            - speaker: "크리스"
              lines:
                - "엄지 여기. 그리고 팔꿈치 좀 내려."
                - "(손을 잡아 교정하며) 이렇게."
              emotion: "patient"
            - speaker: "릴리"
              lines:
                - "……(살짝 굳으며) 아, 네. 이렇게요."
              emotion: "shy"
          choices:
            - text: "(자연스럽게 손을 잡고 가르친다)"
              affinity_change: 16
              response:
                speaker: "릴리"
                lines:
                  - "(귓불이 붉어지며) ……손 따뜻하네요."
                  - "집중해야 하는데."
                emotion: "flustered"
            - text: "뭐, 잘 하는데? 재능 있겠어."
              affinity_change: 10
              response:
                speaker: "릴리"
                lines:
                  - "정말요? ……거짓말은 하지 말아요."
                  - "(웃으며) 그래도 기분은 좋네요."
                emotion: "happy"
            - text: "천천히 해도 돼. 서두를 거 없어."
              affinity_change: 11
              response:
                speaker: "릴리"
                lines:
                  - "……네. 급하지 않아도 되는 거, 처음인 것 같아요."
                emotion: "peaceful"

        - id: "cl_l2_lily_opens_up"
          title: "처음 하는 이야기"
          trigger: "level_up"
          location: "강가 바위 위"
          bgm: "bgm_flow_water"
          has_cg: false
          description: "신뢰 레벨 달성 시 릴리가 자신의 정체에 대해 처음으로 조금 털어놓는 장면"
          dialogues:
            - speaker: "릴리"
              lines:
                - "크리스 씨……. 저, 말해도 될 것 같아요."
              emotion: "nervous"
            - speaker: "크리스"
              lines:
                - "응? 뭘?"
              emotion: "curious"
            - speaker: "릴리"
              lines:
                - "저에 대해서요. 사실 저는…… 제가 어디서 왔는지, 정확히 모르거든요."
                - "기억이 완전하지 않아요. 마치 꿈에서 빌려온 것 같은 기억들만 있고."
              emotion: "serious"
            - speaker: "크리스"
              lines:
                - "……그렇구나."
