# ═══════════════════════════════════════════════════
# 사이드 퀘스트 (지역별, 대폭 확장)
# ═══════════════════════════════════════════════════
side_quests:

  # ─── 1. 잊혀진 숲 (Lv.1~12) ─── 12개
  forgotten_forest:
    - id: "sq_ff_01"
      type: "kill"
      title: "숲의 침입자"
      description: "실바나 근처에 출몰하는 변이 늑대 무리를 처치한다."
      level_req: 2
      rewards: "경험치 150, 골드 50"
      objectives:
        - "변이 늑대 8마리 처치"
        - "실바나 촌장에게 보고"

    - id: "sq_ff_02"
      type: "explore"
      title: "잃어버린 유물"
      description: "숲 깊은 곳에 숨겨진 고대 유물을 찾아 촌장에게 가져간다."
      level_req: 4
      rewards: "경험치 200, 유물 조각 (퀘스트 아이템)"
      objectives:
        - "숲 북쪽 구역 탐사"
        - "빛나는 동굴 발견"
        - "고대 유물 회수"

    - id: "sq_ff_03"
      type: "fetch"
      title: "약초 채집"
      description: "실바나 약사의 의뢰. 숲에서 자생하는 희귀 약초를 모아온다."
      level_req: 3
      rewards: "경험치 120, 회복 포션 x5"
      objectives:
        - "빛나는 이끼 3개 채집"
        - "고대 나무 수액 2개 채집"
        - "약사에게 전달"

    - id: "sq_ff_04"
      type: "investigate"
      title: "실종된 나무꾼"
      description: "숲에 들어간 뒤 돌아오지 않는 나무꾼을 조사한다. 무슨 일이 있었던 것인가?"
      level_req: 5
      rewards: "경험치 250, 골드 100"
      objectives:
        - "나무꾼의 마지막 작업장 조사"
        - "발자국 추적"
        - "변이체 둥지 발견"
        - "나무꾼 구출 또는 유품 회수"

    - id: "sq_ff_05"
      type: "defend"
      title: "마을 방어전"
      description: "밤마다 마을을 습격하는 변이체 무리를 3일간 방어한다."
      level_req: 6
      rewards: "경험치 400, 골드 200, 마을 방어 훈장"
      objectives:
        - "1일차 야간 습격 방어"
