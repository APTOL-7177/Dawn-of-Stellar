# RPG 모드 설정
# "차원의 잔향" - 대균열로 생겨난 또 다른 평행 차원

rpg_mode:
  name: "차원의 잔향"
  description: >
    세피로스가 10만 번 타임라인을 반복하며 생긴 '잔향 차원'.
    이 세계에서 세피로스와 카인은 다른 형태로 존재한다.
    크리스는 이 차원에 도착하여, 잔향의 비밀을 밝히고
    차원을 안정화시켜야 한다.

  initial_level: 1
  protagonist_name: "크리스"
  heroine_name: "릴리"
  party_size: 4
  unlock_condition: "tutorial_all_complete"

# ═══════════════════════════════════════════════════
# 10개 메인 챕터 (세분화된 목표/이벤트 포함)
# ═══════════════════════════════════════════════════
chapters:
  - id: "rpg_ch1"
    title: "잔향의 시작"
    description: >
      크리스가 잔향 차원에 도착한다.
      낯선 하늘, 낯선 숲. 여기가 어디인지도 모른 채
      크리스는 살아남기 위해 움직이기 시작한다.
    unlock_condition: null
    region: "forgotten_forest"
    min_floor: 1
    level_req: 1
    objectives:
      - "잔향 차원에서 의식을 되찾는다"
      - "크리스를 발견한 소녀 '릴리'와 만난다"
      - "릴리의 안내로 숲의 마을 실바나에 도착한다"
      - "마을 촌장 '엘더 모스'와 대화한다"
      - "릴리가 정식으로 동료에 합류한다"
      - "숲을 탐색하며 생존 기술을 익힌다"
    events:
      - title: "각성"
        description: "차원의 균열에 빨려 들어간 크리스가 숲 한가운데서 눈을 뜬다."
      - title: "릴리와의 만남"
        description: >
          의식을 잃은 크리스를 발견한 소녀 릴리. 그녀는 이 차원에서 태어난 존재로,
          '언젠가 하늘에서 누군가가 올 것'이라는 예언을 기다려 왔다고 말한다.
          릴리는 크리스를 치료하고 실바나 마을로 안내한다.
      - title: "실바나 도착"
        description: >
          릴리의 안내로 숲의 마을 실바나에 도착한다. 마을 사람들은 외부인 크리스를 경계하지만,
          릴리의 보증으로 머물 수 있게 된다. 촌장 엘더 모스는 숲의 변이체 문제를 걱정한다.
      - title: "첫 전투"
        description: >
          릴리와 함께 마을 근처를 탐색하던 중 변이체와 조우한다.
          릴리의 치유 마법 덕에 크리스는 위기를 넘기고, 릴리가 정식 동료로 합류한다.

  - id: "rpg_ch2"
    title: "숲의 비밀"
    description: >
      잊혀진 숲 깊은 곳에서 첫 번째 단서를 발견한다.
      이 세계는 자연적으로 생겨난 것이 아니다.
      누군가가, 무언가의 의지로 만들어진 차원.
    unlock_condition: "forgotten_forest_floor_5"
    region: "forgotten_forest"
    min_floor: 5
    level_req: 8
    objectives:
      - "숲 깊은 곳의 고대 비석을 조사한다"
      - "비석에 새겨진 고대 문자를 해독한다"
      - "뿌리의 미궁 입구를 발견한다"
      - "미궁 최하층에서 '잔향의 기록' 첫 번째 조각을 얻는다"
      - "숲의 수호자 엔트리아와 대면한다"
      - "엔트리아를 처치하거나 설득하여 다음 지역으로의 길을 연다"
    events:
      - title: "고대 비석"
        description: "숲 깊은 곳에서 이 차원의 기원을 암시하는 고대 비석을 발견한다."
      - title: "잔향의 기록 #1"
        description: "'이 세계는 후회로 만들어졌다' - 첫 번째 기록 조각이 크리스에게 비전을 보여준다."
      - title: "수호자와의 대면"
        description: "엔트리아는 이 숲을 지키라는 명령만 기억하는 존재. 크리스는 그녀를 넘어서야 한다."
      - title: "사막으로의 길"
        description: "엔트리아의 정원 너머, 끝없는 황금빛 사막이 펼쳐진다."

  - id: "rpg_ch3"
    title: "사막의 유적"
    description: >
      고대 문명의 기록에서 세피로스의 흔적을 발견한다.
      10만 번의 반복. 10만 번의 실패. 10만 번의 후회.
      잔향 차원은 그 후회가 만든 세계였다.
    unlock_condition: "twilight_desert_floor_3"
    region: "twilight_desert"
    min_floor: 13
    level_req: 14
    objectives:
      - "오아시스 마을 미라지에 도착한다"
      - "고고학자 '샌드릴'에게서 유적 정보를 얻는다"
      - "고대 유적 지하에 진입한다"
      - "유적 벽화에서 '시간의 반복자'에 대한 기록을 발견한다"
      - "유적 깊은 곳의 봉인된 기록실에서 잔향의 기록 #2를 입수한다"
      - "사막의 군주 스콜피온이 유적을 지키는 이유를 알아낸다"
      - "스콜피온을 처치하고 심연의 동굴로의 길을 연다"
    events:
      - title: "미라지 도착"
        description: "사막 한가운데 오아시스 마을. 이곳 사람들은 '모래 아래의 신'을 두려워한다."
      - title: "고대 벽화"
        description: "유적 벽화에 한 남자가 시간을 되돌리는 장면이 그려져 있다. 세피로스의 잔영인가?"
      - title: "잔향의 기록 #2"
        description: "'10만 번을 반복해도 구하지 못한 이가 있었다' - 세피로스의 동기가 드러나기 시작한다."
      - title: "스콜피온의 최후"
        description: "스콜피온은 유적을 지키라는 명령을 따르는 존재였다. 그의 소멸 후 지하 통로가 열린다."

  - id: "rpg_ch4"
    title: "심연의 목소리"
    description: >
      심연의 어둠 속에서 세피로스의 잔향이 크리스에게 말을 건다.
      "돌아가라. 이곳에서 더 깊이 들어가면 돌이킬 수 없다."
      하지만 크리스는 멈출 수 없다.
    unlock_condition: "abyss_cavern_floor_5"
    region: "abyss_cavern"
    min_floor: 27
    level_req: 24
    objectives:
      - "동굴 마을 딥홈에 도착한다"
      - "동굴 주민 '드워프 마이너'에게서 심연의 이상 현상을 듣는다"
      - "심연 최하층으로 향하는 길을 찾는다"
      - "세피로스의 잔향과 첫 번째 대화를 나눈다"
      - "잔향이 남긴 시련을 통과한다"
      - "잔향의 기록 #3를 획득한다"
      - "심연의 눈 아비소스를 처치한다"
      - "고원으로 이어지는 수직 통로를 발견한다"
    events:
      - title: "심연의 속삭임"
        description: "동굴 깊이 내려갈수록 누군가의 목소리가 들린다. '더 이상 오지 마라...'"
      - title: "세피로스의 잔향"
        description: "흐릿한 형상의 존재가 나타난다. 세피로스의 잔향. 그는 경고한다."
      - title: "잔향의 기록 #3"
        description: "'차원을 만든 것은 구원을 위해서였다. 하지만 구원받아야 할 이는 이미...' 기록이 끊긴다."
      - title: "아비소스의 진실"
        description: "아비소스는 심연을 감시하는 눈. 세피로스가 만든 감시 시스템의 일부였다."

  - id: "rpg_ch5"
    title: "폭풍 너머"
    description: >
      고원의 끊임없는 폭풍 속에서 카인이 남긴 실험의 흔적을 발견한다.
      카인도 이 차원에 존재한다. 하지만 세피로스와는 다른 목적으로.
    unlock_condition: "storm_plateau_floor_5"
    region: "storm_plateau"
    min_floor: 39
    level_req: 34
    objectives:
      - "고원 마을 스카이홀드에 도착한다"
      - "폭풍 관측사 '윈드워커'에게서 뇌운봉의 이상을 듣는다"
      - "뇌운봉을 올라 카인의 실험 장치를 발견한다"
      - "실험 장치의 기록을 해독한다 - 카인은 차원을 '개조'하려 했다"
      - "카인의 잔향이 남긴 함정을 돌파한다"
      - "잔향의 기록 #4를 획득한다"
      - "뇌신 볼타르크를 처치한다"
    events:
      - title: "카인의 흔적"
        description: "고원 곳곳에 인위적인 구조물이 있다. 누군가가 이 차원을 실험 대상으로 삼았다."
      - title: "실험 기록"
        description: "카인의 기록: '이 차원의 법칙을 바꾸면 시간의 왕좌를 다시 세울 수 있다.'"
      - title: "잔향의 기록 #4"
        description: "'세피로스가 만든 것을 카인이 빼앗으려 한다. 이것이 잔향 차원의 전쟁이다.'"
      - title: "볼타르크"
        description: "볼타르크는 카인이 에너지원으로 이용하려던 정령. 해방시켜야 한다."

  - id: "rpg_ch6"
    title: "얼어붙은 시간"
    description: >
      타임라인의 잔해 속에서 진실을 마주한다.
      세피로스는 이 차원을 통해 누군가를 구하려 했다.
      릴리가 본 환영 속에서, 그녀 자신의 정체에 대한 의문이 생긴다.
    unlock_condition: "eternal_glacier_floor_5"
    region: "eternal_glacier"
    min_floor: 51
    level_req: 44
    objectives:
      - "빙원 마을 프로스트헤이븐에 도착한다"
      - "빙원 현자 '아이스로어'에게서 얼어붙은 타임라인 이야기를 듣는다"
      - "시간의 균열 던전에 진입한다"
      - "얼어붙은 타임라인 잔해에서 과거의 환영을 목격한다"
      - "릴리가 환영 속 인물과 닮은 존재를 발견한다"
      - "세피로스가 크리스를 구하려 반복한 장면을 목격한다"
      - "잔향의 기록 #5를 획득한다"
      - "빙결의 여왕 글라시아를 처치한다"
    events:
      - title: "얼어붙은 기억"
        description: "빙하 속에 과거 타임라인의 잔해가 갇혀 있다. 그 안에서 익숙한 얼굴이 보인다."
      - title: "릴리의 의문"
        description: >
          환영 속에서 릴리와 똑같이 생긴 소녀가 세피로스 곁에 서 있다.
          릴리는 자신이 단순한 이 차원의 주민이 아닐 수 있다는 불안을 느낀다.
      - title: "10만 번의 반복"
        description: >
          세피로스는 크리스가 죽는 미래를 바꾸기 위해 10만 번 시간을 되돌렸다.
          그리고 매번 크리스 곁에는 한 소녀가 있었다. 릴리와 닮은 존재.
      - title: "잔향의 기록 #5"
        description: "'결국 깨달았다. 시간을 되돌려도 운명은 바뀌지 않는다. 그래서 새 차원을 만들고, 그녀의 잔향을 심었다.'"
      - title: "글라시아의 눈물"
        description: "글라시아는 세피로스의 슬픔이 응축된 존재. 그녀를 쓰러뜨리면 빙원이 녹기 시작한다."

  - id: "rpg_ch7"
    title: "전장의 기억"
    description: >
      카인의 잔향과 첫 대면. 카인은 이 차원을 이용해
      시간의 왕좌를 재건하려 한다. 세피로스의 의도와는 정반대.
    unlock_condition: "war_lands_floor_3"
    region: "war_lands"
    min_floor: 59
    level_req: 54
    objectives:
      - "전장 기지 벨포트에 도착한다"
      - "기지 사령관 '아이언월'에게서 전쟁 상황을 파악한다"
      - "카인의 연구실을 발견하고 침입한다"
      - "연구실에서 카인의 잔향과 첫 대면한다"
      - "카인의 잔향이 제시하는 '거래'를 거절한다"
      - "카인이 풀어놓은 전쟁 병기들을 격퇴한다"
      - "잔향의 기록 #6를 획득한다"
    events:
      - title: "전쟁의 흔적"
        description: "황폐한 전장. 여기서 세피로스의 잔향과 카인의 잔향이 싸운 흔적이 남아 있다."
      - title: "카인의 잔향"
        description: "카인의 잔향이 나타난다. '세피로스의 감상적인 장난감을 내가 쓸모 있게 만들어주지.'"
      - title: "거래"
        description: "카인: '나와 함께하면 이 차원의 지배자가 될 수 있다.' 크리스는 거절한다."
      - title: "잔향의 기록 #6"
        description: "'카인은 세피로스의 차원을 왕좌의 재료로 쓰려 한다. 이를 막아야 한다.'"

  - id: "rpg_ch8"
    title: "잔향의 세피로스"
    description: >
      이 차원의 세피로스와 드디어 직접 조우한다.
      본체와는 다른, 슬픔에 잠긴 존재.
      그는 자신이 만든 차원이 카인에게 이용당하는 것을 막고 싶어 한다.
    unlock_condition: "war_lands_floor_8"
    region: "war_lands"
    min_floor: 64
    level_req: 58
    objectives:
      - "차원의 균열 던전 깊은 곳에서 세피로스의 잔향을 만난다"
      - "세피로스의 잔향에게서 차원의 진실을 모두 듣는다"
      - "세피로스와 일시적인 협력 관계를 맺는다"
      - "세피로스가 알려주는 카인의 약점을 파악한다"
      - "전쟁 인형 벨리거를 처치한다"
      - "잔향의 기록 #7를 획득한다"
      - "별빛의 왕좌로 향하는 길이 열린다"
    events:
      - title: "세피로스의 진심"
        description: >
          세피로스의 잔향: '나는 너를 구하기 위해 이 차원을 만들었다. 10만 번의 실패 끝에.'
      - title: "릴리의 진실"
        description: >
          세피로스가 크리스에게 말한다. '릴리는... 10만 번의 반복 속에서 매번 너와 함께했던
          소녀의 잔향이다. 이 차원을 만들 때 그녀의 영혼도 함께 옮겨 심었다.'
          릴리는 처음으로 자신의 기원을 알게 된다.
      - title: "동맹"
        description: >
          릴리가 결의한다. '나는 잔향이어도 상관없어. 지금 이 순간의 나는 진짜니까.'
          세피로스는 크리스와 릴리에게 자신의 힘 일부를 나눠준다.
      - title: "잔향의 기록 #7"
        description: "'왕좌의 열쇠는 별빛의 결정. 그것을 모으면 차원을 안정화할 수 있다.'"
      - title: "벨리거 파괴"
        description: "카인의 최강 전쟁 병기 벨리거를 파괴하고, 최종 지역으로의 길이 열린다."

  - id: "rpg_ch9"
    title: "시간의 왕좌 재림"
    description: >
      카인의 잔향이 왕좌를 재건하려 한다.
      차원이 불안정해지기 시작하고, 곳곳에서 균열이 벌어진다.
      크리스는 별빛 결정을 모아 차원을 안정화해야 한다.
    unlock_condition: "starlight_throne_floor_3"
    region: "starlight_throne"
    min_floor: 73
    level_req: 65
    objectives:
      - "별빛 마을 아스트라에 도착한다"
      - "아스트라의 장로 '스타시어'에게서 왕좌의 위치를 듣는다"
      - "7개 별빛 결정 중 부족한 것을 수집한다"
      - "시간의 왕좌에 진입하여 카인의 의식을 목격한다"
      - "카인의 잔향이 소환한 차원 수호자들을 격퇴한다"
      - "잔향의 기록 #8 (마지막)를 획득한다"
      - "세피로스의 잔향과 합류하여 최종 결전을 준비한다"
    events:
      - title: "차원 붕괴"
        description: "하늘에 금이 간다. 차원이 불안정해지면서 곳곳에서 몬스터가 쏟아진다."
      - title: "카인의 의식"
        description: "카인의 잔향이 시간의 왕좌를 재건하는 의식을 시작한다. 차원의 에너지를 흡수하면서."
      - title: "잔향의 기록 #8"
        description: "'이것이 마지막 기록이다. 차원을 지키든, 파괴하든, 선택은 너에게 맡긴다. - 세피로스'"
      - title: "결전 전야"
        description: "세피로스의 잔향이 마지막 힘을 모아 크리스를 돕겠다고 선언한다."

  - id: "rpg_ch10"
    title: "별빛의 새벽"
    description: >
      최종 결전. 잔향의 카인을 쓰러뜨리고 차원을 안정화한다.
      세피로스의 잔향은 소멸하며 크리스에게 미소를 짓는다.
      "이번에는... 구할 수 있었구나."
    unlock_condition: "starlight_throne_floor_9"
    region: "starlight_throne"
    min_floor: 79
    level_req: 75
    objectives:
      - "잔향의 최심부에 진입한다"
      - "카인의 잔향 - 1단계 전투"
      - "카인이 시간의 왕좌와 융합한다"
      - "릴리의 각성 - 잔향의 힘이 폭발한다"
      - "카인의 잔향 - 최종 형태 전투"
      - "별빛 결정으로 차원을 안정화한다"
      - "세피로스의 잔향과 마지막 대화"
      - "릴리와 함께 잔향 차원의 미래를 결정한다"
    events:
      - title: "최종 결전"
        description: "잔향의 최심부. 카인의 잔향이 시간의 왕좌 위에서 크리스를 기다린다."
      - title: "왕좌의 융합"
        description: "패배한 카인이 왕좌와 융합하여 최종 형태로 변한다. 차원 자체가 무기가 된다."
      - title: "릴리의 각성"
        description: >
          위기의 순간, 릴리 안에 잠들어 있던 잔향의 힘이 각성한다.
          10만 번의 반복 속에서 축적된 소녀의 의지가 빛으로 변한다.
          릴리의 치유 마법이 차원 규모로 확장되어 파티를 보호한다.
      - title: "세피로스의 희생"
        description: >
          세피로스의 잔향이 마지막 힘을 써서 크리스와 릴리를 돕는다.
          '이번에는... 너희 둘 다 구할 수 있었구나.' 미소를 지으며 소멸한다.
      - title: "새벽"
        description: >
          차원이 안정되고, 하늘에 별빛이 쏟아진다.
          릴리는 크리스의 손을 잡고 말한다.
          '나는 잔향이지만, 이 세계는 진짜야. 여기서 함께 살아가자.'
      - title: "선택"
        description: >
          크리스는 원래 세계로 돌아갈 수 있다.
          하지만 릴리와, 이 차원의 사람들과 함께한 시간은 모두 진짜였다.
          돌아갈 것인가, 남을 것인가.

