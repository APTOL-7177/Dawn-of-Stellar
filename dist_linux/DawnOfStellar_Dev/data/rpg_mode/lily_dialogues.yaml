# 릴리 상황별 대사 데이터
# chapter_range: [min, max] - 해당 챕터 범위에서만 출현
# affinity_min: 최소 친밀도 (기본 0)
# weight: 가중치 (기본 1, 높을수록 자주 출현)

exploration_idle:
  # --- Ch0~3: 밝고 호기심 많은 소녀 ---
  - text: "크리스, 저기 봐! 이상한 꽃이 피어있어!"
    chapter_range: [0, 3]
  - text: "이 바람에서 뭔가 느껴지는걸... 좋은데."
    chapter_range: [0, 3]
  - text: "지루하지 않아? 나는 걷는 거 좋아하는데 말이야!"
    chapter_range: [0, 3]
  - text: "크리스는 어디 가고 싶어? 싸움 말고, 하루쯤 놀러 가고 싶다."
    chapter_range: [1, 3]
  - text: "공기가 맛있어서 좋아. 이 느낌이 좋아."
    chapter_range: [0, 2]
  - text: "저 구름, 솜사탕 같아! 크리스, 만질 수 있으면 좋겠다."
    chapter_range: [0, 3]
  - text: "어, 나비야! ...이 세상이 영원했으면 좋겠어."
    chapter_range: [0, 2]
  # --- Ch4~5: 불안과 의문 시작 ---
  - text: "...요즘 이 세상에 처음 온 게 아닌 것 같은 느낌이 들어."
    chapter_range: [4, 5]
  - text: "꿈자리에 이상한 목소리가 들려... 신경쓰였어."
    chapter_range: [4, 5]
  - text: "크리스, 나한테 숨기는 거 있지 않아? ...아니야 아니야."
    chapter_range: [4, 5]
    affinity_min: 30
  - text: "이 풍경이 정말 예쁜데도 마음이 무거워..."
    chapter_range: [4, 5]
  - text: "꽃들이 피어있어... 예쁜데, 왜 이렇게 마음이 복잡할까."
    chapter_range: [4, 5]
  - text: "크리스, 나 가끔 내가 누구인지 모를 것 같아. 이상하지?"
    chapter_range: [5, 5]
    affinity_min: 40
  # --- Ch6~7: 정체에 대한 고민 ---
  - text: "...크리스. 나, 요즘 이상한 꿈을 자꾸 꿔. 무서워."
    chapter_range: [6, 7]
    affinity_min: 50
  - text: "카인의 잔향이라고... 자꾸 들려."
    chapter_range: [7, 7]
  - text: "내가 진짜가 아니라면... 뭐가 진짜인 걸까."
    chapter_range: [6, 7]
    affinity_min: 80
  - text: "...아니야, 아무것도 아니야. 걷자."
    chapter_range: [6, 7]
  - text: "크리스 옆에 있으면 그나마 괜찮아. 고마워."
    chapter_range: [6, 7]
    affinity_min: 70
  - text: "...잔향이라는 말이 뭔지 이제 조금 알 것 같아."
    chapter_range: [7, 7]
    affinity_min: 100
  # --- Ch8~9: 진실을 안 후 결의 ---
  - text: "사라져도 괜찮아. 내가 한 게 진심이기를."
    chapter_range: [8, 9]
    affinity_min: 100
  - text: "크리스 곁에 있을 수 있어서 다행이야."
    chapter_range: [8, 9]
    affinity_min: 150
  - text: "끝까지 함께야. 변하지 않을게."
    chapter_range: [8, 9]
    affinity_min: 100
  - text: "잔향으로 태어난 게 의미가 있는 거 맞다... 지금은 그렇게 믿어."
    chapter_range: [8, 9]
  - text: "마을 사람들이 무사하다면... 그걸로 충분해."
    chapter_range: [8, 9]
    affinity_min: 80
  # --- Ch10: 각성 ---
  - text: "마지막 걸음이어도... 후회하지 않을 거야."
    chapter_range: [10, 10]
  - text: "크리스, 내가 어떤 형태로든 사라져도 돼."
    chapter_range: [10, 10]
    affinity_min: 200
  - text: "이건 내가 선택한 길이야. 같이 가줘."
    chapter_range: [10, 10]
    affinity_min: 150

exploration_region:
  - text: "숲이 우리를 감싸주는 것 같아. 따뜻해."
    region: "forgotten_forest"
    chapter_range: [0, 10]
  - text: "이 숲속에서 뭔가 오래된 목소리가 들려... 신경쓰여."
    region: "forgotten_forest"
    chapter_range: [1, 10]
  - text: "모래야! 발가락에 사르르르. 좋은데."
    region: "twilight_desert"
    chapter_range: [0, 3]
  - text: "이 모래... 황혼이랑 닮아서 슬프지 않아. 시간이 멈춰 있는 것 같아."
    region: "twilight_desert"
    chapter_range: [4, 10]
  - text: "동굴이 무서워... 크리스, 손잡아도 돼?"
    region: "abyss_cavern"
    chapter_range: [0, 5]
  - text: "이 어둠속에서 뭔가 옛 기억이랑 닮은 소리가 들려..."
    region: "abyss_cavern"
    chapter_range: [4, 10]
  - text: "바람이 세차다! 날아갈 것 같은데... 크리스 잡아줘!"
    region: "storm_plateau"
    chapter_range: [0, 10]
  - text: "이 폭풍 속에서도 앞으로 나아가는 크리스가... 멋있어."
    region: "storm_plateau"
    chapter_range: [4, 10]
  - text: "차가워... 얼음으로 만든 세계야. 신비로운 것 같아."
    region: "eternal_glacier"
    chapter_range: [0, 10]
  - text: "시간이 얼어붙은 것 같아... 여기서 뭔가 일어났어."
    region: "eternal_glacier"
    chapter_range: [5, 10]
  - text: "전쟁터야... 정말 슬픈 곳이야."
    region: "war_lands"
    chapter_range: [0, 10]
  - text: "카인의 흔적이 느껴져. 이게 전체의 시작인 것처럼."
    region: "war_lands"
    chapter_range: [7, 10]
  - text: "별빛의 자리야..."
    region: "starlight_throne"
    chapter_range: [0, 10]
  - text: "크리스, 끝까지 왔어... 같이 가자."
    region: "starlight_throne"
    chapter_range: [8, 10]
    affinity_min: 100

combat_start:
  - text: "준비해, 크리스!"
    chapter_range: [0, 3]
  - text: "와도 다 받아줄게! 물러서지 마!"
    chapter_range: [0, 5]
  - text: "이 녀석이야... 같이 싸우자!"
    chapter_range: [0, 4]
  - text: "크리스, 나 여기 있을게!"
    chapter_range: [2, 6]
  - text: "적이 나타났어... 집중해!"
    chapter_range: [3, 7]
  - text: "같이하면 이길 수 있어!"
    chapter_range: [4, 8]
  - text: "크리스를 지켜야 해... 이 힘을 써줄게!"
    chapter_range: [6, 9]
    affinity_min: 100
  - text: "이 마을을 지키기 위해서!"
    chapter_range: [8, 10]
  - text: "포기란 없어... 우리의 유대가 이끌어줄 거야!"
    chapter_range: [9, 10]
    affinity_min: 150
  - text: "크리스, 나와 함께라면 두렵지 않아!"
    chapter_range: [10, 10]
  - text: "마지막 한 놈까지 같이 싸워!"
    chapter_range: [0, 5]
  - text: "이번엔 제대로 해보자, 크리스!"
    chapter_range: [1, 6]
  - text: "덤벼라! 물러나는 건 내 사전에 없어!"
    chapter_range: [0, 4]
  - text: "...카인의 힘을 떠올리면 두려워. 그래도 싸울게."
    chapter_range: [7, 9]
    affinity_min: 80
  - text: "잔향이어도 싸울 수 있어. 지금 이 자리에서!"
    chapter_range: [8, 10]
    affinity_min: 120

combat_victory:
  - text: "이겼어! 다치진 않았어?"
    chapter_range: [0, 3]
  - text: "후... 이겼다. 크리스, 괜찮아?"
    chapter_range: [0, 4]
  - text: "우리 진짜 막강한 것 같아!"
    chapter_range: [1, 5]
  - text: "크리스, 대단했어!"
    chapter_range: [0, 5]
    affinity_min: 30
  - text: "역시 크리스야. 믿어."
    chapter_range: [3, 7]
    affinity_min: 80
  - text: "같이 이기니까 두려워하지 않아."
    chapter_range: [5, 8]
    affinity_min: 100
  - text: "우리라면 못 할 것도 없어."
    chapter_range: [7, 9]
    affinity_min: 150
  - text: "이 싸움의 끝에... 반드시."
    chapter_range: [8, 10]
  - text: "크리스... 고마워. 항상."
    chapter_range: [9, 10]
    affinity_min: 200
  - text: "...살아남아서, 다시 웃을 수 있어서 다행이야."
    chapter_range: [8, 10]
  - text: "예쁘게 이겼어! 크리스 최고!"
    chapter_range: [0, 3]
    weight: 2
  - text: "저 녀석들 이렇게 빨리 이겨버리다니."
    chapter_range: [1, 5]
  - text: "크리스, 그 공격 멋있었어. 진짜."
    chapter_range: [2, 6]
    affinity_min: 50
  - text: "다들 무사하지? 확인해봐야겠어."
    chapter_range: [4, 8]
  - text: "이 힘이 정말 내 것이 맞는지... 그래도 이길 수 있어서 다행이야."
    chapter_range: [7, 10]
    affinity_min: 100

combat_low_hp:
  - text: "크리스! 위험해! 치유할게!"
    chapter_range: [0, 10]
  - text: "이 정도... 아직, 크리스!"
    chapter_range: [0, 10]
  - text: "포기 못 해...! 물러서지 마...!"
    chapter_range: [3, 10]
    affinity_min: 50
  - text: "이 목숨을 내가 지킬게...! 지금만 버텨!"
    chapter_range: [5, 10]
    affinity_min: 100
  - text: "크리스가 쓰러지면 안 돼...!"
    chapter_range: [7, 10]
    affinity_min: 150
  - text: "다들 버텨! 아직 끝나지 않았어!"
    chapter_range: [0, 10]
  - text: "치유할게... 잠깐만 기다려!"
    chapter_range: [0, 7]
  - text: "이대로는 안 돼. 크리스, 내 손 잡아!"
    chapter_range: [4, 10]
    affinity_min: 60
  - text: "...포기 못 해. 아직 지킬 사람이 있어!"
    chapter_range: [6, 10]
    affinity_min: 80
  - text: "잔향이어도 이 마음은 진짜야. 사라지기 싫어!"
    chapter_range: [8, 10]
    affinity_min: 130

town_enter:
  - text: "마을이다! 이 냄새, 크리스."
    chapter_range: [0, 3]
  - text: "사람 사는 냄새가 나... 따뜻해서 좋아."
    chapter_range: [0, 4]
  - text: "마을에서 새로운 정보를 구할 수 있을까? 기대돼!"
    chapter_range: [0, 5]
  - text: "이곳의 사람들이 반겨줘서 기뻐."
    chapter_range: [1, 5]
  - text: "크리스, 상처 있어? 이 마을에서 확인해봐."
    chapter_range: [2, 6]
  - text: "여기서 좀 쉬어도 될까...? 피곤하기도 하다."
    chapter_range: [3, 7]
  - text: "마을 사람들의 웃음소리... 이걸 지키고 싶어."
    chapter_range: [6, 8]
  - text: "이 웃음을 지키기 위해. 반드시."
    chapter_range: [7, 10]
    affinity_min: 100
  - text: "크리스, 나... 이 곳이 좋아."
    chapter_range: [6, 9]
    affinity_min: 80
  - text: "평화로운 마을이 이리도 소중한지... 느낌이 이제야 와."
    chapter_range: [4, 10]
  - text: "어린애들이 뛰어놀고 있어! 이런 게 지켜야 하는 거야."
    chapter_range: [0, 5]
  - text: "노래 소리가 들려. 마을이 살아있는 것 같아."
    chapter_range: [0, 4]
  - text: "크리스, 이런 마을 우리 고향도 있었을까?"
    chapter_range: [3, 7]
    affinity_min: 40
  - text: "여기에 오면 꼭 따뜻한 음식이 생각나. 먹고 싶다."
    chapter_range: [0, 6]
  - text: "...마을이 무사하다면 그걸로 충분해."
    chapter_range: [8, 10]
    affinity_min: 100

random_chat:
  - text: "크리스, 혹시 꿈 꿔? 나는 매일 꾸거든."
    chapter_range: [0, 4]
  - text: "이 세상에서 제일 좋은 게... 크리스랑 걷는 거야."
    chapter_range: [2, 6]
    affinity_min: 50
  - text: "나중에 다 끝나면 뭘 하고 싶어? 말해줬으면 좋겠는데."
    chapter_range: [3, 7]
    affinity_min: 80
  - text: "내 이름, 릴리. 무슨 뜻인지 알아? 백합꽃이야."
    chapter_range: [4, 7]
  - text: "크리스가 처음으로 내 이름을 불러줬던 날이 떠올라."
    chapter_range: [1, 5]
    affinity_min: 30
  - text: "나도 언젠가 내 꿈을 이룰 수 있을까... 지금은 그냥 걸어."
    chapter_range: [3, 6]
  - text: "가끔 더 잘 이야기하고 싶어... 그래도 크리스 곁에 있어."
    chapter_range: [5, 8]
    affinity_min: 100
  - text: "잔향으로서의 이름... 이 세상이 나를 뭐라고 부를까."
    chapter_range: [6, 8]
  - text: "10만 번의 반복... 카인은 그걸 견뎌낸 걸까. 상상도 안 돼."
    chapter_range: [7, 9]
  - text: "잔향은 언젠가 사라져. 바람처럼... 나도 그렇게 될까."
    chapter_range: [8, 10]
    affinity_min: 150
  - text: "크리스, 나한테 말 못 하는 것도 있지? ...괜찮아, 기다릴게."
    chapter_range: [5, 7]
  - text: "옛날이야기 책 읽은 적 있어. 언젠가 크리스한테 들려주고 싶다."
    chapter_range: [2, 5]
  - text: "이 세계 여기저기 구경하고 싶어. 아직 궁금한 게 많아."
    chapter_range: [0, 10]
  - text: "크리스... 그게 끝나도 나를 기억해줄 거야?"
    chapter_range: [6, 9]
    affinity_min: 120
  - text: "이 마지막에... 분명히 해피엔딩이 올 거야. 그렇게 믿어."
    chapter_range: [9, 10]
    affinity_min: 200
  - text: "크리스가 웃는 얼굴을 보면 기분이 좋아져. 이상하다."
    chapter_range: [1, 5]
    affinity_min: 30
  - text: "별 봐. 저 별들 다 이름이 있을까?"
    chapter_range: [0, 5]
  - text: "혼자 울었던 적 있어. 크리스한테는 말 못 했었어."
    chapter_range: [5, 8]
    affinity_min: 90
  - text: "이 여행이 끝나면 크리스랑 뭔가 먹으러 가고 싶다."
    chapter_range: [2, 7]
    affinity_min: 50
  - text: "카인의 기억이 가끔 흘러들어와. 무서워... 크리스."
    chapter_range: [7, 9]
    affinity_min: 100
  - text: "릴리라는 이름이 어울리나? 크리스는 어떻게 생각해?"
    chapter_range: [0, 4]
    affinity_min: 20
  - text: "강한 척해야 할 때가 많아. 사실은 항상 무서워."
    chapter_range: [4, 8]
    affinity_min: 70
  - text: "이 세상을 구할 수 있을지 몰라. 그래도 해볼게."
    chapter_range: [8, 10]
    affinity_min: 100
  - text: "마을 아이들 웃는 소리가 제일 좋아. 그거 지키고 싶어."
    chapter_range: [0, 6]
  - text: "크리스, 나한테 거짓말하지 않을 거지?"
    chapter_range: [4, 7]
    affinity_min: 60

# ========== 신규 카테고리 ==========

combat_ally_down:
  # 크리스(주인공)가 전투불능 됐을 때
  - text: "크리스! 안 돼...! 눈 떠!"
    chapter_range: [0, 10]
    weight: 3
  - text: "크리스가 쓰러졌어...! 일어나, 일어나줘!"
    chapter_range: [0, 5]
    weight: 2
  - text: "...크리스. 이건 내가 막았어야 했는데."
    chapter_range: [3, 8]
    affinity_min: 50
  - text: "안 돼! 크리스 없이는 싸울 수가 없어!"
    chapter_range: [0, 6]
  - text: "지금 당장 치유할게... 제발 버텨줘!"
    chapter_range: [0, 10]
    weight: 2
  - text: "크리스...! 내가 더 강했어야 했어...!"
    chapter_range: [4, 9]
    affinity_min: 80
  - text: "일어나줘! 나 혼자는 안 돼!"
    chapter_range: [0, 5]
  - text: "...잔향인 내가 이렇게 무력할 줄이야."
    chapter_range: [7, 10]
    affinity_min: 100
  - text: "크리스... 여기서 끝나는 건 싫어. 같이 끝내야지."
    chapter_range: [8, 10]
    affinity_min: 120
  - text: "눈을 감지 마! 아직 끝나지 않았어!"
    chapter_range: [5, 10]
    affinity_min: 60

combat_ally_critical:
  # 크리스 HP가 20% 미만일 때
  - text: "크리스 위험해! 치유 써줄게!"
    chapter_range: [0, 10]
    weight: 2
  - text: "위험해! 잠깐 물러서!"
    chapter_range: [0, 6]
  - text: "크리스, 내 뒤로 와! 내가 막아줄게!"
    chapter_range: [2, 8]
    affinity_min: 40
  - text: "이러다가 진짜로... 크리스! 집중해!"
    chapter_range: [3, 8]
  - text: "...포기하지 마. 내가 회복시켜줄게."
