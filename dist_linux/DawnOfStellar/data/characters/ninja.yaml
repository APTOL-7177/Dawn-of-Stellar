gimmick:
  type: ninpo_chain
  name: 인법 연쇄
  description: '[인법 연쇄] 속성 인술을 연결하여 강력한 연쇄 인법을 발동하라!


    ■ 인(印) 시스템 (0~4)

    속성 스킬 사용 시 해당 속성의 인(印)을 축적.

    화(火), 빙(氷), 뇌(雷), 풍(風) 4종.


    ■ 연쇄 인법 (인 2개 이상 시 발동 가능)

    2인: 속성 강화 — 해당 속성 피해 +40%

    3인: 속성 폭주 — 광역 속성 피해 + 속성 약점 무시

    4인: 만화경 인법 — 전 속성 초강력 연쇄 공격


    ■ 속성 순환

    같은 속성 연속 사용 시 인 축적량 감소 (2→1).

    다른 속성으로 전환하면 보너스 인 +1.

    아군에게 속성 부여/가속 지원 가능.

    '
  max_seals: 4
  seal_types:
    - fire
    - ice
    - thunder
    - wind
  chain_effects:
    2:
      name: 속성 강화
      element_damage_bonus: 0.4
    3:
      name: 속성 폭주
      aoe_damage: true
      ignore_element_resist: true
    4:
      name: 만화경 인법
      all_element_burst: true
      damage_multiplier: 2.5
  same_element_penalty:
    seal_reduction: 1
  element_switch_bonus:
    extra_seal: 1
