gimmick:
  type: oath_system
  name: 서약 시스템
  description: '[서약 시스템] 신에게 서약하고 기적을 일으켜라!


    ■ 서약 선택 (전투 시작 시)

    인내의 서약: 탱커 - 피격 시 신앙 +10, 대신 맞기 가능

    순결의 서약: 딜러 - 정화/처치 시 신앙 +15, 공격력 +20%

    자비의 서약: 힐러 - 치유 시 신앙 +10, 힐 효과 +30%


    ■ 신앙 게이지 (0~100)

    서약 준수 시 신앙 축적.

    신앙으로 기적 스킬 사용.


    ■ 기적 스킬

    25+: 작은 기적 (HP 회복)

    50+: 보호/치유의 기적

    75+: 부활/정화의 기적

    100: 신의 심판/은총


    ■ 서약 위반

    금지 행동 시 신앙 -20, 1턴 디버프

    - 인내: 공격 행동 금지

    - 순결: 버프/힐 금지

    - 자비: 공격 행동 금지

    '
  max_faith: 100
  start_faith: 0
  oaths:
