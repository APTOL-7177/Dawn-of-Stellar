traits:
- id: nature_conduit
  name: 자연의 도관
  description: 자연 포인트 획득량 +1, 최대 보유량 +2 (5→7)
  type: passive
  effects:
    nature_gain_bonus: 1
    max_nature_points: 7
- id: primal_form
  name: 원시 형태
  description: 변신 스킬 피해 +40%, 변신 버프 지속시간 +2턴
  type: passive
  effects:
    form_damage_bonus: 1.4
    form_buff_duration: 2
- id: natures_fury
  name: 자연의 분노
  description: 자연 포인트 3 이상 시 모든 피해 +50%, 힐 효과 +30%
  type: conditional
  conditions:
    nature_points_min: 3
  effects:
    damage_bonus: 1.5
    heal_bonus: 1.3
- id: wild_surge
  name: 야생의 격류
  description: 자연 포인트 MAX(5) 시 다음 변신 스킬 MP 무료 + 피해 2배
  type: trigger
  conditions:
    nature_points_exact: 5
  effects:
    free_transform: true
    transform_damage: 2.0
- id: regeneration_aura
  name: 재생의 오라
  description: 변신 중 파티 전체 HP 5%/턴 회복, 자연 포인트 +1/턴
  type: conditional
  conditions:
    in_form: true
  effects:
    party_hp_regen: 0.05
    nature_per_turn: 1
gimmick:
  type: shapeshifting_system
  name: 자연의 변신
  description: '[변신 시스템] 자연 포인트로 동물 변신!


    - 스킬로 자연 포인트 획득 (최대 5)

    - 포인트 소비해 변신 + 공격


    변신 형태:

    - 곰 (0P): 방어력 +60%, 공격력 +30%

    - 표범 (4MP): 속도 +70%, 회피 +40%

    - 독수리 (3P): 강력한 공중 공격

    - 늑대 (4P): 광역 피해 + 공격 버프

    '
  max_nature_points: 5
  forms:
    bear:
      defense: 0.6
      attack: 0.3
    panther:
      speed: 0.7
      evasion: 0.4
    eagle:
      damage: 2.2
      cost: 3
    wolf:
      aoe: true
      cost: 4
