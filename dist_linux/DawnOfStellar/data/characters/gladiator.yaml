gimmick:
  type: crowd_cheer
  name: 콜로세움의 영광
  description: '[콜로세움 쇼타임] 관중의 요구에 응하며 전설이 되어라!


    ■ 관중의 요구

    매 라운드 시작 시 "관중의 요구" 발표.

    요구 충족 → 환호 대량 획득 + 보너스 효과

    요구 실패 → 야유 (-15 환호, 1턴 디버프)


    ■ 환호 단계 (0~100)

    0~29  무명: 기본 상태

    30~59 신인: 공격 +15%, 속도 +10%

    60~79 인기검투사: 공격 +30%, 크리 +15%, 반격률 +20%

    80~99 챔피언: 공격 +50%, 크리 +25%, 반격률 +30%, 회피 +15%

    100   전설: 그랜드 피날레 발동 가능!


    ■ 그랜드 피날레 (환호 100)

    3가지 선택지 중 1개:

    1. 황제의 심판: 전체 HP 4.5 + 최약체 즉사

    2. 불사의 챔피언: 3턴 무적 + 반격 100%

    3. 전설의 귀환: 전회복 + 쿨초기화 + 버프

    '
