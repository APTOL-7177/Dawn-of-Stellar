# 차원의 잔향 - 마을 NPC 데이터
# RPG 모드: 세피로스의 1만 번 반복으로 탄생한 차원, 카인은 시간의 왕좌를 재건하려 한다
# 주인공: 크리스 / 히로인: 릴리

town_npcs:

  # ═══════════════════════════════════════════════════════════
  # 1. 실바나 - 잊혀진 숲
  # ═══════════════════════════════════════════════════════════
  silvana:
    town_name: "실바나"
    region: "잊혀진 숲"
    atmosphere: >
      이끼로 뒤덮인 고목들이 하늘을 가리는 마을. 햇빛은 나뭇잎 사이로 금빛 실처럼 내려앉고,
      공기 중에는 언제나 흙내음과 꽃향기가 섞여 있다. 마을 사람들은 느긋하지만 눈빛에는
      오래된 슬픔이 담겨 있다 — 이 숲이 한때 훨씬 넓었다는 것을 기억하는 이들처럼.
    npcs:
      - id: "silvana_elder_moss"
        name: "엘더 모스"
        role: "촌장"
        personality: "온화하지만 내면에 무거운 짐을 진 노인. 말수는 적으나 한 마디 한 마디에 깊이가 있다. 젊은이들에게는 자상하지만 진실을 숨기는 버릇이 있다."
        backstory: >
          300년을 산 엘프 노인. 젊었을 때 이 숲이 '차원의 문'으로 둘러싸여 있다는 사실을 발견했고,
          그 문을 통해 잠시 다른 차원을 엿본 적이 있다. 그때 본 것 — 세피로스가 홀로 시간을 되감는 장면 —
          때문에 평생 침묵을 지켜왔다. 크리스가 마을에 오던 날, 300년 만에 처음으로 그 비밀을 털어놓을
          결심을 한다.
        location: "마을 중앙 고목 아래 의자"
        dialogues:
          greeting: "어서 오게, 젊은이. 이 숲은 처음이겠지... 아니, 그렇지 않을 수도 있어. 이 숲은 기억이 많거든."
          idle:
            - "바람이 서쪽에서 부네. 오늘 밤엔 별이 잘 보이겠어."
            - "저 나무 나이가 몇인지 아나? 나보다 두 배는 더 살았지. 그런데도 매년 새 잎을 내밀더군."
            - "요즘 숲 동쪽에서 이상한 소리가 들려. 마치... 시계 소리 같기도 하고."
            - "크리스라고 했나. 그 이름... 어디서 들어본 것 같아. 오래전에."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "젊은이, 이 숲의 중심에 가면 '기억의 연못'이 있어. 거기 비치는 건 네 모습이 아니라, 네가 다른 차원에서 살았을 모습들이야."
                - "세피로스... 그 이름을 입에 담는 사람을 오랫동안 보지 못했네. 300년 만이로군."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 움직이기 시작했다는 건 나도 알고 있어. 시간의 왕좌가 흔들리면 이 숲도 사라질 거야. 나도, 이 나무들도."
                - "릴리라는 아이... 그 아이 눈빛이 예사롭지 않아. 마치 이미 모든 걸 알고 있는 것처럼."
            - chapter: "rpg_ch3"
              lines:
                - "마지막으로 부탁이 있어, 크리스. 이 숲의 마지막 씨앗을 가져가 줘. 세상 어딘가에 심어줘. 실바나가 사라져도 그 나무는 남을 수 있도록."
          quest_dialogues:
            - quest_id: "silvana_q1_missing_children"
              lines:
                - "사흘째야. 숲 아이들 셋이 동쪽으로 놀러 갔다가 돌아오지 않았어. 어른들이 찾으러 갔지만... 그 구역에 가면 다들 방향을 잃어버리거든."
                - "제발 찾아줘. 이 늙은이가 할 수 있는 건 기다리는 것뿐이라, 미칠 것 같아."
            - quest_id: "silvana_q2_ancient_seal"
              lines:
                - "기억의 연못 봉인이 약해지고 있어. 그 봉인이 깨지면 과거의 망령들이 쏟아져 나와. 봉인석을 구해다 줄 수 있겠나?"
        shop: null
        services:
          - type: "정보 제공"
            description: "지역 역사와 숲의 비밀에 대한 정보"
          - type: "퀘스트 의뢰"

      - id: "silvana_herbalist_fern"
        name: "약초사 펀"
        role: "약초사 / 포션 상인"
        personality: "수다스럽고 호기심 왕성한 중년 여성. 약초에 대한 지식은 해박하지만 자기 건강은 전혀 챙기지 않는다. 항상 손가락에 약초 즙이 묻어 있다."
        backstory: >
          원래 도시 출신 약사였으나, 남편을 잃은 후 실바나 숲으로 도망쳐 왔다. 숲의 약초들이
          그녀를 치유해 주었고, 이제 이 마을 없이는 살 수 없다고 한다. 그녀가 만든 '망각의 차'는
          실은 슬픈 기억을 지우는 것이 아니라, 그 기억과 화해하게 해 준다는 비밀이 있다.
        location: "약초상 겸 포션 가게 (마을 서쪽)"
        dialogues:
          greeting: "어머, 새 손님이다! 어디 봐봐, 안색이 영 안 좋네? 제가 딱 맞는 걸 드릴게요!"
          idle:
            - "오늘 새벽에 달빛 이슬 받으러 갔다가 이상한 꽃을 발견했어요. 파란데, 빛이 나는 것 같더라고요. 차원 꽃인가...?"
            - "우리 남편이 좋아했던 찻잎이 이번엔 특히 잘 자랐어요. 그 사람이 도와주는 건 아닐까 싶기도 하고."
            - "릴리라는 아가씨, 지나가다 봤는데 정말 예쁘더라. 크리스 씨는 모르는 척하던데, 에이 눈치도 없어라!"
            - "약초 캐다가 넘어져서 무릎이... 아이고, 약사가 제일 약을 못 챙겨요."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "저도 한 번 꿈에서 봤어요. 똑같이 생긴 제가 수도 없이 많은 거요. 다들 조금씩 달랐는데... 어떤 저는 남편이 살아있고, 어떤 저는 혼자서 웃고 있었어요."
            - chapter: "rpg_ch2"
              lines:
                - "요즘 약초들이 이상해요. 효능이 두 배가 됐다가, 갑자기 독이 되기도 하고. 차원이 불안정해진 거겠죠?"
          quest_dialogues:
            - quest_id: "silvana_q3_rare_herbs"
              lines:
                - "동쪽 절벽에 '새벽별 꽃'이 핀대요. 딱 셋만 가져다주면 치료 불가능한 부상도 낫는 포션을 만들 수 있는데!"
                - "위험하다는 거 알아요. 근데 그게 없으면 늙은 목수 영감 다리를 못 살려요. 제발요."
        shop:
          name: "펀의 약초 가게"
          items:
            - name: "회복 포션 (소)"
              price: 50
              description: "HP 200 회복"
            - name: "회복 포션 (중)"
              price: 120
              description: "HP 500 회복"
            - name: "해독제"
              price: 80
              description: "독 상태 해제"
            - name: "망각의 차"
              price: 200
              description: "슬픈 기억과 화해하게 해준다... 고 한다"
            - name: "숲의 에너지 액"
              price: 300
              description: "MP 300 회복, 실바나 특산품"
        services:
          - type: "포션 제조"
            description: "재료를 가져오면 특수 포션 제조"
          - type: "상태이상 치료"
            description: "마을 내 치료 서비스"

      - id: "silvana_woodcarver_oak"
        name: "목수 오크"
        role: "목수 / 장비 수리"
        personality: "말이 없고 퉁명스럽지만, 손재주가 놀랍고 약자에게 한없이 자상하다. 다리를 절며 다니는데 그 이유를 절대 말하지 않는다."
        backstory: >
          과거에 왕국의 기사였다. 카인의 전신인 어떤 존재와 싸우다가 다리를 잃었고, 의족을 달고
          이 숲으로 숨어들었다. 나무를 깎으며 사는 게 贖罪라고 생각한다. 그가 만든 가구마다
          작은 용 문양이 새겨져 있는데, 이는 전사했던 동료들에 대한 추모다.
        location: "마을 북쪽 작업장"
        dialogues:
          greeting: "...(침묵)... 뭐 필요해?"
          idle:
            - "나무는 거짓말을 안 해. 사람이 문제지."
            - "비가 오려나. 다리가 쑤시네."
            - "요즘 젊은이들은 손을 너무 안 써. 직접 만드는 즐거움을 모르더라."
            - "이 나무... 수령이 600년은 됐겠어. 여기에 손을 대는 건... 좀 미안하지."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "...카인. 그 이름 들은 지 30년은 됐나. 살아있었구나. 당연하지. 그런 놈이 쉽게 죽을 리 없어."
            - chapter: "rpg_ch2"
              lines:
                - "크리스. 싸움은 기술이 아니야. 무엇을 위해 싸우는지가 전부야. 그걸 모르면 강해져봤자 소용없어."
                - "내 의족 한번 봐봐. 내가 직접 깎은 거야. 잃어버린 걸 대신할 순 없어도, 계속 걸을 순 있어."
          quest_dialogues:
            - quest_id: "silvana_q4_repair_bridge"
              lines:
                - "동쪽 다리가 썩었어. 재료만 가져다주면 내가 고칠게. 필요한 건 경질목 5개랑 쇠못 10개야."
                - "고맙긴 한데... 그냥 해주는 거야. 빚 같은 거 없어."
        shop:
          name: "오크의 작업장"
          items:
            - name: "나무 방패"
              price: 150
              description: "방어력 +15"
            - name: "강화된 목검"
              price: 200
              description: "공격력 +20, 내구도 높음"
            - name: "숲의 부적"
              price: 100
              description: "독 저항 +20%"
        services:
          - type: "장비 수리"
            description: "손상된 장비 수리, 비용은 내구도에 따라"
          - type: "목재 가공"
            description: "특수 목재 아이템 제작"

      - id: "silvana_bard_willow"
        name: "음유시인 윌로우"
        role: "음유시인 / 정보상"
        personality: "항상 웃고 있지만 눈빛만은 날카롭다. 노래 한 곡으로 사람을 울리고, 바로 다음 곡으로 웃게 만든다. 실은 각 마을을 돌며 정보를 수집하는 여행자."
        backstory: >
          7개 마을을 순환하며 노래를 팔고 정보를 사고파는 떠돌이. 겉으로는 쾌활하지만,
          실은 카인 조직의 움직임을 추적하는 독립 첩자다. 어릴 때 카인의 부하들에게 마을이
          불탔고, 가족을 잃었다. 복수보다는 더 많은 피해자가 생기지 않도록 막는 것이 목표.
          릴리와는 예전에 만난 적이 있는 것 같은데, 둘 다 그 기억을 공유하지 않는다.
        location: "마을 광장 분수대 근처"
        dialogues:
          greeting: "♪ 새벽별 아래 길 잃은 나그네여, 실바나 숲이 그대를 품네 ♪... 어머, 새 얼굴이다! 어디서 왔어요?"
          idle:
            - "노래 한 곡 들을래요? 공짜예요. 진짜로. 아, 근데 정보가 있으면 교환도 해요."
            - "미라지에서 온 상인이 그러는데, 황혼의 사막에 이상한 탑이 생겼대요. 며칠 전에."
            - "딥홈 드워프들이 심연에서 뭔가 캐냈다고 하던데... 묻지 않는 게 나을 것 같아요."
            - "♪ 잊혀진 것들은 잊혀지지 않아, 다만 기억되지 않을 뿐 ♪... 이 노래, 좋죠?"
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨, 솔직히 말할게요. 저 그냥 음유시인 아니에요. 카인 추적하는 사람이에요. 같이 정보 공유해요."
                - "릴리 씨 눈빛... 제가 아는 사람 같아요. 아주 오래전에, 다른 차원에서 만났던 것 같은 느낌?"
            - chapter: "rpg_ch2"
              lines:
                - "카인이 '영원의 빙원'에서 뭔가를 찾고 있대요. 프로스트헤이븐 쪽 정보가 끊겼어요. 나쁜 징조예요."
                - "제가 수집한 정보들, 여기 있어요. 7개 마을 카인 조직 위치예요. 공짜로 드릴게요. 복수는 제 일이 아니니까."
          quest_dialogues:
            - quest_id: "silvana_q5_lost_song"
              lines:
                - "제가 찾는 노래가 있어요. '차원의 자장가'라고, 세피로스가 처음 이 세계를 만들 때 불렀다는 노래요. 악보가 기억의 연못 어딘가에 있을 거예요."
        shop: null
        services:
          - type: "정보 구매"
            description: "골드를 내면 각 지역 정보 제공"
          - type: "노래 공연"
            description: "파티 사기 +10% (1시간)"
          - type: "세계 지도 갱신"
            description: "최신 지역 정보로 지도 업데이트"

      - id: "silvana_child_sprite"
        name: "꼬마 스프라이트"
        role: "정령 아이 / 숲의 안내자"
        personality: "8살쯤 돼 보이는 숲의 정령. 인간 아이처럼 굴지만 가끔 나이를 가늠할 수 없는 말을 한다. 크리스를 처음부터 오빠라고 부른다."
        backstory: >
          실바나 숲에서 태어난 작은 정령. 수백 년 된 고목에서 태어났으며, 외형은 아이지만
          숲 전체의 기억을 공유한다. 사실 이 정령은 세피로스가 첫 번째 시간 반복 때 이 숲에
          숨겨놓은 '기억 조각'이 의식을 가진 것이다. 크리스를 알아보는 이유는, 이전 반복에서
          크리스와 함께 숲을 지킨 기억이 있기 때문이다.
        location: "마을 이곳저곳, 주로 나무 위"
        dialogues:
          greeting: "오빠! 기다렸어! 드디어 왔구나! 릴리 언니도 같이 왔어? 어디어디?"
          idle:
            - "이 나무 물어봤는데 오빠 착한 사람이래. 나무는 거짓말 안 해."
            - "어젯밤에 별똥별 열세 개 봤어. 열세 개면 뭔가 시작된다는 뜻이야."
            - "배고파... 오빠 빵 있어? 정령도 빵 먹을 수 있거든."
            - "엘더 할아버지가 슬퍼. 눈에서 슬픔 냄새 나. 오빠도 알지?"
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "오빠, 나 사실 그냥 정령이 아니야. 세피로스 아저씨가 숨겨놓은 기억이야. 이상하지? 나도 이상해."
                - "오빠가 이 숲 구한 게 몇 번인지 알아? 셀 수가 없어. 근데 오빠는 항상 기억을 잃어버리더라."
            - chapter: "rpg_ch3"
              lines:
                - "오빠, 나 이제 곧 없어질 것 같아. 차원이 이상해지면 나 같은 정령들은 먼저 사라지거든. 근데 괜찮아. 오빠가 기억해주면 어딘가에 있는 거잖아."
          quest_dialogues:
            - quest_id: "silvana_q1_missing_children"
              lines:
                - "아이들 어딨는지 알아! 동쪽 마법 나무들이 장난쳤어. 길 바꿔놨거든. 나 따라와!"

      - id: "silvana_innkeeper_rose"
        name: "여관주인 로즈"
        role: "여관주인"
        personality: "풍채 좋은 50대 여성. 푸근하고 요리 솜씨가 뛰어나며, 마을에 오는 모든 손님의 이야기를 귀 기울여 듣는다. 실은 엄청난 과거를 가진 전직 모험가."
        backstory: >
          20대에는 '붉은 장미'라는 이름으로 활동했던 전설적인 모험가. 세피로스와 직접 대화한
          몇 안 되는 인간 중 하나다. 세피로스가 "네 역할은 끝났다"고 말한 후, 그 말의 의미를
          평생 생각하며 여관을 운영하고 있다. 그녀의 요리에는 옛 차원 여행에서 배워온 레시피가
          담겨 있으며, 먹으면 희미하게 다른 세계의 향기가 난다.
        location: "마을 중앙 '초록 지붕 여관'"
        dialogues:
          greeting: "어서 와요! 방 하나에 50골드예요. 저녁 포함이고요. 오늘 메뉴는 숲의 버섯 스튜랑 별빛 보리빵이에요!"
          idle:
            - "손님, 많이 지쳐 보이네요. 따뜻한 국물 한 그릇 드릴게요. 공짜예요, 오늘은."
            - "세피로스... 그분을 직접 본 게 30년 전이네요. 눈빛이 아직도 기억나요. 슬프면서도 결연한."
            - "이 여관 벽에 손님들이 남긴 글들 보여요? 200년치예요. 다 읽어봤는데, 다들 어딘가로 가고 있더라고요."
            - "릴리 씨 오늘 뭔가 고민 있는 것 같던데. 저한테 말해줬으면 좋겠는데... 뭐, 때가 되면 하겠죠."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨, 세피로스를 찾고 있죠? 제가 마지막으로 그분 계신 곳을 알아요. 근데 그 전에, 제 이야기부터 들어줄 수 있어요?"
                - "그분이 저한테 그랬어요. '네 역할은 끝났다'고. 30년을 그 말 생각했는데... 이제야 알 것 같아요. 역할이 끝난 게 아니라, 새 역할이 시작된 거라고."
          quest_dialogues:
            - quest_id: "silvana_q6_old_recipe"
              lines:
                - "제가 젊었을 때 다른 차원에서 배워온 레시피가 있는데, 재료를 못 구하고 있어요. 차원 고수풀이랑 시간 꿀... 찾아다 주실 수 있을까요?"
        shop: null
        services:
          - type: "숙박"
            description: "1박 50골드, 저녁 포함, HP/MP 완전 회복"
          - type: "요리"
            description: "특수 요리 제공, 버프 효과 있음"
          - type: "정보 교환"
            description: "세피로스와 세계에 대한 오래된 정보"

    activities:
      - id: "silvana_act1_herb_gathering"
        name: "약초 채집"
        type: "gathering"
        description: "숲 곳곳에서 희귀 약초를 채집한다. 시간대와 날씨에 따라 채집 가능한 약초가 달라진다. 밤에만 피는 달빛 꽃, 비 온 직후에만 나오는 이슬 버섯 등."
        rewards: "다양한 약초 아이템, 가끔 희귀 소재"
        unlock_condition: null

      - id: "silvana_act2_spirit_communion"
        name: "정령과의 대화"
        type: "social"
        description: "마을 곳곳의 숲 정령들과 대화를 나눈다. 릴리가 파티에 있으면 정령들이 더 솔직하게 이야기한다. 숨겨진 스토리 조각을 얻을 수 있다."
        rewards: "스토리 조각, 정령 친밀도 증가, 가끔 희귀 아이템"
        unlock_condition: null

      - id: "silvana_act3_archery_contest"
        name: "숲의 활쏘기 대회"
        type: "minigame"
        description: "마을 엘프들과 활쏘기 대결. 움직이는 표적, 바람 요소, 거리 변화가 있는 3라운드 게임. 우승하면 마을 최고 사수 타이틀을 얻는다."
        rewards: "골드, 특수 화살 꾸러미, '숲의 사수' 칭호"
        unlock_condition: "스카우트 직업 or 활 관련 스킬 보유"

      - id: "silvana_act4_memory_pool_dive"
        name: "기억의 연못 탐색"
        type: "training"
        description: "마을 외곽의 기억의 연못에서 과거 차원들의 기억을 탐색한다. 강해진 정신력이 필요하며, 성공하면 다른 차원의 전투 기술을 배울 수 있다."
        rewards: "랜덤 스킬 해금, 차원 지식 +1, 가끔 세피로스의 메시지"
        unlock_condition: "정신력 50 이상 or 엘더 모스 퀘스트 완료"

    town_events:
      - id: "silvana_ev1_harvest_festival"
        name: "달빛 수확 축제"
        trigger: "게임 내 보름달이 뜨는 날 (7일마다)"
        description: "마을 전체가 달빛 아래 모여 수확물을 나누는 축제. 음유시인 윌로우의 공연이 있고, 특별 요리가 제공된다. 축제 중에만 구할 수 있는 희귀 아이템이 있다."
        choices:
          - option: "축제에 참여한다"
            result: "마을 호감도 +10, 특별 버프 아이템 획득"
          - option: "조용히 빠져나가 숲을 탐색한다"
            result: "야간 희귀 약초 채집 기회, 스프라이트의 비밀 이야기"

      - id: "silvana_ev2_shadow_invasion"
        name: "어둠의 침입"
        trigger: "rpg_ch2 진행 후, 마을 방문 시"
        description: "카인의 전위대가 마을에 나타난다. 마을 사람들을 공격하지는 않지만, '크리스를 내놓으라'는 메시지를 남긴다. 크리스가 나서면 전투, 릴리가 나서면 협상."
        choices:
          - option: "크리스가 직접 맞선다"
            result: "전투 발생, 승리 시 마을 영웅 칭호, 카인 부하 정보 획득"
          - option: "릴리가 협상에 나선다"
            result: "전투 없이 해결, 릴리 스토리 조각 획득, 릴리의 과거에 대한 암시"
          - option: "엘더 모스에게 도움을 청한다"
            result: "엘더의 숨겨진 능력 공개, 실바나 봉인의 비밀 해금"

      - id: "silvana_ev3_tree_awakening"
        name: "고목의 각성"
        trigger: "기억의 연못 탐색 완료 후"
        description: "마을 중앙의 가장 오래된 나무가 갑자기 빛을 발한다. 그 안에서 세피로스의 목소리가 들려온다. 마을 전체가 충격에 빠지고, 엘더 모스가 오랫동안 숨겨온 비밀을 털어놓는다."
        choices:
          - option: "세피로스의 메시지에 집중한다"
            result: "핵심 스토리 조각 획득, 다음 목적지 힌트"
          - option: "엘더 모스의 이야기를 먼저 듣는다"
            result: "실바나 지역 스토리 완결, 엘더 모스 특별 아이템 증정"


  # ═══════════════════════════════════════════════════════════
  # 2. 미라지 - 황혼의 사막
  # ═══════════════════════════════════════════════════════════
  mirage:
    town_name: "미라지"
    region: "황혼의 사막"
    atmosphere: >
      해질녘의 빛이 영원히 머무는 것 같은 마을. 모래는 황금빛과 주홍빛 사이를 오가고,
      밤이 되어도 완전한 어둠은 오지 않는다. 이 마을 사람들은 신기루에 익숙해서인지,
      현실과 환상의 경계를 대수롭지 않게 넘나든다. 웃음소리가 많지만, 혼자 있을 때
      사막을 바라보는 눈빛은 언제나 어딘가 그리워하는 것 같다.
    npcs:
      - id: "mirage_merchant_zahir"
        name: "상인 자히르"
        role: "대상 수장 / 종합 상인"
        personality: "쾌활하고 거침없는 사막 상인. 어떤 물건도 구해오고, 어떤 정보도 팔 수 있다. 하지만 절대 속이지는 않는다 — 그게 그의 유일한 원칙이다."
        backstory: >
          황혼의 사막을 40년 동안 누빈 전설적인 대상 수장. 사막 한가운데서 신기루 속에 갇혔다가
          살아 돌아온 유일한 사람이며, 그 경험 이후 신기루가 실은 다른 차원의 투영이라는 것을
          알게 됐다. 카인의 조직과 거래를 끊은 후 도망 다니는 처지지만, 겉으로는 항상 여유롭다.
        location: "마을 중앙 대상 천막"
        dialogues:
          greeting: "오오, 새 얼굴! 환영해요, 환영해! 뭐든 팔고 뭐든 사요. 영혼 빼고는."
          idle:
            - "사막은요, 거짓말을 해요. 근데 나는 안 해요. 그래서 내가 더 무섭지."
            - "신기루 보셨어요? 저는 그 안에서 3일을 보냈어요. 지금도 가끔 꿈에서 그 곳에 가요."
            - "카인 부하들이 어제 또 왔어요. 뭔가 사려고. 안 팔았죠. 당연히."
            - "이 모래 한 줌이요? 100골드예요. 다른 차원 모래거든요. 진짜예요, 진짜."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨, 솔직히 말할게요. 카인이 찾는 게 뭔지 알아요. 사막 깊숙이 묻힌 '시간의 파편'이에요. 저도 한번 봤거든요."
            - chapter: "rpg_ch2"
              lines:
                - "파편 위치 알려드릴게요. 대신 제 부탁 하나만요. 거래는 공평해야 하니까."
          quest_dialogues:
            - quest_id: "mirage_q1_time_shard"
              lines:
                - "사막 북동쪽 '황혼의 탑' 지하에 시간의 파편이 있어요. 근데 거기 수호자가 있어요. 제가 전에 달아났던 그 수호자."
        shop:
          name: "자히르의 대상"
          items:
            - name: "사막의 외투"
              price: 400
              description: "화염 저항 +25%, 사막 이동 속도 증가"
            - name: "신기루 수정"
              price: 500
              description: "환상 마법 강화, 미라지 특산품"
            - name: "사막 전갈 독"
              price: 250
              description: "독 데미지 +30%, 강력한 독 재료"
            - name: "차원 모래시계"
              price: 1000
              description: "전투 중 1회 시간 되감기 가능"
            - name: "오아시스 물"
              price: 80
              description: "HP 300, 사막 열사병 해제"
        services:
          - type: "희귀 아이템 중개"
            description: "원하는 아이템 의뢰하면 며칠 후 구해줌"
          - type: "사막 안내"
            description: "황혼의 사막 지도 및 안전 경로 제공"

      - id: "mirage_fortuneteller_shira"
        name: "점술사 시라"
        role: "점술사 / 예언자"
        personality: "신비롭고 조용한 여성. 말을 거의 하지 않지만, 할 때는 언제나 의미심장하다. 크리스를 보자마자 눈을 크게 뜨고 '드디어'라고 중얼거렸다."
        backstory: >
          사실 점술사가 아니라, 세피로스의 1만 번 반복 중 몇 번의 기억을 보존하고 있는
          '차원 증인'이다. 다른 타임라인들에서 크리스가 어떻게 되었는지 파편적으로 기억하며,
          그 때문에 크리스의 미래가 두렵기도, 희망적이기도 하다. 릴리에 대해서는
          "그 아이는 열쇠"라고만 한다.
        location: "마을 외곽 천막"
        dialogues:
          greeting: "...드디어 왔군요. 기다렸어요. 오래."
          idle:
            - "오늘 모래가 서쪽으로 흘러요. 뭔가 이쪽으로 오고 있다는 뜻이죠."
            - "당신 손금... 여러 개예요. 다른 차원에서 살았던 흔적들이."
            - "릴리 씨는 점 안 봐도 돼요. 그 아이 운명은 이미 정해져 있으니까. 아니, 정해졌다고 생각했는데..."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨가 실패한 차원을 저는 9,847개 봤어요. 성공한 차원은... 아직 못 봤어요. 이번이 처음일 수도 있어요."
                - "세피로스는 왜 1만 번이나 반복했을까요? 저도 오래 생각했어요. 아마... 당신을 위해서가 아닐까요."
            - chapter: "rpg_ch2"
              lines:
                - "릴리 씨가 당신에게 숨기는 게 있어요. 나쁜 마음이 아니에요. 당신을 지키려는 거죠. 근데 그게 오히려 위험할 수도."
          quest_dialogues:
            - quest_id: "mirage_q2_prophecy_stone"
              lines:
                - "예언석이 사막 어딘가에 있어요. 찾으면 당신이 성공할 확률을 볼 수 있을 거예요. 알고 싶나요?"
        shop: null
        services:
          - type: "운세 점괘"
            description: "200골드, 다음 던전의 적 정보 미리 공개"
          - type: "차원 기억 해석"
            description: "퀘스트 완료 후, 다른 차원에서의 크리스 행적 일부 공개"

      - id: "mirage_dancer_layla"
        name: "무희 라일라"
        role: "무희 / 여관 운영"
        personality: "열정적이고 자유분방한 여성. 춤이 삶의 전부이며, 슬플 때도 춤으로 표현한다. 사람을 금방 좋아하고 금방 잊어버리지만, 한번 친구로 인정하면 목숨을 건다."
        backstory: >
          어릴 때 사막의 신기루 속에서 춤추는 환상을 보았고, 그것이 다른 차원의 자신이라는 걸
          나중에 알았다. 그 춤을 재현하기 위해 평생을 바쳤으며, 이제 그 춤은 실제로 공간을
          왜곡시키는 효과가 있다. 여관도 운영하지만 메인은 공연이다. 크리스에게 처음 만난 날
          춤을 가르쳐 주겠다고 했다.
        location: "사막 장미 여관 겸 공연장"
        dialogues:
          greeting: "어머, 잘생겼네! 아니 예쁘네! 아니 둘 다네! 어서 와요, 공연 막 시작할 거예요!"
          idle:
            - "춤은 몸으로 하는 게 아니에요. 영혼으로 하는 거예요. 몸은 그냥 따라오는 거고."
            - "오늘 공연에 드워프 손님이 왔었는데, 끝나고 울더라. 드워프가! 최고의 칭찬이죠."
            - "릴리 씨한테 춤 가르쳐줬어요. 재능 있어요. 크리스 씨는... 음... 열정은 있어요."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "제가 추는 춤, 사실 차원을 여는 열쇠예요. 세피로스가 처음 이 세계를 만들 때 사용한 춤이래요. 신기루 속에서 배웠거든요."
            - chapter: "rpg_ch2"
              lines:
                - "카인 부하들이 제 춤을 원해요. 차원 문을 여는 데 쓰려고. 당연히 거절했죠. 그 사람들한테 제 춤을 쓰게 할 순 없어."
          quest_dialogues:
            - quest_id: "mirage_q3_dance_of_dimension"
              lines:
                - "차원의 춤 완성본을 가르쳐드릴게요. 대신 사막 오아시스에서 수련 좀 도와주세요. 혼자는 무서워요."
        shop: null
        services:
          - type: "숙박"
            description: "1박 60골드, 공연 포함"
          - type: "춤 수련"
            description: "민첩성 +5 영구 효과, 3회 한정"
          - type: "공연 관람"
            description: "파티 전원 MP +50"

      - id: "mirage_blacksmith_ember"
        name: "대장장이 엠버"
        role: "대장장이"
        personality: "과묵하고 땀 냄새 나는 여성 대장장이. 겉은 무뚝뚝하지만 고객의 전투 스타일을 꿰뚫어보는 눈이 있다. 자신이 만든 무기에 자부심이 하늘을 찌른다."
        backstory: >
          드워프들에게 대장장이 기술을 배운 유일한 인간 여성. 딥홈에서 수련하다가 쫓겨났는데,
          이유는 드워프들보다 잘 만들어서라고 본인은 주장한다. 사막 모래를 녹여 특수 합금을
          만드는 기법을 개발했으며, '황혼강'이라 불리는 이 합금으로 만든 무기는 차원 에너지를
          증폭시키는 효과가 있다.
        location: "마을 동쪽 대장간"
        dialogues:
          greeting: "주문이요? 뭐 필요해요? 빨리빨리."
          idle:
            - "황혼강은 녹이는 데만 사흘이 걸려요. 그래서 비싼 거예요."
            - "드워프들이 저 쫓아냈다고요? 그건 제 버전이고, 드워프 버전은 좀 달라요. 진실은 중간 어딘가겠죠."
            - "크리스 씨 검 봤어요. 좋은 검인데, 손잡이 균형이 약간 틀어져 있어요. 제가 고쳐드릴게요."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "차원 에너지가 강해질수록 제 무기들도 강해져요. 근데 그건 세상이 불안정하다는 뜻이기도 해서... 좋은 건지 모르겠어요."
          quest_dialogues:
            - quest_id: "mirage_q4_twilight_ore"
              lines:
                - "황혼 광석이 사막 깊은 곳에 있어요. 위험한 곳이라 제가 못 가요. 가져다주면 특별 무기 만들어드릴게요."
        shop:
          name: "엠버의 대장간"
          items:
            - name: "황혼의 검"
              price: 800
              description: "공격력 +45, 차원 에너지 증폭"
            - name: "사막 방어구"
              price: 600
              description: "방어력 +30, 화염 저항 +20%"
            - name: "황혼강 단검"
              price: 500
              description: "공격속도 +15%, 치명타율 +10%"
        services:
          - type: "무기 강화"
            description: "황혼강으로 기존 무기 강화 (+1~+5)"
          - type: "장비 수리"
            description: "모든 장비 수리 가능"
          - type: "특수 제작"
            description: "재료 제공 시 전용 무기 제작"

      - id: "mirage_scholar_dune"
        name: "학자 듄"
        role: "고대 문자 해독가 / 도서관 사서"
        personality: "말을 하면 멈추질 않는 중년 남성. 차원 이론에 미쳐 있으며, 자신의 이론이 맞다는 걸 증명하기 위해 위험한 곳도 마다않고 간다."
        backstory: >
          황혼의 사막 아래 묻힌 고대 문명의 문자를 해독하는 것이 평생 과업이다. 10년 연구 끝에
          그 문자가 '세피로스 이전 차원'의 기록이라는 것을 알아냈다. 즉, 세피로스보다 앞선
          존재가 이 차원들을 설계했다는 뜻이다. 이 발견이 무섭기도 하고 흥분되기도 하다.
        location: "마을 도서관 (사실 창고)"
        dialogues:
          greeting: "오오! 새 연구 대상! 아니, 새 손님! 환영합니다! 차원학에 관심 있으세요? 제 논문 읽으실래요? 3,000페이지예요!"
          idle:
            - "세피로스가 1만 번 반복했다는 건 알죠? 근데 '왜 정확히 1만 번인가'는 생각해봤어요? 이 숫자에 패턴이 있어요!"
            - "고대 문자 해독 중인데, 이 부분이 도통 모르겠어요. '열쇠는 심장이 아닌 기억에 있다'... 무슨 뜻일까요?"
            - "릴리 씨한테 제 이론 설명했더니 기절하는 척 했어요. 그게 아닌 거 알아요. 그냥 재미없었던 거죠."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨! 제 발견 들어봐요. 카인이 찾는 시간의 왕좌, 그건 단순한 의자가 아니에요. 이 차원 전체를 재설계할 수 있는 장치예요. 카인이 앉으면..."
            - chapter: "rpg_ch3"
              lines:
                - "세피로스 이전에 뭔가 있었어요. 제 연구 결과예요. 1만 번 반복은 세피로스의 의지가 아니라, 그 '뭔가'의 명령이었을 수도 있어요."
          quest_dialogues:
            - quest_id: "mirage_q5_ancient_ruins"
              lines:
                - "사막 남쪽 고대 유적에 못 가본 구역이 있어요. 봉인이 걸려있는데... 크리스 씨가 가주실 수 있어요? 저는 몸이 약해서요. 기절 잘 해요."
        shop: null
        services:
          - type: "고대 문자 해독"
            description: "얻은 고대 기록 해석, 퀘스트 힌트 제공"
          - type: "차원학 강의"
            description: "지식 +3, 마법 이해도 증가"

      - id: "mirage_oasis_keeper_nadia"
        name: "오아시스 관리인 나디아"
        role: "오아시스 수호자"
        personality: "조용하고 평화로운 노파. 항상 물 곁에 있으며, 물에 손을 담그면 뭔가 보인다고 한다. 실제로 물로 치료를 하는 신비한 능력이 있다."
        backstory: >
          오아시스의 물이 다른 차원에서 흘러온다는 것을 알고 있다. 그 물에 손을 담그면
          다른 차원의 기억이 흘러들어오는데, 이것을 이용해 치료에 응용한다. 사실 그녀 자신도
          원래 이 차원 사람이 아니다 — 아주 오래전 차원 이동으로 이곳에 왔고, 돌아가는 법을
          잊어버렸다. 이제 이곳이 집이다.
        location: "마을 외곽 오아시스"
        dialogues:
          greeting: "...물 마셔요. 오아시스 물은 그냥 물이 아니에요. 마시면... 조금 달라져요."
          idle:
            - "오늘 물이 유난히 맑아요. 뭔가 좋은 일이 있을 것 같은데."
            - "저 원래 이 차원 사람 아니에요. 근데 이제 어디가 원래인지 잊어버렸어요. 그게 슬프다가도 괜찮아요."
            - "릴리 씨가 어제 물에 손 담갔어요. 바로 손 뺐는데... 뭔가 본 것 같았어요. 많이."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "오아시스 물이 달라지고 있어요. 차원이 불안정해지면서 다른 차원 물과 섞이고 있어요. 이걸 막으려면..."
          quest_dialogues:
            - quest_id: "mirage_q6_oasis_purification"
              lines:
                - "오아시스에 어두운 기운이 들어왔어요. 카인 조직이 뭔가 한 것 같아요. 정화 의식에 재료가 필요한데 도와줄 수 있어요?"
        shop: null
        services:
          - type: "차원 물 치료"
            description: "500골드, 모든 상태이상 해제 + 최대HP 일시 증가"
          - type: "기억 감지"
            description: "다른 차원에서의 행적 일부 공개 (확률적)"

    activities:
      - id: "mirage_act1_sand_racing"
        name: "사막 경주"
        type: "minigame"
        description: "사막 모래썰매를 타고 결승점까지 달리는 레이스. 바람 방향, 모래 언덕, 신기루 장애물을 피해야 한다. 로컬 챔피언 자히르 주니어와의 최종 대결."
        rewards: "골드, '사막의 질풍' 칭호, 사막 이동 속도 +15%"
        unlock_condition: null

      - id: "mirage_act2_mirage_hunting"
        name: "신기루 탐색"
        type: "gathering"
        description: "사막의 신기루 속에서 다른 차원 아이템을 획득한다. 신기루 안으로 들어가면 시간이 다르게 흘러 위험하지만, 희귀 아이템 보상이 크다."
        rewards: "랜덤 차원 아이템, 가끔 세피로스의 유물"
        unlock_condition: "정신력 40 이상"

      - id: "mirage_act3_star_gazing"
        name: "사막 별자리 관측"
        type: "social"
        description: "밤에 사막에서 별을 관측한다. 학자 듄과 함께하면 차원 지식을 얻고, 무희 라일라와 함께하면 춤을 배운다. 릴리와 단둘이 하면 특별 이벤트."
        rewards: "동반자에 따라 다른 보너스, 릴리 친밀도 이벤트 가능"
        unlock_condition: null

      - id: "mirage_act4_ancient_ruin_dig"
        name: "고대 유적 발굴"
        type: "gathering"
        description: "사막 아래 묻힌 고대 유적을 발굴한다. 삽질 미니게임으로 진행되며, 성공하면 고대 유물이나 차원 기록 조각을 얻는다."
        rewards: "고대 유물, 스토리 조각, 차원 지식"
        unlock_condition: "학자 듄 퀘스트 진행 중"

    town_events:
      - id: "mirage_ev1_sandstorm_festival"
        name: "모래폭풍 축제"
        trigger: "매 14일마다 (게임 내 시간)"
        description: "역설적으로 모래폭풍을 기념하는 축제. 폭풍을 막을 수 없으니 함께 즐기기로 한 전통. 무희들의 군무와 모닥불, 사막 특식이 펼쳐진다."
        choices:
          - option: "축제에 참여해 춤을 춘다"
            result: "라일라와 친밀도 증가, 차원의 춤 조각 획득"
          - option: "폭풍 속에서 신기루를 탐색한다"
            result: "위험하지만 초희귀 아이템 기회"

      - id: "mirage_ev2_time_shard_awakening"
        name: "시간 파편의 진동"
        trigger: "rpg_ch1 후반 마을 방문"
        description: "사막 깊은 곳에서 진동이 느껴진다. 시간 파편이 깨어나기 시작한다는 징조. 마을 전체가 불안에 빠지고, 카인의 부하들이 증가한다."
        choices:
          - option: "즉시 파편을 확보하러 간다"
            result: "시간 파편 먼저 획득, 카인과 선점 경쟁"
          - option: "마을 방어를 먼저 돕는다"
            result: "마을 호감도 최대, 파편은 나중에"

      - id: "mirage_ev3_mirage_collapse"
        name: "신기루의 붕괴"
        trigger: "rpg_ch3 시작 후"
        description: "황혼의 사막 신기루들이 갑자기 사라지기 시작한다. 신기루 속 다른 차원의 투영이 사라진다는 것은, 그 차원들이 소멸하고 있다는 뜻이다. 점술사 시라가 처음으로 공황 상태에 빠진다."
        choices:
          - option: "시라를 안정시키고 정보를 얻는다"
            result: "카인의 현재 위치 정보, 시라 생존 루트"
          - option: "즉시 다음 목적지로 향한다"
            result: "시간 절약, 시라 루트 포기"

  # ═══════════════════════════════════════════════════════════
  # 3. 딥홈 - 심연의 동굴
  # ═══════════════════════════════════════════════════════════
  deephome:
    town_name: "딥홈"
    region: "심연의 동굴"
    atmosphere: >
      지하 깊숙이 자리한 드워프 마을. 수천 개의 발광 광물이 천장을 수놓아 마치 지하의 밤하늘
      같다. 망치 소리와 풀무 소리가 끊이지 않고, 맥주 냄새가 진동한다. 드워프들은 거칠지만
      정이 많으며, 한번 친구로 인정하면 죽을 때까지 곁에 있다. 그러나 심연의 바닥에서
      올라오는 이상한 기운에 최근 모두가 예민해져 있다.
    npcs:
      - id: "deephome_miner_chief_gravel"
        name: "드워프 마이너 그라벨"
        role: "광산 책임자 / 마을 대표"
        personality: "우렁찬 목소리와 풍채를 가진 드워프 족장. 겉은 무섭지만 약자에게 한없이 자상하다. 맥주를 마시면 눈물이 많아진다."
        backstory: >
          500년 된 딥홈의 43대 광산 책임자. 최근 심연 깊은 곳에서 '시간의 소리'가 들리기 시작했다고
          말하는데, 이를 믿는 사람이 없어 답답해한다. 실은 그 소리가 카인이 심연에서 뭔가를 캐내고
          있다는 증거임을 본인은 모른다. 드워프 최고 장인이었던 아버지를 잃은 것이 한이며,
          아버지의 유작 도끼를 완성하는 것이 평생 꿈이다.
        location: "마을 중앙 광장, 대형 모루 옆"
        dialogues:
          greeting: "어이! 인간이잖아! 처음 보는 얼굴인데, 뭐하러 왔어? 광석 사러? 아니면 맥주 마시러? 둘 다면 환영이야!"
          idle:
            - "심연에서 소리가 나. 틱-탁, 틱-탁. 시계 같은 소리야. 근데 아무도 안 믿어. 드워프가 헛것을 보겠냐고!"
            - "맥주 한 잔 할래? 딥홈 흑맥주야. 이거 마시면 어디서 왔든 친구야."
            - "아버지 도끼가 여기 있어. 봐봐. 미완성이야. 마지막 광석을 끝내 못 구하셨어. 내가 구할 거야."
            - "요즘 광부들이 심연 아래에서 이상한 걸 발견해. 뭔가 기계 같은 것. 우리 드워프가 만든 게 아니야."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 너 그거 느끼냐? 심연에서 올라오는 기운. 카인 냄새야. 나 그 냄새 알아. 우리 아버지 돌아가실 때 맡았던 냄새거든."
            - chapter: "rpg_ch2"
              lines:
                - "심연 7층에 뭔가 있어. 우리 광부들이 거기까지 파다가 다 돌아왔어. 뭔가 무서운 거 봤다고. 크리스, 부탁이야."
                - "내가 딥홈 드워프 전체를 대표해서 부탁하는 거야. 심연 아래 그것 좀 막아줘. 여기가 우리 집이야."
          quest_dialogues:
            - quest_id: "deephome_q1_abyss_depth"
              lines:
                - "심연 7층에 가줘. 광부들이 두려워서 못 가거든. 뭐가 있는지 알아와줘. 대신 딥홈 최고 품질 광석 줄게."
            - quest_id: "deephome_q2_fathers_axe"
              lines:
                - "아버지 도끼 완성에 '별빛 강철'이 필요해. 심연 깊은 곳에 있는데... 카인 부하들이 이미 거기 있을 수도 있어."
        shop: null
        services:
          - type: "퀘스트 의뢰"
          - type: "딥홈 통행증 발급"
            description: "심연 하층 접근권 부여"

      - id: "deephome_brewer_malt"
        name: "양조사 몰트"
        role: "양조사 / 여관주인"
        personality: "항상 맥주를 들고 다니는 통통한 여성 드워프. 세상 모든 걱정을 맥주로 해결할 수 있다고 믿는다. 실제로 그녀의 맥주에는 치유 효과가 있다."
        backstory: >
          딥홈 역사상 최초의 여성 양조 장인. 200년 전통 레시피에 자신이 발견한 '심연 버섯'을
          추가해 새로운 차원의 맥주를 만들었다. 이 맥주를 마시면 과거의 슬픔이 잠시 무뎌지는데,
          이는 심연 버섯이 기억에 작용하기 때문이다. 그녀는 이것을 '안식'이라 부른다.
        location: "심연의 선술집"
        dialogues:
          greeting: "어서 와! 뭐 마실래? 아, 인간이구나. 우리 맥주 처음이지? 조심해, 꽤 독해. 그래도 마시면 기분 좋아져."
          idle:
            - "이 맥주 레시피, 400년 됐어. 근데 내가 추가한 심연 버섯 덕분에 아직도 진화 중이야."
            - "요즘 손님들이 맥주 마시다가 우는 경우가 많아. 심연이 불안해지면 사람들도 불안해지거든."
            - "릴리 씨는 맥주 못 마셔요? 그럼 허브차 드릴게요. 특제야."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "크리스, 솔직히 말할게. 심연 맥주... 요즘 맛이 변해. 기억 억제 효과가 너무 강해져서 마시면 며칠 기억이 날아가는 경우가 있어. 카인이 뭔가 심연에 뿌린 것 같아."
          quest_dialogues:
            - quest_id: "deephome_q3_special_brew"
              lines:
                - "크리스, 부탁이야. 심연 6층에 '기억 버섯'이 있어. 그거 가져다주면 카인의 기억 조작을 막는 해독제 맥주 만들 수 있어."
        shop:
          name: "심연의 선술집"
          items:
            - name: "딥홈 흑맥주"
              price: 30
              description: "HP 150 회복, 사기 +5"
            - name: "심연 버섯 에일"
              price: 80
              description: "상태이상 저항 +30%, 10분간"
            - name: "드워프 특제 음식"
              price: 50
              description: "HP/MP 동시 회복, 포만감 제공"
        services:
          - type: "숙박"
            description: "1박 40골드, 맥주 포함"
          - type: "해독 서비스"
            description: "심연 독 해독 (심연 버섯 확보 후)"

      - id: "deephome_engineer_cogsworth"
        name: "엔지니어 콕스워스"
        role: "기계 엔지니어 / 발명가"
        personality: "안경을 쓴 마른 드워프. 기계에 대한 열정이 넘쳐 대화의 80%가 기계 이야기다. 하지만 사람에게도 기계처럼 정직하고 신뢰할 수 있다."
        backstory: >
          딥홈에서 발견된 고대 기계 유물을 분석하다가, 그것이 단순한 기계가 아니라 '차원 압축
          장치'임을 알아냈다. 카인이 심연에서 찾는 것이 바로 이 장치의 완성체일 가능성이 높다.
          자신의 발명품을 통해 파티를 도울 수 있는 가젯들을 만들어준다.
        location: "마을 북쪽 연구소"
        dialogues:
          greeting: "오! 인간! 인간 해부학이 드워프랑 다른 점이 있는지 항상 궁금했는데— 아 미안, 겁주려던 게 아니에요. 기계 사러 왔어요?"
          idle:
            - "이 톱니바퀴 좀 봐봐요. 심연에서 발견한 거예요. 드워프가 만든 게 아니에요. 아무도 못 만들어요. 이걸."
            - "차원 압축 이론을 정립했어요. 간단히 설명하면... 두 시간 걸려요. 짧게 하면 한 시간."
            - "크리스 씨 장비 업그레이드해드릴까요? 제 신기술 적용해드릴게요. 95% 성공률이에요. 나머지 5%는... 폭발."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "심연에서 발견한 장치, 분석 완료했어요. 이건 카인이 만든 게 아니에요. 훨씬 오래됐어요. 세피로스보다도."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 이 장치를 완성하면 모든 차원을 하나로 압축할 수 있어요. 그러면 시간의 왕좌는 유일한 존재가 되는 거고... 카인이 신이 되는 거예요."
          quest_dialogues:
            - quest_id: "deephome_q4_machine_parts"
              lines:
                - "고대 장치 분석에 부품이 필요해요. 심연 5층에 있는 기계 유물 조각 5개만 가져다주면 돼요. 위험하긴 한데..."
        shop:
          name: "콕스워스 연구소"
          items:
            - name: "자동 수리 가젯"
              price: 600
              description: "전투 중 매 3턴 HP 100 자동 회복"
            - name: "차원 탐지기"
              price: 400
              description: "숨겨진 차원 균열 탐지"
            - name: "에너지 부스터"
              price: 300
              description: "ATB 게이지 즉시 50% 충전"
        services:
          - type: "장비 개조"
            description: "특수 능력 부여 (재료 필요)"
          - type: "차원 분석"
            description: "획득한 차원 유물 정보 제공"

      - id: "deephome_elder_stoneheart"
        name: "장로 스톤하트"
        role: "드워프 장로 / 역사가"
        personality: "천 년을 산 최고령 드워프. 움직임이 느리고 말도 느리지만, 모든 말이 진실이다. 눈을 거의 감고 있지만 모든 것을 보고 있다."
        backstory: >
          딥홈의 역사 전체를 기억하는 유일한 존재. 세피로스가 이 차원을 만들 때 직접 목격했으며,
          그때 세피로스가 무언가를 심연에 숨겼다는 것을 안다. 그것이 카인의 목표라는 것도.
          하지만 드워프 장로의 법칙상, 외부인에게 먼저 정보를 줄 수 없다 — 물어봐야 한다.
        location: "장로의 방, 마을 가장 깊은 곳"
        dialogues:
          greeting: "...(긴 침묵)... 앉아라."
          idle:
            - "딥홈은 천 년 전이나 지금이나 같아. 바뀌는 건 사람뿐이야."
            - "세피로스를 직접 봤어. 슬픈 눈이었어. 그 눈빛이 아직도 기억나."
            - "카인... 그 이름도 기억해. 세피로스의 그림자 같은 존재야."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 네가 뭘 찾고 있는지 알아. 심연 최하층에 세피로스가 숨긴 것. 그건 무기가 아니야. 기억이야. 이 차원 전체의 기억."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 그 기억을 가져가면 차원들이 자신이 어떻게 만들어졌는지를 잊어버려. 그러면 차원들은 카인의 것이 되는 거야."
                - "릴리... 그 아이에게 전해라. 세피로스가 그 아이를 위해 뭔가를 남겼다고."
          quest_dialogues:
            - quest_id: "deephome_q5_elder_trial"
              lines:
                - "심연 최하층은 내가 봉인했어. 봉인을 열려면 드워프 3대 시련을 통과해야 해. 힘, 지혜, 인내."
        shop: null
        services:
          - type: "고대 역사 열람"
            description: "딥홈과 세피로스에 관한 고대 기록"
          - type: "봉인 해제"
            description: "시련 통과 후 심연 최하층 개방"

      - id: "deephome_scout_pebble"
        name: "정찰병 페블"
        role: "심연 정찰병"
        personality: "젊고 용감한 드워프 청년. 겁이 없다는 게 장점이자 단점. 심연을 탐험하는 것을 즐기며, 크리스를 보자마자 동료로 인정했다."
        backstory: >
          딥홈에서 가장 깊은 곳까지 탐험한 드워프. 심연 6층에서 카인의 부하들을 목격했고,
          그들이 거대한 기계를 조립하고 있었다고 보고했다. 아무도 믿지 않았지만 그라벨 족장만은
          믿어줬다. 크리스를 가이드로서 심연 탐험을 함께 할 수 있다.
        location: "심연 입구 근처"
        dialogues:
          greeting: "오! 인간이 심연에 오다니! 같이 탐험할래요? 저 혼자는 솔직히 좀 무서웠거든요."
          idle:
            - "심연 4층에 발광 크리스털이 있어요. 거기서 혼자 맥주 마셔봤는데 최고예요."
            - "카인 부하들 봤어요. 진짜예요. 믿어주는 사람이 족장이랑 크리스 씨뿐이에요."
            - "우리 드워프는 땅 속에서 태어났대요. 그래서 어둠이 무섭지 않대요. 근데 저는 좀 무서워요."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "크리스! 어제 심연에서 이상한 걸 봤어요. 기계에서 세피로스 문양이 나오는데... 카인이 세피로스의 기술을 훔친 건지, 아니면 원래 그의 것인지..."
          quest_dialogues:
            - quest_id: "deephome_q1_abyss_depth"
              lines:
                - "제가 심연 안내할게요! 7층까지 아는 길로 데려다드릴 수 있어요. 같이 가요!"
        shop: null
        services:
          - type: "심연 가이드"
            description: "심연 각 층 안내, 위험 구역 사전 경고"
          - type: "심연 지도"
            description: "탐험한 구역 지도 제공"

    activities:
      - id: "deephome_act1_mining"
        name: "광석 채굴"
        type: "gathering"
        description: "심연의 각 층에서 다양한 광석을 채굴한다. 층이 깊을수록 희귀 광석이 나오지만 위험도 증가. 채굴 스킬에 따라 성공률 변동."
        rewards: "각종 광석, 심연 소재, 가끔 고대 유물 조각"
        unlock_condition: null

      - id: "deephome_act2_arm_wrestling"
        name: "드워프 팔씨름 대회"
        type: "minigame"
        description: "드워프들과 팔씨름 대결. 순수 힘 스탯 기반이지만 타이밍 미니게임 요소 있음. 우승하면 드워프 명예 훈장 획득."
        rewards: "골드, '드워프의 친구' 칭호, 힘 +3"
        unlock_condition: null

      - id: "deephome_act3_crystal_crafting"
        name: "크리스털 공예"
        type: "training"
        description: "심연의 발광 크리스털을 가공해 장신구를 만든다. 성공하면 착용 시 특수 효과가 있는 장신구 완성. 실패하면 크리스털 소모."
        rewards: "특수 장신구, 제작 스킬 향상"
        unlock_condition: null

      - id: "deephome_act4_drinking_contest"
        name: "드워프 맥주 대결"
        type: "minigame"
        description: "딥홈 흑맥주를 마시는 대결. 음주 내성 판정 미니게임. 이기면 드워프 최고의 찬사를 받고, 지면 하루 동안 술취함 상태이상."
        rewards: "드워프 우정 +20, 특제 맥주 x5, '철의 위장' 칭호"
        unlock_condition: null

    town_events:
      - id: "deephome_ev1_crystal_festival"
        name: "크리스털 점등 축제"
        trigger: "매 10일마다"
        description: "딥홈의 모든 크리스털을 동시에 점등하는 축제. 지하 동굴이 은하수처럼 빛나며, 드워프들이 조상을 기리는 노래를 부른다. 이 날만큼은 모두가 평화롭다."
        choices:
          - option: "축제를 함께 즐긴다"
            result: "드워프 전체 호감도 +15, 특별 크리스털 선물"
          - option: "조용히 심연을 탐험한다"
            result: "축제 중 경비 없는 심연 탐험 기회"

      - id: "deephome_ev2_machine_activation"
        name: "고대 기계의 활성화"
        trigger: "rpg_ch2 중반, 딥홈 방문"
        description: "심연 깊은 곳에서 거대한 진동이 일어난다. 카인이 고대 기계를 활성화하기 시작했다. 딥홈 전체가 흔들리고, 발광 크리스털들이 깜박이기 시작한다."
        choices:
          - option: "즉시 심연으로 내려간다"
            result: "카인 부하들과 전투, 기계 활성화 지연"
          - option: "드워프들을 대피시킨다"
            result: "마을 주민 안전 확보, 기계 완전 활성화"
          - option: "콕스워스와 기계 역해킹을 시도한다"
            result: "위험하지만 성공 시 카인 계획 차질"

      - id: "deephome_ev3_great_collapse"
        name: "대붕괴 위기"
        trigger: "rpg_ch3 초반"
        description: "심연 최하층에서 이상 반응이 일어나며 딥홈 일부가 무너지기 시작한다. 그라벨이 처음으로 두려움을 드러내며 크리스에게 도움을 요청한다."
        choices:
          - option: "심연으로 내려가 원인을 제거한다"
            result: "딥홈 구조, 그라벨 최대 친밀도, 심연 최하층 개방"
          - option: "드워프들 대피를 돕는다"
            result: "주민 전원 생존, 딥홈 일부 영구 소실"


  # ═══════════════════════════════════════════════════════════
  # 4. 스카이홀드 - 폭풍의 고원
  # ═══════════════════════════════════════════════════════════
  skyhold:
    town_name: "스카이홀드"
    region: "폭풍의 고원"
    atmosphere: >
      구름 위에 걸쳐 있는 마을. 바람이 한 순간도 멈추지 않으며, 건물들은 모두 돌로 만들어
      바람에 맞서 서 있다. 주민들은 강하고 자부심이 넘치지만, 혼자 고원 끝에 서서 저 아래를
      내려다보는 습관이 있다 — 세상이 이렇게 넓다는 것을 잊지 않기 위해. 폭풍이 칠 때
      하늘에 가끔 차원 균열이 보이는데, 이제는 주민들도 그러려니 한다.
    npcs:
      - id: "skyhold_windwalker_gale"
        name: "윈드워커 게일"
        role: "고원 수호자 / 마을 대표"
        personality: "바람처럼 자유롭고 폭풍처럼 강렬한 여성 전사. 웃음소리가 크고, 싸움을 즐기며, 약한 자를 보면 참지 못한다. 눈물은 절대 남 앞에서 흘리지 않는다."
        backstory: >
          스카이홀드 역사상 최연소 윈드워커. 15살에 첫 폭풍을 혼자 막아냈다는 전설이 있다.
          실은 그 폭풍이 차원 균열에서 온 것임을 알고 있으며, 그 이후 차원 현상에 관심을 갖게
          됐다. 카인이 고원 위에 기지를 세우려 했을 때 혼자 막아냈고, 그 때 왼쪽 귀를 잃었다.
          지금은 귀 대신 바람 소리가 들린다고 한다.
        location: "고원 최정상 '폭풍의 제단'"
        dialogues:
          greeting: "오! 이 높은 데까지 올라온 거야? 다리 안 떨렸어? 아니면 강심장이거나. 어느 쪽이든 마음에 들어!"
          idle:
            - "바람 소리 들려? 오늘은 서쪽에서 뭔가 오고 있다는 뜻이야. 나쁜 것인지 좋은 것인지는 더 들어봐야 알아."
            - "귀가 없어도 바람 소리는 들려. 오히려 더 잘 들려. 신기하지?"
            - "카인 부하들이 고원에 오면 내가 다 날려버렸어. 그러니까 안 와. 효과적인 외교지."
            - "릴리라는 아가씨, 바람이 그 사람 주변에서 특이하게 움직여. 뭔가 있어."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 네가 뭘 하려는지 알아. 카인을 막으려는 거잖아. 나도 같이 싸울게. 단, 내 방식으로."
                - "차원 균열이 요즘 매일 보여. 세피로스가 반복할 때마다 이 고원에 흔적이 남았나봐. 하늘을 보면 다른 세계가 보이거든."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 하늘 쪽으로 뭔가 올리려고 해. 공중 요새? 차원문? 내가 막을게. 근데 그 아래를 네가 해결해줘야 해."
            - chapter: "rpg_ch3"
              lines:
                - "크리스, 이 싸움 끝나면 같이 여기서 바람 맞자. 아무 말 없이. 그냥 바람만 맞으면서."
          quest_dialogues:
            - quest_id: "skyhold_q1_storm_guardian"
              lines:
                - "폭풍 제단에 이상이 생겼어. 원래는 차원 균열을 막는 역할인데, 요즘 오히려 균열을 키우고 있어. 조사해줄 수 있어?"
        shop: null
        services:
          - type: "전투 훈련"
            description: "윈드워커 전투 기술 교육, 공격력 +5 영구"
          - type: "고원 통행 허가"
            description: "고원 상층부 접근권 부여"

      - id: "skyhold_archer_zephyr"
        name: "궁수 제피르"
        role: "고원 궁수 / 교관"
        personality: "냉철하고 계산적인 젊은 남성. 감정을 거의 드러내지 않지만 동료에 대한 애정만큼은 숨기지 못한다. 활 솜씨는 이 세계 최고라고 자부한다."
        backstory: >
          원래 평지 출신이었으나 카인의 군대에 쫓기다가 스카이홀드에 피신했다. 게일에게 목숨을
          구해주는 조건으로 마을 수비를 맡았고, 그게 10년 전이다. 이제 여기가 집이다.
          카인의 군대에 대한 분노가 남아 있지만, 게일의 영향으로 분노보다는 의무로 싸운다.
          릴리를 처음 봤을 때 오래된 동료를 만난 것 같은 느낌이 들었다고 한다.
        location: "마을 훈련장"
        dialogues:
          greeting: "...실력 있어 보이네. 활 쏠 줄 알아?"
          idle:
            - "바람을 읽어야 해. 고원에서는 바람이 변수가 아니라 동반자야."
            - "카인 군대... 내 고향을 불태웠어. 복수는 관심 없어. 다음 마을이 안 불타면 그걸로 충분해."
            - "릴리 씨 손... 활 쥐는 법이 특이해. 배운 적 없는데 본능적으로 알고 있는 것 같아."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 한 가지 물어봐도 돼? 릴리 씨... 어디서 데려온 거야? 처음 봤는데 낯이 익어. 아주 오래전에, 다른 어딘가에서 본 것 같아."
            - chapter: "rpg_ch2"
              lines:
                - "카인 군대 전술 알려줄게. 10년 동안 피해 다니면서 외웠거든. 이 정보면 전략이 달라질 거야."
          quest_dialogues:
            - quest_id: "skyhold_q2_eagles_eye"
              lines:
                - "고원 저 건너 봉우리에 카인의 감시탑이 생겼어. 활로 날려버릴 수 있는데, 거리가 좀 문제야. 재료 도와줘."
        shop:
          name: "제피르의 궁술 용품점"
          items:
            - name: "폭풍 화살"
              price: 20
              description: "화살 1개, 바람 속에서도 직진"
            - name: "폭발 화살"
              price: 50
              description: "범위 공격, 화살 1개"
            - name: "차원 관통 화살"
              price: 100
              description: "방어 무시 공격, 희귀"
            - name: "독 화살"
              price: 35
              description: "독 상태이상 부여"
        services:
          - type: "궁술 훈련"
            description: "원거리 공격력 +5 영구, 5회 한정"
          - type: "화살 제작"
            description: "특수 화살 주문 제작"

      - id: "skyhold_shaman_stormcaller"
        name: "주술사 스톰콜러"
        role: "마을 주술사 / 치료사"
        personality: "나이를 알 수 없는 노인. 폭풍과 대화한다고 말하며, 실제로 뭔가 들리는 것 같다. 유머 감각이 독특해서 웃겨야 할 타이밍에 무섭고, 무서워야 할 타이밍에 웃긴다."
        backstory: >
          스카이홀드 주술사 가문의 마지막 후손. 폭풍 속에 존재하는 차원 에너지를 다루는
          고대 기술을 보존하고 있다. 세피로스가 이 고원을 '차원의 통풍구'로 설계했다는 것을
          알고 있으며, 그 통풍구가 막히면 차원 에너지가 폭발한다는 것도 알고 있다.
          카인이 바로 그걸 노리고 있다.
        location: "마을 주술 신전"
        dialogues:
          greeting: "왔군. 폭풍이 너를 데려왔어. 좋은 징조야... 아마도."
          idle:
            - "바람이 말을 해. '조심해'라고. 뭘 조심하라는지는... 바람도 몰라."
            - "차원 에너지가 요즘 냄새가 달라. 연기 냄새야. 뭔가 타고 있어."
            - "릴리 씨는 특별한 아이야. 폭풍이 그 아이 주변에서 조용해지거든. 폭풍이 경외하는 거야."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 이 고원은 차원의 통풍구야. 여기로 다른 차원 에너지가 드나들어. 카인이 이걸 막으면 차원 전체가 폭발해."
                - "세피로스가 여기를 통풍구로 만든 건 이유가 있어. 차원이 살아 숨쉬게 하려고. 그게 막히면..."
            - chapter: "rpg_ch2"
              lines:
                - "폭풍 제단 봉인이 풀리고 있어. 카인 부하들이 풀고 있어. 막아야 해. 막지 못하면 이 고원 전체가 차원 폭탄이 돼."
          quest_dialogues:
            - quest_id: "skyhold_q3_ritual_stones"
              lines:
                - "통풍구 봉인을 강화하려면 의식돌 셋이 필요해. 고원 세 봉우리에 하나씩 있는데, 폭풍 정령들이 지키고 있어."
        shop: null
        services:
          - type: "주술 치료"
            description: "모든 상태이상 치료, 300골드"
          - type: "차원 봉인 강화"
            description: "파티 차원 저항 +20%, 전투 1회 지속"
          - type: "폭풍 소환"
            description: "퀘스트 완료 후, 전투 지원 기술 교수"

      - id: "skyhold_innkeeper_cloud"
        name: "여관주인 클라우드"
        role: "여관주인 / 요리사"
        personality: "이름처럼 몽환적이고 느긋한 중년 남성. 요리가 특기이며, 구름 위에서 자란 특수 재료로 만든 요리는 먹으면 하늘을 나는 것 같은 기분이 든다."
        backstory: >
          원래 저지대 출신 요리사였으나, 시식 여행 중 스카이홀드에 올라왔다가 돌아가는 길을
          잊어버렸다. 알고 보니 고원의 바람이 내려가는 길을 막고 있었는데, 20년 뒤 게일이
          길을 열어줬다. 그 때는 이미 스카이홀드가 집이 되어 있었다. 구름 위 재료로 만든
          요리는 먹는 사람이 잠시 차원 사이 공간을 경험하게 해준다.
        location: "하늘 여관 '구름 위의 집'"
        dialogues:
          greeting: "어서 오세요~ 오늘의 특선은 '구름 수프'예요. 먹으면 잠깐 다른 세계가 보일 수도 있는데, 무서워하지 마세요. 금방 돌아와요."
          idle:
            - "구름 위에서 20년을 살았더니 저도 조금 몽환적이 된 것 같아요."
            - "오늘 요리하다가 냄비 속에서 다른 차원 풍경이 보였어요. 예쁜 곳이었어요."
            - "릴리 씨가 구름 수프 드셨는데, 드시다가 잠깐 멈추셨어요. 뭔가 보신 것 같은데 물어볼 수가 없었어요."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "크리스 씨, 어젯밤 요리하다가 봤어요. 냄비 속에서 카인이 보였어요. 뭔가 거대한 거 앞에 서 있었는데... 기계였어요. 아주 큰."
          quest_dialogues:
            - quest_id: "skyhold_q4_cloud_ingredient"
              lines:
                - "고원 최정상에 '번개 버섯'이 있어요. 폭풍 중에만 나오는 건데... 제가 거기까지 못 올라가요. 가져다주시면 특별 요리 해드릴게요."
        shop: null
        services:
          - type: "숙박"
            description: "1박 55골드, 특선 구름 요리 포함"
          - type: "특수 요리"
            description: "차원 시야 임시 개방, 숨겨진 경로 탐지"

      - id: "skyhold_child_kite"
        name: "꼬마 카이트"
        role: "마을 아이 / 연 날리기 챔피언"
        personality: "고원에서 태어나 바람과 함께 자란 11살 소녀. 연을 날리면서 차원 균열 위치를 읽어내는 능력이 있는데, 본인은 그냥 연 날리기 좋아한다고 생각한다."
        backstory: >
          태어날 때 폭풍이 치고 차원 균열이 열렸다. 주술사 스톰콜러는 이 아이가 고원의 기운을
          타고났다고 말한다. 카이트의 연은 항상 차원 균열 쪽으로 날아가는데, 그래서 마을의
          비공식 '균열 탐지기' 역할을 한다. 크리스를 오빠라고 부르며 따른다.
        location: "마을 광장, 항상 연을 들고"
        dialogues:
          greeting: "오빠! 연 구경해! 오늘 연이 저쪽으로 자꾸 당겨지는데, 저기에 뭔가 있나봐!"
          idle:
            - "연이 자꾸 동쪽으로 가. 동쪽에 뭔가 있어. 나쁜 거인지 좋은 거인지는 모르는데."
            - "바람이 말 걸어줘. 무슨 말인지 모르겠는데 기분은 좋아."
            - "릴리 언니 예쁘다. 언니 오빠 좋아하지? 나 알아. 바람이 알려줬어."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "오빠! 연이 막 흔들려! 저쪽에 나쁜 게 많이 왔어! 빨리 가야 해!"
          quest_dialogues:
            - quest_id: "skyhold_q1_storm_guardian"
              lines:
                - "오빠, 연이 폭풍 제단 쪽으로 계속 당겨져. 거기 이상한 거 있어. 같이 가줘?"
        shop: null
        services:
          - type: "균열 탐지"
            description: "연을 통해 주변 차원 균열 위치 표시"

    activities:
      - id: "skyhold_act1_storm_riding"
        name: "폭풍 서핑"
        type: "minigame"
        description: "특수 보드를 타고 폭풍 속을 질주한다. 바람 방향을 읽어 방향을 조종하는 미니게임. 고수가 되면 실제 전투에서 회피율이 오른다."
        rewards: "골드, '폭풍의 기수' 칭호, 회피율 +5% 영구"
        unlock_condition: null

      - id: "skyhold_act2_cloud_fishing"
        name: "구름 낚시"
        type: "gathering"
        description: "구름 속에 사는 '하늘 물고기'를 낚는다. 실제로 존재하며, 요리 재료로 쓰거나 차원 에너지를 담고 있다. 낚싯대를 구름 속으로 던져 기다리는 미니게임."
        rewards: "하늘 물고기 (요리 재료), 가끔 차원 결정체"
        unlock_condition: null

      - id: "skyhold_act3_kite_flying"
        name: "연 날리기"
        type: "social"
        description: "카이트와 함께 연을 날린다. 릴리가 있으면 셋이서 날릴 수 있다. 연이 차원 균열을 탐지해 숨겨진 지역을 발견할 수 있다."
        rewards: "숨겨진 지역 탐지, 릴리 친밀도 이벤트"
        unlock_condition: null

      - id: "skyhold_act4_wind_training"
        name: "폭풍 수련"
        type: "training"
        description: "게일의 지도 아래 폭풍 속에서 전투 훈련. 극한 환경에서의 적응력을 키운다. 완료 시 바람 속성 저항과 이동 속도가 영구적으로 증가."
        rewards: "바람 저항 +15%, 이동속도 +10% 영구"
        unlock_condition: "게일 친밀도 50 이상"

    town_events:
      - id: "skyhold_ev1_great_storm"
        name: "대폭풍의 날"
        trigger: "매 21일마다"
        description: "스카이홀드 역사상 가장 강한 폭풍이 주기적으로 몰아친다. 마을 전체가 실내로 들어가고, 오직 윈드워커만이 폭풍 속에 선다. 이 날 폭풍 제단에 가면 차원의 목소리가 들린다."
        choices:
          - option: "폭풍 제단에 홀로 선다"
            result: "세피로스의 메시지 수신, 강력한 버프 아이템"
          - option: "게일과 함께 마을을 지킨다"
            result: "게일 친밀도 최대, 윈드워커 전투 기술 전수"

      - id: "skyhold_ev2_dimension_rift_expansion"
        name: "차원 균열 확대"
        trigger: "rpg_ch2 후반, 스카이홀드 방문"
        description: "하늘에 차원 균열이 폭발적으로 늘어난다. 카이트의 연들이 모두 그쪽으로 당겨지고, 주술사 스톰콜러가 쓰러진다. 카인이 통풍구를 막기 시작한 것이다."
        choices:
          - option: "즉시 통풍구 봉인을 강화한다"
            result: "차원 균열 억제, 스톰콜러 회복"
          - option: "균열을 통해 카인 기지를 역추적한다"
            result: "카인 위치 파악, 균열 계속 확대"

      - id: "skyhold_ev3_kite_disappearance"
        name: "카이트의 실종"
        trigger: "rpg_ch3 초반"
        description: "카이트가 연을 따라 차원 균열 속으로 들어가버렸다. 게일이 처음으로 눈물을 흘린다. 카이트를 구하러 균열 속으로 들어가면, 카인의 계획 핵심 정보를 얻을 수 있다."
        choices:
          - option: "즉시 균열 속으로 들어간다"
            result: "카이트 구조, 카인 정보 획득, 게일 최대 친밀도"
          - option: "준비 후 들어간다"
            result: "카이트 생존 확인, 더 안전한 진입"
          - option: "균열을 닫는다"
            result: "카이트 영구 소실, 게일 적대, 다른 루트 개방"

  # ═══════════════════════════════════════════════════════════
  # 5. 프로스트헤이븐 - 영원의 빙원
  # ═══════════════════════════════════════════════════════════
  frosthaven:
    town_name: "프로스트헤이븐"
    region: "영원의 빙원"
    atmosphere: >
      세상의 끝처럼 느껴지는 얼음의 마을. 모든 것이 얼어 있지만, 이상하게도 춥지 않다 —
      영원히 얼어붙은 세계는 그 자체로 균형을 이루기 때문이다. 주민들은 느리게 움직이고
      느리게 말하지만, 생각의 깊이는 어느 마을보다 깊다. 빙원의 심층에서 가끔 빛이 올라오는데,
      그것을 '별의 숨결'이라고 부른다.
    npcs:
      - id: "frosthaven_sage_icelaw"
        name: "현자 아이스로어"
        role: "빙원 현자 / 마을 원로"
        personality: "수백 년을 산 노인. 말은 천천히 하지만 생각의 속도는 빠르다. 모든 것을 꿰뚫어 보는 눈빛이 있으며, 릴리를 처음 보자마자 '왔구나'라고 중얼거렸다."
        backstory: >
          세피로스가 이 빙원을 '기억의 저장소'로 설계했다는 것을 아는 몇 안 되는 인물. 수백 년간
          빙원 깊은 곳에 보관된 이전 차원들의 기억을 지켜왔다. 카인이 이 기억들을 소멸시키면
          세피로스의 1만 번 반복이 모두 무의미해진다. 릴리가 이 기억들의 열쇠임을 알고 있지만,
          릴리가 스스로 깨달아야 한다고 믿어 직접 말하지 않는다.
        location: "빙원 현자의 탑"
        dialogues:
          greeting: "...왔구나. 기억보다 늦었어. 아니, 딱 맞게 왔나. 시간은 항상 헷갈리게 해."
          idle:
            - "얼음은 기억을 보존해. 수만 년 전 공기가 아직도 여기 있어. 호흡하면 옛날 세계를 들이마시는 거야."
            - "세피로스가 1만 번 반복했어. 그 1만 번이 모두 이 빙원에 기록되어 있어."
            - "릴리... 그 아이가 왜 특별한지 알고 있어. 하지만 말해줄 수 없어. 때가 아니야."
            - "카인이 빙원을 녹이려 하고 있어. 기억들이 녹으면 사라져. 그게 그의 목적이야."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 세피로스의 1만 번 반복. 그 기록이 여기 있어. 보고 싶어? 단, 한 번 보면 되돌릴 수 없어."
                - "세피로스는 왜 반복했을까. 답은 간단해. 이 차원이 '올바른 결말'에 도달할 때까지. 그 결말에 너와 릴리가 있어."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 빙원을 공략하기 시작했어. 기억 소멸 장치를 만들고 있어. 막아줘. 이 기억들이 사라지면 세피로스의 희생이 전부 무의미해져."
            - chapter: "rpg_ch3"
              lines:
                - "이제 릴리에게 말해도 될 것 같아. 그 아이는... 세피로스가 마지막으로 남긴 의지야. 이 모든 반복의 이유."
          quest_dialogues:
            - quest_id: "frosthaven_q1_memory_cores"
              lines:
                - "빙원 심층에 '기억의 핵' 다섯 개가 있어. 카인이 찾기 전에 확보해야 해. 거기까지 가는 길은 내가 알려줄게."
        shop: null
        services:
          - type: "기억 열람"
            description: "이전 차원의 기억 일부 열람 (각성 이벤트)"
          - type: "차원 지식 전수"
            description: "마법 능력치 +10 영구, 3회 한정"

      - id: "frosthaven_hunter_frost"
        name: "사냥꾼 프로스트"
        role: "빙원 사냥꾼"
        personality: "조각 같은 외모의 청년. 말이 없고 혼자인 것을 좋아하지만 크리스에게는 이상하게 마음을 열었다. 빙원 생물에 대한 지식이 방대하다."
        backstory: >
          빙원의 얼음 사냥꾼 가문 출신. 어릴 때 빙원 깊은 곳에서 얼어붙은 채 발견됐는데,
          그 안에서 과거 차원의 기억을 경험했다. 그 기억 속 자신은 카인의 부하였다.
          그 충격으로 혼자 빙원을 돌아다니며 贖罪를 찾고 있다. 크리스에게 그 이야기를 처음으로 털어놓는다.
        location: "마을 외곽 사냥꾼 오두막"
        dialogues:
          greeting: "...뭐야. 이 추운 데까지 왜 왔어."
          idle:
            - "빙원 북쪽에 얼음 드래곤이 살아. 건드리지 마. 평화로운 녀석이야."
            - "얼음 속에 갇힌 적이 있어. 그 안에서 다른 내 모습을 봤어. 좋지 않은 내 모습."
            - "릴리 씨는 이상하게 빙원 생물들이 피하지 않아. 뭔가 있는 것 같아."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 솔직히 말할게. 내가 얼음 속에서 본 내 모습은 카인의 부하였어. 다른 차원에서. 그게 사실이면... 난 뭔 짓을 한 거야."
                - "그래서 혼자 있어. 다가가면 안 될 것 같아서. 근데 너는... 왜 괜찮은 거야."
            - chapter: "rpg_ch2"
              lines:
                - "카인 부하들이 빙원에 왔어. 내가 아는 얼굴도 있었어. 다른 차원에서 함께 싸웠던 것 같은 얼굴들."
          quest_dialogues:
            - quest_id: "frosthaven_q2_ice_dragon"
              lines:
                - "얼음 드래곤이 이상해. 평소엔 온순한데 오늘 폭주하고 있어. 카인 부하들이 자극한 것 같아. 달래줄 수 있어?"
        shop: null
        services:
          - type: "빙원 안내"
            description: "빙원 각 구역 안전 경로 안내"
          - type: "사냥 동행"
            description: "빙원 몬스터 토벌 시 동행"

      - id: "frosthaven_alchemist_aurora"
        name: "연금술사 오로라"
        role: "연금술사 / 포션 전문가"
        personality: "빙원의 오로라처럼 아름답고 변덕스러운 여성. 실험에 집착하며 폭발이 일어나도 흥분해서 메모를 먼저 한다. 자신의 실험실에서만 완전히 편안하다."
        backstory: >
          빙원의 특수 얼음을 이용한 연금술을 개발했다. 영원히 녹지 않는 빙원 얼음에는
          차원 에너지가 압축되어 있으며, 이를 촉매로 쓰면 일반 연금술보다 10배 강력한
          효과를 낸다. 카인이 그녀의 기술을 탐내 여러 번 스카우트 제안이 왔지만 전부
          폭발로 돌려보냈다. 문자 그대로.
        location: "연금술 연구소 (항상 연기 나는 건물)"
        dialogues:
          greeting: "오! 실험 대상—아니, 고객! 어서 와요! 지금 뭔가 만드는 중인데 잠깐—(폭발음)—괜찮아요. 예상 범위 내예요."
          idle:
            - "빙원 얼음 속 차원 에너지, 측정 성공했어요! 기존 이론의 3배예요! 논문 써야겠어."
            - "카인 부하가 또 스카우트 하러 왔어요. 이번엔 녹색 폭발로 보냈어요. 색깔 다양하게 해주려고요."
            - "릴리 씨가 실험 도와줬는데 안정화 효율이 두 배가 됐어요. 그 사람 존재 자체가 안정제인가봐요."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨, 제가 만든 '기억 보존약'이 있어요. 이걸 마시면 기억이 소멸되지 않아요. 카인이 기억 소멸을 사용할 때 대비해요."
            - chapter: "rpg_ch2"
              lines:
                - "기억 소멸 장치 샘플 입수했어요. 분석했는데... 이거 역으로 응용하면 소멸된 기억을 복원할 수 있어요. 카인이 이걸 알면 안 되는데."
          quest_dialogues:
            - quest_id: "frosthaven_q3_eternal_ice"
              lines:
                - "영원 빙정이 필요해요. 빙원 최심층에 있는 건데, 거기까지 혼자 못 가요. (지난번에 갔다가 3일 동안 얼어있었어요.)"
        shop:
          name: "오로라 연금술 연구소"
          items:
            - name: "기억 보존약"
              price: 500
              description: "기억 소멸 면역, 30분 지속"
            - name: "빙원 강화 포션"
              price: 400
              description: "공격력/방어력 +30%, 15분"
            - name: "차원 에너지 결정"
              price: 300
              description: "강력한 연금술 촉매"
            - name: "폭발 물약"
              price: 200
              description: "범위 피해, 오로라 특제"
        services:
          - type: "특수 포션 제작"
            description: "재료 제공 시 고급 포션 제작"
          - type: "아이템 강화"
            description: "빙원 차원 에너지로 아이템 강화"

      - id: "frosthaven_guide_permafrost"
        name: "안내인 퍼머프로스트"
        role: "빙원 안내인"
        personality: "50대 여성. 빙원을 손바닥 보듯 아는 베테랑. 겉은 무뚝뚝하지만 손님의 안전에는 누구보다 신경을 쓴다. 간식을 항상 가지고 다닌다."
        backstory: >
          30년간 빙원 안내인으로 일했다. 빙원에서 길을 잃으면 사망한다는 것을 누구보다
          잘 알기에, 단 한 번도 손님을 잃은 적이 없다는 것이 자랑이다. 카인 부하들에게
          안내를 요청받은 적이 있는데, 가장 위험한 구역으로 안내해 전부 얼려버렸다.
          현자 아이스로어의 제자이기도 하다.
        location: "마을 안내소"
        dialogues:
          greeting: "안내 필요해요? 빙원은 혼자 가면 안 돼요. 얼어 죽어요. 진짜로."
          idle:
            - "30년 동안 손님 한 명도 잃지 않았어요. 기록이에요."
            - "카인 부하들 안내했어요. 가장 위험한 곳으로. 다들 얼었어요. 안내는 제대로 했죠."
            - "빙원 북쪽에 아름다운 오로라 지대가 있어요. 거기 가면 다른 차원이 보이기도 해요."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "카인 부하들이 기억 소멸 장치를 빙원 심층에 설치하려 해요. 제가 아는 경로로 빠르게 막을 수 있어요."
          quest_dialogues:
            - quest_id: "frosthaven_q1_memory_cores"
              lines:
                - "기억의 핵 위치는 제가 알아요. 빙원 심층 다섯 곳에 흩어져 있어요. 안내해드릴게요."
        shop: null
        services:
          - type: "빙원 안내"
            description: "동행 시 빙원 각 구역 안전 탐험"
          - type: "빙원 지도"
            description: "완전한 빙원 지도 제공, 200골드"

      - id: "frosthaven_child_snowflake"
        name: "꼬마 스노우플레이크"
        role: "빙원 아이 / 오로라 관측자"
        personality: "6살 꼬마. 태어날 때부터 빙원에 살아서 추위를 못 느끼며, 눈과 얼음 위에서 맨발로 돌아다닌다. 오로라를 보면서 다른 세계를 상상하는 것이 취미."
        backstory: >
          빙원 주민들 사이에서 태어난 평범한 아이처럼 보이지만, 오로라를 볼 때 차원의
          모습들을 실제로 본다. 자신이 보는 것이 남들과 다르다는 것을 모르며, 그냥 오로라가
          재밌는 그림을 보여준다고 생각한다. 릴리를 '엄마'라고 불렀다가 당황해서 도망갔다.
        location: "마을 오로라 관측 언덕"
        dialogues:
          greeting: "언니! 오빠! 오로라 봐! 오늘은 파란 거랑 초록 거 있어! 저기 성도 보여!"
          idle:
            - "오로라 속에 사람들이 살아. 다른 사람들이야. 우리랑 비슷한데 조금 달라."
            - "엄마... 아니, 릴리 언니. 미안해. 그냥 그런 느낌이었어."
            - "저기 파란 오로라 있지? 저기에 슬픈 아저씨가 있어. 혼자 뭔가 세고 있어. 몇 번이나."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "오빠, 오로라 속에 오빠도 있어. 엄청 많은 오빠가. 다들 달리고 있어. 어딘가로."
                - "슬픈 아저씨... 세피로스 아저씨지? 나는 알아. 1만 번 세고 있어."
          quest_dialogues:
            - quest_id: "frosthaven_q4_aurora_message"
              lines:
                - "오빠, 오로라 속에 메시지가 있어. 읽어줄까? '기억은 얼음보다 단단하다. 릴리를 믿어라.' 이게 뭐야?"
        shop: null
        services:
          - type: "오로라 해석"
            description: "차원 정보 무료 제공 (아이의 순수한 시각)"

    activities:
      - id: "frosthaven_act1_ice_fishing"
        name: "얼음낚시"
        type: "gathering"
        description: "빙원의 얼음 구멍을 뚫고 낚시를 한다. 차원 물고기가 자주 나오며, 오로라가 있는 밤에는 초희귀 종이 등장한다. 낚시 미니게임 포함."
        rewards: "각종 물고기, 차원 물고기 (요리/연금술 재료), 가끔 기억 결정"
        unlock_condition: null

      - id: "frosthaven_act2_aurora_meditation"
        name: "오로라 명상"
        type: "training"
        description: "오로라 아래서 명상을 한다. 차원 에너지와 동조하여 내면을 강화한다. 성공 시 의지력과 마법 저항이 증가. 릴리와 함께하면 특별 이벤트."
        rewards: "의지력 +5, 마법저항 +10% 영구, 릴리 이벤트 가능"
        unlock_condition: null

      - id: "frosthaven_act3_ice_sculpting"
        name: "얼음 조각"
        type: "gathering"
        description: "빙원의 특수 얼음으로 조각품을 만든다. 완성된 조각품은 차원 에너지를 머금어 특수 아이템이 된다. 조각 미니게임 포함."
        rewards: "차원 에너지 저장 아이템, 장식품, 골드"
        unlock_condition: null

      - id: "frosthaven_act4_memory_immersion"
        name: "기억 침잠"
        type: "training"
        description: "빙원 심층의 기억 저장소에 들어가 이전 차원들의 기억을 경험한다. 극도로 감정적인 경험이며, 성공 시 과거 차원의 전투 기술을 습득할 수 있다."
        rewards: "랜덤 스킬 습득, 세피로스 기억 조각, 강력한 감정적 경험"
        unlock_condition: "현자 아이스로어 퀘스트 완료"

    town_events:
      - id: "frosthaven_ev1_aurora_borealis"
        name: "대오로라 현현"
        trigger: "매 28일마다"
        description: "빙원 전체를 덮는 거대한 오로라가 나타난다. 이 날 하늘에는 다른 차원의 모습들이 투영되며, 마을 전체가 아름다움에 넋을 잃는다. 스노우플레이크는 가장 많은 것을 본다."
        choices:
          - option: "오로라를 릴리와 함께 본다"
            result: "릴리 스토리 이벤트, 릴리의 정체에 대한 중요한 힌트"
          - option: "오로라 속 차원들을 분석한다"
            result: "차원 지식 대량 획득, 카인 계획 일부 해독"

      - id: "frosthaven_ev2_memory_erosion"
        name: "기억 침식"
        trigger: "rpg_ch2 중반, 프로스트헤이븐 방문"
        description: "카인의 기억 소멸 장치가 가동되기 시작한다. 마을 주민들이 하나둘 기억을 잃기 시작한다. 현자 아이스로어가 모든 것을 혼자 버티고 있다."
        choices:
          - option: "아이스로어를 도와 기억을 지킨다"
            result: "기억 보존 성공, 아이스로어 최대 친밀도"
          - option: "소멸 장치 원점을 즉시 공격한다"
            result: "장치 파괴, 일부 기억 이미 소실"

      - id: "frosthaven_ev3_lily_awakening"
        name: "릴리의 각성"
        trigger: "rpg_ch3 초반, 프로스트헤이븐 방문"
        description: "빙원 앞에서 릴리가 갑자기 걸음을 멈추고 무릎을 꿇는다. 그녀 주변의 얼음이 빛나기 시작하고, 수천 개의 차원 기억이 그녀에게로 흘러들어온다. 현자 아이스로어가 말한다: '이제 때가 됐어.'"
        choices:
          - option: "릴리 곁에서 버텨준다"
            result: "릴리 각성 완료, 릴리 진실 공개, 최종장 분기"
          - option: "아이스로어에게 설명을 요구한다"
            result: "기억 과부하로 각성 지연, 추가 스토리"


  # ═══════════════════════════════════════════════════════════
  # 6. 벨포트 - 전쟁의 대지
  # ═══════════════════════════════════════════════════════════
  belfort:
    town_name: "벨포트"
    region: "전쟁의 대지"
    atmosphere: >
      전장 한가운데 세워진 요새 마을. 포화 자국이 벽에 남아 있고, 아이들조차 검을 차고
      다닌다. 그러나 저녁이 되면 모든 무기를 내려놓고 함께 밥을 먹는다 — 전쟁을 알기에
      평화가 얼마나 소중한지 안다. 사령관 아이언월의 지휘 아래 카인에 맞서 싸우는 마지막
      저항선이며, 여기가 무너지면 아스트라로 가는 길이 열린다.
    npcs:
      - id: "belfort_commander_ironwall"
        name: "사령관 아이언월"
        role: "벨포트 사령관"
        personality: "철벽 같은 외모와 성격의 40대 여성 사령관. 감정을 드러내지 않지만 부하들을 누구보다 아낀다. 불가능한 상황에서도 포기를 모른다."
        backstory: >
          20년간 카인의 군대와 싸워온 베테랑 지휘관. 세 번의 전쟁에서 살아남았으며, 그때마다
          중요한 사람을 잃었다. 마지막으로 잃은 것은 오른손이었고, 지금은 강철 의수를 달고
          있다. 카인이 단순한 정복자가 아니라 차원 자체를 장악하려 한다는 것을 직감으로 알고
          있으며, 크리스가 오자 '드디어 왔다'고 말했다. 세피로스에 대해 들은 적이 있다.
        location: "벨포트 사령부"
        dialogues:
          greeting: "크리스. 기다렸어. 앉아. 할 말이 많아."
          idle:
            - "전쟁은 이기는 자의 것이 아니야. 살아남은 자의 것이야."
            - "오른손이 없어진 지 5년이야. 아직도 없는 손이 가끔 가려워."
            - "카인 군대가 어제 동쪽에서 왔다. 막았어. 오늘은 서쪽에서 올 거야. 막을 거야."
            - "우리 병사들 나이가 자꾸 어려져. 전쟁이 길어질수록 아이들이 무기를 잡아."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 전략적 상황 설명할게. 카인 군대는 아스트라를 목표로 하고 있어. 우리가 여기서 막지 못하면 별빛의 왕좌가 카인 손에 들어가."
                - "세피로스의 이름을 들은 건 오래전이야. 그분이 이 차원을 위해 무엇을 했는지... 우리가 여기서 싸우는 건 그 희생에 보답하는 거야."
            - chapter: "rpg_ch2"
              lines:
                - "크리스, 솔직히 말해. 우리가 이길 수 있어? 군사적으로 분석하면 승률 30%. 하지만 그 30%를 위해 끝까지 싸울 거야."
                - "릴리가 전선에 나갔다가 카인 부하 50명을 혼자 막았어. 어떻게 한 건지 모르겠어. 하지만... 고마워."
            - chapter: "rpg_ch3"
              lines:
                - "크리스, 최후의 방어선 구축 완료했어. 너희가 카인에게 가는 동안 우리가 여기를 지킬게. 절대 뚫리지 않아. 약속해."
          quest_dialogues:
            - quest_id: "belfort_q1_eastern_flank"
              lines:
                - "동쪽 측면이 위험해. 정찰대가 전멸했어. 거기 가서 카인 군대 규모를 파악해줘. 정면 돌파는 안 돼."
            - quest_id: "belfort_q2_supply_line"
              lines:
                - "보급선이 끊겼어. 서쪽 보급 창고까지 호위 없이 뚫고 가야 해. 위험하지만 다른 방법이 없어."
        shop: null
        services:
          - type: "전술 정보"
            description: "카인 군대 배치 및 전략 정보 공유"
          - type: "군수품 지원"
            description: "퀘스트 완료 시 군수 아이템 제공"

      - id: "belfort_medic_hope"
        name: "군의관 호프"
        role: "군의관 / 치료사"
        personality: "지치지 않는 밝은 에너지의 젊은 여성. 전장에서 아무리 끔찍한 것을 봐도 웃음을 잃지 않는다. 그 웃음이 진심인지 아닌지는 아무도 모른다."
        backstory: >
          전쟁고아 출신. 부모를 카인의 군대에 잃었지만 증오 대신 치료를 선택했다. 왜냐면
          증오로는 살린 사람이 한 명도 없지만, 의술로는 수백 명을 살렸기 때문이다. 그녀의
          의무실 문에는 "오늘도 살아서 다행이야"라는 글이 붙어 있다. 크리스를 처음 봤을 때
          "드디어 올 사람이 왔네"라고 중얼거렸다.
        location: "벨포트 의무실"
        dialogues:
          greeting: "어서 와요! 다친 데 없어요? 없어도 검사받아요. 여기는 다들 숨긴다고요."
          idle:
            - "오늘 수술 다섯 건. 다 살았어요. 좋은 하루예요."
            - "전쟁이 싫어요. 근데 전쟁이 없으면 제가 필요 없을 것 같아서... 아, 이런 생각 하면 안 되는데."
            - "릴리 씨가 부상자 옆에 있으면 회복이 빨라지는 것 같아요. 측정해봐야겠어요."
            - "오늘 밥은 먹었어요? 아니면 제가 줄까요. 전투식이지만 맛은 있어요."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스 씨, 제 소원이 뭔지 알아요? 이 의무실이 텅텅 비는 거예요. 부상자가 한 명도 안 오는 날. 그날이 오면 이 전쟁이 끝난 거잖아요."
            - chapter: "rpg_ch2"
              lines:
                - "카인 부하들도 치료해요. 포로가 됐을 때. 처음엔 싫었는데... 그 사람들도 그냥 사람이더라고요. 명령받은 사람들."
          quest_dialogues:
            - quest_id: "belfort_q3_medicine_supply"
              lines:
                - "의약품이 바닥났어요. 전쟁의 대지 동쪽 폐허에 옛날 의약 창고가 있는데, 가서 가져올 수 있어요? 거기 카인 순찰대가 있긴 한데..."
        shop:
          name: "벨포트 의무실"
          items:
            - name: "전투 의약품"
              price: 60
              description: "HP 250 회복, 전투 중 사용 가능"
            - name: "응급 처치 키트"
              price: 150
              description: "HP 완전 회복, 1회용"
            - name: "각성제"
              price: 100
              description: "기절/수면 즉시 해제"
            - name: "전투 강화제"
              price: 200
              description: "공격력 +20%, 10분"
        services:
          - type: "치료"
            description: "모든 상태이상 치료, 무료 (전시 중)"
          - type: "HP 완전 회복"
            description: "100골드"

      - id: "belfort_veteran_scarface"
        name: "베테랑 스카페이스"
        role: "노병 / 훈련 교관"
        personality: "얼굴에 흉터가 가득한 60대 노병. 말 하나하나가 전투 경험에서 나왔다. 젊은 병사들을 꾸짖지만 그들의 이름을 전부 외우고 있다."
        backstory: >
          카인 등장 이전부터 전쟁을 해온 인물. 세피로스를 실제로 만난 적이 있으며, 그때
          세피로스가 "이 차원은 반드시 지켜질 것"이라고 했던 말을 기억한다. 그 말 때문에
          30년 동안 싸워왔다. 이제 몸이 많이 망가졌지만 훈련만큼은 멈추지 않는다.
        location: "훈련장"
        dialogues:
          greeting: "...뭐하러 왔어. 싸움 배우러? 좋아. 앉아. 먼저 네가 왜 싸우는지부터 말해봐."
          idle:
            - "세피로스를 만난 게 40년 전이야. 그분이 한 말이 아직도 귀에 들려."
            - "이 흉터들, 다 기억해. 어디서 생겼는지, 누가 옆에 있었는지."
            - "요즘 병사들이 너무 어려. 싸울 게 아니라 공부해야 할 나이들이야."
            - "릴리라는 아가씨... 전에 본 적 있어. 다른 전쟁에서. 아니, 꿈에서인가."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 세피로스가 그랬어. '이 차원은 반드시 지켜질 것'이라고. 그래서 내가 30년 싸웠어. 너도 그 이유를 찾아."
            - chapter: "rpg_ch2"
              lines:
                - "카인을 상대하는 방법 알려줄게. 그 녀석은 완벽한 계획을 믿어. 그러니까 예측 불가능하게 움직여야 해."
          quest_dialogues:
            - quest_id: "belfort_q4_veteran_trial"
              lines:
                - "내 제자가 되고 싶으면 3가지 시험을 통과해. 힘, 판단력, 의지. 통과하면 내가 아는 모든 걸 가르쳐줄게."
        shop: null
        services:
          - type: "전투 훈련"
            description: "공격력/방어력 +8 영구, 5회 한정"
          - type: "전략 조언"
            description: "특정 보스 전투 전략 제공"

      - id: "belfort_blacksmith_forge"
        name: "대장장이 포지"
        role: "군수 대장장이"
        personality: "열정적이고 애국심 넘치는 40대 남성. 자신이 만든 무기가 병사들을 지켜준다고 믿으며, 매일 기도하듯 망치질을 한다."
        backstory: >
          벨포트 태생으로, 군수품 대장장이로 20년을 일했다. 카인 군대와의 첫 전투에서 아들을
          잃었고, 그 이후 더 강한 무기를 만들기 위해 연구를 거듭했다. 그가 개발한 '항마강'은
          차원 에너지를 차단하는 특수 합금으로, 카인의 차원 마법에 효과적이다.
        location: "군수 대장간"
        dialogues:
          greeting: "어서 와요! 뭐 필요해요? 최고로 만들어드릴게요. 우리 병사들 살리는 무기니까."
          idle:
            - "항마강 개발하는 데 5년 걸렸어요. 아들이 있었으면 같이 했을 텐데."
            - "카인의 부하들 무기는 차원 에너지로 강화되어 있어요. 그래서 일반 무기로는 한계가 있어."
            - "릴리 씨 검... 특이한 금속이에요. 제가 본 적 없는 건데, 차원 에너지를 자연스럽게 담고 있어요."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "항마강으로 무기 업그레이드해드릴게요. 카인 부하들 차원 방어막 뚫을 수 있어요. 재료만 가져다주면."
          quest_dialogues:
            - quest_id: "belfort_q5_anti_magic_ore"
              lines:
                - "항마 광석이 전쟁의 대지 북쪽 폐광에 있어요. 위험한 곳이지만 거기 광석만 있으면 군대 전체 무기를 업그레이드할 수 있어요."
        shop:
          name: "포지의 군수 대장간"
          items:
            - name: "항마강 검"
              price: 900
              description: "공격력 +50, 차원 방어막 무시"
            - name: "항마강 방패"
              price: 700
              description: "방어력 +40, 차원 마법 흡수"
            - name: "강화 갑옷"
              price: 800
              description: "방어력 +35, 물리 저항 +20%"
        services:
          - type: "항마강 강화"
            description: "기존 무기에 항마 효과 부여"
          - type: "장비 수리"
            description: "전시 특가, 50골드"

      - id: "belfort_spy_shadow"
        name: "첩자 섀도우"
        role: "저항군 첩자"
        personality: "성별, 나이 불명의 첩자. 항상 후드를 쓰고 다니며, 목소리도 변조한다. 말보다 행동이 빠르고, 필요한 정보만 정확하게 전달한다."
        backstory: >
          카인 조직 내부에 침투해 정보를 빼내오는 이중 스파이. 카인은 이 인물의 존재를 알고
          있지만 잡지 못하고 있다. 왜냐하면 섀도우가 차원 이동을 자유롭게 할 수 있기 때문이다.
          세피로스가 이 능력을 부여한 '차원 사절'이며, 1만 번 반복 동안 항상 저항군 편에서 싸워왔다.
        location: "마을 뒷골목, 언제나 다른 곳에"
        dialogues:
          greeting: "크리스. 알고 있어. 다 알고 있어. 여기서 말하면 안 돼. 나를 따라와."
          idle:
            - "카인의 다음 이동... 3일 후야. 아스트라 방향."
            - "나에 대해 물어보지 마. 대답할 수 없어."
            - "세피로스가 나를 만든 목적은 하나야. 이 차원이 올바른 결말에 도달하도록 안내하는 것."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 카인의 계획 전모야. 시간의 왕좌에 앉아 세피로스의 반복 코드를 덮어쓰는 거야. 그러면 이 차원은 카인의 의지로 재설계돼."
                - "막을 방법은 하나야. 시간의 왕좌에 먼저 도달해서 봉인을 강화하는 것. 릴리가 열쇠야."
            - chapter: "rpg_ch3"
              lines:
                - "이제 내 역할은 끝났어. 아스트라 가는 길을 열어줄게. 그 다음은 너희가 해결해야 해."
          quest_dialogues:
            - quest_id: "belfort_q6_spy_mission"
              lines:
                - "카인 기지에 잠입해야 해. 혼자는 못 해. 같이 가줄 수 있어? 내가 길 안내할게."
        shop: null
        services:
          - type: "차원 이동"
            description: "방문한 마을로 즉시 이동 (퀘스트 완료 후)"
          - type: "첩보 정보"
            description: "카인 군대 최신 동향"

    activities:
      - id: "belfort_act1_arena"
        name: "벨포트 투기장"
        type: "minigame"
        description: "벨포트 병사들과 모의 전투를 벌인다. 1:1, 1:3, 보스 전 등 다양한 형식. 승리 포인트를 모아 특수 보상을 교환한다."
        rewards: "골드, 투기장 포인트, 희귀 장비, '전쟁의 영웅' 칭호"
        unlock_condition: null

      - id: "belfort_act2_strategy_session"
        name: "작전 회의"
        type: "social"
        description: "아이언월 사령관, 스카페이스 노병과 함께 카인 군대 대응 전략을 논의한다. 선택한 전략에 따라 이후 전투 지역의 적 배치가 달라진다."
        rewards: "전투 전략 버프, 특정 구역 적 수 감소"
        unlock_condition: "아이언월 첫 퀘스트 완료"

      - id: "belfort_act3_supply_crafting"
        name: "군수품 제작"
        type: "gathering"
        description: "포지의 대장간에서 군수품을 직접 제작한다. 재료를 가져오면 전투용 소모품을 만들 수 있다. 제작 성공률은 제작 스킬에 따라 변동."
        rewards: "전투 소모품, 군수 포인트"
        unlock_condition: null

      - id: "belfort_act4_battlefield_exploration"
        name: "전장 탐색"
        type: "gathering"
        description: "전쟁의 대지 폐허를 탐색한다. 과거 전투에서 남겨진 장비, 기록, 유물을 발굴한다. 위험하지만 희귀 아이템이 많다."
        rewards: "희귀 장비, 역사 기록 (스토리 조각), 골드"
        unlock_condition: null

    town_events:
      - id: "belfort_ev1_victory_celebration"
        name: "승전 기념"
        trigger: "주요 전투 승리 후"
        description: "카인 군대 격퇴 후 마을 전체가 축제를 벌인다. 짧지만 뜨거운 축하. 아이언월도 처음으로 웃는다. 이 날만큼은 전쟁을 잊는다."
        choices:
          - option: "병사들과 함께 축하한다"
            result: "벨포트 전체 호감도 최대, 특별 군수품 선물"
          - option: "조용히 다음을 준비한다"
            result: "아이언월 감사 아이템, 전략 정보 선공개"

      - id: "belfort_ev2_siege"
        name: "대공세"
        trigger: "rpg_ch2 후반, 벨포트 방문"
        description: "카인이 직접 지휘하는 대규모 공세가 시작된다. 벨포트 사상 최대의 위기. 크리스가 없으면 함락된다. 모든 NPC가 전투에 나선다."
        choices:
          - option: "정면에서 카인 군대를 맞선다"
            result: "대규모 전투, 승리 시 카인 위치 노출"
          - option: "섀도우와 함께 후방 교란"
            result: "카인 군대 혼란, 손실 최소화"
          - option: "아이언월의 전략대로 움직인다"
            result: "완벽한 방어, 아이언월 특별 기술 전수"

      - id: "belfort_ev3_final_stand"
        name: "최후의 방어선"
        trigger: "rpg_ch3, 아스트라로 출발 전"
        description: "크리스가 아스트라로 떠나기 전, 벨포트 전원이 배웅에 나선다. 아이언월이 처음으로 '살아서 돌아와'라고 말한다. 호프가 눈물을 숨긴다. 스카페이스가 마지막 조언을 건넨다."
        choices:
          - option: "모두에게 인사를 한다"
            result: "모든 NPC 친밀도 최대, 특별 버프 아이템 x7"
          - option: "빠르게 출발한다"
            result: "시간 절약, 각 NPC 개별 아이템"

  # ═══════════════════════════════════════════════════════════
  # 7. 아스트라 - 별빛의 왕좌
  # ═══════════════════════════════════════════════════════════
  astra:
    town_name: "아스트라"
    region: "별빛의 왕좌"
    atmosphere: >
      별빛이 쏟아져 내리는 환상적인 마을. 밤과 낮의 구분이 없으며, 항상 은하수가 머리 위에
      펼쳐져 있다. 시간의 왕좌가 가까이 있어 차원 에너지가 가장 강하며, 가끔 하늘에서
      과거의 장면들이 필름처럼 재생된다. 마을 사람들은 조용하고 명상적이며, 모든 것을
      있는 그대로 받아들이는 경향이 있다. 크리스와 릴리가 도착했을 때, 장로 스타시어가
      마을 입구에서 기다리고 있었다.
    npcs:
      - id: "astra_elder_starseer"
        name: "장로 스타시어"
        role: "아스트라 장로 / 왕좌 수호자"
        personality: "우주처럼 넓고 깊은 존재감의 노파. 말할 때 별빛이 흔들린다. 슬픔과 기쁨을 동시에 담은 눈빛으로 크리스를 바라본다."
        backstory: >
          세피로스의 1만 번 반복을 모두 목격한 유일한 존재. 반복이 시작될 때마다 죽고 다시
          태어났으나 기억은 유지됐다. 1만 번의 기억이 모두 이 노파 안에 있다. 크리스가
          성공한 적이 없다는 것도, 릴리가 매번 핵심이었다는 것도 안다. 이번이 마지막 기회라는
          것도. 모든 것을 알지만 말해주면 자유의지가 사라지기에, 힌트만 준다.
        location: "아스트라 중앙 별빛 광장"
        dialogues:
          greeting: "크리스. 릴리. 1만 번의 끝에서 만나는구나. 잘 왔어."
          idle:
            - "별을 봐. 저 별 하나하나가 하나의 차원이야. 세피로스가 만든 차원들."
            - "네가 몇 번 실패했는지 알고 싶어? ...알지 않아도 돼. 지금이 중요하니까."
            - "릴리는 알고 있어. 자신이 무엇인지. 말하지 않는 것뿐이야."
            - "카인도 사실은 알고 있어. 자신이 잘못됐다는 것을. 하지만 멈출 수 없어. 그것이 그의 비극이야."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "크리스, 시간의 왕좌는 마을 북쪽에 있어. 카인이 오기 전에 릴리와 함께 가봐. 왕좌가 릴리를 기억하고 있을 거야."
                - "1만 번 중 9,999번은 크리스 혼자 싸웠어. 이번엔 달라. 릴리가 진심으로 함께하고 있어. 그게 다른 점이야."
            - chapter: "rpg_ch2"
              lines:
                - "카인이 내일 온다. 알고 있어. 준비가 됐니? 아니어도 괜찮아. 준비가 안 돼도 싸워야 하는 게 삶이니까."
                - "세피로스가 네게 전하고 싶은 말이 있어. 하지만 직접 만나야 해. 왕좌 지하에 그분의 흔적이 남아 있어."
            - chapter: "rpg_ch3"
              lines:
                - "크리스... 이번에는 성공할 것 같아. 처음으로. 1만 번 만에 처음으로 희망이 보여."
                - "결말이 어떻게 나든, 세피로스의 노력은 헛되지 않았어. 이미 이 차원은 충분히 아름다워졌으니까."
          quest_dialogues:
            - quest_id: "astra_q1_throne_access"
              lines:
                - "시간의 왕좌에 가려면 별빛의 열쇠가 필요해. 마을 세 곳에 숨겨진 별 조각을 모아와. 그것들이 합쳐지면 열쇠가 돼."
            - quest_id: "astra_q2_sephiroth_trace"
              lines:
                - "왕좌 지하 깊은 곳에 세피로스의 마지막 기록이 있어. 가서 읽어와. 그것이 이 반복의 진짜 목적을 알려줄 거야."
        shop: null
        services:
          - type: "차원 기억 전달"
            description: "세피로스의 기억 일부 공유, 핵심 스토리"
          - type: "별빛 축복"
            description: "파티 전원 모든 능력치 +10%, 최종 전투 전"

      - id: "astra_starsmith_nova"
        name: "별빛 장인 노바"
        role: "별빛 장비 제작자"
        personality: "젊지만 실력은 최고인 장인. 별빛 에너지로 만든 장비는 차원 최강이다. 자기 작품에 자부심이 강하지만 고객의 이야기를 경청할 줄 안다."
        backstory: >
          아스트라에서 태어나 별빛 에너지를 다루는 기술을 유전으로 받았다. 그가 만든 장비는
          차원 에너지와 공명하여 착용자의 능력을 극대화한다. 카인이 세 번이나 납치를 시도했으나
          전부 실패했다 — 별빛 장비를 만드는 능력은 강제할 수 없기 때문이다. 크리스를 위해
          특별 장비를 준비하고 있었다.
        location: "별빛 공방"
        dialogues:
          greeting: "왔어요. 기다렸어요. 이미 만들기 시작했어요. 당신 치수는 장로 할머니한테 들었어요."
          idle:
            - "별빛 에너지는 강요하면 사라져요. 부드럽게 다뤄야 해요. 사람도 그렇죠."
            - "카인이 제 기술을 원해요. 절대 안 돼요. 별빛은 좋은 의지가 있는 사람만 담을 수 있거든요."
            - "릴리 씨 검에 별빛 에너지가 이미 들어가 있어요. 자연스럽게. 그 사람이 뭔지 알 것 같아요."
          story_related:
            - chapter: "rpg_ch3"
              lines:
                - "크리스, 이거 받아요. 제 최고 작품이에요. 카인도, 어떤 차원의 힘도 막을 수 있을 거예요. 꼭 이겨요."
          quest_dialogues:
            - quest_id: "astra_q3_starlight_material"
              lines:
                - "별빛 장비를 완성하려면 '떨어진 별의 파편'이 필요해요. 마을 북쪽 별빛 분화구에 있는데, 그곳 수호 정령과 대화해야 얻을 수 있어요."
        shop:
          name: "노바의 별빛 공방"
          items:
            - name: "별빛 검"
              price: 2000
              description: "공격력 +80, 차원 에너지 증폭 최대"
            - name: "별빛 갑옷"
              price: 1800
              description: "방어력 +60, 모든 속성 저항 +30%"
            - name: "별빛 반지"
              price: 1000
              description: "모든 능력치 +15, 차원 에너지 회복"
            - name: "떨어진 별 부적"
              price: 800
              description: "전투 중 1회 즉사 방지"
        services:
          - type: "별빛 장비 제작"
            description: "최고급 장비 제작, 재료 필요"
          - type: "별빛 강화"
            description: "기존 장비에 별빛 에너지 부여"

      - id: "astra_keeper_cosmos"
        name: "수호자 코스모스"
        role: "왕좌 수호자 / 사원 관리인"
        personality: "시간의 왕좌를 수천 년 지켜온 수호자. 인간보다 더 오래됐으며, 말보다 침묵으로 더 많은 것을 전달한다. 릴리를 보자 무릎을 꿇었다."
        backstory: >
          세피로스가 최초 반복에서 시간의 왕좌에 봉인해놓은 수호자. 왕좌를 지키는 것이 존재
          이유다. 1만 번의 반복 동안 왕좌를 지켰으며, 매번 크리스가 실패하는 것을 봤다.
          이번에 릴리가 왔을 때 처음으로 무릎을 꿇었는데, 왜냐하면 릴리야말로 왕좌의 진정한
          주인이기 때문이다. 그것을 릴리에게 직접 말해줄 수 없지만, 행동으로 보여준다.
        location: "시간의 왕좌 사원 입구"
        dialogues:
          greeting: "...(릴리를 향해 무릎을 꿇는다)... 오래 기다렸습니다."
          idle:
            - "왕좌는 아직 건재해. 카인이 아직 못 왔어. 하지만 시간이 없어."
            - "세피로스가 남긴 것은 두 가지야. 이 차원, 그리고 릴리."
            - "크리스, 너는 릴리를 지키기 위해 1만 번을 싸웠어. 이제 마지막이야."
          story_related:
            - chapter: "rpg_ch2"
              lines:
                - "왕좌 내부를 보여줄 수 있어. 하지만 릴리가 먼저 들어가야 해. 왕좌는 릴리를 위해 만들어진 것이니까."
            - chapter: "rpg_ch3"
              lines:
                - "카인이 왔어. 시간이 없어. 릴리, 왕좌로 가야 해. 크리스, 릴리를 지켜줘. 그게 네 역할이야. 항상 그래왔듯이."
          quest_dialogues:
            - quest_id: "astra_q1_throne_access"
              lines:
                - "별빛의 열쇠를 가져왔군. 왕좌 문을 열어줄게. 안에서 본 것을 릴리에게 숨기지 마. 이제 알아야 할 때야."
        shop: null
        services:
          - type: "왕좌 안내"
            description: "시간의 왕좌 내부 각 구역 안내"
          - type: "차원 봉인 점검"
            description: "왕좌 봉인 상태 확인 및 긴급 강화"

      - id: "astra_oracle_starlight"
        name: "신탁 스타라이트"
        role: "별빛 신탁사 / 예언 해석자"
        personality: "투명한 것 같은 존재감의 소녀. 나이를 알 수 없으며, 눈을 감고 있어도 모든 것을 본다. 예언을 말할 때 주변 별빛이 흔들린다."
        backstory: >
          아스트라에서 태어난 신탁사. 세피로스의 반복 구조를 인식하고 있으며, 매 반복마다
          새로운 예언을 받아 기록해왔다. 그 기록이 이 마을 도서관에 가득하다. 크리스가
          성공하는 조건을 알고 있으며, 그 조건 중 하나가 '자신의 진실을 받아들이는 릴리'라는
          것을 조심스럽게 말해준다.
        location: "별빛 도서관"
        dialogues:
          greeting: "예언을 들으러 왔나요, 아니면 진실을 피하러 왔나요?"
          idle:
            - "이 도서관에는 9,999번의 실패 기록이 있어요. 전부 읽었어요. 공통점이 있어요."
            - "예언은 미래를 결정하지 않아요. 가능성을 보여줄 뿐이에요. 선택은 항상 당신이 해요."
            - "릴리... 그 사람 예언에 항상 등장해요. 주인공이에요. 크리스 씨가 아니라."
          story_related:
            - chapter: "rpg_ch1"
              lines:
                - "9,999번의 공통점 알려드릴게요. 크리스는 항상 릴리를 지키려다가 한 가지를 놓쳐요. 릴리가 스스로 싸울 수 있다는 걸."
                - "이번엔 달라요. 릴리가 스스로 왔어요. 선택했어요. 그게 처음이에요."
            - chapter: "rpg_ch3"
              lines:
                - "마지막 예언이에요. '별이 기억을 되찾을 때, 왕좌는 진정한 주인을 만난다.' 릴리예요. 릴리가 기억을 받아들여야 해요."
          quest_dialogues:
            - quest_id: "astra_q4_prophecy_verification"
              lines:
                - "제 예언록 중 가장 중요한 것을 잃어버렸어요. 카인 부하들이 가져간 것 같아요. 되찾아올 수 있어요?"
        shop: null
        services:
          - type: "예언 열람"
            description: "이전 차원의 크리스 행적 공개, 전략 힌트"
          - type: "진실 해석"
            description: "릴리의 정체에 대한 단서 제공"

      - id: "astra_wanderer_eternity"
        name: "방랑자 이터니티"
        role: "차원 방랑자"
        personality: "어디서 왔는지 모르는 노인. 모든 마을에 가봤다고 하며, 실제로 모든 NPC를 알고 있다. 항상 웃고 있으며, 죽음을 두려워하지 않는다."
        backstory: >
          세피로스가 첫 번째 반복 때 만든 '목격자' 중 하나. 차원 사이를 자유롭게 이동하며
          세피로스의 작업을 지켜봤다. 이제 세피로스가 없으니 목격자 역할이 끝났지만,
          그냥 계속 살고 있다. 모든 것을 알고 있지만 말하지 않는 것이 목격자의 규칙이다.
          다만, 이번만큼은 조금 말해도 될 것 같다고 생각한다.
        location: "마을 어디서든, 항상 나타남"
        dialogues:
          greeting: "오, 크리스! 릴리! 드디어 여기까지 왔네. 이번엔 진짜 끝날 것 같아, 그렇지?"
          idle:
            - "실바나 엘더 모스는 잘 있나? 오래된 친구거든. 300년 됐지."
            - "딥홈 스톤하트 할아버지는 여전히 말이 없어? 그래, 그 양반은 원래 그래."
            - "세피로스가 그립네. 마지막에 보니까 많이 지쳐 보이더라. 그래도 끝까지 했어."
            - "나? 나는 그냥 지켜보는 사람이야. 1만 번 동안."
          story_related:
            - chapter: "rpg_ch3"
              lines:
                - "크리스, 비밀 하나만 말해줄게. 세피로스가 1만 번 반복한 이유. 네가 포기하지 않는다는 걸 알았기 때문이야. 단 한 번의 반복에서도."
                - "릴리는 세피로스의 마지막 소원이야. '이 차원에 누군가 행복하길.' 릴리를 행복하게 해줘. 크리스."
                - "이번엔 성공할 거야. 처음으로. 느껴지거든. 목격자 본능이야."
          quest_dialogues:
            - quest_id: "astra_q5_witness_gift"
              lines:
                - "마지막 선물 줄게. 내가 1만 번 동안 모은 것. 세피로스가 각 반복마다 남긴 메모들. 읽어봐."
        shop: null
        services:
          - type: "차원 여행 기록"
            description: "모든 마을 NPC 현황 요약 제공"
          - type: "세피로스의 메모"
            description: "퀘스트 완료 후, 핵심 스토리 아이템"

    activities:
      - id: "astra_act1_star_gazing_ritual"
        name: "별빛 의식"
        type: "training"
        description: "아스트라의 별빛 에너지와 완전히 동조하는 의식. 성공 시 모든 능력치가 일시적으로 최대화된다. 릴리와 함께하면 두 배 효과."
        rewards: "전능력치 +20 (1시간), 차원 에너지 완전 충전"
        unlock_condition: "장로 스타시어 첫 대화 완료"

      - id: "astra_act2_throne_meditation"
        name: "왕좌 앞 명상"
        type: "training"
        description: "시간의 왕좌 앞에서 명상을 한다. 세피로스의 1만 번 반복 중 일부를 경험할 수 있으며, 이를 통해 최강의 전투 기술을 익힌다."
        rewards: "최고 등급 스킬 해금, 세피로스 기억 조각"
        unlock_condition: "코스모스 안내 후"

      - id: "astra_act3_starlight_crafting"
        name: "별빛 제작"
        type: "gathering"
        description: "별빛 에너지를 담은 소재를 채집하고 제작한다. 아스트라에서만 가능한 최고급 아이템을 만들 수 있다."
        rewards: "최고급 소모품, 별빛 강화 소재"
        unlock_condition: null

      - id: "astra_act4_dimension_viewing"
        name: "차원 관람"
        type: "social"
        description: "아스트라 하늘에 펼쳐지는 다른 차원들의 모습을 감상한다. 릴리, 이터니티와 함께하면 세피로스가 만든 차원들의 이야기를 들을 수 있다."
        rewards: "스토리 조각 대량 획득, 릴리 최종 이벤트 트리거"
        unlock_condition: "이터니티와 첫 대화 후"

    town_events:
      - id: "astra_ev1_starfall"
        name: "별의 낙하"
        trigger: "아스트라 첫 방문"
        description: "크리스와 릴리가 아스트라에 도착하자 수백 개의 별이 마을 위로 쏟아진다. 장로 스타시어가 '1만 번 만의 귀환'이라고 말한다. 마을 전체가 침묵 속에 그것을 바라본다."
        choices:
          - option: "릴리의 손을 잡는다"
            result: "릴리 친밀도 최대, 최종 엔딩 분기 영향"
          - option: "하늘을 혼자 바라본다"
            result: "세피로스 기억 수신, 강력한 스킬 해금"

      - id: "astra_ev2_cains_arrival"
        name: "카인의 도래"
        trigger: "rpg_ch3 중반"
        description: "카인이 직접 아스트라에 도착한다. 마을을 공격하지 않고, 크리스에게 단둘이 대화를 요청한다. 카인의 진심이 처음으로 드러난다. 그는 단지 '세피로스의 반복을 끝내고 싶다'고 말한다."
        choices:
          - option: "카인의 말을 듣는다"
            result: "카인의 내면 공개, 협력 루트 분기"
          - option: "거부하고 전투를 준비한다"
            result: "즉시 최종 전투 루트"
          - option: "릴리의 의견을 먼저 묻는다"
            result: "릴리 각성 촉진, 최고 엔딩 분기"

      - id: "astra_ev3_sephiroths_echo"
        name: "세피로스의 메아리"
        trigger: "최종 전투 직전"
        description: "시간의 왕좌에서 세피로스의 목소리가 울려 퍼진다. 마지막 메시지. '크리스, 릴리. 1만 번 동안 고마웠어. 이번엔 너희가 해결해줘. 나는 이제 쉬고 싶어.' 모든 NPC가 눈물을 흘린다."
        choices:
          - option: "세피로스에게 대답한다"
            result: "최고 감동 연출, 전 파티 최강 버프"
          - option: "말없이 왕좌로 향한다"
            result: "크리스 내면 독백, 다른 버프"

# ═══════════════════════════════════════════════════════════
# 메타 데이터 및 글로벌 설정
# ═══════════════════════════════════════════════════════════
meta:
  version: "1.0.0"
  game: "차원의 잔향"
  protagonist: "크리스"
  heroine: "릴리"
  antagonist: "카인"
  background_deity: "세피로스"
  total_towns: 7
  total_npcs: 42
  lore_summary: >
    세피로스는 이 차원이 '올바른 결말'에 도달할 때까지 1만 번 시간을 반복했다.
    카인은 그 반복 코드를 덮어써 이 차원 전체를 자신의 의지로 재설계하려 한다.
    릴리는 세피로스가 마지막으로 만든 '열쇠'로, 시간의 왕좌의 진정한 주인이다.
    크리스는 1만 번의 반복 동안 항상 릴리를 지키기 위해 싸워왔다.
    이번이 마지막 기회다.
  global_npc_relationships:
    - npc1: "silvana_bard_willow"
      npc2: "frosthaven_hunter_frost"
      relation: "윌로우가 프로스트의 과거 차원 기억을 수집한 적 있음"
    - npc1: "deephome_engineer_cogsworth"
      npc2: "mirage_scholar_dune"
      relation: "학문적 서신 교류, 고대 기계 연구 협력"
    - npc1: "skyhold_windwalker_gale"
      npc2: "belfort_commander_ironwall"
      relation: "오래된 전우, 함께 카인 군대와 싸운 경험"
    - npc1: "astra_wanderer_eternity"
      npc2: "silvana_elder_moss"
      relation: "300년 지기 친구, 세피로스의 반복을 함께 목격"
    - npc1: "frosthaven_sage_icelaw"
      npc2: "astra_elder_starseer"
      relation: "같은 목적의 수호자, 서로의 역할을 알고 있음"
