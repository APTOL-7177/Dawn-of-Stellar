# Cooking Recipes Data
# Format:
# - id: unique_id
#   name: Display Name
#   ingredients: {item_id_or_category: count_or_value, ...}
#   effects: {effect_type: value, ...}
#   difficulty: 1-10 (Higher is harder, better rewards)
#   description: Flavor text
#   priority: LOW/MEDIUM/HIGH/VERY_HIGH/FALLBACK (optional)
#   result_category: category_value (optional)
#   food_value: float (optional, default 1.0)

